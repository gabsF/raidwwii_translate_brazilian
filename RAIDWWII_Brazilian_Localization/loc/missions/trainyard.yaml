trainyard_operate_crane4_amer: "So get on with it. Get that crane ready to pick up the wagon."
trainyard_operate_crane4_brit: "Come on, lads - get that crane over the wagon ready to pick it up."
trainyard_operate_crane4_germ: "Gentlemen, please - the crane must be positioned over the wagon, yes?"
trainyard_operate_crane4_russ: "Move crane over wagon."
trainyard_place_crane_over_ar_amer: "Great! Now just lower the crane hook over the wagon."
trainyard_place_crane_over_ar_brit: "Splendid. Crane's in position. Now, lower the hook over the wagon."
trainyard_place_crane_over_ar_germ: "Crane position good. Lower the hook over the wagon. Very good."
trainyard_place_crane_over_ar_russ: "Crane position good! Now lower the hook to wagon."
trainyard_plant_dynamite2_amer: "Whaddya want, a medal? Get that dynamite planted."
trainyard_plant_dynamite2_brit: "Give that man a medal! Now get that dynamite planted."
trainyard_plant_dynamite2_germ: "You are a hero. Now get it planted!"
trainyard_plant_dynamite2_russ: "You want prize? Get it planted!"
trainyard_plant_dynamite3_amer: "Gotta find where the wall is weak!"
trainyard_plant_dynamite3_brit: "Look for a section where the wall is weaker."
trainyard_plant_dynamite3_germ: "Some parts of wall are weak. Look for them!"
trainyard_plant_dynamite3_russ: "Look for weak wall."
trainyard_pulled_crane_lever2_amer: "That did it. It's moving!"
trainyard_pulled_crane_lever2_brit: "It's starting! Yes, it's moving!"
trainyard_pulled_crane_lever2_germ: "Ja! It's moving! Very good. "
trainyard_pulled_crane_lever2_russ: "Da! You did it. It is moving!"
trainyard_remove_chocks_amer: "Hey, they got rail chocks holding the locomotive there. Get 'em away from the wheels."
trainyard_remove_chocks_brit: "Couple of chocks by the wheels there, you see? Get them out of the way."
trainyard_remove_chocks_germ: "The locomotive is secured by those chocks. Remove them!"
trainyard_remove_chocks_russ: "Those chocks are holding the locomotive in place. Move them!"
trainyard_restart_coal_rem_amer: "Hey, this ain't a holiday. Get the coal hatch open!"
trainyard_restart_coal_rem_brit: "Chop chop, lads. Get the coal hatch open!"
trainyard_restart_coal_rem_germ: "That hatch remains closed. Open it! Now!"
trainyard_restart_coal_rem_russ: "The hatch is closed. Open it!"
trainyard_restart_coal1_amer: "The hell I say about the hatch, dammit! "
trainyard_restart_coal1_brit: "Those blasted swine shut the hatch."
trainyard_restart_coal1_germ: "Dunderkopf! They closed the hatch!"
trainyard_restart_coal1_russ: "Ugggh. They close the hatch. "
trainyard_restart_coal2_amer: "So open it, dammit!"
trainyard_restart_coal2_brit: "Get it open again!"
trainyard_restart_coal2_germ: "Re-open the hatch, schnell!"
trainyard_restart_coal2_russ: "Get it open."
trainyard_shoot_the_airplanes_complete1_amer: "Haha! You had enough?! You fuckers had enough of us?!"
trainyard_shoot_the_airplanes_complete1_brit: "Seems the tin cans have had enough! That's what you bloody well get!"
trainyard_shoot_the_airplanes_complete1_germ: "Gentlemen! It appears they have had enough of a beating!"
trainyard_shoot_the_airplanes_complete1_russ: "You sent planes to fight us?! We send you death!"
trainyard_shoot_the_airplanes_complete2_amer: "That's right! You run home to mama, candy-ass shitbirds! Tell 'em we'll kill all'a you!"
trainyard_shoot_the_airplanes_complete2_brit: "See how they run! Haha! Superb effort chaps - they'll not forget us any time soon."
trainyard_shoot_the_airplanes_complete2_germ: "They flee with their tails between their legs! Remember this day schweins!"
trainyard_shoot_the_airplanes_complete2_russ: "They run away! Planes are scared of us! Haha! Stupid planes!"
trainyard_shoot_the_airplanes2_amer: "So get on an AA gun and see if it does what it's meant to!"
trainyard_shoot_the_airplanes2_brit: "Find yourself an AA gun and put it to bally good use!"
trainyard_shoot_the_airplanes2_germ: "One of these anti-aircraft guns should be of some use!"
trainyard_shoot_the_airplanes2_russ: "We use anti-aircraft guns, yes? Yes!"
trainyard_spawn2_1_amer: "These assholes have no idea we're here, so whadda ya say? Do we go in nice and quiet, or make some noise?"
trainyard_spawn2_1_brit: "Right chaps. They've no inkling we're here. So we can tiptoe in and out, or make a lot of noise and take them head on. What do you think?"
trainyard_spawn2_1_germ: "We have managed to arrive undetected, gentlemen. Should we try to do this quietly, or let them know we're ready for a fight?"
trainyard_spawn2_1_russ: "Is it a day to be quiet, or to be loud? Loud feels good!"
trainyard_start_train_amer: "Let's get this old iron rollin'. "
trainyard_start_train_brit: "Time to get this old girl going."
trainyard_start_train_germ: "We are almost ready!"
trainyard_start_train_russ: "Almost done!"
trainyard_switch_ar_tracks_amer: "*laughs* It's free. Now, back to the crane and lift the wagon over to the other track!"
trainyard_switch_ar_tracks_brit: "Now, back to the crane. Swing the wagon over to the other track. Gentle now!"
trainyard_switch_ar_tracks_germ: "Now, use the crane and swing the wagon over to the other track."
trainyard_switch_ar_tracks_russ: "Wagon free! Now, use crane to move it!"
trainyard_switch_tracks_amer: "Just gotta get the locomotive to the Amber wagon. Find the lever to switch the tracks!"
trainyard_switch_tracks_brit: "We need to roll the locomotive back to the Amber wagon. Switch the tracks!"
trainyard_switch_tracks_germ: "Now, we must bring locomotive to the train. I believe the lever will switch the tracks."
trainyard_switch_tracks_russ: "Now we reverse locomotive to wagon. The lever will switch the tracks."
trainyard_wagon_closed_amer: "Wagons doors are closed. Time to make a move."
trainyard_wagon_closed_brit: "That's the doors closed. Top hole. Time to move along!"
trainyard_wagon_closed_germ: "The wagon doors are closed. Time to get moving."
trainyard_wagon_closed_russ: "Doors are closed."
trainyard_wagon_coupled_amer: "We got the wagon hooked up, good to go."
trainyard_wagon_coupled_brit: "That's the wagon connected."
trainyard_wagon_coupled_germ: "The wagon is connected, gentlemen."
trainyard_wagon_coupled_russ: "Wagon linked."
trainyard_wagon_door_opened1_1_amer: "Alright. We find where they've got the Amber Room hidden away, get it to our engineers, and get out of here."
trainyard_wagon_door_opened1_1_brit: "All right then - we find where they've stashed this treasure, carry it off from under their noses, find our ride and get out of here."
trainyard_wagon_door_opened1_1_germ: "Now then, we have to identify where they're hiding the treasure, steal it, and make our escape."
trainyard_wagon_door_opened1_1_russ: "Now to find priceless treasure and escape on train! Hahah!"

# Objetivos
obj_ger_miss_05_ty_01_desc: "Vocês chegaram no pátio. Hora de encontrarem a Câmara de Âmbar" #You've arrived at the rail yard. Time to find the Amber Room."
obj_ger_miss_05_ty_01_hl: "Saiam do vagão" #Get out of the wagon"
obj_ger_miss_05_ty_01a_desc: "A Câmara de Âmbar está em um dos vagões. Procurem até achá-lo." #The Amber Room is in one of the wagons. Search them until you find it."
obj_ger_miss_05_ty_01a_hl: "Achem o vagão com a Câmara de Âmbar" #Find the Amber Room wagon"
obj_ger_miss_05_ty_02_desc: "Usem o guindaste para transferir o vagão de Âmbar no trilho oposto." #Use the crane to transfer the Amber Room wagon to the opposite track."
obj_ger_miss_05_ty_02_hl: "Controlem o guindaste" #Operate the crane"
obj_ger_miss_05_ty_03_desc: "Puxem a alavanca para mover o guindaste até estar de baixo do vagão da Câmara de Âmbar." #Pull the lever to move the crane until it is directly over the Amber Room wagon."
obj_ger_miss_05_ty_03_hl: "Movem o guindaste de baixo do vagão com a Câmara de Âmbar." #Move the crane over the Amber Room wagon"
obj_ger_miss_05_ty_04_desc: "Puxem a alavanca para abaixar o cabo do guindaste de baixo do vagão com a Câmara de Âmbar." #Pull the lever to lower the crane's cable towards the roof of the Amber Room wagon."
obj_ger_miss_05_ty_04_hl: "Abaixem o cabo do guindaste" #Lower the crane cable"
obj_ger_miss_05_ty_05_desc: "Antes que o vagão com a Câmara de Âmbar possa ser movido, precisa de desconectado dos outros vagões e o cabo do guindaste conectado no seu telhado." #Before the Amber Room wagon can be moved it needs to be decoupled from the other wagons, and the crane's cable must be connected to its roof."
obj_ger_miss_05_ty_05_hl_sub_01_desc: "Conectem o cabo do guindaste nos quatro pontos do telhado do vagão com a Câmara de Âmbar." #Connect the crane cable to the four points on the Amber Room wagon roof."
obj_ger_miss_05_ty_05_hl_sub_01: "Conectem o cabo do guindaste no vagão com a Câmara de Âmbar." #Connect the crane cable to the Amber Room wagon"
obj_ger_miss_05_ty_05_hl_sub_02_desc: "A Câmara de Âmbar está conectado nos vagões. Desconectem os dois lados." #The Amber Room wagon is coupled to the neighbouring wagons. Decouple it at both ends."
obj_ger_miss_05_ty_05_hl_sub_02: "Desconectem o vagão com a Câmara de Âmbar" #Decouple the Amber Room wagon"
obj_ger_miss_05_ty_05_hl_sub_03_desc: "Nós não queremos o tesouro caindo para fora, então fechem as portas do vagão." #We don't want the treasure falling out, so close the door on the Amber Room wagon."
obj_ger_miss_05_ty_05_hl_sub_03: "Fechem a porta do vagão com a Câmara de Âmbar" #Close the Amber Room wagon door"
obj_ger_miss_05_ty_05_hl: "Preparem o vagão da Câmara de Âmbar para ser movido" #Prepare the Amber Room wagon to be moved"
obj_ger_miss_05_ty_05a_desc: "O guindaste não pode ser movido com você em cima. Sai daí!" #The crane can't lift the Amber Room wagon with you on it. Get off!"
obj_ger_miss_05_ty_05a_hl: "Saia do telhado" #Get off the roof"
obj_ger_miss_05_ty_06_desc: "Puxe a alavanca no guindaste para levantar e mover o vagão da Câmara de Âmbar. Espere até estar no trilho oposto." #Pull the lever in the crane to lift and move the Amber Room wagon. Wait until it is over the opposite track."
obj_ger_miss_05_ty_06_hl: "Transfere o vagão da Câmara de Âmbar para o trilho oposto" #Transfer the Amber Room wagon to the opposite track"
obj_ger_miss_05_ty_06a_desc: "Puxe a alavanca no guindaste para mover o vagão da Câmara de Âmbar para ficar em cima do trilho." #Pull the lever in the crane to move the Amber Room wagon above a clear section of track."
obj_ger_miss_05_ty_06a_hl: "Mova o guindaste para a posição correta" #Move the crane to the right position"
obj_ger_miss_05_ty_07_desc: "Puxe a alavanca no guindaste para abaixar a Câmara de Âmbar no trilho." #Use the lever in the crane to lower the Amber Room wagon on to the track."
obj_ger_miss_05_ty_07_hl: "Abaixe o vagão da Câmara de Âmbar" #Lower the Amber Room wagon"
obj_ger_miss_05_ty_08_desc: "O vagão da Câmara de Âmbar precisa ser desconectado do guindaste e conectado nos vagões." #The Amber Room wagon needs to be disconnected from the crane and coupled to the neighbouring wagon."
obj_ger_miss_05_ty_08_hl_sub_01_desc: "Desconecte o vagão da Câmara de Âmbar dos quatros cabos do guindaste." #Disconnect the Amber Room wagon from the four cables attaching it to the crane."
obj_ger_miss_05_ty_08_hl_sub_01: "Desconecte o vagão da Câmara de Âmbar dos cabos" #Disconnect the Amber Room wagon from the cables"
obj_ger_miss_05_ty_08_hl_sub_02_desc: "O vagão da Câmara de Âmbar precisa ser conectado no novo trem. Conectem o vagão da Câmara de Âmbar nos outros vagões." #The Amber Room wagon needs to be connected to the new train. Couple the Amber Room wagon to the neighbouring wagon."
obj_ger_miss_05_ty_08_hl_sub_02: "Conecte o vagão da Câmara de Âmbar no trem" #Couple the Amber Room wagon to the train"
obj_ger_miss_05_ty_08_hl: "Conecte o vagão da Câmara de Âmbar no trem" #Connect the Amber Room wagon to the train"
obj_ger_miss_05_ty_08a_desc: "O cabo do guindaste quebrou! Atire para soltar o vagão da Câmara de Âmbar." #The crane cable has jammed! Shoot it to release the Amber Room wagon."
obj_ger_miss_05_ty_08a_hl: "Atire o vagão" #Shoot the cable"
obj_ger_miss_05_ty_08b_desc: "Conecte o vagão da Câmara de Âmbar no novo trem nos dois lados." #Connect the amber room wagon to the new train on both sides."
obj_ger_miss_05_ty_08b_hl: "Conecte o vagão no novo trem!" #Connect the wagon to the new train!"
obj_ger_miss_05_ty_09_desc: "O locomotiva de fuga está dentro da cabana de manutenção. Achem dinamite para abrir uma entrada." #The escape locomotive is inside the maintenance shed. Find the dynamite to blast a way inside."
obj_ger_miss_05_ty_09_expo_desc: "Usem o dinamite para abrir uma entrada na parede na cabana de manutenção." #Use the dynamite to blast a hole in the wall of the maintenance shed!"
obj_ger_miss_05_ty_09_expo_hl: "Explodem a parede da cabana de manutenção." #Blast the maintenance shed wall open!"
obj_ger_miss_05_ty_09_hl: "Achem dinamite e explodem uma entrada na parede da cabana de manutenção" #Find the dynamite and blast your way into the maintenance shed"
obj_ger_miss_05_ty_10_desc: "O tênder precisa estar cheio de carvão. Atire ou interage com a escotilha para despejar o carvão." #The tender needs to be filled with coal. Shoot or interact with the hatch to start filling it."
obj_ger_miss_05_ty_10_hl: "Abrem a escotilha do carvão" #Open the coal hatch"
obj_ger_miss_05_ty_10a_desc: "Os nazistas vão tentar fechar a escotilha do carvão. Não deixem eles chegarem perto!" #The Nazis will try to close the coal hatch. Keep them away from it!"
obj_ger_miss_05_ty_10a_hl: "Mantenham o carvão seguindo" #Keep the coal flowing"
obj_ger_miss_05_ty_10b_desc: "O tênder do carvão precisa estar cheio. Atire ou interage com a escotilha para despejar o carvão." #The coal tender needs to be filled with coal. Shoot or interact with the hatch to start filling it."
obj_ger_miss_05_ty_10b_hl: "Abrem a escotilha do carvão" #Open the coal hatch"
obj_ger_miss_05_ty_11_desc: "Couple the coal tender to the locomotive, remove the chocks and open the maintenance shed doors."
obj_ger_miss_05_ty_11_expo_desc: "The main doors of the maintenance shed need to be opened to let it out. Look for a lever nearby."
obj_ger_miss_05_ty_11_expo_hl: "Open the maintenance shed doors!"
obj_ger_miss_05_ty_11_hl_sub_01_desc: "Remove the two chocks from the locomotive wheels so it can move."
obj_ger_miss_05_ty_11_hl_sub_01: "Remove the chocks"
obj_ger_miss_05_ty_11_hl_sub_02_desc: "Couple the coal tender to the locomotive."
obj_ger_miss_05_ty_11_hl_sub_02: "Couple the coal tender"
obj_ger_miss_05_ty_11_hl_sub_03_desc: "The main doors of the maintenance shed need to be opened to let it out. Look for a lever nearby."
obj_ger_miss_05_ty_11_hl_sub_03: "Open the maintenance shed doors!"
obj_ger_miss_05_ty_11_hl: "Prepare the locomotive"
obj_ger_miss_05_ty_12_desc: "The locomotive is ready to move out. Signal the Resistance engineer by knocking on the locomotive door."
obj_ger_miss_05_ty_12_hl: "Give the engineer the signal"
obj_ger_miss_05_ty_12a_desc: "The Resistance engineer is driving the locomotive to the main track. Hold the Nazis off while he gets into position."
obj_ger_miss_05_ty_12a_hl: "Wait for the locomotive to reach the escape track!"
obj_ger_miss_05_ty_13_desc: "The locomotive needs to be coupled to the Amber Room wagon. Use the lever to switch the track so it can back up."
obj_ger_miss_05_ty_13_hl: "Switch the tracks"
obj_ger_miss_05_ty_14_desc: "The locomotive can now be backed up. Give the Resistance engineer the signal by knocking on the locomotive door."
obj_ger_miss_05_ty_14_hl: "Give the engineer the signal"
obj_ger_miss_05_ty_15_desc: "The locomotive is now in position. Couple it to the Amber Room wagon."
obj_ger_miss_05_ty_15_hl: "Couple the locomotive to the Amber Room"
obj_ger_miss_05_ty_16_desc: "The Nazi bombers are attacking the train! Use the AA guns to clear the skies of them!"
obj_ger_miss_05_ty_16_hl: "Take out the bombers"
obj_ger_miss_05_ty_16a_desc: "The Nazis would rather destroy the Amber Room than lose it, and have sent bombers to do the job! Get to one of the AA guns and get ready to shoot them down."
obj_ger_miss_05_ty_16a_hl: "Prepare to take out the bombers"
obj_ger_miss_05_ty_16b_desc: "The Nazis bomber squadron has been beaten back, but remain vigilant until they have left the area."
obj_ger_miss_05_ty_16b_hl: "Wait for the bombers to flee"
obj_ger_miss_05_ty_17_desc: "Return to your wagon, and escape with the Amber Room!"
obj_ger_miss_05_ty_17_hl: "Escape with the train"
obj_zone_01_04a_desc: "A train is due to pass carrying AA munitions and weapons. Get ready to take positions to take them out."
obj_zone_01_04a_hl: "Prepare for the munitions train"
obj_zone_01_04b_desc: "Shoot all the AA shells on each wagon to destroy the AA cannons."
obj_zone_01_04b_hl: "Destroy the AA cannons by shooting the shells"
obj_zone_01_04c_desc: "Signal the train driver to get the train out of the area so you can escape."
obj_zone_01_04c_hl: "Signal the train driver for the escape!"
obj_zone_01_04d_desc: "Get onto the escape wagon and get away with the train."
obj_zone_01_04d_hl: "Get onto the escape wagon!"
obj_zone_01_04e_desc: "Wait for the train to arrive at the rail yard."
obj_zone_01_04e_hl: "Arrive at the rail yard"