# Dicas
tip_tips: "Dica:" #Tip:",
tip_steelsight: "Mirando com a sua arma fará mais preciso do que atirar sem mirar." #Aiming down your sights is more accurate than shooting from the hip.",
tip_shoot_in_bleed_out: "Enquanto estiver incapacitado, você ainda pode atirar com a sua arma secundária." #While in bleed-out, you can still fire your sidearm.",
tip_challenge_cards_2: "Quando jogar com outras pessoas, considere usar uma carta de bônus para facilitar as missões." #When playing online consider using booster cards to make harder raids easier.",
tip_select_reward: "Enquanto sobe de nível, você pode adquirir e melhorar as suas habilidades, que pode dar uma variedade de bônus." #As raiders rank up, they can train and improve Proficiencies, which can give them a wide variety of bonuses.",
tip_help_bleed_out: "Se um jogador cair, ele entrará no estado de 'incapacitado', onde ele não poderá se mover e pode apenas atirar com a sua arma secundária." #If a raider is shot down he goes into "bleed-out", where he can't move and can only shoot with his sidearm.",
tip_new_grenade_throw_hold: "Os jogadores podem segurar a granada por cinco segundos antes delas explodirem." #Raiders can cook grenades for 5 seconds before they explode themselves.",
tip_new_consumable_missions: "Fique de olho em arquivos confidenciais, se você encontrar um e concluir a missão, vai desbloquear missões secretas fora da lei." #Keep an eye out for confidential files, if you find one and escape you will unlock secret outlaw raids.",
tip_detection_2: "Inimigos gritarão quando avistarem um jogador, alertando os outros guardas próximos." #Enemies will call out when spotting a raider, alerting nearby enemies.",
tip_head_shot: "Tiros na cabeça são mais efetivos e causam um dano massivo. Inimigos com capacetes vão sofrer menos dano na cabeça." #Shots to the head are more effective and inflict significantly more damage. Enemies with helmets take slightly less headshot damage.",
tip_crowbar: "Algumas caixas de suprimentos dos inimigos só podem ser abertas com um pé-de-cabra. Se encontrar um, não esquece de pegá-la." #Some enemy supply crates can only be opened with a crowbar. If you find one, be sure to grab it.",
tip_objectives: "O seu objetivo atual é exibido no canto superior direito da tela. Uma descrição mais detalhada pode ser encontrada na tela de informações. " #Your current objective is shown in the upper-right corner of the screen. A more detailed description can be seen in the info screen.",
tip_flamers: "Os lança-chamas são inimigos com armadura pesada, atire no tanque de gás vermelho e vai explodir, o matando instantaneamente e deixando fogo no chão." #Flamers are heavily armored, shoot the big red gas tank and the flamer will explode- killing him instantly and leaving behind a pool of fire.",
tip_detection_1: "Ficando mais perto dos inimigos vai os alertar instantaneamente, agachado vai reduzir o alcance da detecção." #Getting too close to enemies will alert them instantly, crouching will greatly reduce the detection range.",
tip_supply_crates: "As caixas de suprimentos dos inimigos podem ter munição, equipamento e cura médica." #Looting enemy supply crates can provide Ammo, Equipment and Medical supplies.",
tip_melee_attack: "Uma pancada com a coronha da sua arma pode ser uma boa forma de finalizar o seu inimigo. Útil especialmente se você não tiver muita munição." #A hit with the butt of your weapon can be a good way to finish off an opponent. This can be especially useful if you are low on ammo.",
tip_tactical_reload: "Você pode recarregar a sua arma a qualquer momento. Certifique-se que esteja com o carregador cheio antes de entrar em uma nova área." #You can reload your weapon at any time. Make sure that you always have a full magazine before entering a new area.",
tip_switch_to_sidearm: "Trocando para sua arma secundária é mais rápido do que recarregar a sua primária." #Switching to your sidearm is quicker than reloading your primary weapon.",
tip_new_objective_bonuses: "Algumas missões podem recompensar bônus de experiência por ir além dos objetivos obrigatórios." #Some raids can reward bonus experience for going above and beyond your required objectives.",
tip_commanders: "Capitães vão juntar os inimigos e deixar as coisas mais difíceis para você, mate eles assim que possível." #Captains will rally enemies and make things very difficult for you, kill them as soon as possible.",
tip_first_aid_loot_drop: "Usando caixas médicas grandes vão recuperar uma queda sua, use-as para prevenir que morre." #Using large medical cases will return a single down, Use them to prevent dying for good.",
tip_grenade_loot_drop: "Pegando as granadas que você não precisa vai deixar o resto para trás que podem ser coletadas para depois." #Picking up grenades you don't need will leave behind spares that can be collected later.",
tip_automatic_pickups: "Alguns suprimentos soltos no chão podem ser coletadas automaticamente; pequenas curas médicas, pequenas bolsas de munições e pilhas de munições." #Some loot drops on the ground will be automatically picked up; small health bandages, small ammo pouches and medium ammo piles will be picked up when needed.",
tip_weapon_effecienty: "Armas diferentes são mais efetivos em alcances diferentes, e assim são apropriados para situações diferentes." #Different weapons are effective at different ranges, and are therefore suited to different situations.",
tip_grenade_using: "Se consegue ouvir eles, mas não pode atirar neles, jogue uma granada!" #If you can hear them but you cant shoot them you can probably grenade them!",
tip_bag_sprinting: "Quando estiver carregando itens pesados, vai consumir mais vigor enquanto estiver correndo." #When carrying heavy items you consume more stamina while sprinting.",
tip_new_grenade_throw_alt: "Jogue granadas em diferentes ângulos com o botão alternativo do mouse" #Throw grenades at different angles with the alternative mouse button.",
tip_new_weapon_parts: "Não gostou da aparência de alguma parte da sua arma favorita? Você pode tirar a parte cosmética clicando no ícone da modificação." #Don't like the looks of some weapon parts on your favorite gun? Toggle cosmetic parts off by clicking attachments with the tool icon.",
tip_new_honk_honk: "Quando estiver pilotando um veículo, você pode buzinar com o botão de atirar." #When in a vehicle as the driver you can honk the horn with the fire button.",
tip_new_level_fourty: "Tente subir de nível das outras classes, você pode gostar." #Try leveling up other classes, you might enjoy it.",
tip_challenge_cards_1: "Quando jogar com outras pessoas, considere usar uma carta de desafio para conseguir mais experiência." #When playing online consider using challenge cards to earn even more experience.",
tip_silent_headshots: "Atirar num inimigo que não está em alerta, pode matá-lo instantaneamente mirando na cabeça." #Shooting an enemy who is not yet alerted can instantly kill them but only if you aim for the head.",
tip_outlaw_rewards: "Missões fora da lei vão recompensar ouro extra na dificuldade mais alta." #Outlaw raids will award extra gold the higher difficulty you play them on.",
tip_weapon_spread: "A maioria das armas são mais precisas quando atirar em rajadas." #Most weapons are more accurate when fired in bursts.",

