# Nomes e descrições
loading_tutorial: "Bem-vindo à gangue RAID..." #Welcome to the RAID gang...",
menu_tutorial_hl: "Tutorial",
menu_tutorial_briefing: "Tutorial",
menu_tutorial_skip_hl: "Pular tutorial" #Skip Tutorial",

# Legendas
tutorial_set_up_maps_table: "A mesa de mapas é onde você pode ver informações para cada missão que eu tiver disponível para você, também é onde você poderá escolher qual missão vai querer executar." #The maps table is where you'll find briefings and intel for every mission I make available to you, and is where you choose which mission to execute next. ",
tutorial_spawn1_amer: "Segue o beco. Fique de olhos nos guardas. Chegar na igreja. Mamão com açúcar." #Go down an alley. Keep an eye out for guards. Get to the church. Piece'a cake.",
tutorial_find_locked_gate_brit: "Porcaria. Preciso destrancar esse cadeado." #Bugger. Need to take care of this lock.",
tutorial_spawn1_germ: "Passar pelo beco de fininho. Tomar cuidado com os guardas. Boa sorte, mein Freund." #Sneak down the passage. Be mindful of guards. Enter the church. Good luck to you, mein Freund.",
tutorial_spawn2_russ: "Ei, guarda a frente, ver? Vamos continuar escondidos por uma surpresa." #Hey. Guard up ahead - you see? Let us stay hidden for bigger surprise.",
tutorial_spawn1_russ: "Pelo beco. Guardas a frente. Chegar na igreja. Simples, sim." #Through alley. Guards ahead. Reach church. Is simple, yes.",
tutorial_close_to_graveyard_russ: "Porta da frente não é uma opção? Como vamos entrar?" #Front door is not option? So how we get in?",
tutorial_set_up_card_table: "Serve para lhe ajudar a descansar entre as missões, esta carta é ideal para crescer a sua coleção de cartas de desafios e de bônus." #As well as helping you unwind between missions, this card table is ideal for perusing your collection of Challenge and Booster cards.",
tutorial_set_up_radio_01: "Você pode usar este rádio para contatar outros soldados da RAID e juntar forças com eles nas missões. Assim como eles podem usar o rádio deles para se juntar a você, se permitir." #You can use this radio to contact other RAID operatives and join forces with them on missions. Likewise, they can use their radios to join you, should you choose to allow them.",
tutorial_spawn1_brit: "De fininho pelo beco. Ficar atento com os guardas. Entrar na igreja. Maravilha." #Tip-toe down the alley. Eyes peeled for guards. Pop into the church. Marvellous."
tutorial_spawn2_germ: "Espere um momento. O guarda lá, você vê? Vamos ficar fora de vista dele... por enquanto." #Stop a moment. The guard there, do you see? Let us stay out of sight... for now.",
tutorial_see_crypt_amer: "Me pergunto se isso é o jeito de entrar. Nada há nada como entrar por um cripta." #Wonder if this is a way in. Nothing like creeping through a crypt.",
tutorial_lock_picked_amer: "E foi. Agora, precisamos achar a igreja." #And that's that. Now, need to find us a church.",
tutorial_gold_box_01: "Se você, por acaso, achar algum ouro, você pode considerar a gastar para dar um toque a mais nesse lugar." #If you do happen to come across some, you might want to consider using some of it to spruce up this place.",
tutorial_killed_enemies_brit: "E é por isso que eles deveriam cuidar das suas vidas. Vamos, entrar, pessoal." #And that's why they should've minded their own business. Let's head in, lads.",
tutorial_spawn2_amer: "Vem problema aí, tá vendo? Fique na moita, fique quieto." #We got company, see up ahead? Stay low, stay quiet.",
tutorial_lock_picked_germ: "Esperava ser mais desafioso. Hm. Onde está a igreja?" #I expected more challenge. Hm. Where is this church, then?",
tutorial_set_up_card_table_01: "Cartas de desafios podem ser usados para fazer uma missão mais difícil em troca de mais recompensas, enquanto cartas de bônus lhe dará uma vantagem contra o inimigo." #Challenge cards can be used to make a mission harder in return for increased rewards, while Booster cards can be used to give you a temporary advantage against the enemy.",
tutorial_pull_lever_amer: "Corrente é um belo jeito de começar o dia." #Chain's as good a place to start as any.",
tutorial_see_crypt_russ: "Isso é a entrada? Cripta é a saída, né? Bah, vamos." #This is way in? Crypt is way out, surely? Bah, we go, come.",
tutorial_lock_picked_russ: "Nenhuma tranca pode parar Kurgan. Então, onde está a igreja?" #No lock can stop Kurgan. So where is church?",
tutorial_inside_crypt_amer: "Puta merda... huh. Parece que vamos ter que arrumar as caixas." #Holy shit... huh. Looks like we'd best unbox some crates.",
tutorial_killed_enemies_germ: "Você tenta isso, nesse lugar sagrado? Pena de você por não se esforçar. Agora, vamos entrar." #You try this, in such a holy place? Shame on you for not trying harder. Now, let us head inside.",
tutorial_pull_lever_germ: "Vamos puxar essa corrente, talvez." #Let's try this chain, perhaps.",
tutorial_spawn2_brit: "Parece que temos um guarda a frente. Fique fora de vista dele, e não faz um piu, certo." #Looks like a guard  up ahead. Stay out of sight, and not a peep, right.",
tutorial_find_locked_gate_amer: "Temos que fazer algo com esse cadeado." #Gotta do something about this lock.",
tutorial_find_locked_gate_russ: "Hm. Pequeno cadeado não vai me parar." #Hm. Little lock will not stop me.",
tutorial_find_locked_gate_germ: "Admiro o otimismo em colocar um cadeado aqui." #I admire the optimism of placing this lock here.",
tutorial_lock_picked_brit: "Aqui estamos. Agora, qualquer um de vocês gostariam de procurar uma igreja aqui?" #There we are. Now, any of you chaps see a church around here?",
tutorial_close_to_graveyard_brit: "Como vamos entrar aqui?" #How do you suppose we get in?",
tutorial_close_to_graveyard_amer: "Acho que temos que achar um jeito de entrar." #Guess we gotta find a way inside.",
tutorial_close_to_graveyard_germ: "Acredito que devemos achar um jeito de entrar." #I believe we must find a way inside.",
tutorial_see_crypt_brit: "Ah, a porta da morte, eh?" #Ah. Death's door, eh? Delightful. Through here, methinks.",
tutorial_see_crypt_germ: "Eu não sou fã das tumbas, mas se vai ter que ser assim, que assim seja." #I am not one for tombs, but if this is the way in, so be it.",
tutorial_killed_enemies_amer: "Bom, pelo menos estamos próximos a um cemitério, heh. Bora, vamos entrar." #Well, at least we're near a graveyard, heh. C'mon, let's get inside.",
tutorial_killed_enemies_russ: "Eu mato quem tentar me parar. Conta para os seus amigos. Ah, tarde demais. Vamos entrar." #I crush any who try to stop me. Tell your friends. Oh. Too late. Come - inside.",
tutorial_pull_lever_brit: "Me atrevo dizer, devemos começar com essa corrente." #I daresay we should start with the chain.",
tutorial_pull_lever_russ: "A corrente parece ser boa para começar." #The chain is good place to start.",
tutorial_inside_crypt_brit: "Huh. Bom... Isso não é algo que você vê todo dia. Suponho que devemos arrumar essas coixas." #Huh. Well... that's not something you see everyday. I suppose we ought to unbox some crates.",
tutorial_inside_crypt_russ: "Hm. Bela decoração. Vamos. Arrumar as caixas." #Hm. That is quite the decoration. Come - we unbox crates.",
tutorial_inside_crypt_germ: "Hah... Isso é novo. Bom, sem mais delongas, vamos arrumar as caixas." #Hah... that's new. Well then, without further ado, let us unbox crates.",
tutorial_set_up_char_table: "Aqui, você vai poder recrutar e trocar entre os membros da RAID para fazer as missões. Os mais bem vestidos também podem decidir quais trajes os personagens vão vestir." #Here, you'll be able to recruit and switch between different RAID members to take on missions. The more sartorially-minded can also decide which outifits their operatives will wear.",
tutorial_set_up_weapon_table: "A bancada de armas é onde você vai poder melhorar o seu armamento e, o mais importante, vai poder escolher o seu equipamento antes de ir para as missões." #The weapons bench is where you can upgrade your armaments and, importantly, where you'll choose your loadout before going on missions.",
tutorial_set_up_skils_table: "Esta área de treinamento é onde você poderá expandir e melhorar os talentos e as habilidades da gangue RAID." #This training area is where you'll be able to expand and hone your RAID team's talents and abilities.",
tutorial_goto_bed: "Vocês fizeram um bom trabalho preparando o acampamento. Agora sugiro vocês descansarem antes de irem para sua primeira missão. Sra. White, câmbio, desligo." #You've done well to get the camp set up. Now I suggest you get some rest before embarking on your first mission. Mrs White, over and out.",
tutorial_gold_box: "Tenho certeza que não preciso falar para *você* ficar de olho por oportunidades de 'pôr em lugar errado' algum ouro nazista." #I'm sure I don't have to tell *you* to be on the lookout for opportunities to 'misplace' a little Nazi gold.",
tutorial_get_dogtags: "Quando vocês estiverem no campo, fique de olho por dog tags dos soldados aliados falecidos." #When you're out in the field, be sure to keep a look-out for the dogtags of fallen Allied soldiers.",
tutorial_set_up_radio: "Ah, você botou o rádio para funcionar. Excelente. " #Ah, you've gotten the radio working. Excellent. Allow me to introduce myself. My name is Mrs White, and Control has asked me to supervise the RAID project.",
tutorial_get_dogtags_01: "Coletando eles nos permitirá informar as suas famílias dos seus destinos. E não se preocupe, será recompensado por isso." #Collecting them will allow us to inform their families of their fates. And don't worry, you'll be rewarded for your efforts.",

