# Nomes e descrições
menu_ger_miss_03_ld_desc: |
 A operação toda não é oficial, o financiamento da gangue requer muita "criatividade da contabilidade", isso envolve ouro. Como já era de costume, os nazistas estão guardando uma quantidade grande de ouro dentro da tesouraria. Vão para lá. O Sabre Squadron vai explodir o seu cofre. O seu objetivo é entrar e roubar o ouro. A Resistência vai ajudar vocês escaparem com os espólios.$NL;
  - Entre no cofre da tesouraria
  - Recupere o ouro
  - Leva o ouro até a Resistência
  - Fuja
#The whole Raid operation is strictly off-the-books, and financing the gang requires a lot of “creative accountancy”. Much of this involves gold. As it happens, the Nazis are storing a large amount of it in a nearby Treasury. Head there. Sabre Squadron will blast open its vault. Your job is to simply get in and steal the gold. The Resistance will help you get it out.$NL;
# - Enter the Treasury’s vault
# - Retrieve the gold
# - Bring the gold to the Resistance
# - Escape"
menu_ger_miss_03_ld_loading_desc: "Entrem na tesouraria, achem um jeito de entrarem no cofre e levem o ouro até o avião da Resistência." #Blast your way into the Treasury, gain access to the vault and bring the gold to the Resistance plane."
menu_ger_miss_03_ld_hl: "Gold Rush" #Gold Rush"
treasury_mission_photo_1_title: "A tesouraria" #The Treasury"
treasury_mission_photo_3_description: "Uma grande quantidade de ouro que os nazistas roubaram estão guardados no cofre." #A vast amount of the Nazis' stolen gold lies in this deep vault."
treasury_mission_photo_2_title: "Canhões Flak" #Flak Cannons"
treasury_mission_photo_1_description: "O lugar onde ficar os bens roubados pelos nazistas. A sua opulência dá a falsa ideia de quão forte é." #Home to much of the wealth stolen by the Nazis. It's opulence belies just how strong it is."
treasury_mission_photo_2_description: "A área está cercada com canhões 88mm Flak. Devastador contra alvos aéreos, também útil contra alvos no chão." #The area is surrounded with powerful 88mm flak cannons. Devastating against air targets, and useful against ground targets too."
treasury_mission_photo_3_title: "Cofre da tesouraria" #The Treasury Vault"
treasury_mission_photo_4_description: "Assim que recuperarem uma pequena fortuna, este avião aterrissará na rua próxima e preparado para escapar com o ouro." #Once you have liberated a small fortune, this plane will land in a nearby street and be ready to haul the gold away."
treasury_mission_photo_4_title: "O avião da resistência" #The Resistance Plane"

# Legendas
bank_aa_gun_first2_amer: "Haha, muito bom! Temos uma arma antiaérea. Só precisa achar munição pra ela." #Haha - very nice! Got an AA gun here. Just need to find some shells for it."
bank_aa_gun_first2_brit: "Aqui vamos nós! Uma arma antiaérea só esperando para ser usada pelo bem maior. Só precisa de munição." #Here we are! An AA gun just waiting to be used for the greater good. Just need some ammo."
bank_aa_gun_first2_germ: "Ótimo, nós temos a arma antiaérea. Agora, a munição." #Excellent. We have the AA gun we need. Now - to find some bullets."
bank_aa_gun_first2_russ: "Olá! Arma antiaérea está aqui. Nós achamos munição agora." #Hello! AA gun is here. We find ammo now."
bank_aa_gun_first3_amer: "Então, nós temos uma puta chave pra tesouraria!" #Then we'll have ourselves one hell of a key for the treasury!"
bank_aa_gun_first3_brit: "Bom, é um jeito de entrar na tesouraria! Olha que beleza" #Well... that's one way to get into the treasury! Jolly good!"
bank_aa_gun_first3_germ: "Um jeito mais ingênuo para entrar na tesouraria. Ah, gostei disso." #A most ingenious way of gaining access to the treasury. Oh, I like this."
bank_aa_gun_first3_russ: "E a arma antiaérea vai ser o jeito de entrar na tesouraria. Tem a minha aprovação." #And AA gun will be effective way to enter treausry. I approve of this."
bank_arsenal_complete2_amer: "Legal! Hora de usar a arma e fazer muito barulho!" #Nice! Time to use the gun as the world's loudest treasury key!"
bank_arsenal_complete2_brit: "Excelente, agora vejamos o que essa belezinha pode causar, eh?" #Excellent. Now, how about we see what sort of punch this little blighter can pack, eh?"
bank_arsenal_complete2_germ: "Maravilha, cavalheiros. Posso sugerir que testamos a arma para abrir a tesouraria dos nazistas?" #Superb, gentlemen. Might I suggest we test the gun's ability to open up Nazi treasuries?"
bank_arsenal_complete2_russ: "Nós temos a arma, temos a munição, por que estamos parados? Bora atirar a arma!" #We have gun. We have ammo. Why we stand here? We have gun to shoot!"
bank_bank_entrance_free_amer: "Boa! Tá, acho que aquilo serviu!" #Yeah! All right, I think that did it!"
bank_bank_entrance_free_brit: "Bingo! Funcionou! Entramos!" #Bingo! That did it! We're through!"
bank_bank_entrance_free_germ: "Haha! Excelente, a tesouraria está aberto pra negócios!" #Haha! Excellent - the treasury is open for business!"
bank_bank_entrance_free_russ: "Hehe! Agora nós abrimos a porta!" #Heh-heh! We have open door now!"
bank_bank_entrance_free2_amer: "Ah, aí sim. Eu tenho que arrumar uma dessas arma. Bora, temos uma entrada. Hora de roubar o ouro!" #Oh hell yeah. I gotta get me one of these guns. C'mon - we got an opening. Time to get paid!"
bank_bank_entrance_free2_brit: "Um ótimo trabalho, cavalheiros! Hora de pegar esse ouro!" #Jolly good work, chaps! Time to go grab us some gold!"
bank_bank_entrance_free2_germ: "Hoho! Uma bela vista. Agora, nós temos uma tesouraria cheio de ouro pra gente roubar." #Hoho! A most impressive display. And now, we have a treasury full of gold to be taken."
bank_bank_entrance_free2_russ: "Estou impressionado. Quando a gente receber o ouro, deveria comprar uma arma assim. Vamos roubar o ouro." #I am impressed. When we have the gold, I should buy gun like this. We take gold now."
bank_bank_front_open1_amer: "Agora isso que chamo de uma puta entrada! Entendeu? Porque a gente... fez uma... ah, deixa." #Hoo-HOO! Now THAT's what I call 'making an entrance'! Ya geddit? 'Cos we... MADE an... ah forget it."
bank_bank_front_open1_brit: "Que Deus me abençoe! Acho que os meus ouvidos vão ficar com zumbido por semanas!" #Goodness gracious me! I think my ears will be ringing for weeks!"
bank_bank_front_open1_germ: "Yowzer! Isso foi um pouco perto para conforto." #Yowzer! That was a little close for comfort."
bank_bank_front_open1_russ: "FALOU COMIGO? A EXPLOSÃO ME DEIXOU SURDO!" #YOU SPEAK TO ME? EXPLOSION WAS LOUD!"
bank_bomb_alive1_amer: "Ah, porra, a bomba não explodiu!" #Ah fuck. Bomb was a dud! "
bank_bomb_alive1_brit: "Ah, mas que... Pelo amor de Deus. A bomba não explodiu!" #Oh fuuu... for Heaven's sake. It was a dud!"
bank_bomb_alive1_germ: "Que? Inaceitável! Sem explosão!" #What? Most unacceptable! No explosion!"
bank_bomb_alive1_russ: "Eh? A bomba é inútil." #Eh? Bomb is useless."
bank_bomb_alive3_amer: "Quer explodir algo? Então, atire nele!" #You want something to blow up? Shoot some holes into it!"
bank_bomb_alive3_brit: "Talvez podemos dar um motivo para explodir com as nossas armas. Atire!" #Perhaps we could encourage an explosion with our weapons. Shoot it!"
bank_bomb_alive3_germ: "Você vão descobrir que as nossas armas podem fazer a bomba obedecer. Atirem!" #You will find our guns may be able to persuade the bomb to behave. Fire!"
bank_bomb_alive3_russ: "Talvez a bomba explodir se nós atirar. Sim. Nós atirar." #Maybe bomb explode after we shoot it. Yes. We shoot it."
bank_call_squadron1_amer: "Broadsword para Sabre Squadron! Tá na escuta, pessoal?" #Broadsword to Sabre Squadron! Ya hearing me, guys?"
bank_call_squadron1_brit: "Broadsword para Sabre Squadron! Câmbio." #Broadsword calling Sabre Squadron! Come in!"
bank_call_squadron1_germ: "Broadsword para Sabre Squadron. Câmbio." #Broadsword to Sabre Squadron. Over."
bank_call_squadron1_russ: "Broadsword para Sabre Squadron. Responda, por favor." #Broadsword to Sabre Squadron. Respond. Please."
bank_call_squadron2: "Aqui é Sabre Squadron. Podemos ajudar vocês?" #This is Sabre Squadron. We help you guys?"
bank_call_squadron3_amer: "Pode apostar que pode! Consegue ver a fumaça subindo da tesouraria?" #You bet ya ass ya can! You see a shitload of smoke comin' outta the bank?"
bank_call_squadron3_brit: "Devo dizer que sim. Vocês deveriam ver uma fumaça vindo da tesouraria. Câmbio." #I should say so. You should see a pillar of smoke rising from the bank. Over."
bank_call_squadron3_germ: "De fato, estão vendo a fumaça da tesouraria?" #Indeed. Do you see smoke rising from the bank?"
bank_call_squadron3_russ: "Da. Estão vendo a fumaça? Vindo da tesouraria?" #Da. You see smoke? Rising from bank?"
bank_call_squadron4: "Estamos vendo, Broadsword. Foram vocês?" #We see it, Broadsword. Your handiwork?"
bank_call_squadron5_amer: "Sim, ouçam, vocês podem soltar uma das suas bombas bem no meio?" #Yeah. Listen, you reckon you guys could drop one of those bombs right through it?"
bank_call_squadron5_brit: "É um sinalizador. Bem no cofre. Sejam gentis e soltam uma das suas bombas bem no meio." #It's a marker. Right at the vault. Be a good chap and drop one of those bombs through it, would you?"
bank_call_squadron5_germ: "Ja. Nós queremos que você solta uma bomba diretamente aí." #Ja. We request that you drop a bomb directly through it."
bank_call_squadron5_russ: "Da. Fumaça é o alvo. Soltem a bomba pela fumaça. Da?" #Da. Smoke is target. Drop bomb through smoke. Da?"
bank_call_squadron6: "Vocês são uns doidos mesmo, mas estamos preparando o nosso ataque!" #You guys are half a bubble off plumb, but... setting up our attack run!"
bank_canister_picked2_amer: "Olha, há veículos ao redor da gente. Devemos conseguir pegar combustível deles." #Look, there's vehicles all around us. Should be able to siphon fuel from 'em."
bank_canister_picked2_brit: "Têm veículos ao redor. Peguem combustível deles!" #There are vehicles all around. Siphon petrol from them!"
bank_canister_picked2_germ: "Tem muitos veículos na rua. Podemos pegar o combustível deles." #There are many vehicles in the street. We could siphon fuel from them."
bank_canister_picked2_russ: "Olhem em volta, veículos! Peguem gasolina deles, da?" #Look around. Vehicles! Siphon gasoline from them, da?"
bank_car_found1_amer: "Aqui vamos nós, achamos a nossa carroça!" #Here we go - think we found our ride!"
bank_car_found1_brit: "Excelente! Cá estamos nós, cavalheiros, a nossa carroça nos aguarda!" #Excellent! Here we are, gents - our chariot awaits!"
bank_car_found1_germ: "Não é lá essas coisas, mas serve. É o nosso veículo." #It is unsightly, but it will do. Here is our vehicle."
bank_car_found1_russ: "E isso vai ser o nosso veículo. E tem espaço para o nosso ouro." #And this shall be our vehicle. It has space for gold."
bank_car_found2_amer: "Vai servir. Vamos botar o ouro aí." #That'll do. Let's load up the gold."
bank_car_found2_brit: "Estiloso! Vamos guardar o ouro aí, então." #Good show! Let's pop the gold in, then."
bank_car_found2_germ: "Não é lindo, mas se pode carregar o ouro, vai servir. Carreguem o ouro!" #It is not the cleanest. But if it carries our gold, it will do. Load up!"
bank_car_found2_russ: "Então, vamos botar o nosso ouro aí!" #Then we shall fill it up!"
bank_car_refueled_amer: "Gasolina tá no jeep. Droga, acho que ainda precisamos de mais." #Gas is in the jeep. Shit, I still think we need more."
bank_car_refueled_brit: "Ok, lá vamos nós. Não acho que foi o suficiente." #Okay, there we go. Don't think it's enough quite yet."
bank_car_refueled_germ: "Oh, isso é ridículo. Ainda não é suficiente." #Oh this is ridiculous. We still do not have enough fuel."
bank_car_refueled_russ: "Temos mais combustível, mas ainda precisa de mais." #More fuel has been used. But more fuel is needed, still."
bank_destroy_skylight_amer: "Derrubem a clarabóia!" #Bring down the skylight!"
bank_destroy_skylight_brit: "Derrubem a clarabóia!" #Take out the skylight!"
bank_destroy_skylight_germ: "A clarabóia tem que ser derrubada!" #The skylight must be brought down!"
bank_destroy_skylight_russ: "Atire na clarabóia!" #Shoot the skylight!"
bank_destroy_skylight2_amer: "Tem que ser um buraco grande pra as bombas." #Give the planes a hole big enough for the bombs."
bank_destroy_skylight2_brit: "O buraco tem que ser grande bastante para a bomba!" #Make sure the hole's big enough for some bombs!"
bank_destroy_skylight2_germ: "O buraco tem que ser grande suficiente para a bomba!" #The hole must be big enough for the bombs!"
bank_destroy_skylight2_russ: "Bombas precisam de um buraco grande. Lembrem-se, eles erraram antes!" #Bombs need big hole. Remember - they missed before!"
bank_fence_smashed2_amer: "Tudo bem, o avião da Resistência tá em algum lugar." #All right, the Resistance plane is around here somewhere."
bank_fence_smashed2_brit: "Agora, o avião da Resistência está em algum lugar próximo. Só temos que achar." #Now, that Resistance plane is around here somewhere. Just got to find it."
bank_fence_smashed2_germ: "Nós vamos achar o avião da Resistência por aqui, espero." #We will find the Resistance plane in the area, I hope."
bank_fence_smashed2_russ: "Agora achamos o avião da Resistência. Está por perto, sim?" #Now we find Resistance plane. It is close, yes?"
bank_find_car1_amer: "Procurem algo que podemos usar pra carregar o ouro e cair fora daqui." #Keep a lookout for something we can load up and drive outta here."
bank_find_car1_brit: "Isso seria menos cansaço com um veículo. Vejam se conseguem acharem um." #This would be frightfully less tiring with a vehicle. See what you can find."
bank_find_car1_germ: "O exercício é bom, mas devemos usar um veículo, eu acredito." #The exercise is good, but we must use a vehicle, I believe."
bank_find_car1_russ: "Hm, eu posso carregar ouro, mas amigos, vocês parecem cansados já. Achamos algo para transporte até o avião." #Hm. I can carry gold, but comrades, you look tired already. We find something to drive to plane."
bank_find_car2_amer: "Não tem como a gente levar todo esse ouro a pé." #There's no way we can take all the gold we want on foot."
bank_find_car2_brit: "Concordo. É longe demais para a gente carregar." #Agreed. There's far too much to carry ourselves."
bank_find_car2_germ: "Com toda certeza. O avião está longe e temos muito ouro." #Absolutely. The plane is far, and the gold is plentiful."
bank_find_car2_russ: "Boa ideia. Estou bem, mas vocês parecem cansados, e o avião está longe." #That is good idea. I am fine, but you all look tired already, and plane is far."
bank_find_radio1_amer: "Temos um rádio por perto, achem." #There has to be a radio nearby. Find it."
bank_find_radio1_brit: "Presumo que tem um rádio por perto. Fiquem atentos." #I'd wager there's a radio nearby. Keep your eyes peeled."
bank_find_radio1_germ: "Deve ter um rádio por perto, com toda certeza. Devemos achá-lo." #There will most definitely be a radio nearby. We must find it."
bank_find_radio1_russ: "Nós vamos achar o rádio. Continuem procurando." #We will find radio. Keep looking."
bank_find_radio2_amer: "Faz sentido que eles teriam rádios longe do ouro, num escritório, acho eu. Vamos achar e ligar pro Sabres, eles são a chave pro cofre." #Makes sense that they'd have the radios away from the gold, in an office, I guess. We find that, we radio the Sabres, and we got our key to the vault."
bank_find_radio2_brit: "Pode chamar de chute, mas diria que os escritórios seria o melhor lugar. Achem o rádio, chama os pilotos e as suas bombas!" #Call it an educated guess, but I'd say any offices would be our best shout. Find the radio, call the fly-boys, and bombs away!"
bank_find_radio2_germ: "O escritório é o lugar mais lógico de ser ter um rádio. Quando a gente achar, nós chamamos os nossos pilotos e vamos ver se podem abrir o cofre." #The offices are the most logical place to find the radio. Once we do, we can call our overhead friends and see if they can open the vault."
bank_find_radio2_russ: "O escritório é um lugar bom para o rádio. Nós falamos com o Sabre Squadron e vão abrir o cofre." #Office is good place for radio. We speak to Squadron of Sabres, and they will open vault."
bank_find_shells2_amer: "Merda! Não estou vendo nenhuma munição." #Damn! I don't see any shells though."
bank_find_shells2_brit: "Droga, está sem munição. Vamos procurar pelas balas!" #Toss. There's no shells. Get looking for them!"
bank_find_shells2_germ: "Mas não consigo ver nenhuma bala!" #But I fail to see any shells!"
bank_find_shells2_russ: "Mas... onde está as balas?" #But... where are shells?"
bank_find_shells3_amer: "Faz sentido da munição estar por perto! Não parem de procurar!" #Makes sense for 'em to be close! Get looking!"
bank_find_shells3_brit: "Podem estar por perto. Continuem procurando!" #They have to be close. Get looking for them!"
bank_find_shells3_germ: "Eles deixariam as balas guardadas em algum canto próximo. Vamos procurar!" #They would have to store them nearby. Let us search!"
bank_find_shells3_russ: "Deve estar por perto, nós procurar!" #Must be close. We look!"
bank_flag_burnt_var3_amer: "Quem diria que queimariam tão rápido?" #Who'da thought they'd burn so fast?"
bank_flag_burnt_var3_brit: "Essas coisas queimam tão fácil!" #These things burn so easily!"
bank_flag_burnt_var3_germ: "Bela fogueira!" #It burns nice and bright!"
bank_flag_burnt_var3_russ: "Cheiro de churrasco, bandeira do fascista!" #Burn nicely, fascist flag!"
bank_flak88_destroy_wall1_amer: "Tudo bem, carregado. Agora como funciona essa coisa?" #All right, loaded. Now how do we work the damn thing?"
bank_flak88_destroy_wall1_brit: "Está carregada. Agora, como funciona esse troço?" #It's loaded. Now, how do you work this thing?"
bank_flak88_destroy_wall1_germ: "O canhão está carregado. Presumo que funciona que nem qualquer outra arma...?" #The shell is loaded. I presume it works like any other gun...?"
bank_flak88_destroy_wall1_russ: "Carregado e pronto, o que fazer agora?" #Locked and loaded. What to do now?"
bank_flak88_destroy_wall2_amer: "Acho que é só mirar na parede e atirar." #Guessing ya just point at the wall and shoot."
bank_flak88_destroy_wall2_brit: "Mira na parede e atire, eu acho." #Point it at the wall and shoot, I expect."
bank_flak88_destroy_wall2_germ: "Vejam a parede? Mirem, atirem e \"poof!\", a parede vira uma entrada." #Do you see that wall? Point the gun, shoot, and 'poof', the wall becomes an entrance."
bank_flak88_destroy_wall2_russ: "Tem uma parede, você atire, aí teremos buraco. Entendeu?" #There is wall. You shoot. There is hole in wall. You understand?"
bank_flak88_interact1_amer: "Ok, uma bala! Agora só carregar a merda da arma." #Okay. One shell! Now just got to load the damn thing."
bank_flak88_interact1_brit: "Pronto! Agora, carregue a arma." #There! Now, get it loaded."
bank_flak88_interact1_germ: "Perfeito. Parece ser a munição correta. Vamos carregar a arma." #Perfect. That looks like the correct ammo. Let's load the gun."
bank_flak88_interact1_russ: "Ok, temos a munição. Coloque na arma." #Okay! Now we have shell. Put in gun."
bank_flak88_loaded1_amer: "Ok, está carregado. Agora como essa droga funciona?" #All right, loaded. Now how do we work the damn thing?"
bank_flak88_loaded1_brit: "Está carregada. Agora, vocês sabem como essa coisa funciona?" #It's loaded. Now, how do you work this thing?"
bank_flak88_loaded1_germ: "A bala está na arma. Presumo que é só puxar o gatilho?" #The shell is loaded. I presume it works like any other gun...?"
bank_flak88_loaded1_russ: "Está pronto. Fazer o que agora?" #Locked and loaded. What to do now?"
bank_flak88_loaded2_amer: "Acho que é só mirar na porta e atirar." #Guessing ya just point at the door and shoot."
bank_flak88_loaded2_brit: "Mire na porta e atire, acho eu." #Point it at the door and shoot, I expect."
bank_flak88_loaded2_germ: "Você vê aquela porta? Mira a arma, atire e caboom, não tem mais porta." #Do you see that door? Point the gun, shoot, and 'poof', no more door."
bank_flak88_loaded2_russ: "Ali está a porta. Você atire. Não tem mais porta. Entendeu?" #There is door. You shoot. There is NO door. You understand?"
bank_flak88_miss_amer: "Ô merda! Como assim errou aquilo, porra? Tenta de novo!" #Shit! How the fuck did that miss. Do it again!"
bank_flak88_miss_brit: "Droga! Errei. Recarrega e tenta de novo!" #Bollocks! Missed. Reload, do it again!"
bank_flak88_miss_germ: "Aí não dá! Difícil de errar, vamos, precisamos recarregar e acertar o alvo!" #Inconceivable! That was a difficult target to miss. Come - we reload and hit the target!"
bank_flak88_miss_russ: "Bem ruim! Nós atiramos novamente, e vê se não erre dessa vez!" #Very poor! We shoot again, and do not miss this time!"
bank_flak88_reload_amer: "Na mosca, mas parece que não derrubou. Só mais um tiro." #Direct hit! But it didn't break it down. One more shot."
bank_flak88_reload_brit: "Acertei! Ei, espera, não quebrou. Tenta de novo!" #Hit! Hey, wait - it didn't break it down. Try again!"
bank_flak88_reload_germ: "Haha! Na mosca! E mesmo assim, precisa de mais um tiro, ao que parece. De novo!" #Haha! Bullseye! And yet, the wall will require another strike, it would seem. Again!"
bank_flak88_reload_russ: "Sim! A parede é forte que nem russo. Atire de novo e ficará fraca, como um fascista." #Yes! Wall is strong like Russian. Shoot again and it is weak, like fascist."
bank_found_aa_gun_amer: "Aha! Ora, olá, Sra. arma antiaérea, o que disse? Claro que sim, você pode estourar aquela porta da tesouraria. Maravilha." #Aha! Well hello there Mr AA gun? What's that? Why yes, you CAN blast a way into the treasury. How thoughtful."
bank_found_aa_gun_brit: "Nossa senhora! Eu diria que esta arma é uma baita zarabatana. Acredito que isso é a nossa chave para entrar na tesouraria." #Golly! I say, this is QUITE the little peashooter. I do believe this is our key to entering the treasury."
bank_found_aa_gun_germ: "Minha nossa senhora, isso é a minha primeira vez que vejo uma chave desse jeito. Vamos ver se vai funcionar." #My goodness. This may be the first time I have seen a key shaped exactly like an AA gun. Let us see if it works."
bank_found_aa_gun_russ: "Heh! Agora achamos uma arma grande bastante para Kurgan! Vamos testar a sua força." #Haha! Now we find gun big enough for Kurgan! We shall test its might."
bank_fuel_taken_amer: "Tá bom, peguei um pouco do combustível. Hora de levar de volta pro jeep." #All right, got a bit of juice. Time to get it back to the jeep."
bank_fuel_taken_brit: "Bela gasolina que temos aqui! Agora só levar de volta para a carroça." #Nice bit of petrol there! Now just got to get it back to the jeep."
bank_fuel_taken_germ: "Ugh, muito comum. Não tem problema, nós temos o que precisamos. Hora de usar pro combustível!" #Ugh. How very common. No matter - we have what we came for. Time to use this fuel!"
bank_fuel_taken_russ: "Eh, não é o pior gosto que já tive. Temos gasolina. Voltamos pro veículo agora." #Pah. Eh, not the worst I have tasted. We have fuel. We go back to vehicle now."
bank_get_to_the_gate_amer: "Temos um avião pra pegar! Pisa fundo!" #We got a plane to catch! Floor it!"
bank_get_to_the_gate_brit: "Vamos para o avião, sem enrolação!" #Let's get to the plane, double-time!"
bank_get_to_the_gate_germ: "E agora, melhor não deixar o avião esperar. Schnell!" #And now, let us not keep our plane waiting. Schnell!"
bank_get_to_the_gate_russ: "O nosso avião está esperando. Sem atraso, vamos!" #Our plane is waiting. Do not delay - we go now!"
bank_get_vehicle1_amer: "Ei, nós precisamos de um carro pra cair fora daqui." #Hey, we're gonna need wheels to get this loot outta here."
bank_get_vehicle1_brit: "Essa coisa é bem pesada. Vamos precisar de um carro ou algo assim pra escapar daqui." #This stuff is frightfully heavy. Going to need a car or something to get it out."
bank_get_vehicle1_germ: "Este ouro é mais pesado do que eu esperava. Um veículo seria útil." #This gold is heavier than I expected. A vehicle would be useful. "
bank_get_vehicle1_russ: "Oof, é pesado. Precisa de carro, talvez?" #Oof. Is heavy. Need car, maybe?"
bank_get_vehicle2_amer: "Achem algum veículo, huh?" #Find some wheels, huh?"
bank_get_vehicle2_brit: "Vão e achem uma!" #Go and find one!"
bank_get_vehicle2_germ: "Nós temos que achar um veículo." #We shall find a vehicle."
bank_get_vehicle2_russ: "Vamos procurar." #Let us search."
bank_locate_vault1_amer: "Ok, vamos achar o cofre, hm?" #Alright - let's say we find some vault doors, eh?"
bank_locate_vault1_brit: "Vamos achar as portas do cofre." #Let's locate the vault doors."
bank_locate_vault1_germ: "Agora, nós precisamos achar as portas do cofre." #Now, we should get to the business of find the vault doors."
bank_locate_vault1_russ: "Então, nós achamos as portas do cofre. Consegue ver onde estão?" #So, we find vault doors. Can you see vault doors?"
bank_more_gold2_amer: "Então, nós pegamos mais ou escapamos? Seja como for, não tem problema." #So do we go get more, or we make tracks? Either's fine by me."
bank_more_gold2_brit: "Hm, então poderíamos pegar mais ouro ou voltar pra base. Eu não me importo, pessoal." #Hm. So we could scoop up more riches, or head back to base. I don't mind either way, lads."
bank_more_gold2_germ: "Respeito a decisão, mas nós voltamos e pegamos mais ouro ou escapamos daqui?" #I will respect the decision regardless, but do we return and collect more gold, or do we return to base?"
bank_more_gold2_russ: "Esse ouro que temos é bom, mas pegamos mais ou irmos embora?" #This gold we have is good, but do we take more, or do we leave now?"
bank_need_more_fuel_amer: "Beleza, tem gasolina no tanque, mas parece que tá um pouco vazio. Vamos pegar mais gasolina!" #All right, that's gas in the tank. Still sounds a little empty though. Get more gas!"
bank_need_more_fuel_brit: "Ok, então, combustível no tanque. Ainda não é suficiente, precisamos de mais." #Okay. So. Fuel in the tank. Not quite enough though. Will need more."
bank_need_more_fuel_germ: "Droga, não é suficiente, temos que pegar mais combustível." #Blast. This isn't enough fuel. We must obtain more."
bank_need_more_fuel_russ: "Hm, o tanque não está vazio, mas não está cheio. Mais gasolina." #Hm. Tank is not empty, but tank is not full. More fuel is needed."
bank_notice_skylight2_amer: "Nós destruímos a clarabóia, Sabre Squadron solta a bomba bem no meio do buraco..." #We destroy the skylight, Sabre Squadron drops its bomb right through the hole..."
bank_notice_skylight2_brit: "Então, se nós destruirmos a clarabóia, o Sabre poderá entregar a bomba bem no buraco..." #So..if we destroy the skylight, the Sabre's drop their bomb right through the hole..."
bank_notice_skylight2_germ: "Se a gente destruir a clarabóia, Sabre Squadron pode soltar a bomba bem no buraco..." #If we destroy the skylight, Sabre Squadron can put a bomb through the hole..."
bank_notice_skylight2_russ: "Destruam a clarabóia. Fazer um buraco. Buraco para a bomba do Sabre Squadron..." #Destroy skylight. Make hole. Sabre Squadron bomb hole..."
bank_notice_skylight3_amer: "E boom! Nós temos a nossa entrada no cofre!" #And boom! We got a way through to the vault!"
bank_notice_skylight3_brit: "E boom! Temos uma entrada pro maldito cofre!" #And boom! We have a way to the bloody vault!"
bank_notice_skylight3_germ: "E nós temos uma entrada no cofre. Wunderbar!" #And we have a way into the vault. Wunderbar!"
bank_notice_skylight3_russ: "Boom! Cofre aberto. Nós falamos olá para o ouro." #Boom! Vault open. We say hello gold."
bank_plane_near_sky2_amer: "Lá vai!" #Here it comes!"
bank_plane_near_sky2_brit: "Recuem, essas bombas vão cair a qualquer segundo!" #Keep back - those bombs'll drop any second now!"
bank_plane_near_sky2_germ: "Oh, hoho! Isso vai ser ótimo!" #Oh-ho-ho! This is going to be good!"
bank_plane_near_sky2_russ: "Bomba é bonita!" #Bomb is beautfiul...!"
bank_resist_pilot_is_that_all_var1: "Foi tudo? Huh, então se estiverem prontos pra irem embora, girem a hélice. Fiquem prontos pra decolagem." #Is that all? Huh. Then, if you are ready to leave, spin the propeller. Prepare for take-off."
bank_resist_pilot_is_that_all_var2: "Foi tudo? Hm, bom, se vocês estiverem prontos, girem a hélice. Vamos embora." #Is that everything? Hm. Well, if you are ready, spin the propeller. We leave at once."
bank_resist_pilot_is_that_all_var3: "É tudo isso que vai estar levando? Entendi, se querem ir embora agora, girem a hélice. Aí nós vamos!" #That is all you are bringing? I see. If you wish to leave now, spin the propellor! We go!"
bank_resist_pilot_is_that_all_var4: "Hm, eu esperava mais ouro. Bom, se querem ir, girem a hélice, ja? Então, nós vamos embora." #Hm. I expected more gold. Well, if you want to go, spin the propeller, ja? Then we leave."
bank_resist_pilot_is_that_all_var5: "Já foi... tudo? Querem ir embora, girem a hélice, tá bom?" #That is... all the gold? Should you wish to leave, spin the propeller, yes?"
bank_secure_loot2_amer: "Eles têm um avião. Audácia desse cara, eh? Coloquem as bolsas lá dentro." #They brought a plane. Little fucker, ain't it? Get the bags on board."
bank_secure_loot2_brit: "Um maldito Storch! Assegurem as bolsas, rápido!" #A bloody Storch! Get the bags aboard, quickly!"
bank_secure_loot2_germ: "Hm, não é o pior plano que já ouvi. Botem o ouro na carroça, rápido!" #Hm. Not the worst plane I have seen today. Get the gold loaded, quickly!"
bank_secure_loot2_russ: "Ah, ha, aqui está o avião. Nós levamos o ouro até o avião!" #Aha - here is plane. We take gold onto plane!"
bank_shells_first1_amer: "Ei, achei umas balas antiaéreas." #Hey, found some AA shells."
bank_shells_first1_brit: "Aha! Temos munição que deve servir para a arma antiaérea, né?" #Aha! Got some shells here which look exactly right for an AA gun, wouldn't you say?"
bank_shells_first1_germ: "Cavalheiros! Essas balas parecem boas para uma arma antiaérea, certo?" #Gentlemen! These shells look suitable for an AA gun, correct?"
bank_shells_first1_russ: "Esta munição é boa para arma antiaérea." #This ammo is good for AA gun."
bank_shells_first2_amer: "Bom trabalho, agora nós vamos achar algum lugar pra usar eles!" #Nice work - now let's find somewhere to use 'em!"
bank_shells_first2_brit: "Ô que maravilha! Agora nós precisamos achar a arma perfeita!" #Jolly good! Now we just need to find a suitable host!"
bank_shells_first2_germ: "Eu concordo. Nós temos a munição, hora de achar a munição." #I concur. Now we have the ammo, time to find the gun."
bank_shells_first2_russ: "Nós temos munição? Então precisamos da arma!" #We have ammo? Then we need gun!"
bank_shells_found2_amer: "Ei, achei! Peguei a munição pra a arma." #Hey, I found 'em! I got shells for an AA gun right here."
bank_shells_found2_brit: "Maravilha! Temos munição para a arma antiaérea aqui!" #Super! Got some ammo ripe for an AA gun, here!"
bank_shells_found2_germ: "Localizei as balas da arma antiaérea!" #I have located shells for the AA gun!"
bank_shells_found2_russ: "Aqui está as balas antiaéreas. Por aqui!" #Have flak shells. Over here!"
bank_shells_picked2_amer: "Pare de chorar. Levem de volta pra arma!" #Stop whining. Get it back to the gun!"
bank_shells_picked2_brit: "Carreguem nas costas! Voltem para a arma!" #Put your back into it! Back to the gun!"
bank_shells_picked2_germ: "Um conselho meu, pensa do ouro que vamos roubar! Está vendo? A bala ficou mais leve! Bora, para a arma!" #My advice - think of the gold we will steal! You see? The shell gets lighter! Quickly, to the gun!"
bank_shells_picked2_russ: "Sem recuar, sem render! A bala vai entrar na arma." #No retreat, no surrender! Shell will get to gun."
bank_skylight_destroyed1_amer: "Agora, nós marcamos o ponto de entrega. Precisamos de fumaça!" #Now we oughta mark the drop point. We need smoke!"
bank_skylight_destroyed1_brit: "Agora, vamos ajudar Sabre Squadron, marquem o buraco. Um pouco de fumaça deve servir." #Now, let's help Sabre Squadron out. Mark the hole. Bit of smoke should do it."
bank_skylight_destroyed1_germ: "Ah! Seria bom se tivesse um jeito de marcar o buraco. Fumaça seria uma boa." #Ah! It would be good if we could mark the hole. Smoke would do very well."
bank_skylight_destroyed1_russ: "Agora marquem o buraco. Fumaça deve servir!" #Now mark hole. Smoke will be good!"
bank_skylight_destroyed2_amer: "Essas bandeiras devem queimar. Botem fogo neles!" #These flags should burn nicely. Set fire to 'em!"
bank_skylight_destroyed2_brit: "E como fazemos fumaça? É claro... fogo! Queima as bandeiras!" #And how do we make smoke? Of course..fire! Burn the flags!"
bank_skylight_destroyed2_germ: "Ah, essas bandeiras queimam muito bem, botem fogo neles!" #Ah, these flags and banners should burn very well. Set flame to them!"
bank_skylight_destroyed2_russ: "Olha para essas bandeiras nazistas. Perfeitas para queimar, bota fogo neles!" #Look at all Nazi flags. Perfect for burn. Set fire to flags!"
bank_spawn_land4_amer: "Só pode ser brincadeira? Sabre Squadron ERROU?! Hã, ok... Sra. White falou que tem armas antiaéreas por perto, né? Tá pensando no que eu tô pensando?" #Are you fucking kiddin' me? Sabre Squadron MISSED? Uh, ok... Mrs. White said there's some AA guns round here, right? You thinking what I'm thinking?"
bank_spawn_land4_brit: "Pelo amor de Deus, os aviões erraram o alvo. Agora, se me lembro, a Sra. White mencionou que tinham armas antiaéreas aqui... Me fez ter uma ideia." #For pity's sake - the planes missed the target. Hm. Now, if I remember correctly, Mrs. White mentioned some AA guns on-site... which gives me an idea."
bank_spawn_land4_germ: "Esses pilotos são uns incompetentes mesmos! Mas tudo não está perdido. A Frau White não tinha falado que haviam armas antiaéreas na área? Já entenderam o meu plano?" #Those pilots are incompetent buffoons! But all is not lost. Did not Frau White say that there were AA guns in the vicinity? Do you understand my plan?"
bank_spawn_land4_russ: "Huh, os pilotos erraram o alvo? Então, armas antiaéreas vão ter que fazer o serviço que eles não conseguiram. Entenderam?" #Huh. The men in planes missed target? Then AA guns will do what they could not. You understand?"
bank_spawn_land5_amer: "Oh, ho ho! Nós podemos usar a arma antiaérea pra explodir a porta! Gostei!" #Oh-ho-ho! We use the anti-aircraft gun to blast open our own doorway! I like it!"
bank_spawn_land5_brit: "Haha! Que maravilha. Podemos usar a arma antiaérea e fazer a nossa entrada na tesouraria!" #Haha! Bloody marvellous. We can use an anti-aircraft gun and make our own way into the treasury!"
bank_spawn_land5_germ: "Um plano esperto, mein freund. Não há muitas tesourarias que podem aguentar um tiro de antiaéreo!" #A most cunning plan, mein Freund. There are not many treasuries that could withstand a blast from an anti-aircraft gun!"
bank_spawn_land5_russ: "Nós usamos uma arma antiaérea para abrir a tesouraria. Gostei. Bora lá." #We use anti-aircraft gun to open the treasury. I like this. We do this."
bank_spawn2_amer: "Hora de roubar, pessoal! Temos um avião esperando, então vamos entrar, pegar um pouco do ouro e cair fora daqui." #Time to smash and grab, boys! We got a plane waiting, so let's get in, grab some'a that gold, and get outta here."
bank_spawn2_brit: "Agora, onde nós estávamos? Ah, sim! Entrar, roubar o ouro e sair daqui vivo. É melhor não deixar o avião da Resistência esperando, não é, gente?" #Now, where were we? Ah yes! Get in, get copious amounts of gold, and get out alive. Let's not keep our resistance plane waiting too long, eh chaps?"
bank_spawn2_germ: "Haha! Podemos fazer isso de novo? Não? Nesse caso, sugiro irmos até a tesouraria e recuperar o ouro lá dentro, enquanto temos um avião esperando pela gente." #Haha! Can we do that again? No? In that case, I suggest we go and liberate the gold from this treasury, while we still have a plane waiting."
bank_spawn2_russ: "Foi divertido, sim? Nós estamos aqui para pegar o ouro. Então, vamos pegar o ouro e levar pro avião!" #That was fun, yes? We are here to take gold. So, let us take gold and put in plane!"
bank_start_car_amer: "Este jeep tá com tanque cheio e pronto pra dirigir!" #This jeep is fully gassed and good to go!"
bank_start_car_brit: "Que beleza. Combustível cheio já. Vamos evitar de enrolar aqui." #Splendid. Plenty of petrol. It's just pissing on my shoes now."
bank_start_car_germ: "Aí está! Agora podemos botar essa carroça, junto com o ouro, na estrada!" #There we are! Now we can get this show - and this gold - on the road!"
bank_start_car_russ: "Veículo tem todo combustível que precisa. Estou meio bêbado. Aquela gasolina é bem forte." #Vehicle has all fuel it needs. I am little tipsy. That fuel has a kick!"
bank_start_plane2_amer: "Devemos cair fora ou a ganância tá falando mais alto?" #Shall we send this off now, or ya feeling greedy?"
bank_start_plane2_brit: "Vamos ligar o avião agora ou voltar para mais espólio?" #Shall we send this bird off now, or head back for a little more lolly?"
bank_start_plane2_germ: "Aliás, se nós não queremos ir embora, podemos pegar mais ouro...?" #Although, if we do not wish to leave, we could acquire more riches...?"
bank_start_plane2_russ: "Nós podemos ir embora ou pegar mais ouro." #We can leave, or we can go get more gold. "
bank_take_fuel_amer: "Vocês sabem como tirar a gasolina, né? Faço isso desde que tinha 9 anos." #You guys know how to siphon gas, right? Been doing it since I was 9."
bank_take_fuel_brit: "Podemos roubar combustível dos outros veículos, vamos lá!" #We can siphon petrol from these other vehicles. Hop to it!"
bank_take_fuel_germ: "Prefiro de outro jeito, mas podemos roubar gasolina de outros veículos." #I would prefer another way, but we can steal fuel from the stationary trucks."
bank_take_fuel_russ: "Podemos roubar combustível, usar o tubo e chupar. Eu não sei a palavra certa." #We can steal fuel. Use tube. Suck fuel. I do not know correct word."
bank_vault_blown_amer: "Boom! Beleza, agora vamos para o cofre!" #Boom! All right, now we have a way into the vault!"
bank_vault_blown_brit: "Hurra! Aí está a nossa entrada no cofre, pessoal." #Hurrah! There's our way into the vault, lads. "
bank_vault_blown_germ: "Haha! Fez caboom! Eu poderia fazer isso o dia todo... mas com o cofre aberto, há muita coisa para fazer." #Haha! Kablooey! I could do that all day... but with the vault open, there is already much to do."
bank_vault_blown_russ: "A bomba fez a boa, nós entramos agora." #Bomb did good. We enter vault now."
bank_vault_cage_open_var1_amer: "Entramos! Quero ver esse ouro logo!" #We're in! C'mere beautiful gold!"
bank_vault_cage_open_var1_brit: "E bingo! Está aí a porta aberta, hora de pegar o ouro!" #And bingo! There's a cage open - time to take our booty!"
bank_vault_cage_open_var1_germ: "Aqui nós estamos. Consegue ver o ouro todo feliz agora?" #There we are. See how much more happy the gold looks now?"
bank_vault_cage_open_var1_russ: "Abriu, o ouro está brilhando." #Cage is open. Gold is shiny."
bank_vault_cage_open_var2_amer: "Abrimos uma. Agora ISSO que chamo de corrida do ouro." #Got a cage open. Now THIS is what I call a gold rush."
bank_vault_cage_open_var2_brit: "Abre-te, sésamo! Riqueza fabulosa, é para mim? Ah, que gentileza sua!" #Open sesame! Fabulous riches, for me? Oh you're too kind!"
bank_vault_cage_open_var2_germ: "E assim, a porta desistiu do todo ouro que guardava..." #And so, the cage relinquished its grip upon the gold contained within..."
bank_vault_cage_open_var2_russ: "Pronto, porta aberta. Vem, meu precioso ouro, vem cá." #There. Cage open. Come, little gold, fly free."
bank_vault_cage_open_var3_amer: "A porta tá aberta. Peguem todo ouro que podem!" #This cage is open. Grab all the gold you can carry!"
bank_vault_cage_open_var3_brit: "Aí está! Mais uma gaiola prontinha para gente pegar tudo." #There! Another cage ready to give us everything it has."
bank_vault_cage_open_var3_germ: "Esta porta decidiu em dar o todo ouro para gente. Que gentileza." #This cage has decided to give us its gold. How thoughtful."
bank_vault_cage_open_var3_russ: "E a porta abriu, vamos pegar o ouro agora." #And cage open. We take the gold now."
bank_vault_extra_loot2_amer: "Não há nada pra se preocupar, podemos destrancar!" #Ain't nothing to worry about - we can pick the locks!"
bank_vault_extra_loot2_brit: "Me atrevo dizer que os cadeados nas gaiolas não vão ser um problema. Alguém vê um jeito de destrancar?" #I dare say the locks on the cages won't give us much trouble. Anyone up for a spot of lockpicking?"
bank_vault_extra_loot2_germ: "Do jeito que está, essas trancas vão ser simples de destrancar. Podemos usar a gazua." #By the looks of them, these locks will be far more simple to overcome. These locks can be picked."
bank_vault_extra_loot2_russ: "As portas estão trancadas, mas podemos arrombar. Não há necessidade de explosivos." #Cages have locks to pick. We need no explosive help this time."
bank_vault_interior_loot_amer: "Agora quem manteria todo esse ouro de refém assim? Temos que achar um jeito de abrir essas portas." #Now who would keep their gold prisoner like this? We gotta figure out how to bust these cages open."
bank_vault_interior_loot_brit: "Bom, então. Parece que eles estão mantendo o ouro de cativeiro, esses malditos. Que tal abrirmos essas portas?" #Right then. Looks like they're keeping their gold captive, the brutes. Let's open these cages up, shall we?"
bank_vault_interior_loot_germ: "Viram como eles mantém o ouro de refém? Nós vamos levar o ouro pra casa, assim que abrirmos as portas." #See how they hold their gold hostage? We will be doing the gold a favour, if we free it from these cages."
bank_vault_interior_loot_russ: "Eles prendem o ouro como pássaros dentro da gaiola. Nós libertamos o ouro." #They cage gold like cage of birds. We free gold from cage."
bank_vault_pick_locks_amer: "Vamos destrancar essas trancas pra gente poder pegar o ouro!" #Let's get those locks picked so we can pick the cages clean!"
bank_vault_pick_locks_brit: "É melhor não deixar o ouro esperando, pessoal. Destranquem essas portas." #Let's not keep the gold waiting, chaps. Get those locks picked."
bank_vault_pick_locks_germ: "O ouro está ficando bem impaciente. Nós destrancamos as portas." #The gold grows impatient. We pick the locks."
bank_vault_pick_locks_russ: "Nós vamos pegar as ferramentas, ou vamos ficar vendo esse ouro para sempre." #We will pick locks, or we will have to look at gold forever."
bank_vehicle_not_starting2_amer: "Nós abastecemos, então. Peguem um galão!" #We fuel it ourselves. Grab a canister!"
bank_vehicle_not_starting2_brit: "Nós precisamos pegar o combustível. Achem o botijão!" #We need to get our own fuel. Grab a canister!"
bank_vehicle_not_starting2_germ: "Então, devemos reabastecer o veículo nós mesmos. Peguem um galão!" #So, we must refuel this vehicle ourselves. Take a canister!"
bank_vehicle_not_starting2_russ: "Nós vamos pegar gasolina. Pegar galão!" #We will get fuel. Grab canister!"
bank_wait_for_plane1_amer: "Legal, Sabre está chegando." #Great, Sabres are on the way."
bank_wait_for_plane1_brit: "Ok, estão vindo." #Okay, they're on their way. "
bank_wait_for_plane1_germ: "Então, parece que o Sabre Squadron vai chegar em breve." #Then it would appear the Sabre Squadron will soon be with us."
bank_wait_for_plane1_russ: "Sabre Squadron está vindo. Eles vão chegar com as bombas." #Sabre Squadron come now. So they bring bombs."
bank_way_in_rem3_amer: "Desgraça! Tem que ter alguma munição por perto." #Friggin' A! There's gotta be one'a them round here someplace."
bank_way_in_rem3_brit: "Têm que estar por perto, não enrolem e achem uma!" #There simply must be one close by. Let's hurry up and find one!"
bank_way_in_rem3_germ: "Talvez eu possa sugerir de ir mais rápido e achar logo o troço?" #Then might I suggest we hurry up and find the damned thing?"
bank_way_in_rem3_russ: "Sim, sim, arma vai estar por perto, nós achamos agora." #Yes, yes. Gun will be close. We find it, now."
bank_way_in1_amer: "Tem que ter um jeito pra gente entrar aqui." #There's gotta be a way for us to get in there."
bank_way_in1_brit: "Venham, gente. Vamos achar um jeito de entrar." #Come along, chaps. Let's find a way inside."
bank_way_in1_germ: "Posso sugerir a gente achar um jeito de entrar?" #Might I suggest we find a way to get inside?"
bank_way_in1_russ: "Nós devemos achar um jeito de entrar. Alguém tem alguma ideia?" #We will find a way inside. Anyone have good idea?"
bank_way_in2_amer: "Tem uma arma antiaérea em algum lugar aqui, eu sabia. É o nosso jeito de entrar na tesouraria." #There's an AA gun somewhere around here - I know it. That's our ticket into the treasury."
bank_way_in2_brit: "Se nós queremos entrar na tesouraria, nós precisamos achar uma arma antiaérea, anda logo." #If we want to get into that treasury, we'll need to find an AA gun, sharpish."
bank_way_in2_germ: "Queria entrar na tesouraria, uma arma antiaérea pode abrir uma entrada para gente." #I wish to enter the treasury, and an AA gun would surely enable us to do so."
bank_way_in2_russ: "A arma antiaérea deve estar por perto. Podemos usar pra derrubar a parede." #AA gun should be near. Then we blast building."

# Objetivos
obj_ger_miss_03_rb_ld_10b_desc: "O ouro é pesado demais para carregar nas ruas. Encontre um carro e carregue o ouro nele." #The gold is too heavy to carry through the streets. Find a car and load the gold onto it."
obj_ger_miss_03_rb_ld_06_hl: "Destrua a clarabóia" #Destroy the skylight"
obj_ger_miss_03_rb_ld_01_desc: "A arma antiaérea é poderosa suficiente para derrubar as paredes da tesouraria, mas você precisa achar a munição da arma." #The AA gun is powerful enough to break through the Treasury's walls, but you need to find shells for it."
obj_ger_miss_03_rb_ld_11_hl: "Ligue o carro" #Start the car"
obj_ger_miss_03_rb_ld_05_desc: "Agora que chegaram, hora de entrar na tesouraria." #Now that you have blasted your own way in, get inside the Treasury."
obj_ger_miss_03_rb_ld_11_desc: "Entre no carro e ligue-o." #Get into the car and start it."
obj_ger_miss_03_rb_ld_15_desc: "A cerca não é um obstáculo, pisa fundo!" #The fence is no obstacle - drive straight through it!"
obj_ger_miss_03_rb_ld_05b_desc: "O cofre está fechado, mas é aí onde o ouro está." #The vault is sealed, yet that is where the gold is."
obj_ger_miss_03_rb_ld_09_desc: "Sabre Squadron está a caminho. Fiquem atentos!" #Sabre Squadron is on the way. Stay alive!"
obj_ger_miss_03_rb_ld_08_desc: "A fumaça pode ser vista do céu. Está na hora de chamar o Sabre Squadron." #The smoke can be clearly seen from the sky. It is time to call in Sabre Squadron."
obj_ger_miss_03_rb_ld_03_hl: "Invade a tesouraria com a arma antiaérea" #Break into the Treasury with the AA gun"
obj_ger_miss_03_rb_ld_18_desc: "O avião conseguiu sair com o ouro, hora de ir!" #The airplane has successfully left with the gold. It's time to go!"
obj_ger_miss_03_rb_ld_09_hl: "Espere pelo piloto" #Wait for the bomber"
obj_ger_miss_03_rb_ld_09b_hl: "Detone a bomba" #Detonate the bomb"
obj_ger_miss_03_rb_ld_01_hl: "Ache munição para a arma antiaérea" #Find shells for the AA gun"
obj_ger_miss_03_rb_ld_13_hl: "Abasteça o carro" #Fuel the car"
obj_ger_miss_03_rb_ld_01a_hl: "Encontre uma arma antiaérea" #Find an AA gun"
obj_ger_miss_03_rb_ld_01a_desc: "Sabre Squadron errou o alvo! Encontre a arma antiaérea que possa usar para derrubar a parede da tesouraria." #Sabre Squadron missed their target! Find an AA gun you can use to blast a way into the treasury."
obj_ger_miss_03_rb_ld_05b_hl: "Vá até o cofre" #Get to the vault"
obj_ger_miss_03_rb_ld_04_hl: "Derrube a parede da tesouraria usando a arma antiaérea" #Blow up the Treasury wall using the AA gun"
obj_ger_miss_03_rb_ld_10b_hl: "Carregue o ouro no veículo" #Load the gold onto a vehicle"
obj_ger_miss_03_rb_ld_13_hl_sub_01: "Pegue o combustível dos outros veículos" #Take fuel from the other vehicles"
obj_ger_miss_03_rb_ld_14_desc: "O carro já está abastecido. Está na hora de ir embora!" #The car is now fully fueled. It is time to leave this area!"
obj_ger_miss_03_rb_ld_12_desc: "Você precisa de um galão que possa usar para reabastecer o carro. Deve ter algum por perto." #You need a fuel canister you can use to refuel the car. There must be some scattered around."
obj_ger_miss_03_rb_ld_17_hl: "Ligue o avião quando estiver pronto" #Start the plane when you're ready"
obj_ger_miss_03_rb_ld_13_hl_sub_02: "Abasteça o carro com o combustível" #Fill the car with fuel"
obj_ger_miss_03_rb_ld_16_desc: "O avião da resistência está esperando para levar o ouro. Encontre-o!" #There is a Resistance airplane waiting to take the gold. Find it!"
obj_ger_miss_03_rb_ld_18_hl: "Fuja!" #Escape!"
obj_ger_miss_03_rb_ld_10_desc: "Agora tem um jeito de entrar no cofre! Vai lá e roube o ouro." #There is now a way into the vault! Get down there and start taking gold."
obj_ger_miss_03_rb_ld_14_hl: "Entre no carro" #Get in the car"
obj_ger_miss_03_rb_ld_02_hl: "Carregue a arma antiaérea" #Load the AA gun"
obj_ger_miss_03_rb_ld_04_desc: "Use a arma antiaérea e use para derrubar a parede da tesouraria." #Operate the AA gun and use it to blast the wall of the Treasury."
obj_ger_miss_03_rb_ld_05_hl: "Entre na tesouraria" #Enter the Treasury"
obj_ger_miss_03_rb_ld_13_desc: "Não tem combustível no carro! Tem outros veículos na área. Pegue combustível deles." #There is no fuel in the car! There are other damaged vehicles in the area. Siphon fuel from them."
obj_ger_miss_03_rb_ld_17_desc: "Quando você estiver pronto para ir embora, gire a hélice e o piloto vai decolar." #When you're ready for the airplane to leave, start the propeller and the pilot will take off."
obj_ger_miss_03_rb_ld_09b_desc: "A bomba está com defeito e não detonou no impacto. Atire para detonar." #The bomb was a dud, and failed to detonate on impact. Set it off by shooting it."
obj_ger_miss_03_rb_ld_08_hl: "Ligue para o piloto" #Call in the bomber"
obj_ger_miss_03_rb_ld_07_hl: "Bote fogo nas bandeiras" #Set fire to the flags"
obj_ger_miss_03_rb_ld_07_desc: "Sinalize o Sabre Squadron botando fogo nas bandeiras, a fumaça vai subir pela clarabóia destruída." #Signal Sabre Squadron by setting the flags on fire, so that smoke rises through the broken skylight."
obj_ger_miss_03_rb_ld_03_desc: "Use a arma antiaérea para derrubar a parede da tesouraria." #Operate the AA gun and use it to blast a way into the Treasury."
obj_ger_miss_03_rb_ld_10_hl: "Entre no cofre e pegue o ouro" #Jump into the vault and take the gold"
obj_ger_miss_03_rb_ld_06_desc: "Prepare para sinalizar o Sabre Squadron destruindo a clarabóia." #Prepare to signal Sabre Squadron by destroying the skylight."
obj_ger_miss_03_rb_ld_15_hl: "Derrube a cerca com o carro" #Smash through the fence with the car"
obj_ger_miss_03_rb_ld_16_hl: "Leve o ouro até o avião da Resistência" #Take the gold to the Resistance plane"
obj_ger_miss_03_rb_ld_12_hl: "Pegue um galão vazio" #Pick up an empty fuel canister"
obj_ger_miss_03_rb_ld_02_desc: "Leve a munição até a arma antiaérea e use na arma." #Carry the shell to the AA gun and load it into the breech."