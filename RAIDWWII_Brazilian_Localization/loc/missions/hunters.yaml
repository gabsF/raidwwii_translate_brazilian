# nomes e descrições
menu_hunters_hl: "Hunters" #Hunters",
loading_hunters: "Cace os membros do esquadrão da morte e mate-os. " #Hunt down the members of the death squad and kill them all.",
menu_hunters_desc: |
 Uma unidade especial da Waffen-SS foi enviada para invadir uma vila que era suspeita de abrigar membros da Resistência. Muitos civis inocentes foram mortos de maneiras brutais, incluindo mulheres e crianças. Eles estão acampando em uma floresta perto da vila, sem dúvida se preparando para outra atrocidade. Seu objetivo é simples: matar todos eles. Eles provavelmente saquearam a vila, então tente recuperar qualquer coisa valiosa.$NL;
 - Encontre os acampamentos da SS
 - Mate todos os soldados nos acampamentos
 - Fuja
#A notorious special detachment of Waffen-SS has just carried out a particularly nasty raid on a village they suspected of harbouring members of the Resistance. Many innocent civilians were brutally killed, including women and children. They’re currently camped in a nearby forest, no doubt preparing for their next atrocity. Your objective is simple: kill them all. They probably looted the village, so try and recover any valuables.$NL;$NL;- Find the SS camps$NL;- Kill every soldier inside$NL;- Escape",
hunters_mission_photo_4_title: "Motorista da Resistência" #Resistance Driver",
hunters_mission_photo_4_description: "O motorista que o levará até a área da missão e retornará para resgatá-lo quando você eliminar os inimigos." #The driver who delivers you to the mission area will return to pick you up when you've cleared all the camps.",
hunters_mission_photo_3_title: "Itens de Valor" #Looted Valuables",
hunters_mission_photo_3_description: "Saquear civis é procedimento básico desta unidade. Tente recuperar o máximo de itens valiosos possíveis." #Looting civilian targets is standard proceedure for this unit. Try to recover what valuables you can.",
hunters_mission_photo_2_title: "Soldados Waffen-SS" #Waffen-SS Soldiers",
hunters_mission_photo_2_description: "Até entre os mais infâmes da Waffen-SS, essa unidade é conhecida por serem brutais. Eles devem ser parados. Permanentemente." #Even among the infamous Waffen-SS, this unit is known for its brutality. They must be stopped. Permanently.",
hunters_mission_photo_1_title: "Acampamentos Inimigos" #Enemy Camps",
hunters_mission_photo_1_description: "Nossas informações sugerem que os alvos montaram três acampamentos. Encontre-os." #Our intel suggests that the targets have set up three camps. Find them all.",

