# Nomes e descrições
bridge_mission_photo_1_description: "Crossing the Elbe, this bridge supports a rail route that connects Kassel to Berlin. It is a vital part of the kraut infrastructure."
bridge_mission_photo_1_title: "The Bridge"
bridge_mission_photo_2_description: "Thanks to the Resistance, you should find a cache of explosives on the bridge. You will need them for blasting the arches."
bridge_mission_photo_2_title: "Explosives"
bridge_mission_photo_3_description: "The bridge has been sabotaged before, and some of the arches are obviously weakened. Planting explosives at the visibily weakened arches should finish the job."
bridge_mission_photo_3_title: "The Bridge Arches"
bridge_mission_photo_4_description: "A train carrying gold from the Eastern Front is due to cross that bridge. There is enough loot to fund our operations for quite some time."
bridge_mission_photo_4_title: "The Train"
bridge_mission_photo_5_description: "Your way in and out. The boat and its driver - codenamed 'Seeadler' - will remain close by during your mission. He’ll know how to keep out of harm’s way."
bridge_mission_photo_5_title: "The Resistance Boat"
menu_ger_bridge_00_hl_desc: "We know that a train will soon be crossing a rail bridge over the Elbe. We also know that, amongst other things, this train is carrying gold stolen from the Eastern Front. One of our Resistance contacts will get you to this rail bridge, via the river. Stop the train by detonating explosives at the weakest arch. Once the train is stationary, search it and recover the gold.$NL;$NL;- Make your way to the top of the bridge$NL;- Find explosives and blast the arches$NL;- Take the gold from the train$NL;- Escape"
menu_ger_bridge_00_hl_loading_desc: "Plant explosives at the weakened arch. When the train has stopped, search it and steal the gold."
menu_ger_bridge_00_hl: "Trainwreck"

