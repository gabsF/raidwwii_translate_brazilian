# Nomes e descrições
#menu_ger_miss_05_hl: "The Amber Train"
menu_ger_miss_05_desc: |
 Logo depois da invasão da Rússia, os nazistas roubaram a Câmara de Âmbar. É um tesouro sem preço, seis toneladas de âmbar e ouro. Muitos dariam a vida só para ter um pedacinho disso. Agora, está com uma transferência pendente em um pátio de trens em Königsberg. Vocês vão ir para lá e roubar o que é nosso. A Resistência vai ajudar vocês entrarem e saírem do pátio. É bom que vocês tirem a Câmara de Âmbar do trem dos nazistas e botem no da Resistência.

 - Achem o vagão com a Câmara de Âmbar
 - Transferem o vagão com a Câmara de Âmbar para o trem da Resistência
 - Preparem o trem da Resistência para irem embora
 - Fuja
#Shortly after the invasion of Russia, the Nazis stole the Amber Room. It's a priceless treasure - six tons of amber and gold. Many would pay a fortune for just a piece of it. Currently, it is awaiting transfer at a rail yard in Königsberg. You're going to go there, and steal it back. The Resistance will get you in and out of this rail yard. You have to make sure the Amber Room is removed from the Nazis’ train and onto the Resistance’s.
# 
#- Find the wagon containing the Amber Room
#- Transfer the Amber Room wagon to the opposite track
#- Prepare the Resistance train to leave
#- Escape
menu_ger_miss_05_loading_desc: "Achem o vagão que contém a Câmara de Âmbar e movem-a até o trilho oposto. Localizem o trem da Resistência e usem-a para fugir." #Find the wagon that contains the Amber Room and move it to the opposite track. Locate the Resistance locomotive and use it to escape."
rail_yard_mission_photo_1_description: "A Resistência vai ajudar vocês entrarem no pátio em um vagão discretamente." #The Resistance is going to smuggle you into the railyard in an unmarked wagon."
rail_yard_mission_photo_1_title: "Os vagões" #The Wagons"
rail_yard_mission_photo_2_description: "O trem com a Câmara de Âmbar vai estar blindado. Pode esperar que vai estar destacado." #The train containing the disassembled Amber Room will be armored. Expect these wagons to stand out."
rail_yard_mission_photo_2_title: "O trem com a Câmara de Âmbar" #The Amber Room Train"
rail_yard_mission_photo_3_description: "A Câmara de Âmbar, originalmente presente da Alemanha, da época que era amigável, para a Rússia. Considerada como a \"Oitava Maravilha do Mundo\"." #The Amber Room. Originally gifted to Russia by a much friendlier Germany. Often considered to be the ‘Eighth Wonder of the World’."
rail_yard_mission_photo_3_title: "A Câmara de Âmbar" #The Amber Room"
rail_yard_mission_photo_4_description: "Vocês vão achar um guindaste, é assim você vão colocar o vagão com a carga no novo trem. Confio em vocês que vão cuidar bem do tesouro." #You’ll find a crane on-site - this is how you’ll swap a priceless one onto a new train. I trust you’ll handle the treasure with care."
rail_yard_mission_photo_4_title: "O guindaste" #The Crane"
rail_yard_mission_photo_5_description: "Assim que vocês localizarem o vagão com a Câmara de Âmbar, a Resistência deve ter um locomotivo esperando vocês. Sejam gentis com o condutor." #Once you’ve located the wagon containing the Amber Room, the Resistance should have a locomotive waiting to get you and the wagon out. Do be pleasant to the driver."
rail_yard_mission_photo_5_title: "O locomotivo da Resistência" #The Resistance Locomotive"

