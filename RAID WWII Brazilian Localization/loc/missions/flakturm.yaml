# Nomes e descrições
menu_ger_miss_01_desc: |
 Dr. Maximillian Reinhardt, o cientista-chefe do programa de Armas Especiais da SS, está em Berlim. Após uma tentativa fracassada de assassiná-lo em Peenemünde, ele ficou paranóico e nunca mais saiu de seu dirigível. Este dirigível, o Odin, está atracado para reabastecimento no topo da Torre Flak em Berlim. Vá até lá. Use o sistema de reabastecimento para destruir o Odin e mate o Dr. Reinhardt.$NL;
 - Entre na Torre Flak
 - Use os reguladores para encher o Odin de gás
 - Exploda o gás
 - Fuja
#Dr. Maximillian Reinhardt, the lead scientist of the SS Special Weapons program, is in Berlin. After a botched attempt to kill him in Peenemünde, he has become a paranoid recluse, and never leaves his personal airship. This airship, the Odin, is docked for refueling at the top of the Berlin Zoo flakturm. Go there. Use the flakturms’s refueling system to destroy the Odin, and kill Dr. Reinhardt.$NL;$NL;- Gain entrance to the flakturm$NL;- Use the gas regulators to fill the Odin with explosive gas$NL;- Detonate the gas$NL;- Escape",
menu_ger_miss_01_hl: "Odin's Fall" #Odin's Fall",
menu_ger_miss_01_loading_desc: "Entre na Torre Flak e use o sistema de reabastecimento de gás para destruir o dirigível." #Find a way into the flakturm and use the gas refueling system to destroy the airship.",
flak_mission_photo_3_title: "Reguladores do Sistema de Gás" #The Gas Network Regulators",
flak_mission_photo_1_title: "A Torre Flak" #The Flakturm",
flak_mission_photo_2_title: "Entrada da Torre Flak" #Flakturm Entrance",
flak_mission_photo_6_description: "O LZ 130 Odin Graf Zeppelin II" #The LZ 130 Odin Graf Zeppelin II. Long-thought decommissioned, the airship is the personal flagship of Dr. Maximillian Reinhardt.",
flak_mission_photo_6_title: "O Odin" #The Odin",
flak_mission_photo_4_title: "O Controlador Principal do Sistema de Gás" #The Gas Network Main Controller",
flak_mission_photo_5_description: "Agora você entende porquê seria um desastre atacar o Odin do ar. Canhões Flak 88mm destruiriam qualquer coisa voando por perto." #Now you see why attacking the Odin from the air would result in disaster. 88mm flak cannons would make short work of anything flying close.",
flak_mission_photo_5_title: "Canhões Flak" #Flak Cannons",
flak_mission_photo_4_description: "Esta máquina é onde o gás é misturado e bombeado para o Odin." #This machine is where all of the gas is mixed and pumped up to the Odin.",
flak_mission_photo_1_description: "A Torre Flak, uma monstruosa fortaleza de concreto. Sendo vital para a proteção de Berlim, pode apostar que ela estará rodeada de bunkers fortificados e patrulhas." #The Flakturm - a monstrous concrete fortification. Being vital to the protection of Berlin, you can expect it to be surrounded by heavily fortified bunkers, and foot patrols.",
flak_mission_photo_3_description: "Localizados no interior da Torre Flak, você verá válvulas que regulam o fluxo e a mistura do gás para o controlador principal." #Located throughout the interior of the flakturm, you will see valves that regulate the flow and mixture of gas to the main controller.",
flak_mission_photo_2_description: "As portas da Torre Flak são o único jeito de entrar. Você deve conseguir abrir a porta. Caso contrário, exploda ela com dinamite." #The doors of the mighty flakturm are the only way in. You should be able to pick the lock, but, failing that, blast them off with explosives.",
menu_ger_oper_01_event_7_progress_title: "Blinding Heimdall" #Blinding Heimdall",
menu_ger_oper_01_event_7_progress_text: |
 As suas ações no pátio ferroviário nos permitem atacar o Heimdall, os nazistas usam o novo sistema de comunicação dentro da torre Flak, vão para o telhado. Lá vocês devem virar os holofotes para o Heimdall. Assim que estiver sendo iluminado, Sabre Squadron deve chegar e explodir o lugar!$NL;
 - Entre na Torre Flak
 - Vá para o telhado
 - Vire os holofotes no Heimdall
 - Fuja
#Your actions at the railyard mean that we can now attack Heimdall, the Nazis new communication system. Get inside the flakturm, and make your way to the roof. There you should turn the powerful searchlights onto Heimdall. Once it is brightly lit, Sabre Squadron will come in and blast it to dust!$NL;$NL;- Gain entrance to the flakturm$NL;- Get to the roof$NL;- Point the searchlights at Heimdall$NL;- Escape",
clear_skies_mission_photo_8_title: "Heimdall" #Heimdall",
clear_skies_mission_photo_8_description: "O radar experimental no topo da torre Flak consegue localizar estações de rádio dos aviões em uma distância gigante, fazendo os ataques aéreos quase impossíveis. Deve ser destruído." #The experimental radar atop the flakturm is able to determine aircraft radio locations across vast distances, making an airborne attack almost impossible. It must be destroyed.",

# Legendas
flakturm_get_on_the_bunker_russ: "Subimos! Agora vamos para o pátio. Em silêncio!" #We up! Now, proceed to yard. Quietly!",
flakturm_lou_panel_broken_var1_russ: "Já temos gás o suficiente. Antes de continuarmos, vamos quebrar a válvula, sim?" #We have all the gas. Before we go, we break off valve, yes?",
flakturm_ste_top_reached_brit: "Chegamos. Todos com a dinamite pronta?" #This is it. Everyone still got their dynamite?",
flakt_opn_call_elevator1_germ: "O elevador está lá em cima. Precisamos dele embaixo." #The elevator is up there. We need it down here.",
flak_op_call_mrs_white5_amer: "Não ser explodido enquanto esperamos pelos paraquedas?! Oh claro, não é problema! Câmbio, desligo!" #So don't get blown up while we wait for the parachutes?! Oh sure, this ain't a problem! Over and out!",
flakturm_ste_spotted_regulator1_brit: "Ali. Parece um regulador do gás." #Over there. Looks like a gas regulator.",
flak_op_escape_var1_brit: "Para o caminhão! Rápido!" #Into the truck! Go!",
flakturm_get_to_the_flak_door1_germ: "Sehr gut. Com certeza estamos perto das portas da torre." #Sehr gut. We are surely closer to the tower's doors.",
flakturm_lou_main_gas_contr_germ: "Caso eu não esteja enganado, este deve ser o controlador principal do gás?" #Unless I am mistaken, this must be the main controls for the gas?",
flakturm_lou_prepare_aa_gun4_brit: "Boa ideia. Primeiro precisaremos de munição." #Good idea. First we're going to need some ammo.",
flakturm_gas_panel_breaks_var1_amer: "Ei, vamos terminar isso logo. Quebre a válvula para que eles não a desliguem." #Hey, we should make this official. Bust the controller valve, and they won't be able to switch it off.",
flakturm_go_to_master_control4_germ: "Claro! O topo! Vamos!" #Of course! The roof! We proceed!",
flak_op_call_mrs_white3_russ: "Claro. Mas agora estamos enrascados. Precisamos sair da torre. Pode nos ajudar? Câmbio." #Of course. But now, we are in trouble. We must leave tower. Can you help? Over.",
flakturm_desrtoyy_aa_dyna_brit: "Não se esqueçam de destruir as armas. Coloquem dinamite nelas!" #Don't forget to take out the guns. Get the dynamite on them!",
flakturm_defend_gas_var2_amer: "Até parece que eles não querem nos deixar se divertir. Matem eles antes que parem o gás." #It's almost like these guys don't want us to have any fun. Take 'em out before they stop the gas flow.",
flakturm_stealth_broken_brit: "Porcaria. Eles trancaram a porta!" #Bollocks. No point picking the lock!",
flakturm_ste_1st_dynamite_plant2_germ: "O primeiro cano está armado com explosivos. Não deixem os outros canos com inveja." #The first pipe has its explosive 'upgrade' ready. Ensure the other pipes do not get jealous.",
flakturm_load_explosives_germ: "Aquele elevador leva os projéteis até o topo. Precisamos deles lá. Vai servir bem, não acham?" #That elevator takes shells to the roof. We need explosives on the roof. That is rather handy, wouldn't you say?",
flakturm_gas_off_var2_germ: "Ah! Estão tentando parar o gás! Não podemos deixar." #Ah! They attempt to stop the gas flow! We cannot allow that.",
flakturm_find_explo2_brit: "Vamos lidar com isso depois. Agora coloquem a dinamite na porta." #We'll figure that out later. Now, get the dynamite on the door.",
flak_op_close_to_escape_truck_germ: "Para o caminhão! Schnell!" #Into the truck! Schnell!",
flakturm_find_right_bunker1_brit: "O bunker tem uma porta. Estão vendo?" #That bunker's got a door. You see it?",
flakturm_defend_gas_var1_russ: "Vejo nazistas. Não deixem pararem o gás." #I see Nazis. We stop them from stopping gas.",
flakturm_tank_spotted1_amer: "Puta merda. É a desgraça de um Tiger!" #Well, holy shit. That's a goddamn Tiger!",
flakturm_lou_main_gas_contr_brit: "Certo, rapazes, esse não parece ser o controlador principal?" #Right chaps, wouldn't you say this is the main gas controller?",
flak_op_escape_var1_amer: "Para o caminhão. Agora!" #Get your ass in the truck - now!",
flakturm_elevator_in_position_amer: "O elevador está no teto. Vamos terminar com isso!" #Elevator's on the roof. Let’s do what we came for!",
flakturm_lou_gas_flowing_germ: "Excelente. O gás está fluindo, mas esses schweins não seriam tolos de deixar isso acontecer." #Excellent. The gas is flowing, but the schweins would be fools to simply let it happen.",
flakturm_lou_panel_broken_var3_russ: "Muito gás. Quebrem a válvula agora e vamos continuar, da?" #Very much gas. We break the valve now, and go, da?",
flakturm_wayin1_brit: "Essa porta é um ponto fraco. Ainda bem que trouxemos a dinamite." #That door's the obvious weakspot. Good job we brought the dynamite.",
flakturm_get_to_the_flak_door1_russ: "Ali. As portas da torre estão fechadas." #There. Tower doors are close.",
flak_op_call_mrs_white1_brit: "Broadsword chamando Sra. White! Responda Sra. White! Câmbio." #Broadsword calling Mrs White! Come in Mrs White! Over.",
flakturm_lou_lever_failed_again1_amer: "Puta que pariu!" #Fer fucks sake!",
flakturm_lou_escape1_germ: "Hora de ir, cavalheiros! Agora! Rápido!" #Time to leave gentlemen! Now! Quickly!",
flakturm_destroy_odin3_germ: "Deve haver válvulas que liberem o gás. Procurem por elas!" #There will be valves that let the gas flow. Look for them!",
flakturm_nightwitchers_incoming: "Esquadrão Sabre falando. Preparando o ataque. Espero que estejam protegidos." #Sabre Squadron here. Lining up our attack run. Hope you're clear.",
flakturm_ste_top_reached_germ: "Chegamos. Vocês ainda estão com os explosivos?" #We have arrived. Do you gentlemen still have your explosives?",
flakt_opn_call_elevator1_russ: "O elevador está em cima. Precisamos dele embaixo." #Elevator up. We need elevator down.",
flakturm_tank_spotted2_russ: "Passem por ele!" #Go past it! ",
flakturm_lou_defend_gas_var1_amer: "Mantenham os nazistas longe da válvula!" #Keep the krauts away from the control valve!",
flakturm_lou_shoot_planes2_amer: "Para as armas antiaéreas, rápido! Se esses idiotas jogarem bombas em nós, o lugar inteiro vai explodir!" #Get to the AA guns, fast! If those shitheels drop bombs on us, this whole place'll go up!",
flakturm_lou_shoot_zeppelin_russ: "Usem as armas antiaéreas para atirar no Odin. Não estão vendo? Em cima!" #Use the AA guns to shoot the Odin. Can't see it? Look up!",
flakturm_lou_increase_pressure2_russ: "O gás está fluindo para o Odin!" #Gas flows into the Odin now!",
flakturm_lou_find_main_controller3_russ: "Então vamos! Urah!" #Then let us go! Urah!",
flak_op_door_blocked2_brit: "Não é hora de sutileza. Entremos com o carro. Vamos!" #No time for finesse. We drive through. Let's go!",
flakturm_look_for_entrance_brit: "Estamos dentro! Procurem um jeito de entrar na torre flak!" #We're through! Look for a way into the flak tower!",
flakt_opn_spawn_door_blocked2_brit: "Teremos que forçar a passagem." #We'll have to force our way through.",
flakturm_blow_fuel_cans_var1_1_russ: "Isso me lembra de quando eu era jovem. Vamos colocar latas de combustível no bunker e depois atirar nelas..." #This reminds me of time from youth. We place fuel cans at bunker. Shoot fuel cans...",
flakturm_gas_off_var2_brit: "Aha! Esses imbecis querem parar o gás! Não vamos deixar, rapazes!" #Aha! Those rapscallions want to stop the gas! Let's put a stop to that, chaps!",
flakturm_searchlight_intro_seq2_germ: "Virar as luzes para o Heimdall?" #Is it turn the lights onto Heimdall?",
flakturm_defend_gas_var3_russ: "Um pouco de diversão antes do principal. Os nazistas não podem arruinar nosso plano." #Snack before main course. The Nazi must not ruin plan.",
flakturm_go_to_master_control4_russ: "Aha! Para o telhado! Vamos!" #Aha! The roof! We go!",
flakturm_lou_main_gas_contr2_russ: "Da! Ativem!" #Da! Activate!",
flakturm_lou_shoot_zeppelin_amer: "Ei, estão vendo esse balão gigante em cima de nós? Explodem ele, agora!" #Hey, ya see that big hot air balloon above us? Blast it, will ya!",
flakturm_elevator_in_position_brit: "Elevador pronto. Agora as coisas ficam interessantes!" #Elevator's up. Now the real work begins!",
flakturm_shoot_explosive_russ: "Pronto! Agora esperamos!" #Done! Now, we wait!",
flak_op_find_elevator_russ: "Posso destruir as armas antiaéreas do telhado com minhas mãos! Mas talvez seja mais rápido achar outra coisa que faça o trabalho também..." #I can crush AA guns on roof, with bare hands! But... maybe it is quicker, yes, to find something that does job too...",
flakturm_lou_lever_failed_again2_amer: "Então atirem!" #Then just shoot it!",
flakturm_spotted_bunker_door1_brit: "Ah! Uma porta!" #Ah! A door!",
flakturm_all_searchlight_lit_amer: "Eu acho... é, foram todas as luzes. Aposto que da pra ver o Heimdall da Alemanha toda." #I think... yeah, that's all the searchlights. Bet anyone can see Heimdall clear across Germany.",
flakturm_lou_shoot_aim_front_germ: "Mire na parte frontal do Odin!" #Aim for the Odin's front!",
flakturm_lou_shoot_aim_front_amer: "Atirem na parte da frente!" #Let's get some fire on the front!",
flakturm_lou_lever_failed_again2_germ: "Então atirem!" #So shoot it!",
flakturm_lou_lever_failed_again2_brit: "Atirem no desgraçado." #Shoot the fucker.",
flakturm_gas_panel_breaks_var3_amer: "Oh já está bom. Quebrem a válvula para que eles não nos parem." #Oh this is good. Break off the controller valve and they won't be able to stop us.",
flakt_opn_bomb_dropped_var1_russ: "Bombas em todo lugar! Cuidado!" #Bombs everywhere! Be careful!",
flakturm_look_for_entrance_germ: "Entramos! Procurem um jeito de entrar no flakturm!" #We got through! Look around - we need a way into the flakturm!",
flakturm_wayin1_russ: "A porta. Vamos usar a dinamite, da?" #Door is way in. Use dynamite, da?",
flakturm_dynamite_left_germ: "Se algum de vocês tiver explosivos sobrando... também serviriam." #And if anyone is having a little of the explosives remaining... also effective.",
flakturm_defend_gas_var3_amer: "Achei que os nazistas gostavam de gás? Pff. Não deixem esses idiotas desligarem o gás." #I thought Nazis liked using gas? Pff. Don't let these pricks switch off the gas.",
flakturm_elevator_in_position_germ: "O elevador chegou no teto. Estamos perto!" #Elevator reached the roof. We are close now!",
flakturm_stealth_broken_amer: "Puta que pariu. Não adianta arrombar a porta agora!" #Goddamn it. Ain't no point picking the lock now!",
flakturm_tank_spotted2_amer: "Não dá pra lidar com isso! Hora de flanquear!" #We can't deal with that! Flank it!",
flakturm_blow_fuel_cans_var1_2_amer: "...e explodir o bunker. Nada mal. Nada mal mesmo." #...turn that bunker into a smokehouse. Not bad. Not bad at all.",
flakturm_lou_defend_gas_var2_germ: "Mantenham os schweins longe da válvula!" #Keep the schweins off the control valve!",
flakturm_lou_panel_broken_var3_germ: "Mal posso esperar pra usar esse gás. Vamos, quebrem a válvula para continuarmos até a atração principal!" #I cannot wait to use all this gas. Come, break off the valve so we can take another step towards the big bang!",
flakturm_start_elevator_brit: "Vamos ligar o elevador. Ele vai carregar a munição até o topo." #Now, let's get this elevator working. Let it carry these shells to the top.",
flakturm_lou_defend_gas_var1_germ: "Não podemos deixar eles encostarem na válvula!" #We cannot let them reach the control valve!",
mrswhite_level_flakturm_line_01: "Na escuta, Broadsword. Assumo pelas explosões que vocês destruiram as armas antiaéreas? Câmbio." #I hear you, Broadsword. I'm guessing from those explosions that you've taken the AA guns out? Over.",
flakturm_destroy_odin3_amer: "Deve haver válvulas para regular o gás aqui. Encontre-as!" #Gonna be some kinda valves for regulating the gas around here. Find 'em!",
flakturm_lou_gas_flowing_var2_russ: "O gás está fluindo. Se alguem tentar parar, faremos o sangue dele fluir também." #The gas makes journey. Anyone try to stop, we send them on journey too.",
flakturm_lou_enemies_interrupt_gas1_brit: "Droga! Pararam o gás!" #Toss! They stopped the gas!",
flakturm_lou_defend_gas_var3_russ: "Venham! Tentem mexer na válvula. Kurgan ensinará uma lição a vocês." #Come! Try to use control valve. Kurgan will teach you not to.",
flakturm_turn_on_the_gas_var3_amer: "O gás principal está ligado. Assim que todo o gás estiver onde queremos, dá pra fazer boom. Certo?" #Main gas pipe is on. Once all the gas is where we want it, we can go make things go boom. Am I right?",
flakturm_lou_enemies_interrupt_gas1_germ: "Ach! Scheisse! Eles pararam o gás." #Ach! Scheisse! They've halted the gas.",
flak_op_escape_var1_russ: "No caminhão. Agora!" #In truck, right now!",
flakturm_power_searchlights_russ: "Agora, sinalize o Esquadrão Sabre com os holofotes. Os bombardeiros vão terminar isso." #Now, signal Sabre Squadron with searchlights. Bombers finish this.",
flakturm_lou_enemies_interrupt_gas2_brit: "Então acabe com eles, e reinicie!" #So let them have, and restart it!",
flakturm_find_bunker1_brit: "Eu estou imaginando ou esses bunkers levam direto à entrada da torre flak?" #I say, is it just me or do these bunkers look like they lead right into the flakturm's foreground?",
flakturm_lou_lever_failed1_russ: "Bozhe moi! Complicado..." #Bozhe moi! Tricky...",
flak_op_escape_var2_germ: "O caminhão - entrem no caminhão!" #The truck - get in the truck!",
flakturm_blow_fuel_cans_var1_3_amer: "Então vamos encontrar os galões de combustível!" #Let's find those fuel cans then!",
flakturm_find_bunker1_amer: "Parece maluquice, mas eu acho que esses bunkers levam direto para a torre flak." #Call me crazy, but it looks like these bunkers might lead right into the heart of the flakturm.",
flakturm_lou_lever_failed2_germ: "Tenta de novo." #Try again.",
flakturm_lou_lever_failed1_brit: "Merda." #Bugger.",
flak_op_call_elevator_brit: "Eu digo para chamarmos o elevador, carregar com os projéteis, e mandar de volta pra cima. Rápido, rapazes!" #I say we call the elevator, load it with shells, and send it back up. Call it down, chaps!",
flakturm_find_bunker1_germ: "Hm. Você acha que os bunkers nos levariam para o pátio da torre flak?" #Hm. Do you suppose that these bunkers lead into the flakturm yard?",
flak_op_find_elevator_amer: "As armas antiaéreas estão no topo, mas não vamos destruí-las com nossas mãos. Deve haver algo que podemos usar." #The AA guns are up top, but we ain't gonna take 'em out with our bare hands. Gotta be something we can use...",
flakturm_signal_airdrop4_russ: "É hora de chamar a Sra. White. Ela terá um plano, ou teremos uma morte dolorosa." #It is time we call Mrs. White. She will have plan, or we will face unpleasant death.",
flakturm_spotted_ladder2_amer: "Que gentileza deles. Subam." #Nice of them. Get up there.",
flakturm_enough_explosives_amer: "Acho que é suficiente. É, pessoal, temos o suficiente!" #Think we got enough. Yeah, hey guys, we got enough now!",
flak_op_call_mrs_white1_russ: "Broadsword chamando Sra. White. Câmbio." #Broadsword calling Mrs White. Over.",
flakt_opn_spawn_door_blocked2_amer: "Vamos ter que forçar nossa passagem." #Gonna have to force our way through.",
flakturm_start_elevator_amer: "Iniciem o elevador! Ele pode levar a carga pesada." #Start the elevator! It can do the heavy lifting now.",
flakturm_searchlight_defend_russ: "Fascistas destruiram as luzes. Acabem com eles!" #Fascists destroy lights. Resist them!",
flakturm_blow_fuel_cans_var1_2_russ: "...e os fascistas asfixiam na fumaça e abrem a porta. Parece divertido." #...then fascists get choke on smoke. Open door. Sounds fun.",
flak_op_call_elevator_russ: "Colocamos os projéteis no elevador. Subimos o elevador. E boom! Sim! Chamem!" #We elevator with shells. Send shells up. And big boom surprise! Yes! Call it!",
flakturm_lou_defend_gas_var3_germ: "As válvulas não gostam de ser tocadas por vocês!" #The control valve is not to touched by the likes of you!",
flakturm_lou_find_main_controller2_amer: "Deve ter um interruptor que permite o gás ir para o Odin. Acho que está no topo." #There'll be a master switch to let it all flow into Odin. My guess is the roof.",
flakt_opn_spawn_door_rammed_russ: "Entramos! Agora encontrem o elevador!" #Smash and crash! Now, find elevator!",
flakturm_lou_panel_broken_var1_brit: "Eu diria que é gás suficiente. Vamos, quebrem a válvula e continuemos." #I'd say that's more than enough gas. Come on - let's break that valve off and crack on.",
flakt_opn_bomb_dropped_var3_amer: "Vai! Vai! As bombas, pelo amor de Deus!" #Move! Move! The bombs, for Christ sakes!",
flakturm_lou_gas_flowing_var3_brit: "Perfeito. Aposto que o gás está fluindo perfeitamente. Mas acho que os guardas não concordam." #Jolly good - I'd wager that the gas is flowing nicely. Still, I'd expect the guards here may prefer it doesn't.",
flakturm_turn_on_the_gas_var3_brit: "Ótimo. Gás principal acionado. Assim que terminar, tudo vai ficar bom. Ou melhor, BOOM, talvez." #Super. That's a main gas pipe on. Once it's finished everything will be tickety-boo... or tickety-BOOM, perhaps.",
flakt_opn_call_elevator1_brit: "O elevador está no topo. Precisamos desce-lo." #Elevator is at the roof. Need to bring it down.",
flakturm_go_to_master_control4_amer: "Ah! O telhado. Vamos!" #Ah! The roof. Let's go!",
flak_op_find_shells_brit: "Agora aonde vamos achar os projéteis?" #Now - where do you think we'll find those shells?",
flakturm_get_to_the_flak_door1_brit: "Ótimo, estamos perto da porta da torre flak. Conseguem ver?" #Good, we're close to the flakturm's doors. See?",
flakturm_lou_find_main_controller2_brit: "Haverá um interruptor mestre pra liberar o gás até o Odin. Provavelmente no topo." #There will be a master switch to release it into the Odin. Probably on the roof.",
flakt_opn_elevator_on_top1_germ: "O elevador chegou ao topo!" #The elevator has reached the roof!",
flakturm_lou_ammo_found_germ: "Acredito que sejam projéteis para as armas antiaéreas. Peguem eles!" #I believe this is shells for the AA guns. Take them!",
flakturm_find_explo2_germ: "Nos preocupamos com os canos depois. Agora explodimos a porta." #We can worry about the pipes later. Now, we blow the door.",
flakturm_ste_door_picked5_amer: "Correto! Deve haver reguladores de gás por aqui. Só abrir as válvulas e estamos feitos." #Damn straight! Gotta be some gas pipe regulators round here someplace. Get those valves turned, and we're in business.",
flakturm_destroy_odin2_amer: "Gás. Levamos bastante gás lá pra cima, e boom!" #Gas. We get enough explosive gas up there, and - boom!",
flakturm_destroy_odin2_brit: "Precisamos liberar bastante gás para o Odin." #We need to get a nice amount of gas right up into the Odin.",
flakturm_searchlight_defend_amer: "Eles tentarão apagar os holofotes. Não deixem, eles precisam ficar acesos!" #They're gonna try and take out the lights. Keep 'em off, and keep 'em shining!",
flakturm_ste_spotted_regulator1_amer: "Ei, estão vendo? Parece um regulador de gás pra você?" #Hey, ya see that? That look like a gas regulator to you? ",
flakturm_blow_fuel_cans_var1_3_russ: "Então procurem galões de gasolina!" #So, look for fuel cans!",
flakturm_lou_lever_failed2_brit: "Tenta de novo." #Try again.",
flakturm_lou_escape_from_flak2_russ: "Reação em cadeika. Precisamos ir!" #Chain reaction. Must leave!",
flakturm_lou_shoot_target_missed_brit: "Oh, merda! Errei o maldito!" #Oh, titty-twats! Missed the bugger!",
flakt_opn_wait_for_parachutes1_germ: "Gut! Paraquedas a caminho. Só precisamos..." #Gut! Parachutes are en-route. We just need to...",
flakturm_jump_reminder_brit: "Os bombardeiros estão chegando. Hora de pular!" #Those bombers are almost here. Time to jump!",
flak_op_call_mrs_white4: "Paraquedas a caminho, e os bombardeiros também. Não podem ser impedidos. Fiquem fora do alcance. E, se não morrerem, os paraquedas chegarão em breve. Câmbio." #Parachutes are en route, but so is a fleet of bombers. They can't be stopped. Stay out of their way. And, if you're still breathing, the parachutes will be with you soon. Over.",
flakturm_spawn4_germ: "Então vamos ter certeza que o general está no dirigível antes de acabarmos com ele." #Then let us ensure the general is on board the airship before we give him a very memorable one-way trip.",
flakturm_ste_1st_dynamite_plant2_brit: "O primeiro cano está pronto. Encontrem o resto, rapazes, e terminaremos isso rapidinho." #That's the first pipe rigged. Find the rest, chaps, and we'll be done in a jiffy.",
flakturm_spotted_bunker_door2_germ: "Deve levar até o pátio. Que sorte a nossa!" #Likely leads to the yard. Fortune favours us!",
flakturm_lou_enemies_interrupt_gas1_amer: "Ah merda! Pararam o gás!" #Ah crap! They stopped the gas!",
flakturm_spotted_ladder2_germ: "Das ist gut! Para cima!" #Das ist gut! Get up!",
flakturm_turn_on_the_gas_var2_germ: "Wunderbar. Com o encanamento principal acionado, nosso plano está funcionando. Vamos esperar o gás terminar." #Wunderbar. With that main gas pipe on, our plan is in motion. Let us wait for the gas to finish flowing.",
flakturm_defend_gas_var2_germ: "Droga. Temos companhia. Não podemos deixar pararem o gás." #Damn. We have company. We must not let them stop the gas flow.",
flakturm_lou_lever_failed_again1_russ: "Ah! Bozhe moi!" #Ah! Bozhe moi!",
flakt_opn_wait_for_parachutes1_russ: "Paraquedas chegarão em breve! Vamos esperar, e..." #Parachutes here soon! We wait, and...",
flakturm_spawnseq5_brit: "De fato. Vamos encontrar um jeito de entrar." #Indeed. Let's find a way in.",
flakturm_get_inside_tower_amer: "Desculpa interromper, mas precisamos continuar logo com isso. Vamos entrar!" #Sorry to cut in, but we gotta get this show on the road. Get inside!",
flakturm_calling_mrswhite2_russ: "Estamos com problemas. Pode nos ajudar? Câmbio." #We're in trouble. Can you help? Over.",
flakturm_calling_mrswhite1_germ: "Broadsword chamando Frau White. Consegue nos ouvir, Frau White? Câmbio." #Broadsword calling Frau White. Are you there, Frau White? Over.",
flak_op_open_flak_door_brit: "Deve ser uma boa ideia abrir essa porta e ver no que da, quê?" #Might be an idea to open this door and see what's what, what?",
flakturm_desrtoyy_aa_dyna_russ: "Coloque a dinamite na arma. Simples. E efetivo." #Place dynamite on gun. So simple. So effective.",
flakturm_broke_regulator2_germ: "Acredito que tenha mais. Continuem." #I believe there is more. Proceed.",
flakturm_place_dynamite_on_pipes1_russ: "Haha! Hora de fazer boom. Vamos explodir os canos, da?" #Haha! Time for big boom. We blow up gas pipes, da?",
flakturm_turn_on_the_gas_var2_brit: "Ótimo. Parece que o gás está indo pro lugar certo. Melhor ter certeza antes de continuarmos, com licença." #Good. Seems the gas is going where we want it. Best to make sure of it before we head off, mind.",
flakturm_flak_guns_destroyed1_brit: "As armas já eram!" #That's it for the guns!",
flakturm_defend_gas_var2_russ: "Quero explosões grandes. Não podemos deixar os nazistas interferirem." #I want big explosion. We stop Nazis from getting in way.",
flakturm_lou_gas_flowing_russ: "O gás está fluindo. Se os fascistas vierem, o sangue deles também vai." #The gas flows. If fascists come, blood will flow.",
flakt_opn_elevator_on_top1_amer: "Ei, o elevador chegou ao topo!" #Hey, elevators made it to the roof!",
flakturm_lou_prepare_aa_gun4_amer: "Ótima ideia. Vamos encontrar munição para elas!" #Great idea. Let's find some shells for 'em!",
flakt_opn_bomb_dropped_var2_germ: "Mein gott! Bombas! Corram!" #Mein gott! Bombs! Move!",
flakturm_lou_lever_failed_again2_russ: "Atirem!" #Shoot it!",
flakturm_look_for_entrance_amer: "Conseguimos! Agora encontrem um jeito de entrar na torre flak!" #Through! Now look for a way into the flak tower!",
flakturm_searchlight_intro_seq2_brit: "Vamos virá-las para o Heimdall, ele ficará visível de Berlin à Belfast!" #We turn them on Heimdall, and it'll be visible from Berlin to Belfast!",
flakturm_ste_top_reached_russ: "Aqui. Ainda temos dinamite?" #Here. Still have dynamite? ",
flakturm_lou_shoot_aim_front_russ: "Mirem na frente do Odin!" #Aim for front of Odin!",
flakturm_lou_shoot_aim_front_brit: "Mirem na frente daquela porcaria!" #Aim for the front of the fucking thing!",
flakturm_gas_off_var1_germ: "Achtung! Esses schweins estão parando o gás. Matem eles, e deixem o gás ligado!" #Achtung! The schweins are stopping the flow of gas. Eliminate them, and get the gas flowing!",
flakturm_lou_defend_gas_var1_russ: "Fascistas não podem encostar na válvula!" #Fascists not touch control valve!",
flakturm_ste_1st_dynamite_plant_amer: "Coloquei dinamite na primeira arma. Separem-se. Preparem o resto." #I got dynamite on the first gun. Spread out. Get the rest done.",
flakturm_lou_shoot_target_missed_russ: "Ah nyet. Errou! Mas como...?" #Ah nyet. Missed! But how...?",
flakturm_load_explosives_russ: "O elevador pode levar os projéteis até o topo. Precisamos de explosivos. Estão pensando o mesmo que eu?" #Elevator brings shells to roof. We need explosives. Is everyone thinking same as I am thinking?",
flakturm_lou_shoot_planes2_russ: "Armas antiaéreas agora! Uma bomba, e a torre inteira explode." #AA guns now! One bomb, and whole tower go boom.",
flakturm_lou_ammo_found_amer: "Ei, isso parece munição para as armas antiaéreas. Peguem!" #Hey, this looks like shells for the AA guns. Grab 'em!",
flak_op_find_shells_russ: "Sem elevadores hoje, sim? Encontrem os projéteis agora." #No more elevators today, yes? We find shells now.",
flakturm_shoot_explosive_amer: "Fusível aceso! Recuem e esperem." #Fuse is live! Stand back and wait.",
flakturm_all_searchlight_lit_russ: "Kurgan contou. Todos os holofotes acesos. Brilhante o suficiente para todos os fascistas na Alemanha." #Kurgan kept count. All searchlights lit. Bright enough for bring all the fascists in Germany.",
flakturm_lou_shoot_zeppelin_brit: "A coisa gigante flutuando acima de nós? Usem as armas antiaéreas e atirem nela!" #The big floaty thing above us? Use an AA gun and shoot it!",
flakturm_destroy_odin2_germ: "Essa torre tem muito gás. Podemos encher o Odin, e depois explodir." #This tower has a lot of gas. We can fill the Odin, and blast it.",
flakturm_tank_spotted2_brit: "Contornem ele!" #Get around it!",
flakt_opn_elevator_on_top1_brit: "Tudo certo. Elevador chegou ao topo!" #All right. Elevator's at the roof!",
flakturm_lou_gas_flowing_brit: "Perfeito - o gás está fluindo, mas eu acho que os nazistas não estão gostando disso." #Jolly good - the gas is flowing, but I feel Jerry might have something to say about that.",
flakturm_lou_lever_failed1_amer: "Merda. Esse negócio é complicado..." #Crap. Thing's a finicky little..",
flakturm_broke_regulator2_brit: "Vamos ter que abrir mais uma. Continuem." #Going to be at least one more. Keep going.",
flakturm_broke_regulator2_amer: "Não foi a última. Vamos para a próxima." #Not the last. Move on to the next.",
flakturm_ste_spotted_regulator2_brit: "Girem a válvula. Liberem o gás." #Turn it. Get it flowing.",
flakturm_turn_on_the_gas_brit: "Certo. O primeiro está aberto. Só precisamos esperar esvaziar." #Right-o. That's one gas pipe opened up. Just need to wait until it's all emptied.",
flakturm_gas_panel_breaks_var3_russ: "A válvula? Pah! Vamos quebrá-la." #Controller valve? Pah! Let us break it.",
flakturm_lou_defend_gas_var3_amer: "Ei, essa válvula é MINHA! Você não pode encostar nela!" #Hey, that's MY control valve! You can't have it!",
flakturm_spotted_bunker_hatch_brit: "Escotilha acima. Provavelmente trancada. Alguma ideia?" #Hatch up there. Probably locked. Any takers?",
flakturm_lou_panel_broken_var2_russ: "Não precisamos de mais gás. Quebrem a válvula e vamos embora." #No more gas needed. Break the valve off and we leave.",
flakturm_flak_guns_destroyed4_germ: "Vamos sair da zona de perigo, ja? Vamos voltar!" #Get ourselves out of danger, ja? Back we go!",
flakturm_ste_enter_flak3_brit: "Uma maldita porta gigante aqui, mas todas as portas têm fechaduras. E todas podem ser destrancadas." #Bloody big door here, but all doors have a lock. And all locks can be picked.",
flakt_opn_call_elevator2_brit: "Então chame-o, amigo. Puxe a alavanca." #Then call it, dear fellow. Pull the lever.",
flakturm_spawn4_russ: "Então, garantam que o general está no dirigível. Dirigível faz boom. Problemas resolvidos." #So. Make sure general on airship. Airship go boom. Two problems solved.",
flakturm_shoot_explosive_brit: "...e pronto! Recuem e esperem um momento!" #...and done! Stand back and give it a mo!",
flakturm_place_dynamite_on_pipes1_brit: "Lembrem o porquê estamos aqui. Precisamos explodir o dirigível, senhores. Vamos explodir os canos." #Remember why we're here. We have an airship to ignite, gents. Let's blow those pipes.",
flakturm_lou_shoot_zeppelin_germ: "Permita-me lembrá-los de explodir o Odin. Lembram? O dirigível grandão acima de nós!" #Allow me to remind you to destroy the Odin. You know? Big balloon above us!",
flakturm_find_explo2_russ: "Damos um jeito nos canos depois. Agora explodam a porta." #Worry about pipes later. Now, blast door.",
flakturm_find_bunker2_amer: "Parece que sim. Se entrarmos nesses bunkers, deve ter uma maneira de chegar até a torre. Vamos." #Seem so. If we break into these bunkers, it should get us closer to the tower. C'mon.",
flakturm_lou_enemies_charge_gas2_russ: "Então não os deixem parar!" #Stop them stopping it!",
flakturm_gas_off_var3_amer: "Vamos deixar esses otários desligarem o gás? Matem eles!" #We gonna let those shitbirds turn off the gas? Take 'em out!",
flakturm_lou_escape2_brit: "Rápido, rapazes! Antes que o lugar inteiro exploda!" #Quick as you can, lads! Before this whole place is ablaze!",
flakturm_find_bunker2_germ: "Eu acho que sim. Sugiro que encontremos uma maneira de entrar." #That looks correct to me. I suggest we find a way inside.",
flakturm_ste_door_picked4_russ: "Mas primeiro precisamos abastecer o Zepelim para ele ficar pronto para explodir." #But first, we need to feed the Zeppelin until she is ready to go pop.",
flakturm_destroy_aa_guns_germ: "Com certeza. Peguem o projétil, coloquem na arma e atirem? Ja, é fácil." #For sure. Grab shell, put by gun and shoot the shell? Ja, is easy.",
flakturm_find_right_bunker3_brit: "Esqueçam. Vamos abrir a porta e passar." #Nevermind that. Let's pick it and sneak through.",
flakturm_calling_mrswhite2_amer: "Estamos enrascados aqui. Você não tem alguma idea para nos tirar daqui, tem? Câmbio." #We're in a tight spot here. You couldn't give us an idea of getting off this thing, could ya? Over.",
flakturm_ste_planted_dynamite2_germ: "Eu sugiro sairmos daqui. Por mais que eu ame explosões, eu prefiro não ficar perto delas." #Might I suggest we make an exit. Much as I love explosions, I prefer to not get caught in them.",
flakturm_spotted_bunker_hatch_russ: "Veem a escotilha? Talvez esteja trancada. Quem quer abrir?" #See hatch? Maybe locked. Who wants to open?",
flakturm_lou_enemies_charge_gas2_brit: "Então não os deixem parar!" #Then stop them stopping it!",
flakturm_calling_mrswhite1_amer: "Broadsword chamando Sra. White! Responda Sra. White! Câmbio." #Broadsword calling Mrs. White! Come in Mrs. White! Over.",
flakturm_calling_mrswhite2_brit: "Estamos com problemas aqui, velhota. Alguma ideia de como sair da torre? Câmbio." #Spot of bother here, old thing. Any ideas about getting off the tower? Over.",
flakturm_ste_spotted_regulator2_germ: "Girem. Deixem o gás fluir." #Turn it. Make the gas flow.",
flakturm_gas_off_var2_russ: "Hm. Os nazistas não gostam desse gás. Vamos, temos que mostrar que é bom." #Hm. Nazis do not like this gas. Come - we show Nazis we disagree.",
flakturm_find_explo2_amer: "Improvisamos depois. Explodam a porta." #We'll improvise later. Get that door blown.",
flakturm_ste_planted_dynamite2_amer: "Então vamos dar o fora daqui. Não acho que os nazistas vão gostar quando isso explodir." #Then let's haul ass outta here. Don't reckon the krauts are gonna be too happy when this goes off.",
flakturm_flak_guns_destroyed4_russ: "Vamos sair daqui! Sigam o caminho de volta pra baixo!" #Save ourselves! Back down through tower!",
flakt_opn_wait_for_parachutes2_amer: "Tentar não ser explodidos por nossos aliados? Perfeito!" #Try not to get bombed by our own guys? Great!",
flakturm_spawn4_brit: "Ótimo. Mas explodir o dirigível é uma coisa - precisamos ter certeza que o general está lá dentro antes de fazer kaboom." #Good show. Although blowing up the airship is one thing - we do need to be sure that blasted general is on board before it goes kablooey.",
flakturm_lou_enemies_charge_gas2_germ: "Então... parem eles!" #So... stop them!",
flak_op_door_blocked2_germ: "Não podemos perder tempo, mas podemos bater o carro na porta! Isso com certeza vai abri-   la." #We cannot waste time, but we CAN drive through! That will teach it to be stuck.",
flakturm_lou_panel_broken_var1_amer: "Deve ser gás o suficiente. Quebrem a válvula e vamos dar o fora daqui." #That should be plenty'a gas. Bust off the valve so we can get outta here.",
flakt_opn_bomb_dropped_var3_germ: "Tem bombas por todo lado! Movam-se!" #There are bombs everywhere! Keep moving!",
flakturm_get_to_observation_deck_russ: "Deck de observação! Vamos lá!" #Observation Deck! Get there!",
flakturm_flak_guns_destroyed4_amer: "Vamos sair daqui! Precisamos descer a torre!" #Get the fuck out! Back down the tower!",
flakturm_get_to_observation_deck_brit: "Deck de observação! Vamos lá!" #Observation Deck! Get up there!",
flakturm_lou_panel_broken_var2_germ: "Esse gás deve ser o suficiente, cavalheiros. Vamos nos certificar de quebrar a válvula e podemos continuar." #That should be more than enough gas, gentlemen. Make that valve unusable and we can be on our way.",
flakturm_lou_panel_broken_var3_brit: "Eu acho que é gás suficiente. Quebrem a válvula e vamos continuar." #I daresay that's as much gas as we need. Pull that valve off and we can make haste. ",
flakturm_load_explosives_amer: "Aquele elevador de carga pode levar a munição até o topo. Ele resolverá nosso problema." #That cargo elevator lifts shells to the roof. That could solve our explosives problem!",
flakturm_ste_spotted_regulator2_russ: "Vamos girar. Liberar o gás?" #We turn it. We make it flow?",
flakturm_defend_gas_var1_germ: "Achtung. Esses schweins querem nos parar, vamos matá-los primeiro." #Achtung. Some schweins who wish to stop us, unless we stop them first.",
flakturm_all_searchlight_lit_germ: "Excelente. Foram todos os holofotes. O Heimdall está brilhando muito!" #Excellent. That's all the searchlights. Heimdall shines so very, very bright!",
flakturm_gas_off_var3_russ: "Estão parando o gás. Matem os nazistas." #Gas is being stopped. We stop the Nazis.",
flakturm_look_for_entrance_russ: "Conseguimos! Agora, procurem um jeito de entrar na torre flak!" #We through! Next, look for way into flakturm!",
flakturm_lou_defend_gas_var2_brit: "Não deixem esses otários parar o gás!" #Don't let the buggers stop the gas flow!",
flak_op_call_mrs_white5_brit: "Oh ótimo! Não ser explodido, e esperar pelos paraquedas?! Que ótimo! Câmbio, desligo!" #Oh spiffing! So don't get bombed, and wait for parachutes?! Just spiffing! Over and out!",
flakturm_blow_fuel_cans_var1_3_germ: "Então vamos procurar galões de combustível!" #Then we look for the fuel cans!",
flakturm_get_inside_tower_germ: "Temos muito a fazer. Sugiro que continuemos isso lá dentro. Komm!" #There is much to do. Might I suggest we continue this inside. Komm!",
flakturm_signal_airdrop4_brit: "Então vamos rezar que a Sra. White tenha uma ótima ideia para nos ajudar a descer. Precisamos entrar em contato imediatamente." #Then we'd best hope Mrs. White has a bright idea for how we're getting back down. We must contact her, immediately.",
flakturm_turn_on_the_gas_var2_russ: "Bom. O gás vai ser uma surpresa. Esperem o gás chegar lá." #Good. The gas goes for big surprise. Wait for gas to reach target.",
flak_op_call_elevator_amer: "Carregamos o elevador com a munição, então teremos o necessário para explodir as armas antiaéreas. Chamem ele!" #We load the elevator with shells, and we got everything we need to blast the AA guns. Call it!",
flakturm_ste_planted_dynamite2_russ: "Tick tick tick. Hora de encontrar um lugar para assistir ao show!" #Tick tick tick. Time to find good place to watch show!",
flakturm_lou_find_main_controller3_germ: "Então o topo é nosso próximo objetivo! Raus!" #Then, the roof is our next destination! Raus!",
flak_op_call_elevator_germ: "Podemos colocar os projéteis no elevador, eles vão destruir as armas antiaéreas. Rápido, chamem ele!" #We can load the elevator with shells. They will destroy the AA guns. Quickly, call it down!",
flakt_opn_elevator_on_top2_russ: "Então vamos para o topo também!" #Then, we go roof too!",
flakturm_defend_gas_var2_brit: "Ah. Parece que os nazistas querem interferir em nossos planos. Melhor não deixar, né?" #Ah. Looks like Jerry might try to scupper our plans. Best we don't let him, eh?",
flak_op_door_blocked1_germ: "Que porcaria! A porta emperrou." #Good grief! The damned door is stuck.",
flakturm_signal_airdrop3_russ: "Hm. Chegamos ao topo, e não podemos voltar. Isso é ruim." #Hm. We reach top of tower, and cannot retreat. This is bad.",
flakturm_lou_gas_flowing_var3_russ: "O gás continua fluindo. Não permitimos interrupções." #Gas flows. We do not allow interruptions.",
flakturm_find_right_bunker1_amer: "Ei, olhem lá. Aquele bunker tem uma porta." #Hey, check it out. Bunker over there's got a door.",
flakturm_ste_enter_flak3_amer: "Olha o tamanho dessa porta. Será que conseguimos arrombar a fechadura?" #Look at the size of this door. Reckon we could pick its lock?",
flakturm_destroy_aa_guns_amer: "Agora é fácil. Levem um projétil para uma das armas e depois atirem nele. Boom!" #And this bit's easy. Take a shell to one of the guns, and shoot the shell. Boom!",
flakturm_spotted_ladder2_brit: "Muito prestativo da parte deles. Vamos subir." #Awfully obliging of them. Get up it.",
flakturm_gas_off_var3_brit: "Esses idiotas estão tentando desfazer nosso trabalho. Não podemos deixar!" #These blighters are trying to undo our hard work. We can't be having that!",
flakturm_place_dynamite_on_pipes1_germ: "Parece que faz tanto tempo desde que explodimos algo. Para acabar com o dirigível, explodimos os canos, ja?" #It feels far too long since we blew up something. To remove the airship, we blast the gas pipes, ja?",
flakturm_searchlight_defend_brit: "Eles vão tentar desligar os holofotes. Eu aposto nisso! Mantenha-os afastados!" #They'll try and put out those lights. I bet my arse on it! Keep them off!",
flakturm_spotted_bunker_hatch_amer: "Tem uma escotilha ali. Provavelmente trancada. Quem quer abrir?" #There's a hatch there. Guessing it's locked. Anyone wanna open it?",
flakturm_gas_off_var1_amer: "Ah merda! Estão desligando o gás! Matem os nazistas e liguem o gás de novo!" #Aw shit! They're turning off the gas! Take the krauts out and get the gas back on!",
flakturm_get_on_the_bunker_brit: "Conseguimos. Deve ser moleza chegar no pátio agora." #We're up. Should be a doddle to get into the yard now.",
flakturm_lockpick_bunker2_brit: "Se quisermos o elemento surpresa, sugiro que escolhamos uma porta e abrimos ela, velhote." #If we want the element of surprise, I'd suggest we choose a door and pick the lock, old boy.",
flak_op_escape_var2_russ: "Subam no caminhão, companheiros!" #Get in truck, comrades!",
flakturm_defend_gas_var3_brit: "Parece que alguém quer estragar a festinha. Não deixem desligar o gás, rapazes." #Looks like someone might try to be a party pooper. Don't let him switch off the gas, there's a good chap.",
flakturm_ste_spotted_regulator1_russ: "Ali. Estão vendo? Um regulador de gás." #Over there. You see? Gas regulator. ",
flakturm_lou_shoot_aim_engines_amer: "Concentrem-se nos motores, vamos!" #Focus on those engines, will ya!",
flakturm_gas_panel_breaks_var3_brit: "Sabem, se quebrarmos a válvula, duvido que conseguirão parar o gás. Que tal?" #Y'know, if we bust that controller valve off, I doubt they'd be able to stop the gas. Shall we?",
flakturm_lou_shoot_target_missed_germ: "Errei! Como? Estou mirando com o olho errado?" #I missed! How? I aim with missing eye?",
flakturm_go_to_master_control4_brit: "Claro. O telhado! Vamos!" #Of course. The roof! Come on!",
flak_op_escape_var2_amer: "Para o caminhoão - vamos!" #In the truck - go!",
flakturm_blow_fuel_cans_var1_2_germ: "...e os nazistas vão asfixiar. Tortuoso, porém efetivo." #...and the schweins will be smoked out. Most devious, but most effective.",
flak_op_call_mrs_white3_brit: "Muito. Mas estamos numa posição ruim aqui, velhota. Alguma ideia de como sairmos dessa torre? Câmbio." #Very much so. But we're in a spot of bother here, old thing. Any ideas about getting us off the tower? Over.",
flakturm_yard_seq3_germ: "Acho que se olharmos em volta, vamos achar uma entrada." #I think if we look around, we may find a way in.",
flakturm_blow_fuel_cans_var1_1_germ: "Hm. Tenho um plano. Há galões de combustível por perto? Podemos colocá-los no bunker e acendê-los..." #Hm. I have a most cunning plan. There will be fuel cans around? Put those by the bunker, set them on fire...",
flakt_opn_bomb_dropped_var2_russ: "Argh! Bombas! Mexam-se!" #Argh! Bombs! Keep moving!",
flakturm_lou_enemies_charge_gas1_russ: "Estão parando o gás!" #They try to stop gas!",
flakturm_flak_guns_destroyed4_brit: "Como disse nosso amigo Americano, dá o fora daqui!" #As the American so eloquently says, get the fuck out!",
flakturm_lou_panel_broken_var2_amer: "Acho que o gás é suficiente. Quebrem a válvula e vamos continuar." #I'd guess that's all the gas we need. Break that valve off and we can go.",
flakturm_desrtoyy_aa_dyna_germ: "Tudo que precisamos fazer é colocar dinamite nas armas." #All we must do is place dynamite on the guns.",
flak_op_door_blocked1_russ: "Aaagh! A porta emperrou." #Aaagh! Damn door stuck.",
flakturm_dynamite_left_russ: "Alguém tem dinamite? É efetivo também." #Anyone have dynamite. That effective too.",
flakturm_yard_seq3_russ: "Olha. Um jeito de entrar. Kurgan tem certeza." #Look. Find a way in. Kurgan know it.",
flakturm_elevator_in_position_russ: "O elevador chegou. Agora, vamos acabar com isso." #Elevator is up. Now, finishing this time.",
flakturm_gas_panel_breaks_var3_germ: "Aquela válvula deve ser quebrada agora que temos gás suficiente." #That controller valve should be removed now that the gas is where we want it.",
flakturm_all_searchlight_lit_brit: "Deixa eu ver. Um, dois *contagem indistinta* É! Heimdall está brilhando mais que um baile de formatura em Blackpool!" #Let me see. One, two *indistinct counting* Yep! Heimdall is lit up like Blackpool prom!",
flakturm_gas_off_var1_russ: "Fascistas querem acabar com a festa. Parem eles, deixem o gás fluir!" #Fascists stop party. Stop fascists, and keep gas on!",
flakturm_lou_shoot_planes2_germ: "Schnell! Usem as armas antiaéreas ou as bombas com certeza vão explodir todo o gás da torre!" #Schnell! Use the AA guns or their bombs will surely ignite all the gas in the tower!",
flakturm_dynamite_left_brit: "Dinamite vai servir também. Alguém tem um pouco sobrando?" #Dynamite will do the job too. Anyone have a little left over?",
flakturm_ste_door_picked5_germ: "Você está correto. Com certeza haverá reguladores de gás por perto, com válvulas implorando para ser ligadas." #You're quite correct. There will surely be gas pipe regulators nearby, with valves just begging to be turned.",
flakturm_spawnseq5_germ: "Ja. Vamos encontrar um jeito de entrar." #Ja. Let's look for a way in.",
flakturm_power_searchlights_germ: "Gut. Agora sinalizamos o Esquadrão Sabre. Liguem os holofotes." #Gut. Now, we signal das Sabre Squadron. Start the searchlights.",
flakturm_lou_prepare_aa_gun4_germ: "Claro! Vamos pegar os projéteis!" #Of course! Let's get shells!",
flakturm_lou_defend_gas_var2_russ: "Essa válvula tá ocupada. Você não vai mexer nela." #Control valve busy. You will not use it.",
flakturm_spotted_bunker_door1_amer: "Ei, estão vendo aquela porta?" #Hey, ya see that door?",
flakturm_ste_1st_dynamite_plant2_amer: "Este cano está pronto pra explodir. Deve haver outros por aqui." #That's one pipe ready to blow. The others should be around here somewhere",
flakturm_find_right_bunker3_russ: "Então arrombamos a porta e entramos, sim?" #So we pick the lock and sneak through, yes?",
flakturm_ste_1st_dynamite_plant_russ: "Primeira dinamite pronta. Continuem." #First gun set. Keep going.",
flakturm_ste_top_reached_amer: "Estamos aqui. Puta merda. Certo, todos ainda estão com a dinamite?" #We're here. Holy shit. All right, everyone still got their dynamite?",
flakturm_spotted_bunker_door2_brit: "Deve levar ao pátio. Que gentileza deles." #Must lead to the yard. Awfully obliging of them.",
flakturm_lou_find_main_controller3_brit: "Então vamos subir! Rápido!" #Then let's head up there! Hurry!",
flakturm_defend_gas_var1_brit: "Droga. Não podemos deixar os nazistas pararem o gás." #Blast. Mustn't let those Nazis stop the gas from flowing.",
flakturm_tank_spotted1_brit: "Mas que merda! Um tanque Tiger!" #Dash it all! A Tiger tank!",
flakturm_lou_find_main_controller3_amer: "Então vamos subir! Mexam-se!" #So let's head up there! Move it!",
flakturm_lou_panel_broken_var2_brit: "Acho que é gás suficiente para explodir o dirigível, e vocês? Vamos quebrar a válvula e continuar, rapazes." #Enough gas to detonate an airship, you think? Let's break that valve off and make a move, old boy.",
flakturm_lou_main_gas_contr2_brit: "De fato. Ativem!" #Indeed. Activate it!",
flakt_opn_wait_for_parachutes2_germ: "Evitar a chuva da morte? Oh, isso vai ser um ótimo jeito de vencer a guerra!" #Avoid the hail of death? Oh, this is a great way to win a war!",
flakturm_lou_lever_failed1_germ: "Verdamnt! Essa alavanca é ruim..." #Verdamnt! Lever is tricky...",
flakturm_lou_shoot_target_missed_amer: "Como que eu errei isso!?" #How the hell I miss that!?",
flakt_opn_elevator_on_top1_russ: "O elevador chegou ao topo!" #Elevator is at roof!",
flakturm_get_inside_tower_brit: "Me desculpem, mas que tal pararmos de enrolar e entrarmos logo!" #Awfully sorry, but perhaps we could stop dicking around and get inside!",
flakturm_dynamite_left_amer: "A dinamite que a Sra. White nos deu servirá também. Alguém tem alguma sobrando?" #The dynamite Mrs. White gave us will work too. Anyone got a little left?",
flakturm_yard_seq3_brit: "Procurem. Deve haver um jeito de entrar." #Look around. There's surely a way in somewhere.",
flakturm_lou_escape_from_flak2_amer: "Hora de dar no pé!" #Time to bug out!",
flakturm_lou_shoot_aim_engines_germ: "Os motores! E as hélices! Atirem neles!" #The engines! The propellers! Shoot them!",
flakturm_spotted_bunker_door2_amer: "Deve levar até o pátio. Muito útil." #Gotta lead to the yard. That's handy.",
flakturm_find_bunker1_russ: "Camaradas. Os bunkers parecem um jeito de entrar. Da?" #Comrades. The bunkers look like way in. Da?",
flakturm_get_to_observation_deck_germ: "A plataforma de observação! Vamos!" #That Observation Deck! Go!",
flakturm_find_right_bunker1_russ: "Aquele bunker? Tem uma porta." #That bunker? It has a door.",
flakt_opn_bomb_dropped_var1_brit: "Cuidado coma s bombas! Mexam-se!" #Watch for the bombs! Keep moving!",
flakturm_gas_panel_breaks_var1_russ: "Sem válvula não tem como pararem o gás. Da?" #No controller valve, no way to stop gas. Da?",
flakturm_lou_lever_failed2_russ: "Tenta de novo." #Try again.",
flakturm_lou_main_gas_contr2_germ: "De fato! Ativem ela!" #It is indeed! Activate it!",
flakturm_lockpick_bunker2_germ: "Se queremos nos esconder, arrombar a fechadura vai ser a melhor opção. Então... qual bunker é o certo?" #If we are trying to stay hidden, picking the lock would be best. So... which bunker is correct?",
flakt_opn_wait_for_parachutes2_russ: "Não ser explodido em pedacinhos? Perfeito!" #Not be blown to bits? Wonderful!",
flakturm_broke_regulator2_russ: "Precisamos de mais. Continuem." #Still more. Keep going.",
flakturm_find_right_bunker3_amer: "Que seja. Significa que podemos abrir e passar." #Whatever. It means we can pick it and get through.",
flakturm_stealth_broken_germ: "Verdamnt! Não tem porquê sermos cautelosos. Esqueçam a fechadura!" #Verdammt! No point being subtle. Forget the lock!",
flakturm_spawnseq5_russ: "Da. Vamos encontrar um jeito de entrar." #Da. Let's find way in.",
flakt_opn_bomb_dropped_var2_brit: "Mexam-se, que droga!" #Keep moving, damn you!",
flakturm_get_on_the_bunker_amer: "Conseguimos. Deve ser fácil chegar ao pátio agora." #We're up. Oughta be easy to get to the yard now.",
flakturm_defend_gas_var3_germ: "Outro schwein procura a morte. Devemos ajudá-lo, antes que ele desligue o gás." #Another schwein seeks death. We should comply, before he switches the gas off.",
flakturm_lou_main_gas_contr_amer: "Ah cara. Acham que esse é o controlador principal?" #Oh man. Ya reckon this is it, the main gas controls?",
flakt_opn_spawn_door_rammed_amer: "Boom! Certo. Entrem e procurem o elevador!" #Boom! All right. Get in there. Find the elevator!",
flakturm_gas_off_var3_germ: "Vamos mostrar aos nazistas o que fazemos com quem fica em nosso caminho. O gás deve continuar ligado." #Let us show these Nazis what we do to those who stand in our way. The gas must flow.",
flakturm_ste_door_picked5_brit: "Ah sim! Fiquem de olho nos reguladores de gás. E só girem as válvulas, simples assim!" #Ah yes! Keep an eye out for the gas pipe regulators. Turn the valves on, and Bob's your uncle!",
flakturm_searchlight_intro_seq2_amer: "Vamos aponta-las para o Heimdall." #We turn 'em around and point 'em at Heimdall.",
flakturm_lou_gas_flowing_var3_germ: "Wunderbar. É gás suficiente para explodir o dirigível, eu acho. Eles vão tentar nos parar, marquem minhas palavras." #Wunderbar. Enough gas to blow up an airship, perhaps. But they will try to stop us, you mark my words.",
flakturm_lou_lever_failed_again1_germ: "Scheisse!" #Scheisse!",
flakturm_gas_panel_breaks_var2_germ: "Sabem, eu criei afeto por essa válvula. Acho que deviamos levá-la, só pra garantir." #Y'know, I have grown fond of this controller valve. I feel we should take it, to ensure no-one else uses it.",
flakturm_turn_on_the_gas_var2_amer: "Parece que ligamos o cano principal de gás. Isso é bom, mas precisamos ter certeza de que todo o gás está indo pro lugar certo antes de continuarmos." #Looks like we got the main gas pipe on. That's good, but we gotta make sure all the gas goes where we want it before we make tracks.",
flakturm_get_to_the_flak_door1_amer: "Devemos estar perto da porta da torre flak." #We gotta be close to the flak tower's doors.",
flakturm_spotted_bunker_door1_germ: "A porta bem ali." #That door over there.",
flakturm_turn_on_the_gas_amer: "Nada mal - o encanamento principal está ligado. Esperem, precisamos ter certeza que todo o gás foi liberado." #Not bad - main gas pipe is flowing. Sit tight - we gotta wait til it's all gone through.",
flakturm_turn_on_the_gas_var3_germ: "Ótimo. O gás está fluindo. Vamos esperá-lo terminar." #There. The gas flows to its destination. We should show it the courtesy of waiting for it to finish.",
flakturm_lou_main_gas_contr2_amer: "Eu acho que sim! Ativem!" #I reckon so! Activate it!",
flakturm_lou_escape2_germ: "Quanto gás nós usamos?! Saiam daqui - agora!" #How much gas did we use?! Clear the area - now!",
flakturm_gas_panel_breaks_var1_germ: "Agora que o gás está onde queremos, quebrar essa válvula fará o processo ser irreversível, eu acho." #Now that the gas is where we want it, removing this control valve will make the process quite irreversible, I feel.",
flakturm_jump_reminder_amer: "Os bombardeiros estão chegando. Vamos embora!" #Bombers are almost here. Let's bail!",
flakturm_lockpick_bunker2_amer: "Vamos continuar discretos? Então vamos destrancar as portas! Tá, uh, qual bunker é o que devemos ir?" #We keeping a low profile? Lockpick all the way! So, uh, which bunker is the one we need?",
flakturm_destroy_odin3_russ: "Então vamos liberar o gás? Procurem por válvulas!" #So we make gas flow? Look for valves!",
flakturm_lou_escape_from_flak2_brit: "Hora de ir!" #Time to leave!",
flakturm_jump_reminder_russ: "Estão chegando. Pulem! Agora!" #They're almost here. Jump! Now!",
flakturm_destroy_odin3_brit: "Provavelmente há válvulas reguladores por aqui. Encontrem-as." #There's probably regulating valves around. Look for them.",
flakturm_shoot_explosive_germ: "Está pronto! Agora esperem e depois boom, ja!?" #Is done! Now, wait and then boom, ja!?",
flakturm_ste_spotted_regulator2_amer: "Gire-a. Vamos liberar o gás." #Turn it. Let's get the gas flowing.",
flakturm_turn_on_the_gas_var3_russ: "Vai, meu gás querido. Vamos esperar você. Nos servirá bem." #Flow, little gas. We wait for you. You serve us well.",
flak_op_spawned_brit: "Certo, rapazes. A resistência ajudou a entrarmos na toca do leão, mas é nós que temos que descobrir uma maneira de destruir as armas antiaéreas no topo. Mexam-se." #Righto chaps. The Resistance got us into the belly of the beast, but it's up to us to find a way to destroy the AA guns up top. Let's move.",
flakturm_spotted_bunker_door2_russ: "Deve conectar ao pátio. Isso é bom." #Must lead to yard. That good.",
flakturm_spotted_bunker_door1_russ: "Olhem! Uma porta!" #Look! A door!",
flakturm_lou_escape_from_flak2_germ: "Precisamos ir. Agora!" #We must go. Now!",
flakt_opn_bomb_dropped_var3_brit: "Cuidado com as bombas! Mexam-se" #Mind the bombs! Move!",
flakturm_tank_spotted1_russ: "Nyet! Um tanque Tiger" #Nyet! A Tiger tank!",
flakturm_ste_1st_dynamite_plant2_russ: "Primeiro cano pronto. Continuem." #First pipe set. Keep going.",
flakturm_gas_panel_breaks_var1_brit: "Aqui vai uma ideia. Que tal nos certificarmos que eles nunca desliguem essa válvula?" #Here's an idea. How about we make sure they can never turn this valve off?",
flak_op_escape_var2_brit: "Rápido! Para o caminhão!" #Move it! Get into the truck!",
flakturm_enough_explosives_brit: "Deixa eu ver. *fazendo contagem* É, acho que é suficiente, rapazes." #Let me see. *indistinct sounds of counting* Yes, I think that should do it, chaps.",
flakturm_gas_panel_breaks_var2_amer: "Veem a válvula? Vamos quebrá-la, eles nunca vão poder parar o gás. Hah!" #See that controller valve? We bust that off, they ain't ever stopping the gas. Hah!",
flakturm_tank_spotted1_germ: "Oh nein! Um tanque Tiger!!" #Oh nein! A Tiger!!",
flakturm_lou_gas_flowing_amer: "Certo, o gás está fluindo. Preparem-se, pessoal. Vamos encontrar problemas." #Alright, that's the gas flowing. Lock and load, ladies. Trouble can't be far.",
flakturm_lou_enemies_charge_gas1_germ: "Achtung! Inimigos parando o gás!" #Achtung! Enemy stopping gas!",
flakturm_ste_1st_dynamite_plant_brit: "Primeira arma sabotada. Espalhem-se. Sabotem as outras também." #That's the first gun rigged. Scatter out. Find the rest and spike them too.",
flakturm_ste_1st_dynamite_plant_germ: "A primeira arma já ganhou sua 'melhoria' explosiva. Não deixem as outras armas com ciúmes." #The first gun has its explosive 'upgrade' ready. Ensure the other guns do not get jealous.",
flak_op_call_mrs_white3_amer: "Alguma vez já te deixamos pra baixo? Falando em 'baixo' tem alguma ideia brilhante para nos tirar dessa coisa? Câmbio." #We ever let you down? Speaking of 'down', you got any bright ideas for getting us off'a this thing? Over.",
flakturm_destroy_odin2_russ: "Use o sistema de reabastecimento a gás. Encha o Odin de gás e bang, bola de fogo nazista." #Use the gas fueling system. Fill up the Odin, bang and Nazi fireball.",
flakt_opn_call_elevator1_amer: "O elevador está no topo. Precisamos desce-lo." #Elevator's up at the roof. Gotta get it down here.",
flakturm_spotted_bunker_hatch_germ: "Ah, uma escotilha! Provavelmente trancada! Alguém quer abri-la, por favor?" #Ah, a hatch! Likely locked! A volunteer to open it, please?",
flak_op_spawned_russ: "A resistência fez bem nos deixando dentro da torre flak. Agora precisamos fazer algo bom também. Vamos destruir as armas antiaéreas, e qualquer soldado que ficar em nosso caminho." #Resistance did good, getting us inside flakturm. Now - we do good. We crush AA guns, and every little man who stands in way.",
flakturm_signal_airdrop4_amer: "É melhor a Sra. White ter um plano genial para nos ajudar a descer, ou vamos virar churrasco. Chamem ela pelo rádio, agora." #Mrs. White better have some genius plan for getting us down, or we're toast. Get her on the radio, right now.",
flakturm_lou_enemies_interrupt_gas1_russ: "Bozhe moi! Estão parando o gás!" #Bozhe moi! They stop gas!",
flakturm_enough_explosives_germ: "Está bom de explosivos? Ja, com certeza." #Is that enough explosives? Ja, for sure.",
flakturm_lou_defend_gas_var3_brit: "Desculpem, proibido nazistas nessa área! Tirem as mãos da válvula!" #Sorry, this is a no-Nazi zone! Hands off the control valve!",
flakturm_lou_lever_failed_again1_brit: "Puxa direito!" #Bugger it proper!",
flakturm_lou_panel_broken_var3_amer: "Heh! Esse gás é suficiente. Quebrem a válvula para que possamos continuar em frente." #Heh! That's a good amount'a gas. Pull the main valve off and we can get this show on the road.",
flakturm_lou_enemies_interrupt_gas2_amer: "Não reclama comigo. Mate eles e reinicie!" #Don't tell me. Give 'em hell and get it restarted!",
flakturm_lou_back_to_mission_germ: "Isso quase me fez suar. Hm. Que tal voltarmos ao plano de explodir o dirigível?" #That almost made me sweat. Hm. Shall we get back to the business of making the airship explode?",
flakturm_gas_off_var1_brit: "Droga! Nazistas estão tentando parar o gás. Precisamos impedi-los!" #Blast! Jerry's trying to turn off the gas. We have to make sure it stays on!",
flakturm_ste_door_picked4_germ: "Antes de continuarmos, eu sugiro que enchemos aquele dirigível com algo inflamável." #Before we proceed, might I suggest we fill that vulgar airship with something combustible.",
flakturm_turn_on_the_gas_russ: "Os gás está fluindo. Vamos esperar terminar." #The gas flows. We stay until finish.",
flakturm_ste_spotted_regulator1_germ: "Achtung. Aquilo parece ser um regulador de gás." #Achtung. That appears to be a gas regulator.",
flakturm_wayin1_amer: "Aquela porta é o único ponto fraco. A dinamite deve servir." #That door's the only weak spot. Our dynamite should do it.",
flakturm_desrtoyy_aa_dyna_amer: "Plantem a dinamite nas armas! Vamos!" #Get that dynamite rigged to the guns! Let's do this!",
flakturm_lou_enemies_interrupt_gas2_germ: "Reclamar não adianta. Matá-los e reiniciar vai!" #Complaining won't fix it. Killing them and restarting it will!",
flakturm_ste_enter_flak3_russ: "A porta, talvez? Aquela grandona, mas ela está trancada." #Door, maybe? Big door, but has lock to pick.",
flakturm_place_dynamite_on_pipes1_amer: "Hora de destruir o dirigível! Agora podemos explodir os canos? Por favor?" #Time to take out the airship! NOW can we blow the gas pipes? Please?",
flakturm_find_bunker2_russ: "Da. O bunker terá passagem até a torre. Vamos entrar." #Da. Bunkers will lead to tower. We break in.",
flakturm_yard_seq3_amer: "Olhem em volta. Nenhum lugar é à prova de invasões." #Look around. Nowhere's impregnable.",
flakturm_start_elevator_germ: "Subam com o elevador. Vamos! Raus!" #Proceed with elevator. Come on! Raus!",
flakturm_turn_on_the_gas_germ: "Excelente - agora que o gás está fluindo, só precisamos esperar." #Excellent - now that the gas is flowing, all we need to do is wait until all has passed.",
flakturm_lou_ammo_found_russ: "Parecem projéteis antiaéreos. Peguem!" #Looks like AA shells. Take!",
flakturm_lou_shoot_aim_engines_russ: "Atirem nos motores! Lá!" #Shoot engines! See!",
flakturm_get_on_the_bunker_germ: "Subam! Deve ter um caminho até o pátio." #Up! Should be a clear path to the yard now.",
flakturm_ste_planted_dynamite2_brit: "Vamos sair. Prefiro não ficar perto quando nosso presentinho explodir." #Let's leave. Rather not be around when Jerry gets his little present.",
flakturm_ste_door_picked4_amer: "Esperem um pouco. Precisamos encher o dirigível de combustível, não é?" #Hold your horses. We gotta make sure that Zeppelin's full of gas, right?",
flakturm_power_searchlights_brit: "Certo. Sinalizem o Esquadrão Sabre! Liguem os holofotes!" #Right. Signal Sabre Squadron! Get the searchlights on!",
flakt_opn_wait_for_parachutes2_brit: "Ficar vivos enquanto tá chovendo bombas? Oh perfeito!" #Stay alive as the bombs rain down? Oh spiffing!",
flakturm_ste_enter_flak3_germ: "Hm. Mesmo uma porta formidável dessa terá uma tranca para abrir, ja?" #Hm. Even a door as formidable as this will have a lock to pick, ja?",
flakt_opn_elevator_on_top2_amer: "Então que tal subirmos também?" #Then what say we get up there too?",
flakturm_ste_door_picked5_russ: "Bom, bom. Procuramos válvulas de combustível, para abastecer o dirigível." #Good, good. We seek out valves for gas pipes, and send gas to airship.",
flakturm_find_bunker2_brit: "Parece, velhote. Que tal entrarmos e ver aonde ele nos leva?" #Looks like it, old boy. What say we make our way in and see where they take us.",
flakturm_find_right_bunker1_germ: "Vejam aquela bunker. Tem uma porta, estão vendo?" #Observe that bunker. It has a door, you see?",
flakturm_lockpick_bunker2_russ: "Se quiser ficar quieto, abrimos a tranca. Mas qual tranca abrir?" #If you want quiet, we pick lock. But which lock to pick?",
flakturm_gas_panel_breaks_var2_brit: "Se quebrarmos a válvula eu diria que os nazistas vão ter alguns problemas para parar o gás." #Break that controller valve and I daresay that Jerry will have a frightful time trying to stop the gas flow.",
flakturm_spawn4_amer: "Contanto que o general esteja no dirigível, podemos explodir tudo." #And so long as the general's in the airship, we can blow it all to hell.",
flakturm_spawnseq5_amer: "Parece bom. Vamos procurar um jeito de entrar." #Sounds good. Let's look for a way in.",
flakturm_find_right_bunker3_germ: "Irrelevante! Vamos abrir e passar." #Irrelevant! Let us pick it and ghost through.",
flakturm_spotted_ladder2_russ: "Muito bom. Subam!" #Very good. Up it!",
flakturm_wayin1_germ: "Aquela porta é o jeito de entrar. Vamos explodir com a dinamite?" #That door is the way in. Blast it with explosives?",
flakturm_ste_door_picked4_brit: "Primeiramente, rapazes, devemos garantir que o dirigível está abastecido e pronto para explodir, certo?" #First things first, chaps -- we should make sure that Zeppelin is filled up and ready to go bang, all right?",
flakturm_defend_gas_var1_amer: "Cuidado - não podemos deixar esses arrombados pararem o gás. Impeça-os" #Watch it - can't let these assholes stop the gas flow. So let's stop them first.",
flakturm_gas_off_var2_amer: "Nazistas sabem acabar com a diversão. Não deixem esses imbecis desligarem o gás!" #Trust a Nazi to spoil the fun. Don't let those assholes turn off the gas!",
flakturm_gas_panel_breaks_var2_russ: "Eles não precisam das válvulas. Vamos quebrá-la." #They not need controller valve. We take it.",
flakturm_blow_fuel_cans_var1_3_brit: "Então vamos encontrar os galões de combustível!" #So let's find the fuel cans!",
flakturm_stealth_broken_russ: "Hah. Ótimo! Esqueçam a tranca - Kurgan prefere assim!" #Hah. Good! Forget stupid lock - Kurgan prefer this!",
flakturm_lou_gas_flowing_var2_brit: "Maravilha. Parece que o gás está fluindo. Receio que tentarão nos impedir." #Marvellous. Sounds like the gas is flowing. Best get ready for some resistance, I fear.",
flakturm_lou_gas_flowing_var2_amer: "O gás está fluindo, mas eu acho que a coisa vai ficar feia." #The gas is doing its thing, but I'd bet it's about to get messy.",
flakturm_lou_gas_flowing_var2_germ: "Sehr gut, senhores. No entanto, acho que nossos amigos não gostam do gás fluindo desse jeito." #Sehr gut gentlemen. However, our hosts may have some objections to the gas flowing like this.",
flakturm_lou_gas_flowing_var3_amer: "Parece que o gás está fluindo. Aposto dez pratas que alguém vai querer pará-lo." #Sounds like the gas is going. Ten bucks says someone's gonna try to stop it.",
flakturm_lou_defend_gas_var1_brit: "Não deixem os nazistas chegarem perto da válvula, rapazes!" #Don't let Jerry near the control valve, lads!",
flakturm_lou_defend_gas_var2_amer: "Mantenham esses merdas longe da válvula!" #Keep those shitbirds off our control valve!",
flakturm_lou_enemies_charge_gas1_brit: "Estão parando o gás!" #They're stopping the gas!",
flakturm_lou_enemies_charge_gas1_amer: "Ei, estão parando o gás!" #Hey, they're stoppin' the gas!",
flakturm_lou_enemies_charge_gas2_amer: "Então, parem ELES!" #So, stop THEM!",
flakturm_lou_enemies_interrupt_gas2_russ: "Então matem eles! E reiniciem!" #Then kill them! And restart it!",
flakturm_lou_panel_broken_var1_germ: "Ótimo, parece que temos todo o gás necessário. Sugiro que quebremos a válvula para continuar." #Good, I expect we have all the gas we need now. I suggest we break the valve off and continue our mission.",
flakturm_lou_find_main_controller2_russ: "Haverá um controlador mestre que libera o combustível para o Odin. Provavelmente no telhado." #There will be a master switch. Make gas go into Odin. Probably on the roof.",
flakturm_lou_find_main_controller2_germ: "Deve ter um controlador mestre que regula o fluxo para o Odin. Provavelmente vamos acha-lo no topo." #There will be a master switch to regulate the flow to the Odin. Most likely we will find it on the roof.",
flakturm_lou_shoot_planes2_brit: "Armas antiaéreas, perfeito! Se deixarmos eles nos bombardear, a torre inteira vai explodir!" #AA guns, double-time! If we let them bomb us, this whole tower will blow!",
flakturm_lou_back_to_mission_brit: "E agora, onde estávamos? Ah sim. Hora de explodir aquele balão, eu acho." #Now then, where were we? Ah yes. Time to detonate their little balloon, I believe.",
flakturm_lou_back_to_mission_amer: "Agora que estamos livre disso, que tal explodirmos esse maldito dirigível?" #Now we got that out the way, how's about we blow up that god-damn airship already?",
flakturm_lou_back_to_mission_russ: "Ótimo. Agora eu quero fazer o dirigível explodir. Vamos continuar." #Good. Now I wish to make the airship explode. Let us proceed.",
flakturm_lou_main_gas_contr_russ: "Aha! O controlador mestre! Se ativarmos isso o gás irá até o Odin, certo?" #Aha! Main gas controller! We activate this and Odin gets gas, yes?",
flakturm_lou_increase_pressure2_brit: "Isso deve liberar o gás para o Odin!" #That should get the gas flowing into the Odin!",
flakturm_lou_increase_pressure2_amer: "Ótimo. O gás deve estar indo para o Odin." #Great. Gas oughta be filling the Odin.",
flakturm_lou_increase_pressure2_germ: "Imaginem todo esse gás no Odin." #Think of all that gas flowing to the Odin.",
flakturm_lou_lever_failed2_amer: "Mais uma vez..." #Once more...",
flakturm_lou_prepare_aa_gun4_russ: "Ah! Ótimo! Procuramos projéteis?" #Ah! Good! We look for shells?",
flakturm_lou_ammo_found_brit: "Isso parece munição antiaérea. Peguem." #That looks like the AA ammo. Grab it.",
flakturm_lou_shoot_aim_engines_brit: "Mirem nas malditas hélices!" #Aim for the bloody propellers!",
flakturm_lou_escape1_brit: "Não parem agora, rapazes! Precisamos sair da torre!" #Don't stop now, chaps! We need to get out of the tower!",
flakturm_lou_escape1_amer: "Nosso caminho está livre! Vamos sair dessa maldita torre, agora!" #We've got a clear path! Get outta the goddamn tower, now!",
flakturm_lou_escape1_russ: "Não há chamas em nosso caminho. Corram, companheiros!" #We have no flames stopping us. Run, comrades!",
flakturm_lou_escape2_amer: "Vai vai vai! Esse lugar inteiro vai explodir!" #Go go go! This whole place is gonna blow!",
flakturm_lou_escape2_russ: "O lugar todo vai queimar! Corram! Agora!" #Everything here will burn! Run! Now!",
flakturm_tank_spotted2_germ: "Não podemos destruí-lo. Precisamos passar por ele!" #We can't destroy it. We must get past!",
flakturm_searchlight_intro_seq2_russ: "Apontem os holofotes para o Heimdall!" #Shine lights on Heimdall!",
flakturm_power_searchlights_amer: "Vamos ligar os holofotes!" #Let's power up the searchlights!",
flakturm_searchlight_defend_germ: "Eles vão tentar desligar as luzes. Eu sei disso. Precisamos protegê-las!" #They'll go after the lights. I know it to be true. We must protect them!",
flakt_opn_spawn_door_blocked2_russ: "Precisamos abrir caminho." #We must force way through.",
flakt_opn_spawn_door_blocked2_germ: "Precisamos abrir caminho." #We must force a way through.",
flakt_opn_spawn_door_rammed_brit: "Que tal essa! Certo, vamos encontrar o elevador!" #Have fucking that! Right, let's find this elevator!",
flakt_opn_spawn_door_rammed_germ: "Entramos! Agora procurem o elevador!" #We're through! Now, get inside and find the elevator!",
flakt_opn_call_elevator2_amer: "Então puxe a alavanca." #Then pull the lever.",
flakt_opn_call_elevator2_russ: "Então vai logo. Puxe a alavanca." #Then bring it. Pull lever.",
flakt_opn_call_elevator2_germ: "Então chamem ele. Puxe a alavanca." #So, call it down. Pull the lever.",
flakt_opn_wait_for_parachutes1_brit: "Certo. Os paraquedas estão a caminho. Só precisamos..." #Right. Parachutes are on their way. We just have to... ",
flakt_opn_wait_for_parachutes1_amer: "Escutem. Os paraquedas estão a caminho. Até lá só precisamos..." #Listen. Parachutes are comin'. Til then we just gotta...",
flakt_opn_elevator_on_top2_brit: "Então vamos subir também, certo?" #Then let's join it, shall we?",
flakt_opn_elevator_on_top2_germ: "Então vamos subir junto com ele!" #Then let us not be shy, and join it!",
flakturm_load_explosives_brit: "Aquele elevador leva as munições até o topo, e precisamos de explosivos!" #That cargo elevator carries shells to the guns, and we still need explosives!",
flakturm_enough_explosives_russ: "Kurgan acha que esses explosivos são suficientes." #Kurgan think that sufficient amount of explosives. ",
flakturm_start_elevator_russ: "Liguem o elevador. Vamos levar os projéteis até o topo." #Begin elevator. Let take shells to roof.",
flakturm_destroy_aa_guns_brit: "De fato. Peguem um projétil, coloquem do lado da arma, vão para trás e atirem. Perfeito!" #Indeed. Grab a shell, chuck it by an ack-ack gun, stand back and shoot it. Lovely!",
flakturm_destroy_aa_guns_russ: "Isso é fácil. Coloquem o projétil perto da arma, atirem nele, arma explode." #This bit easy. Put shell by gun, shoot shell, gun blow up.",
flakturm_flak_guns_destroyed1_amer: "As armas já eram!" #The guns are dealt with!",
flakturm_flak_guns_destroyed1_russ: "As armas foram destruídas!" #The guns are all done!",
flakturm_flak_guns_destroyed1_germ: "Essa foi a última arma!" #That was the last gun!",
flakturm_jump_reminder_germ: "Acredito que o Esquadrão Sabre está chegando!" #I believe Sabre Squadron is almost here!",
flakturm_get_to_observation_deck_amer: "Subam ate a plataforma de observação!" #Get up to that Observation Deck!",
flakturm_blow_fuel_cans_var1_1_brit: "Senhores, eu diria que deve ter galões de combustível por aqui. Se colocarmos eles perto do bunker, poderíamos explodi-los..." #I say, lads. Must be some fuel cans around here. If we were to pop them by the bunker, we could ignite the fuel...",
flakturm_blow_fuel_cans_var1_1_amer: "Tenho uma ideia. Deve haver latas de combustível aqui. Vamos colocá-las no bunker, atirar nelas..." #I got an idea. Gotta be fuel cans around here. Stick 'em by the bunker, light 'em up...",
flakturm_blow_fuel_cans_var1_2_brit: "...e asfixiar os desgraçados para eles sairem! Bem pensado." #...and smoke the buggers out! Smart thinking. ",
flakt_opn_bomb_dropped_var1_amer: "Cuidado com as bombas!" #Keep an eye out for the bombs!",
flakt_opn_bomb_dropped_var1_germ: "Tomem cuidado com as bombas!" #Be mindful of the bombs!",
flakt_opn_bomb_dropped_var2_amer: "Cuidado com as bombas! Mexam-se!" #Watch out for the bombs! Hustle!",
flakt_opn_bomb_dropped_var3_russ: "Bombas! Cuidado!" #Bombs! Beware!",
flakturm_calling_mrswhite1_brit: "Broadsword chamando Sra. White! Responda, Sra. White! Câmbio." #Broadsword calling Mrs. White! Come in Mrs. White! Over.",
flakturm_calling_mrswhite1_russ: "Broadsword chamando Sra. White. Câmbio." #Broadsword calling Mrs. White. Over.",
flakturm_calling_mrswhite2_germ: "Não estamos na vantagem aqui. Pode nos ajudar? Câmbio." #We are not in a situation of advantage. Can you assist? Over.",
mrswhite_level_flakturm_line_02: "Não se preocupem, rapazes. Mandei o Esquadrão Sabre entregar paraquedas. Marquem sua posição com um sinalizador. E tomem cuidado, nossos bombardeiros estão a caminho para explodir o Heimdall. Câmbio, desligo." #Never fear, boys. I have Sabre Squadron are ready to drop you parachutes. Mark your position with a flare. And don't dally - our bombers are on the way to level Heimdall. Mrs White, over and out.",
flakturm_signal_airdrop3_brit: "Merda. Não tem mais onde subir. E descer vai ser um pouquinho complicado." #Blast. Nowhere left to climb. And getting back down might be a tad tricky.",
flakturm_signal_airdrop3_amer: "Ah merda. Somos alvos fáceis aqui. Eu gostaria de saber voar... O que fazemos agora?" #Aw crap. We're sitting ducks up here. At least ducks can fly... whadda we do now?",
flakturm_signal_airdrop3_germ: "Oh isso não é bom. Não podemos subir mais, e não podemos voltar" #Oh this is not good. We cannot go higher, and cannot turn back.",
flakturm_signal_airdrop4_germ: "Posso sugerir que contatemos Frau White, talvez ela tenha planos para nos ajudar a fugir?" #Might I suggest we contact Frau White at once, and see if she has any plans for our escape? ",
flakturm_planes_dropping_parachutes: "Os paraquedas chegaram. Matem os inimigos." #The parachutes are dropped. Clear the roof.",
flak_op_spawned_amer: "Certo, rapazes. A Resistência nos trouxe para dentro, destruir as armas antiaéreas no topo é com a gente. Mexam-se." #All right, guys. The Resistance got us inside, so now it's up to us to finish things and destroy the AA guns up top. Move out.",
flak_op_spawned_germ: "Elogio a resistência por nos trazer tão longe. Agora precisamos destruir as armas antiaéreas da torre, e todos que ficarem em nosso caminho. Komm!" #I commend the resistance for getting us this far. Now, we must destroy this flakturm's AA guns, and all who stand in our way. Komm!",
flak_op_open_flak_door_amer: "Hm. Vamos ver o que tem atrás da porta. Destranquem ela." #Hm. Let's see what's behind the big door. Get it open.",
flak_op_open_flak_door_russ: "Vamos. Veremos o que tem depois da porta.." #Come. We see what is past this door.",
flak_op_open_flak_door_germ: "Destranquem a porta. Nosso destino nos espera." #Open the door. Our destiny awaits.",
flak_op_door_blocked1_brit: "Oh porcaria! A porta emperrou!" #Oh balls! The ruddy door's stuck!",
flak_op_door_blocked1_amer: "Tá de sacanagem. Essa merda emperrou." #You shittin' me. Damn thing's stuck.",
flak_op_door_blocked2_amer: "Não temos tempo. Foda-se, vamos bater nela com o carro!" #Ain't got time. Fuck it - we're gonna drive through!",
flak_op_door_blocked2_russ: "Não há tempo. Ah! Já sei! O carro!" #Have no time. Ah! I know! Drive through!",
flak_op_find_elevator_brit: "Não acho que eles vão ter 'explosivos anti-antiaéreo' por aqui, mas deve ter algo que possamos usar..." #Doubt they're just going to have 'anti-anti-aircraft explosives' lying around, but there's got to be something we can use...",
flak_op_find_elevator_germ: "Precisamos ter certeza que temos algo para explodir as armas antiaéreas no topo. Certamente há algo aqui que possa nos ajudar..." #We must ensure we have the means to blow up the AA guns on the roof. Surely there is something here that will help...",
flak_op_find_shells_amer: "Certo, se eu fosse um otário, onde eu deixaria os projéteis?" #Alright, if I were a shitbird, where would I keep my shells?",
flak_op_find_shells_germ: "Sugiro encontrar logo esses projéteis." #Might I suggest we hurry up and locate the shells.",
flak_op_call_mrs_white1_amer: "Broadsword chamando Sra. White. Consegue nos ouvir, boneca? Câmbio!" #Broadsword to Mrs White. You there, doll? Over!",
flak_op_call_mrs_white1_germ: "Broadsword chamando Frau white. Consegue nos ouvir, Frau White? Câmbio." #Broadsword calling Frau White. Are you there, Frau White? Over.",
flak_op_call_mrs_white2: "Estou na escuta, Broadsword. Assumo pelas explosões que as armas antiaéreas foram destruídas? Câmbio." #I hear you, Broadsword. I'm guessing from those explosions that you've taken the AA guns out? Over.",
flak_op_call_mrs_white3_germ: "Com certeza, querida, mas estamos com um probleminha para fugir. Pode nos ajudar? Câmbio." #Of course dear lady, but it has presented us with a problem regarding an escape. Can you assist? Over.",
flak_op_call_mrs_white5_russ: "Evitar as bombas, esperar paraquedas, pular da torre! Simples! Câmbio, desligo!" #Avoid bombs, wait for parachutes, jump off flakturm! Is simple! Over and out!",
flak_op_call_mrs_white5_germ: "Evitar as bombas, esperar paraquedas, e depois pular da torre!? Mein gott. Câmbio, desligo!" #Avoid bombs, await parachutes, and then leap off the flakturm!? Mein gott. Over and out!",
flak_op_close_to_escape_truck_brit: "O caminhão! Subam!" #There's the truck! Get in!",
flak_op_close_to_escape_truck_amer: "Subam no caminhão! Vai vai vai!" #Get in the truck! Move move move!",
flak_op_close_to_escape_truck_russ: "Subam no caminhão! Rápido!" #Get in truck! Quick!",
flak_op_escape_var1_germ: "Ali! Subam no caminhão!" #There! Into the truck!",
flakturm_get_inside_tower_russ: "Aqui fora é legal, mas a missão é mais, certo? Vamos entrar!" #Out here is nice, but mission is nicer, yes? We go inside!",

# Objetivos
flak_get_inside_desc: "A porta está aberta, hora de entrar e acabar com o Odin." #The door is open, time to get inside and deal with the Odin.",
flak_activate_gas_loud_des_desc: "Os reguladores controlam o fluxo do gás. Gire as válvulas para aumentar o fluxo." #The regulators control the flow of gas. Open them up and increase the flow of gas by turning the pipe valves.",
flak_activate_gas_desc: "Os reguladores controlam o fluxo do gás. Gire as válvulas para aumentar o fluxo." #The regulators control the flow of gas. Open them up and increase the flow of gas by turning the pipe valves.",
flak_activate_gas_loud_des_sub_desc: "Este regulador terminou. Quebre a válvula para que ninguém possa impedi-lo." #This regulator has finished. Break the valve to prevent further tampering.",
flak_activate_gas_loud_def_desc: "Os reguladores controlam o fluxo do gás. Aumente o fluxo girando as válvulas." #The regulators control the flow of gas. Open them up and increase the flow of gas by turning the pipe valves.",
flak_reactivate_gas_loud_def_desc: "Os reguladores controlam o fluxo do gás. Gire a válvula novamente para aumentar o fluxo." #The regulators control the flow of gas. Re-Open them up and increase the flow of gas by turning the pipe valves.",
flak_bunker_wait_smoke_out_desc: "Espere o fogo forçar os guardas a abrir o bunker." #Wait for the fire to force the guards to open the bunker door and run out.",
flak_activate_gas_loud_def_sub_desc: "Enquanto o gás está sendo transferido ao Odin, não deixe ninguém interromper o processo. Mantenha os inimigos longe da válvula." #While gas is being pumped into the Odin, prevent anyone from closing the gas flow off. Keep them away from the regulators!",
flak_activate_gas_loud_def_hl: "Abra a válvula" #Open the gas regulators",
flak_reactivate_gas_loud_def_hl: "Reabra a válvula" #Re-open the gas regulators",
flak_activate_gas_loud_des_hl: "Abra a válvula" #Open the gas regulators",
flak_get_inside_hl: "Entre na torre flak" #Get inside the flakturm",
flak_activate_gas_loud_def_sub_hl: "Defenda a válvula" #Defend the gas regulator",
flak_activate_gas_hl: "Abra a válvula" #Open the gas regulators",
flak_bunker_wait_smoke_out_hl: "Espere os guardas abrirem o bunker" #Wait for the guards to open the bunker",
flak_activate_gas_loud_des_sub_hl: "Quebre a válvula" #Break the gas regulator valve",
obj_ger_miss_01_ft_09a_hl: "Leve os projéteis até o topo" #Transfer the shells to the top",
obj_ger_miss_01_ft_013_hl: "Chame uma entrega de paraquedas" #Call for a Parachute Airdrop",
obj_ger_miss_01_ft_011c_hl: "Vá para o topo" #Get to the roof",
obj_ger_miss_01_ft_09a_hl_sub_01: "O cabo de energia desconectou por causa da explosão. Conecte-o novamente." #The power cable for the elevator was torn loose by the explosion. Hook it back up.",
obj_ger_miss_01_ft_015_hl: "Pegue um paraquedas e pule!" #Collect a parachute and jump!",
obj_ger_miss_01_ft_021_stealth_hl: "Plante dinamite na porta principal" #Plant dynamite on the main door",
obj_ger_miss_01_ft_017_solo_hl: "Saia da torre flak" #Get out of the flakturm",
obj_ger_miss_01_ft_04b_hl: "Espere a dinamite explodir" #Wait for the dynamite to explode",
obj_ger_miss_01_ft_05_hl: "Continue avançando torre adentro" #Advance deeper into the flak tower",
obj_ger_miss_01_ft_014_desc: "O Esquadrão Sabre está a caminho. Defenda a área e sobreviva!" #The Sabre Squadron are en-route. Defend the area and stay alive!",
obj_ger_miss_01_flak_op_call_mrs_white_desc: "Você precisa sir da torre antes que os bombardeiros cheguem. A Sra. White tem um plano. Use o rádio para se comunicar com ela." #You need to get off the flakturm before the bombers arrive. Mrs. White has a plan. Use the radio to call her.",
obj_ger_miss_01_ft_020_stealth_desc: "As armas antiaéreas são o alvo. Plante dinamite nelas." #The AA guns are your target. Plant dynamite on each of them.",
obj_ger_miss_01_ft_012_hl_sub_02: "Aponte os holofotes para o Heimdall" #Point the searchlights towards the Heimdall radar",
obj_ger_miss_01_ft_04b_desc: "Está tudo pronto! Mate os nazistas e espere pela explosão." #The fuse is set! Hold the Germans off and wait for the blast.",
obj_ger_miss_01_ft_013_hl_sub_02: "Acenda um sinalizador" #Light a signal flare",
obj_ger_miss_01_ft_020_stealth_hl: "Plante dinamite nas armas antiaéreas" #Plant dynamite on the AA guns guns",
obj_ger_miss_01_ft_09_e3_desc: "Pegue o cabo e puxe-o até a caixa de energia." #Grab the cable, drag it towards electricity box.",
obj_ger_miss_01_ft_011c_desc: "Os projéteis antiaéreos estão no topo. Vá para lá!" #The AA shells are at the roof. Get up there!",
obj_ger_miss_01_ft_05_desc: "Avance o máximo que puder até a torre." #Fight your way deeper into the flakturm.",
obj_ger_miss_01_ft_00_desc: "Sua primeira tarefa é encontrar um jeito de passar pela muralha de fora." #Your first task is finding a way past the outer perimeter wall. Look around for a way in.",
obj_ger_miss_01_flak_op_call_elevator_desc: "O elevador está no topo da torre flak. Puxe a alavanca para ele descer." #The elevator is at the top of the flakturm. Pull the control lever to call it down.",
obj_ger_miss_01_flak_op_fix_power_desc: "A energia do elevador foi cortada. Religue a energia do elevador." #The power has been cut to the elevator. Fix the power supply to the elevator.",
obj_ger_miss_01_flak_op_fix_power_hl: "Religue a energia" #Fix the power",
obj_ger_miss_01_flak_op_vehicle_door_desc: "As portas parecem estar emperradas. Não temos tempo, entre no veículo e atropele as portas." #The door appears to be stuck. No time to finesse it, so get in the truck and smash through the doors.",
obj_ger_miss_01_ft_012_solo_desc: "As armas antiaéreas estão no topo. Destrua-as uma plantando dinamite nelas." #The AA guns are placed around the roof. Destroy each by planting dynamite on them.",
obj_ger_miss_01_ft_013_e3_desc: "A plataforma de observação é um local decente. Acenda um sinalizador para marcar o local." #The Observation Deck is a suitable high point. Place a flare to signal position.",
obj_ger_miss_01_ft_017_solo_desc: "A dinamite está pronta para explodir! Saia da torre flak." #The dynamite is ready to blow! Make your way back down the flakturm.",
obj_ger_miss_01_ft_014_hl: "Defenda a área até o Esquadrão Sabre chegar" #Defend the area until Sabre Squadron squadon arrive",
obj_ger_miss_01_flak_op_jump_hl: "Pule!" #Jump!",
obj_ger_miss_01_flak_op_open_door_hl: "Abra a porta" #Open the door",
obj_ger_miss_01_flak_op_get_parachute_desc: "A entrega aérea com os paraquedas chegou. Pegue um e prepare-se para fugir da torre flak." #The airdrop pod has arrived with your parachutes. Take one and prepare to escape the flakturm.",
obj_ger_miss_01_flak_op_find_shells_desc: "Há projéteis antiaéreos pelo local. Encontre e leve-os até o elevador." #There are AA shells around. Find them and take them to the elevator.",
obj_ger_miss_01_flak_op_send_elevator_hl: "Mande o elevador subir" #Send elevator to top",
obj_ger_miss_01_flak_op_shells_elevator_hl: "Coloque os projéteis no elevador" #Put the shells on the elevator",
obj_ger_miss_01_flak_op_vehicle_door_hl: "Use o veículo para quebrar a porta" #Use vehicle to break the door",
obj_ger_miss_01_flak_op_locate_elevator_desc: "Há um elevador que vai até o topo da torre. Encontre-o." #There is an elevator that goes all the way to the top of the flakturm. Find it.",
obj_ger_miss_01_flak_op_get_to_top_desc: "O elevador com os projéteis chegou ao topo da torre." #The elevator with the AA shells has arrived at the top of the flakturm.",
obj_ger_miss_01_ft_013_desc: "Contate a Sra. White para pedir os paraquedas. Acenda um sinalizador para marcar o local." #Contact Mrs. White and to have parachutes delivered. Place a flare to signal the airdrop position.",
obj_ger_miss_01_ft_016_desc: "O Esquadrão Sabre está bombardeando o local! Saia de perto da torre flak!" #Sabre Squadron are dropping bombs! Get away from the flakturm!",
obj_ger_miss_01_flak_op_wait_elevator_desc: "O elevador está em movimento, mas ele é lento." #The elevator is on its way but it moves slowly.",
obj_ger_miss_01_ft_011_hl: "Espere o elevador chegar até o topo" #Wait for the elevator to reach the roof",
obj_ger_miss_01_ft_018_hl: "Fuja" #Escape",
obj_ger_miss_01_ft_019_stealth_hl: "Abra a porta principal" #Lockpick the main door",
obj_ger_miss_01_flak_op_shells_aa_hl: "Exploda as armas antiaéreas com os projéteis" #Blow up AA guns with shells",
obj_ger_miss_01_ft_09_e3_hl: "Reconecte o cabo de energia do elevador" #Reconnect the elevator power cable",
obj_ger_miss_01_ft_09_desc: "Procure projéteis antiaéreos. Eles estão guardados no interior. Leve-os até o elevador." #Search for AA shells. They will be stashed around the interior. Transfer those shells to the elevator.",
obj_ger_miss_01_flak_op_get_to_top_hl: "Vá para o topo do elevador" #Get to the top of the elevator",
obj_ger_miss_01_ft_013_e3_hl: "Vá para a plataforma de observação e acenda um sinalizador" #Get to the Observation Deck and light a signal flare",
obj_ger_miss_01_ft_012_hl: "Vire os holofotes para a antena Heimdall e destrua as armas antiaéreas." #Aim the search lights at the Heimdall radar dish and take out the AA guns.",
obj_ger_miss_01_flak_op_turn_searchlights_desc: "Vire os holofotes para o Heimdall para que os bombardeiros consigam vê-lo." #Help the bombers spot Heimdall by turning the searchlights onto it.",
obj_ger_miss_01_ft_015_desc: "Os paraquedas estão na plataforma de observação. Pegue um e pule!" #The parachutes are on the Observation Deck. Grab one and jump!",
obj_ger_miss_01_flak_op_turn_searchlights_hl: "Vire os holofotes para o Heimdall" #Turn the searchlights towards Heimdall",
obj_ger_miss_01_flak_op_shells_elevator_desc: "Pegue os projéteis antiaéreos e coloque-os no elevador" #Take the AA shells and place them into the elevator",
obj_ger_miss_01_ft_00_hl: "Explore a área" #Scout the area",
obj_ger_miss_01_flak_op_find_shells_hl: "Encontre projéteis antiaéreos" #Find AA shells",
obj_ger_miss_01_flak_op_get_parachute_hl: "Pegue um paraquedas" #Collect a parachute",
obj_ger_miss_01_flak_op_wait_for_plane_hl: "Espere pela entrega aérea" #Wait for an airdrop pod",
obj_ger_miss_01_ft_019_stealth_desc: "A torre flak possui uma porta. Para continuar furtivo, tente abri-la." #The flakturm has a large entrance. To maintain stealth, attempt to lockpick it.",
obj_ger_miss_01_ft_09_hl: "Encontre projéteis antiaéreos e coloque-os no elevador" #Find AA shells and put them on the elevator",
obj_ger_miss_01_ft_016_hl: "Saia de perto da torre flak" #Get away from the flakturm",
obj_ger_miss_01_flak_op_shells_aa_desc: "As armas antiaéreas protegem a torre flak. Coloque os projéteis nas armas antiaéreas e atire neles para explodirem." #The AA guns are protecting the flakturm. Place the shells onto the AA guns and detonate them by shooting them.",
obj_ger_miss_01_ft_09a_hl_sub_02: "Encontre munição antiaérea e leve-os até o elevador." #Find AA shells and transfer them to the elevator.",
obj_ger_miss_01_ft_018_desc: "Saia da torre e fuja! Cuidado com as explosões!" #Make your way out of the area and escape! Watch the dynamite explode!",
obj_ger_miss_01_flak_op_open_door_desc: "Estamos na frente da torre, hora de abrir a porta e entrar..." #Here we are in the flak tower, time to open this door and get inside...",
obj_ger_miss_01_flak_op_call_elevator_hl: "Chame o elevador" #Call down the elevator",
obj_ger_miss_01_ft_021_stealth_desc: "A torre flak possui uma porta. Plante dinamite para explodi-la!" #The flakturm has a large entrance. Plant dynamite on it and blast your way in!",
obj_ger_miss_01_ft_04a_desc: "A porta é o único jeito de entrar na torre flak. Plante dinamite para explodi-la!" #The door is the way in to the flakturm. Plant the dynamite to blast it open!",
obj_ger_miss_01_ft_011_desc: "O elevador está levando os projéteis até o topo. Espere ele chegar lá." #The elevator is carrying the shells to the roof. Wait for it to reach the top.",
obj_ger_miss_01_ft_012_solo_hl: "Plante dinamite nas armas antiaéreas" #Plant dynamite on AA guns",
obj_ger_miss_01_flak_op_send_elevator_desc: "Há projéteis suficientes no elevador. Ative a alavanca para mandar o elevador subir até o topo da torre flak." #There are enough AA shells in the elevator. Press the control switch to send the elevator to the top of the flakturm.",
obj_ger_miss_01_flak_op_jump_desc: "Os bombardeiros chegaram. Só tem um jeito de sair da torre flak - pulando!" #The bombers are here. There's only one way to get off the flakturm - jump!",
obj_ger_miss_01_ft_04a_hl: "Plante dinamite na porta" #Plant dynamite on the door",
obj_ger_miss_01_ft_012_hl_sub_01: "Destrua as armas antiaéreas" #Destroy AA guns",
obj_ger_miss_01_flak_op_wait_for_plane_desc: "A Sra. White mandou o Esquadrão Sabre entregar os paraquedas. Sobreviva!" #Mrs. White has Sabre Squadron on their way with parachutes. Wait, and survive!",
obj_ger_miss_01_flak_op_locate_elevator_hl: "Encontre o elevador" #Locate the elevator",
obj_ger_miss_01_ft_013_hl_sub_01: "Use o rádio para chamar uma entrega aérea" #Use the radio to call for an airdrop",
obj_ger_miss_01_ft_012_desc: "Há armas antiaéreas e holofotes no topo. Destrua as armas e aponte os holofotes para o Heimdall." #The roof has AA guns and searchlights. Destroy the guns and point the searchlights at Heimdall.",
obj_ger_miss_01_flak_op_wait_elevator_hl: "Espere pelo elevador" #Wait for the elevator",
obj_ger_miss_01_flak_op_call_mrs_white_hl: "Use o rádio para chamar a Sra. White" #Use radio to call Mrs. White",
marian_flakturm_wu_man_1_desc: "Enquanto o gás está fluindo até o Odin, impeça qualquer um de parar o gás. Mantenha os inimigos longe das válvulas!" #While gas is being pumped into the Odin, prevent anyone from closing the gas off. Keep them away from the regulators!",
marian_flak_bunker_loud_desc: "Junte galões de combustível e coloque-os na frente da porta." #Gather fuel canisters and lay them out in front of the door.",
marian_flak_bunker_stealth_desc: "A porta pode ser aberta. Cuidado para não ser visto." #The bunker door can be lockpicked. Be careful to avoid detection.",
marian_flak_bunker_loud_p2_smoke_hl: "Atire nos galões" #Shoot the gas canisters",
marian_flakturm_gas_pressure_hl: "Ative o controlador principal" #Activate the main gas network controller",
marian_flak_bunker_loud_smoke_hl: "Coloque os galões no bunker" #Place gas canisters at the bunker",
marian_flakturm_wu_man_0_desc: "Os reguladores controlam o gás. Gire as válvulas para abri-los e aumentar o fluxo de gás." #The regulators control the flow of gas. Open them up by turning the valves and increase the flow of gas.",
marian_flak_bunker_loud_p2_hl: "Exploda a porta do bunker" #Blast the bunker door",
marian_flakturm_get_to_roof_hl: "Vá para o telhado" #Get to the roof",
marian_flak_bunker_opened_desc: "A porta do bunker está aberta! Encontre um caminho até o pátio da torre." #The bunker door is open! Head through it and find your way to the flakturm yard.",
marian_flakturm_gas_shoot_desc: "O controlador principal está com problemas." #The main gas network controller is malfunctioning. ",
marian_flakturm_plane_attack_hl: "Elimine os aviões" #Take down the planes",
marian_flakturm_gas_shoot_hl: "Atire no controlador principal" #Shoot the main gas network controller",
marian_flakturm_zeppelin_takedown_desc: "É hora de destruir o Odin e matar o Dr. Reinhardt! Use o canhão antiaéreo para destruir as partes marcadas do Odin." #It is time to destroy the Odin and kill Dr. Reinhardt! Use the AA flak cannon to shoot the marked areas of the Odin.",
marian_flak_bunker_loud_p2_smoke_desc: "Atire nos galões para acendê-los. A fumaça e as chamas forçarão os guardas a sair do bunker." #Ignite the gas canisters by shooting them. The smoke and flames will force the guards out of the bunker.",
marian_flakturm_way_down_hl: "Fuja!" #Escape!",
marian_flakturm_way_down_desc: "O lugar está desmoronando! Fuja enquanto há tempo!" #This place is collapsing! Make your way through the fire and escape while there's still time!",
marian_flakturm_wu_man_2_desc: "Este regulador terminou. Quebre a válvula para previnir que sabotem ele." #This regulator has finished. Break the valve to prevent further tampering.",
marian_flakturm_wu_wait_hl: "Espere o gás terminar de fluir." #Wait for the gas to finish flowing",
marian_flakturm_zeppelin_find_ammo_hl: "Encontre projéteis antiaéreos" #Find AA shells",
marian_flakturm_zeppelin_find_ammo_desc: "As armas antiaéreas estão vazias! Encontre munição e recarregue-as!" #The AA flak cannons are empty! Find shells and reload them!",
marian_flakturm_way_down_sub_hl: "Desligue o gás para abrir caminho!" #Cut the gas to clear a path out!",
marian_flakturm_way_down_sub_desc: "O fogo está bloqueando o caminho. Desligue as válvulas para abrir caminho antes que a torre exploda!" #Fire is blocking our way out. Turn off the gas pipe valves to clear a path before the flakturm explodes!.",
marian_flakturm_wu_man_0_hl: "Abra as válvulas" #Open the gas regulators",
marian_flak_bunker_stealth_hl: "Abra o bunker" #Lockpick the bunker",
marian_flakturm_way_down_regular_hl: "Fuja!" #Escape!",
marian_flakturm_gas_pressure_desc: "Ative o controlador principal. Isso deixará o gás fluir até o Odin." #Activate the main gas controller. This will cause the gas to flow into the Odin.",
marian_flak_bunker_opened_hl: "Prossiga até o pátio da torre" #Proceed to the flakturm yard",
marian_flak_bunker_find_desc: "Encontre um bunker com uma porta externa. É a única maneira de entrar." #Look for a bunker with an external door. Find it. That will provide the way inside.",
marian_flakturm_wu_wait_desc: "O gás está fluindo até o Odin. Espere o processo terminar." #The gas is flowing through the regulators to the Odin. Wait for it to complete.",
marian_flakturm_get_to_roof_desc: "O Odin deve estar cheio de gás agora. É hora de explodi-lo. Vá para o telhado." #The Odin should be full of explosive gas now. It's time to blow it up. Get to the roof.",
marian_flakturm_flaktop_desc: "Os canos estão cheios de gás pressurizado altamente volátil. Plante dinamite nos canos." #The gas pipes are full of highly-volatile, pressurized gas. Plant dynamite on the pipes.",
marian_flakturm_plane_attack_desc: "Aviões estão tentanto matá-lo! Você não coneguirá sair da torre flak antes de eliminá-los!" #Planes are trying to take you out! you wont be able to make it out the flakturm without taking them out!",
marian_flakturm_wu_man_1_hl: "Defenda a válvula" #Defend the gas regulator",
marian_flakturm_way_down_regular_desc: "O lugar vai explodir! Vá para a saída e fuja enquanto há tempo!" #This place is going to blow! Make your way to the exit and escape while there's still time!",
marian_flak_bunker_find_hl: "Encontre um bunker que seja possível abrir" #Find a breachable bunker",
marian_flak_bunker_loud_smoke_desc: "Asfixie os nazistas no bunker. Pegue galões de combustível e coloque-os na janela." #Smoke the Nazis out of their bunker. Gather fuel canisters and lay them out at the window.",
marian_flak_bunker_loud_p2_desc: "Atire nos galões para acendê-los. A explosão destruirá a porta para nos deixar entrar." #Shoot the canisters to light them up. The explosion will destroy the door giving us a way in.",
marian_flakturm_wu_saboted_hl: "Reabra a válvula" #Re-open the gas regulator",
marian_flak_bunker_loud_hl: "Posicione os galões de combustível" #Lay out gas canisters",
marian_flakturm_flaktop_hl: "Plante dinamite nos canos de gás" #Plant dynamite on the gas pipes",
marian_flakturm_wu_saboted_desc: "O regulador foi desligado. Ligue-o novamente!" #The gas regulator has been turned off. Turn it back on!",
marian_flakturm_wu_man_2_hl: "Quebre a válvula" #Break the gas regulator valve",
marian_flakturm_zeppelin_takedown_hl: "Destrua o Odin com tiros antiaéreos" #Destroy the Odin with AA fire",