# Nomes e descrições (Wiretap)
menu_afr_miss_04_hl: "Wiretap" #Wiretap",
menu_afr_miss_04_desc: |
 Franz Lange é o melhor decodificador da Resistência. Última noite, ele foi preso e está sendo feito de refém em um acampamento de rádio fora do Kassel. Lange recuperou informações que são vitais para a Sra. White. Resgatem ele com as suas informações.$NL;
 - Encontre o Lange
 - Adquire as informações
 - Escolte Lange
 - Fuja
#Franz Lange is the Resistances’ top code-breaker. Last night, he was arrested and is currently being held at a radio camp outside Kassel. Lange has recovered intel that is vital to Mrs. White. Rescue him and get him out with his intel.
#$NL;- Find Lange
#- Acquire the intel
#- Ensure Lange survives
#- Escape",
menu_afr_miss_04_loading_desc: "Resgatem Lange e o escoltem com as informações para a Sra. White." #Rescue Lange, and ensure you bring the intel to Mrs. White.",
radio_base_mission_photo_1_title: "O sinal Corpo do acampamento" #The Signal Corps Camp",
radio_base_mission_photo_5_description: "Se Franz não conseguir, vocês devem gravar os sinais enviados pelos nazistas manualmente. Pode demorar, mas podemos decodificar as mensagens." #Should Franz become indisposed, you must manually record the signals being sent by the Nazis. It may take longer, but we can decode these messages.",
radio_base_mission_photo_2_description: "Vocês devem resgatar Franz Lange, um gênio das comunicações, e um dos meus melhores agentes. É difícil de pôr em palavras o valor das suas habilidades, então o escoltem." #You are to rescue Franz Lange - a communications genius, and one of my top agents. It’s hard to overestimate the value of his expertise, so see that he’s kept safe.",
radio_base_mission_photo_3_title: "Barricadas locais" #Local Barricades",
radio_base_mission_photo_1_description: "A torre de rádio fica dentro do acampamento do Sinal do Corpo Wehrmacht. Ela é bem vital para os nazistas. Assim que a gente tiver o quê queremos, podem destruí-la." #The radio tower sits within a camp of the Wehrmacht Signal Corps. It’s quite vital to the Nazis. Once we have what we need, feel free to destroy it.",
radio_base_mission_photo_5_title: "Dispositivos de Gravações" #Recording Devices",
radio_base_mission_photo_4_description: "A torre do rádio pode enviar e receber comunicações de alto nível. Assim que ele estiver livre, Franz Lange deve conseguir usá-lo." #The Radio Mast can send and receive high-level communiques. Once he is free, Franz Lange should be able to use it.",
radio_base_mission_photo_3_description: "A área em volta tem várias barricadas. Usem para sua vantagem." #The surrounding area has a number of strong barricades. Be sure to use these to your advantage.",
radio_base_mission_photo_2_title: "Franz Lange" #Franz Lange",
radio_base_mission_photo_4_title: "A torre do rádio" #The Radio Mast",
menu_ger_oper_01_event_4_loading_text: "Vão para o acampamento do rádio e usem-o para transmitirem os sinais para Londres." #Head to the Radio Camp and use it’s powerful mast to transmit the deciphered signals to London.",

# Nomes e descrições (London Calling - Clear Skies Parte 4)
menu_ger_oper_01_event_4_progress_text: |
 Com a máquina, códigos e cifras em mãos, vocês podem transmitir o sinal para os decifradores da Sra. White em Londres e finalmente podem desenterrar o segredo do projeto Heimdall. Vão para o acampamento do rádio e começam a transmissão.$NL;
 - Vá para a torre do rádio.
 - Prepare o equipamento de transmissão
 - Espere pela transmissão terminar
 - Fuja
#With the machine, codes and ciphers in your possession, you can know transmit the signal to Mrs. White’s codebreakers in London, and finally learn the secret of Project Heimdall. Head to the Radio Camp and begin the transmission.$NL;$NL;- Get to the radio tower$NL;- Set up the transmitting device$NL;- Wait for the transmission to complete$NL;- Escape",
menu_ger_oper_01_event_4_progress_title: "London Calling" #London Calling",
clear_skies_mission_photo_5_title: "A torre do rádio" #The Radio Tower",
clear_skies_mission_photo_5_description: "Com o dispositivo Enigma, os sinais interceptados vão ser decifrados na hora. Por isso, é importante que protegem os dispositivos, ou algo pior pode acontecer." #With the Enigma device in your possession, the intercepted signals will be decrypted on-site. As a result, it’s vital our devices are not tampered with, or worse.",
clear_skies_mission_photo_6_description: "O gerador é a fonte de energia local, vocês terão que manter o gerador rodando e ficar de olho na gasolina, para manter os dispositivos funcionando." #The generator is the local powersource, you’ll have to keep the generator fuelled and running if we are to keep our devices operational.",
clear_skies_mission_photo_6_title: "O gerador" #The Generator",

# Legendas
radiobase_find_flare_position2_russ: "Plioto vai ver fumaça, e soltar pacote." #Pilot will see smoke, and drop package.",
radio_op_get_to_tower_germ: "Então, vamos logo." #Then we should get moving.",
radiobase_area_cleared1_russ: "Ah, estão mortos já?" #Awww, all dead already?",
radiobase_inside_yard4_amer: "Tá vindo daquela barraca, tem que ser o Lange." #Came from that tent. Gotta be Lange.",
radiobase_post_spawn3_brit: "Seja lá o quê for o nosso plano, devemos ser limpos. Resgatamos o Lange, usamos aquela torre feia para descobrir o quê os alemães estão tramando, depois trazer todo mundo são e salvo. Devemos?" #However we proceed, let's be clear. We rescue Lange, use that ruddy tower to find out what jerry's planning, then bring everyone home safe and sound. Shall we?",
radiobase_defend_technician_amer: "*murmúrio* Jesus Cristo, Franz. *barulhento* Beleza, pessoal. Não deixem que esses nazistas chegam perto!" #*muttering* Jesus Christ, Franz. *loudly* Okay guys. Let's keep the Nazis off him!",
radiobase_tank_destroy_gate1_brit: "Minha nossa senhora! Eles explodiram o portão!" #Bloody Nora! They blew up the gate! ",
radio_op_send_new_mess_complete_germ: "Está na hora de enviar uma nova mensagem." #It is time to dispatch a new message.",
radio_op_escape_active_rem_amer: "Falei grego? Entra, agora mesmo!" #Did I stutter? Get in, right now!",
radiobase_franz_climb_down2_brit: "Não para de atirar! Protege Herr Lange! Quase lá, seus idiotas!" #Keep shooting! Protect Herr Lange! Almost done, you chaps!",
radio_op_call_airdrop_dyna2_amer: "Liga a ligação, deixa o comando saberem o quê a gente precisa, e não enrola!" #Put the call in. Let command now what we need, and fast!",
radiobase_call_mrs_white_rec1_russ: "Saudações. Estão me ouvindo?" #Greetings. You are hearing me? ",
radiobase_toolbox_close4_brit: "Isso seria as ferramentas do Lange?" #Are those Lange's tools?",
radio_op_prepare_trans1_brit: "Precisamos preparar o equipamento próximo na base da torre." #We need to set the equipment up near the base of the tower.",
radiobase_technician_died3_brit: "Sra. White vai ficar doida com a gente. Esperamos que isso não foi em vão." #Mrs. White is going to bollock us. Lets make sure he didn't die in vain.",
radiobase_prepare_for_attack2_brit: "Nós precisamos que o Lange tenha tempo. Bloqueia aquelas portas!" #We need to buy Lange some time. Barricade those doors!",
radio_op_repair_fuse_box_complete2_amer: "Não deixe ninguém chegar perto disso, huh?" #Keep 'em off it from now, huh?",
radio_op_repair_fuse_box_brit: "Mas que... aqueles canalhas mexeram nos fios!" #What the - those rotters pulled the fuses! ",
radio_op_escape_amer: "Beleza, temos uma saída." #All right, we have an exit.",
radiobase_defend_the_radiodev_germ: "Os inimigos vão tentar nos parar de gravar à qualquer custo. Protegem o dispositivo!" #The enemy will try to stop the recording by any means. Protect the device!",
radiobase_area_cleared1_amer: "Já se foram os guardas." #That's it for the guards. ",
radio_op_find_dynamite2_russ: "Viram? Na ponte, barras na parede? Desse jeito." #See, by bridge - bars in wall? That way.",
radiobase_inside_yard2_brit: "Vindo da barraca. Deve ser o Lange." #From the tent. Must be Lange.",
radiobase_tank_destroys_gate_brit: "Parece que o portão lá fora se foi. O tanque está chegando, pessoal!" #That sounded like the outer gate going. Tank is on its way, chaps!",
radiobase_tech_tank_enters_park: "O tanque! Está no parque!" #The Tiger! It's in the park!",
radiobase_slow_tank1_germ: "Oh, nein. Um tanque?" #Oh nein. A tank?",
radiobase_defend_device_complete_amer: "Acho que isso foi tudo que este canal teve para oferecer. Temos que mudar a frequência." #I think that's everything this channel's got to offer. We gotta change the frequency.",
radiobase_technician_alert_south: "Eles estão vindo do sul!" #They are coming from the South!",
radiobase_escape_via_tower_germ: "Nosso plano funcionou, cavalheiros! Nós temos que passar pela muralha!" #Our plan worked, gentlemen! We have a way to get over the wall!",
radiobase_tank_entering_russ: "Aquele tanque está aqui! Está aqui!" #That tank is here! It's here!",
radiobase_tank_arc_destroyed_brit: "Tanque está dando uma volta pelo arco. Isso vai deixá-lo devagar." #Tanks moving around the arch. That'll slow it.",
radiobase_got_the_radiodev2_russ: "O dispositivo de gravação tem que ser conectado, sim?" #Recording device must be hooked up now, yes?",
radiobase_plane_arrived1_germ: "Aha! O avião chegou, meine Freunde!" #Aha! The plane has arrived, meine Freunde!",
radiobase_inside_yard2_germ: "Aquela barraca. Tem que ser o Lange." #That tent. Got to be Lange.",
radio_op_place_dynamite_germ: "Barras? Dá um 'oi' para as dinamites. Dinamites? Dá um 'oi' para as barras." #Bars? Meet dynamite. Dynamite? Say hello to bars.",
radio_op_place_dynamite_complete_germ: "Dinamite colocada. Não fiquem perto!" #Dynamite set. Do not stand close!",
radio_op_call_airdrop_dyna1_brit: "Agora, pessoal, diria que o nosso único jeito de cairmos o fora seria com ajuda de alguma dinamite." #Now then, chaps - I'd say our only way out of here is with the help of some dynamite.",
radiobase_tech_needs_tools: "Eles confiscaram as minhas ferramentas. Por favor, procurem elas para mim." #They confiscated my wire-tapping equipment. Please, find it.",
radio_op_escape2_brit: "Por aqui, rápido!" #Get through there, hurry!",
radiobase_tech_needs_tools_rem: "Já acharam as minhas ferramentas?" #Have you found my equipment yet?",
radio_op_get_to_tower_russ: "Da, precisamos estar ali. Anda, agora." #Da, need to be there. Move, now.",
radiobase_change_channel2_germ: "Haverá outro canal transmitindo. Temos que achar." #There will be another channel broadcasting. We must find it.",
radiobase_2nd_barricade_defend2_amer: "Pode apostar! A gente ainda tá de pé!" #You bet! Don't count us out yet!",
radio_op_start_trans_amer: "Beleza, estamos prontos. Alguém manda o primeiro sinal!" #All right, we're set. Someone send the first signal!",
radio_op_codebook_placed_germ: "Boa, o livro de código está no lugar." #Good. the codebook is in position.",
radiobase_call_mrs_white_rec1_germ: "Alô? Conseguem me ouvir?" #Hello? Can you hear me? ",
radiobase_slow_tank1_brit: "Um tanque!?" #A tank!?",
radio_op_repair_fuse_box_amer: "Ei, espere, eles puxaram o fio!" #Hey wait - they pulled the fuses! ",
radiobase_place_flare_complete_amer: "Botei a sinalizadora. O avião vai achar a gente, mas botamos um alvo nas nossas costas aqui. Fiquem atentos!" #Flare's out. The plane can find us, but we just told every asshole out here how to find us. Lock and load!",
radiobase_find_flare_position2_brit: "Aquilo vai chamar muita atenção para nós." #That'll let them know where we are.",
radiobase_slow_tank1_russ: "Ele disse tanque?" #Did he say a tank?",
radiobase_device_destroyed4_brit: "Acendem a sinalizadora e fiquem atentos até chegar o pacote." #Light the flare and hold your position until the next air drop.",
radiobase_2nd_barricade_defend1_russ: "Ainda tem uma barricada." #Still one barricade.",
radiobase_tech_10th_message: "Ora, ora, ora..." #Well, well, well...",
radiobase_free_franz3_germ: "Agora, localizem o Lange." #Now, to locate Lange.",
radiobase_gate_closed2_brit: "Vamos encontrar um jeito de entrar." #Lets find another way in",
radiobase_deliver_tools1_brit: "Entreguem as ferramentas do Lange! Rápido!" #Give Lange his tools! Hurry!",
radio_op_pick_up_dyna_complete1_brit: "Aqui estamos!" #Here we are! I have the dynamite.",
radio_op_refuel_generator_brit: "Parece que o gerador está ficando sem combustível." #Sounds like the generator is running out of petrol. ",
radio_op_wait_for_truck1_germ: "Droga! Frau White disse que haveria uma caminhonete esperando por nós. Onde que tá?" #Blast! Frau White said there would be truck waiting for us. Where is it?",
radio_op_drop_flare_brit: "Sabre está a caminho, pessoal. Soltem um sinalizadora para guiar eles." #Sabre's are en route, chaps. Drop a flare so they know where to strike.",
radio_op_activate_power_gen_complete_russ: "A energia está ligada!" #Power is running!",
radio_op_radio_call_white5_amer: "Ah, ha! Eu poderia te beijar! Broadsword, câmbio e desligo." #Oh-ho! I could kiss ya! Broadsword, over and out.",
radio_op_drop_flare_complete_brit: "Coloquei a sinalizadora! Fiquem longe!" #That's the flare placed! Get well away from it!",
radio_op_start_trans_russ: "Enviem o sinal! Não enrolem, da?" #Send signal! Doublequick, da?",
radio_op_escape_germ: "Glória, pagamento e um belo vinho me esperam." #Glory, payment and fine wine await. ",
radiobase_technician_free9: "Merda! Nós vamos fazer isso, ja? Vocês estão prontos para uma luta?" #Gut! We do this, ja? You will be ready for the fight?",
radiobase_post_spawn3_amer: "Enfim, temos que resgatar o Lange, usamos a torre para espiar o inimigo, aí levamos o Lange E as informações para casa. Vamos nessa." #Either way, we gotta get to Lange, use the tower to listen in on the enemy, then bring Lange AND the intel home. Let's do it.",
radiobase_call_mrs_white_rec1_brit: "Alô, estão me ouvindo?" #Hello, are you receiving? ",
radiobase_place_flare_complete_russ: "A sinalizadora está acesa. O avião e os facistas vão saber onde estamos. Fiquem prontos para uma luta." #The flare burns. Both plane and fascists will know our location. Be ready for fight.",
radiobase_clear_area_rem8_brit: "Vamos livrar desse lote horrível e falamos depois, podemos?" #Let's just get rid of this horrible lot and talk later, shall we?",
radiobase_lou_technician_free4_brit: "Ficaríamos bem agradecidos se vocês nos guiassem em pegar as informações que você começou a ouvir?" #We'd be much obliged if you'd tell us how we can get the rest of the intel you'd started listening to?",
radio_op_refuel_generator_germ: "O gerador está ficando sem combustível!" #The generator is getting thirsty! ",
radio_op_start_trans_germ: "Temos tudo que precisamos. Hora de enviar a transmissão." #We have all we need. Time to send the transmission.",
radiobase_message_sent1_germ: "Lange? Já terminou o quê tinha que fazer?" #Lange? Have you completed your task?",
radiobase_tech_germans_climbing: "Mein gott! Eles estão subindo a torre! Socorro!" #Mein gott! They are climbing the tower! Help me!",
radiobase_barricade_down1_amer: "Que merda, eles derrubaram a barricada!" #Dammit, they got to the barricade!",
radio_op_escape_active_rem_brit: "Hora de irmos! Entrem, agora!" #Time to go! Get in, now!",
radiobase_franz_climb_down1: "Essa foi a última! Estou descendo! Me deem cobertura!" #That is the last one! I'm coming down! Protect me!",
radiobase_tank_destroys_main1_amer: "Aquele tanque explodiu a porra do portão!" #That tank blew the fucking gate!",
radiobase_find_flare_position1_amer: "Pessoal! Temos que achar um espaço livre para o pacote e soltar uma sinalizadora, não enrolem!" #Guys! We gotta find a space clear enough for the airdrop and bust out a flare, pronto!",
radiobase_technician_free_ex1_brit: "Desembuche, como podemos pegar o resto das informações que você começou a ouvir?" #Tell us - how we can get the rest of the intel you'd started listening to?",
radiobase_tech_half_up: "No outro dia, talvez eu possa aproveitar essa vista." #On another day I might enjoy such a view.",
radiobase_appro_gate1_amer: "Viram aquele portão? Parece que o acampamento está no outro lado." #See that gate? Looks like their camp's on the other side.",
radiobase_device_destroyed3_russ: "Então use outra sinalizadora, da?" #So use another flare, da?",
radio_op_radio_call_white3_brit: "Nós temos o que queremos, ficaria agradecido de receber uma mão para livrar dessa merda! Câmbio!" #We've got what we came for, and would appreciate a hand getting out of this bloody hellhole! Over!",
radiobase_escape_russ: "Ah ha! Uma rota de fuga perfeita! Vamos!" #Aha! Perfect escape route! Let's go!",
radiobase_tools_picked2_amer: "Boa! Deem pro Lange." #Great! Go give 'em to Lange.",
radio_op_spawn_brit: "Ali está a torre." #There's the tower.",
radio_op_place_dynamite_amer: "Você consegue ver as barras ali? Precisamos de dinamite nelas!" #You see the bars over there? Need the dynamite on them!",
radiobase_cut_cables2_amer: "Aquela torre está de pé por causa desses cabos. Nós cortamos e aí..." #That mast is kept standing by those cables. We cut the cables, and...",
radiobase_pick_up_device_amer: "Terminamos, pessoal. Vamos levar o dispositivo de gravação de volta para a torre do rádio, conecta e vamos terminar o quê Lange começou. Bora!" #This is it, guys. We take this recording device back to the radio tower, hook it up and get the rest of the intel that Lange died for. C'mon!",
radio_op_activate_power_gen_complete_germ: "E então houve luz!" #And then there was power!",
radio_op_keep_trans_running_brit: "Escutem, pessoal. Precisamos manter tudo funcionando. Defendem a caixa de fusível, e não deixem ninguém tocar naquele gerador!" #Listen chaps. We need to keep everything running smoothly. Defend the fuse box, and keep that generator ticking over!",
radiobase_free_franz3_russ: "Vamos achar esse Lange." #Let's find this Lange.",
radiobase_call_mrs_white_rec1_1_germ: "Nós precisamos de um dispositivo de gravação." #We require a recording device urgently. ",
radiobase_find_flare_position2_germ: "De fato. O piloto vai achar a gente em breve." #Indeed. The pilot will soon know where we are.",
radiobase_tools_picked2_germ: "Entreguem pro Lange, rápido." #Take them to Lange, quickly.",
radio_op_send_new_mess_germ: "Frau White requer uma performance repetida." #Frau White requires a repeat performance. ",
radiobase_tech_at_top: "Apesar de tudo, essa vista é linda. Espero que não seja a minha última." #Despite it all, this view is quite magnificent. I hope it is not my last.",
radiobase_device_destroyed4_germ: "Nós precisamos acender uma sinalizadora e esperar a próxima carga. Também vai vim uma onda de inimigos!" #We must light a flare and wait for the next air drop. Expect another wave to find us!",
radio_op_escape_active_amer: "Fiquem atentos! Entrem, agora!" #Look alive! Jump in, now!",
radiobase_tools_picked_up1_amer: "Peguei as coisas dele!" #I got his things!",
radiobase_new_plan1_germ: "Sem essas informações, Frau White vai ficar bem furiosa. Nós temos que concluir o que Lange começou!" #Without that intel, Frau White would be most displeased. We have to complete what Lange started!",
radiobase_tools_picked2_russ: "São do Lange." #They are for Lange. ",
radio_op_send_new_mess2_amer: "Volta pro rádio!" #Get back on the radio!",
radiobase_defend_device1_russ: "Haha! Olha como esses fascistas tentam parar a máquina! Nós paramos os fascistas!" #Haha! Look how fascists try to stop machine! We stop fascists!",
radiobase_tech_gets_tools: "Obrigado, cavalheiros. Agora o quê eu preciso é bisbilhotar nessas comunicações e tentar achar a localização dessa arma para a Sra. White." #Thank you, gentlemen. Now I have what I need, I shall tap these wires and try to find the location of this weapon for Mrs. White.",
radio_op_radio_call_white3_germ: "Querida senhorita, temos as gravações. Ficaria agradecido com um plano de fuga, câmbio." #Dear lady, we have the recordings. Would appreciate assistance in leaving. Over. ",
radio_op_keep_trans_running_complete_germ: "Bom trabalho. A transmissão está feita. Agora celebramos." #Good work. The transmission is complete. Now we celebrate.",
radiobase_recover_codebooks_amer: "Franz tem que ter o caderno com ele. Recuperem!" #Franz's gotta have the notebook on him. Grab them!",
radio_op_find_dynamite_complete_germ: "Ah! Aí está você. Agora, dinamite, gostaria que conhecessem alguns amigos meus." #Ah! There you are. Now, dynamite, I would like you to meet some friends of mine.",
radiobase_pick_up_device_complete_amer: "Consegui! Bora, temos que voltar para a torre!" #I got it! C'mon, we gotta haul ass back to the tower!",
radiobase_new_plan2_amer: "Ei, eu sei. Tinha um rádio com o Lange. Nós podemos botar um gravador bisbilhotando, né?" #Hey, I know. There was a radio with Lange. We can get a recording machine airdropped in, right?",
radio_op_call_airdrop_dyna_complete_amer: "Tá, temos uma carga de dinamite a caminho." #Alright - we got an airdrop of dynamite on the way.",
radio_op_keep_trans_running_russ: "Não deixem o tanque ficar sem combustível, não deixem eles chegarem perto dos fios, da?" #Keep fuel in tank, stop them getting to fuse box, da?",
radiobase_device_destroyed1_brit: "Estourem tudo! Eles destruiram o gravador!" #Blast it all! They've destroyed the recorder!",
radiobase_change_channel2_brit: "Achem a próxima frequência que está transmitindo. Estamos quase lá, pessoal, bora terminar isso!" #Find the next frequency that's broadcasting. We're nearly there, lads - let's get this finished!",
radio_op_sabre_missed1_russ: "O bombardeiro estava nervoso? Ele errou o alvo!" #Bomber is nervous? He missed target!",
radiobase_protect_barricade3_germ: "Então sugiro que paramos eles quando chegarem perto!" #Then I suggest we stop them once they draw near!",
radio_op_find_dynamite_rem2_brit: "Têm que estar por aqui!" #Got to be some around here!",
radio_op_pick_up_dyna_complete1_amer: "Aí está, pegamos os dinamites." #There we go, got the dynamite.",
radiobase_wait_for_plane1_germ: "Isso está se tornando uma batalha. O avião já está vindo?" #This is fast becoming a battle. Is the plane on its way?",
radio_op_get_to_tower_complete_amer: "Tá bom, estamos aqui. Agora o quê?" #All right, we're here. What next?",
radiobase_call_mrs_white_rec1_1_russ: "Precisamos de um gravador. Você vai mandar um avião. Entendeu?" #We need recording device. You will send plane. You understand?",
radio_op_drop_flare_amer: "Temos um bombardeiro chegando. Vai estar procurando por um sinalizador, então bora não ficar enrolando." #Got a bomber incoming. Gonna be looking for a flare, so let's not keep 'em waiting.",
radiobase_retreat_germ: "Voltem para a torre. Fiquem atentos!" #Fall back to the tower. Keep order!",
radiobase_technician_died3_amer: "Sra. White vai matar a gente. Pelo menos podemos levar o seu caderno." #Mrs. White is going to kill us. Least we can do is get his notebook out.",
radiobase_call_mrs_white_rec1_amer: "Essa coisa está ligada?" #Is this thing on? ",
radio_op_find_dynamite2_brit: "Tem um canal de água ali, viram? Coberto pelas barras de aço? É a nossa fuga." #There's a water channel over there, you see? Covered by steel bars? That's our way out.",
radio_op_open_pod_germ: "Bora, temos que pegar a carga. Vai estar junto com uma fumaça verde." #Quickly - we must get to the airdrop. The green smoke, that's where it is.",
radiobase_technician_died2_amer: "Jesus, ele morreu!" #Christ, he's dead!",
radiobase_tech_tied_rem2: "Oh, essas cordas estavam apertadas!" #Oh, these ropes hurt!",
radiobase_call_mrs_white_rec2_germ: "Nós vamos deixar a área limpa, sim, também vamos acender a sinalizadora, sim. Obrigado." #We will ensure the ground is clear, yes, and we shall place a flare, yes. Thank you.",
radio_op_escape_active_complete_russ: "Piloto. Por que demorar tanto? Você parar para matar inimigo também?" #Driver. What took so long? You stop to kill enemy, too?",
radiobase_new_plan1_russ: "Hm, se nós voltarmos sem as informações, a Sra. White não vai ficar feliz. Temos que terminar o serviço, ou vamos morrer." #Hm. Mrs. White would be unhappy, if we return without intel. We must finish, or we are finished.",
radiobase_device_destroyed2_amer: "Então, devemos chamar um extra." #So we gotta get a replacement dropped in.",
radiobase_inside_yard1_amer: "Ei, escutem!" #Hey, listen!",
radio_op_repair_fuse_box2_brit: "Venham para cá e consertem!" #Get over there and fix it!",
radiobase_lou_technician_free4_germ: "Poderia gentilmente explicar como podemos gravar o resto das informações que você prometeu para Frau White?" #Would you kindly explain how we are to acquire the rest of the intel you promised Frau White?",
radiobase_stop_barricade3_brit: "Só deixa aí. Fiquem de olho em qualquer sabotador!" #Just keep it there. Don't let their sappers clear it!",
radio_op_pick_up_dyna_complete2_russ: "E dinamite é bom para limpar caminho! Muito bom!" #And dynamite is good to make path! Very good.",
radiobase_device_destroyed1_germ: "Verdammt! Eles destruiram o dispositivo!" #Verdammt! They took out the device!",
radiobase_call_mrs_white_rec2_amer: "Hã? É, sim! Achem um lugar limpo, coloquem uma sinalizadora pro piloto. Entendido!" #Huh? Yeah, yeah! Find clear ground, place a flare for the pilot. Got it!",
radio_op_find_dynamite3_russ: "Então quebramos algumas barras. Explosivos, então!" #So we break some bars. Explosives needed!",
radiobase_got_the_radiodev2_brit: "Bora, conectem o gravador!" #Quickly now - hook up the recording device!",
radiobase_codebook_recovered1_amer: "Beleza! Peguei o caderno, pessoal!" #Sweet! I got the notebook, fellas!",
radio_op_white_req: "Sra. White chamando Broadsword. Preciso entender esta mensagem direito. Podem repetir ela para mim? Câmbio." #Mrs. White calling Broadsword. Need clarification on this. Can you read it back to me? Over.",
radio_op_wait_airdrop1_russ: "Haha! Matamos fascistas enquanto esperamos pela carga!" #Haha! Fascists keep us busy while we wait for airdrop!",
radiobase_technician_free5: "Oh, nein! Vejam a torre. Posso bisbilhotar as comunicações. Frau White está pagando muito, ja?!" #Oh, nein! See the tower. I can tap into communications. Frau White pays big, ja?!",
radio_op_radio_call_white5_brit: "Maravilha! Broadsword, câmbio, desligo." #Marvellous! Broadsword, over and out.",
radiobase_tech_climb_down_half: "Calma, Lange. Calma!" #Steady now, Lange. Steady!",
radiobase_change_channel1_amer: "Eles pararam a transmissão, não está gravando nada!" #They must'a stopped the broadcast -- we're not getting anything.",
radiobase_connect_device_complete_amer: "Conectei o gravador! É melhor funcionar!" #Got the device hooked up! This better work!",
radio_op_start_trans_complete_brit: "Ah! Belo show. Está transmitindo o sinal para a Sra. White." #Ah! Good show. It's transmitting the signal to Mrs. White.",
radiobase_technician_died1_germ: "Lange?! Scheisse..." #Lange?! Scheisse...",
radiobase_gate_closed2_amer: "Tem que ter outro jeito." #Gotta be another way in.",
radiobase_prepare_for_attack2_germ: "Nós temos que dar uma chance para o Lange! Fazem barricada nas portas!" #We must give Lange a fighting chance! Barricade the doors!",
radio_op_repair_fuse_box_russ: "Eles puxaram o cabo!" #They pulled out fuse! ",
radio_op_codebook_placed_russ: "Caderno está aqui." #Codebook is ready.",
radio_op_repair_fuse_box2_amer: "Vem aqui e consertem!" #Get over there and fix that!",
radiobase_wait_for_plane1_russ: "Que rota o avião está fazendo? Deixa para lá. Estou ocupado." #Is plane taking scenic route? No matter. I am busy here.",
radio_op_repair_fuse_box_complete_amer: "Tá bem, os fios estão consertado." #All right, fuse box is fixed. ",
radiobase_tech_starts_transmitting: "Ok, estou recebendo agora." #Okay, I am receiving messages right now.",
radiobase_tech_escape_hint: "Seria uma torre derrubada um jeito de escapar?" #Is that fallen tower a way out of here?",
radiobase_retreat_russ: "Defendem na torre do rádio!" #Assume new defence at the radio tower!",
radiobase_all_signals_rec_brit: "Trabalho bem feito, cavalheiros! Gravamos tudo. Melhor escaparmos daqui!" #Job well done, gents! We've got it recorded. Best we make our escape!",
radiobase_recording_is_done_germ: "Excelente trabalho, cavalheiros," #Excellent work gentlemen, we have everything now. We must retrieve the recording device.",
radiobase_device_destroyed3_amer: "Tá bom, então acendemos outra sinalizadora." #Alright -- so we light another flare.",
radiobase_protect_barricade3_russ: "Então, matamos antes deles chegarem perto, da? Fácil!" #So, kill them before they get there, da? Easy!",
radiobase_connect_device_complete_russ: "Gravador conectado." #Device is connected now. ",
radiobase_technician_died3_russ: "Oops, a Sra. White não vai ficar feliz. Podemos recuperar o caderno pelo menos." #Ooops. Mrs. White will not be happy. We can recover the notebook though.",
radio_op_start_trans_brit: "Pronto para fazer contato! Liguem o rádio." #Ready to make contact! Get on that radio.",
radio_op_spawn_amer: "Estamos aqui. Tá vendo a torre?" #We're here. Ya see the mast there? ",
radiobase_tak_shoots_at_gate_brit: "Merda! O tanque está no portão, não vai durar muito contra aquele canhão!" #Bugger! The tank's at the gate - it won't last long against that firepower!",
radiobase_searching_for_wire_tools2_amer: "Essas ferramentas devem estar por aqui. Procurem." #Those tools've gotta be round here someplace. Look around.",
radio_op_activate_power_gen3_russ: "Gerador vai estar perto. Nós achamos e usamos." #Generator will be close. We find it, we use it.",
radiobase_call_mrs_white_rec1_1_brit: "Nós estamos bem ferrados aqui, e sem tempo para explicar. Ficaríamos gratos se nos mandar um gravador, o mais rápido possível." #We're in quite the pickle, and no time to explain. We'd be much obliged if you could send us a recording device, quick as you can.",
radiobase_place_flare_complete_brit: "Sinalizador aceso. Agora o avião pode achar a gente, também os nazistas. Fiquem atentos!" #That's the flare lit. Now the plane can find us, but so can the Nazis. Get ready!",
radiobase_stop_barricade1_amer: "Olha, a barricada consegue segurar o tanque!" #Look, the barricade held the tank up!",
radio_op_radio_call_white3_amer: "Nós temos as gravações, mas eles estão mantendo a pressão na gente! Seria uma boa tirar a gente daqui! Câmbio!" #We got the recordings, but they're turning up the heat! Fancy getting us outta here? Over!",
radiobase_inside_yard2_russ: "A barraca. Deve ser o Lange." #The tent. Must be Lange.",
radio_op_prepare_trans1_germ: "Agora temos que preparar os dispositivos na base." #Now we set the devices at the base.",
radio_op_escape_active_complete_germ: "Haha! Bom trabalho, cavalheiros. Agora, meu amigo, posso pegar o volante?" #Hahaha! Good work gentlemen. Now, my friend, perhaps I should take the wheel?",
radiobase_tools_picked2_brit: "Belo show! Agora levem para o Lange!" #Good show! Now get them to Lange!",
radiobase_open_pod2_russ: "Eles mandaram o gravador. Nós vamos e pegar." #They send recording device. We go and get device.",
radiobase_prepare_for_attack2_amer: "Lange precisa de todo tempo possível. Fazem barricada na porta!" #Lange needs all the time we can give him. Get the doors barricaded!",
radiobase_clear_area_rem8_russ: "Tarefa de matar os fascistas? Então vamos limpar a área." #Task requires killing of fascists? Then we clear area.",
radiobase_tech_see_tank: "Eu acho que... sim! Eu estou vendo. Tanque Tiger!" #I think I... yes! I see it. Tiger tank!!",
radiobase_technician_died2_russ: "Nós fracassamos. Ele morreu." #We failed. He is dead.",
radio_op_wait_for_truck1_brit: "Sra. White falou que haveria uma caminhonete a caminho. Onde diabos está?" #Mrs. White said there'd be a truck waiting. Where the blazes is it?",
radio_op_find_dynamite_complete_brit: "Eu tenho dinamites!" #I got some dynamite!",
radiobase_start_still_no_enemies_brit: "Por que diabos está muito quieto?" #Why is it so bloody quiet?",
radiobase_mrs_white_respond2: "Entendido, Broadsword. Sabre Squadron está a caminho. Sinalizem a zona de entrega. Câmbio." #Copy that, Broadsword. Sabre Squadron on their way. Mark the drop zone. Over.",
radiobase_open_pod_complete_amer: "Beleza, entrei!" #Alright, I'm in!",
radiobase_tech_tank_closing_park: "O tanque está chegando no parque. Está chegando!" #The Tiger is approaching the park. It is coming!",
radiobase_franz_climb_down2_russ: "Martela eles até morrer! Não vamos deixar ele morrer!" #Hammer them to pieces! Not letting him die now!",
radiobase_defend_device2_amer: "Não deixem esses desgraçados chegarem perto! Temos que pegar aquela informações!" #Keep those pricks away! We gotta get that intel!",
radiobase_tech_closing_tower: "Vou te ajudar. Um espião com um rádio e um caderno, ja! Só não me deixa morrer!" #I will help you. A spy with a radio and a notebook, ja! Just keep me alive!",
radiobase_tank_entering_germ: "Mein gott! O tanque está aqui!" #Mein gott! The tank is here!",
radiobase_got_the_radiodev1_germ: "Ah, rá. Peguei o gravador aqui." #Aha. I have the recording device here.",
radio_op_repair_fuse_box2_germ: "A gente tem que consertar! Schnell!" #They must be fixed! Schnell!",
radio_op_keep_trans_running_amer: "Está rodando, melhor a gente manter assim. Protegem a caixa de fios, e fiquem de olho no combustível daquele gerador!" #We're running, so let's keep it that way. Defend the fuse box, and keep that generator gassed up!",
radiobase_tank_destroy_gate3_russ: "Dentro, dentro! Recuem para o acampamento!" #Inside, inside! We hold at camp!",
radiobase_technician_alert_north: "Eles estão vindo do Norte!" #They are coming from the North!",
radio_op_escape_active_russ: "Nós vamos agora? Mas ainda há muitos inimigos para matar!" #We go now? But many more enemies to crush!",
radiobase_appro_gate3_germ: "Ah! Lange vai estar presente. Tenho certeza." #Ah! Lange will be there. I am sure of it.",
radiobase_plane_arrived2_russ: "A carga vai estar por perto aqui." #Air drop will be close to here.",
radio_op_sabre_missed1_amer: "Você está brincando comigo? Ele errou! Inacreditável, porra!" #Are you shittin' me? He fuckin' missed! c!",
radiobase_slow_tank1_amer: "A droga de um tanque!?" #A goddamn tank!?",
radio_op_drop_flare_germ: "Um bombardeiro está chegando, pessoal. Marquem o alvo com uma sinalizadora." #A bomber is on the way, men. Mark it's target with a flare.",
radiobase_pick_up_device_germ: "Talvez eu possa sugerir que pegamos esse gravador de volta para a torre e terminamos o quê Lange começou." #Might I suggest we get this recording device back to the tower and complete the work Lange started.",
radiobase_find_flare_position1_russ: "Abrem espaço para a carga. Precisamos acender a sinalizadora." #Open space for air drop is needed. We will light flare.",
radio_op_wait_for_truck1_russ: "Eu não entendo. Caminhonete deveria estar aqui. Onde está?" #I do not understand. Truck should be here.  Where is truck?",
radiobase_tank_destroy_gate3_germ: "Recuem para o acampamento! Vai, agora!" #Retreat to the camp! Go, now!",
radiobase_free_franz3_amer: "Agora libertamos o Lange." #Now we free Lange. ",
radiobase_find_tools_russ: "Kurgan entende. Procurar pelas ferramentas." #Kurgan understand. Look for his tools.",
radiobase_area_cleared1_germ: "Foi todo mundo? Foi fácil." #All gone? That was easy.",
radiobase_new_plan2_russ: "Ah! Havia um rádio na barraca com o Lange. Vamos pedir para o avião entregar o gravador, para gravar o rádio?" #Ah! There was radio in tent with Lange. We ask for plane to drop recorder, record radio?",
radio_op_send_new_mess_complete_russ: "Hora para nova mensagem. Hmm..." #Time for new message. Hmmm...",
radio_op_pick_up_dyna_complete2_brit: "Isso vai arrebentar essas barras de aço, podem marcar as minhas palavras. Aí nós vamos sair daqui." #This'll make short work of those steel bars, you mark my words. Then we're scot-free.",
radiobase_device_destroyed2_brit: "Então, vamos ter que pegar um novo gravador." #Then we'll have to get another one dropped in.",
radiobase_inside_yard3_amer: "Entendi, tá bom, bora matar esses krauts e libertar ele." #Reckon so. All right, let's nail these krauts and free him.",
radio_op_near_pod_brit: "Quase lá. Nós vamos ter aquele dinamite em breve." #Nearly there. We'll soon have that dynamite.",
radiobase_defend_technician_brit: "*suspiro* Ok, pessoal. Vocês sabem o quê fazer. Não deixem Herr Lange morrer." #*weary sigh* Okay, chaps. You know the drill. Keep Herr Lange safe.",
radio_op_call_airdrop_dyna_complete_brit: "Maravilha, eles estão chegando com a carga. Devem chegar em breve." #Lovely stuff - they're sending us an airdrop. Should be here fairly soon.",
radio_op_codebook_placed_brit: "Beleza, aqui está o caderno." #All right, there's the codebook.",
radiobase_device_destroyed1_russ: "Maldito seja Stalin! O dispositivo está quebrado." #Stalin's balls! The device is dead.",
radio_op_radio_call_white1_russ: "Sra. White? Me ouviu? É o Broadsword, câmbio." #Mrs. White? You hear me? This is the Broadsword, over.",
radiobase_mrs_white_respond1: "Broadsword? Sim, consigo te ouvir. Câmbio." #Broadsword? Yes, I can hear you. Over.",
radiobase_technician_died1_russ: "Ei, Lange!" #Hey! Lange!",
radio_op_activate_power_gen2_amer: "Cadê o gerador?" #Where's the generator?",
radiobase_open_pod_complete_russ: "Pacote está aberto." #Package is open.",
radiobase_all_signals_rec_germ: "Excelente, meine Freunde! Nós temos todos os sinais gravados? Então, vamos, temos que levar as informações." #Excellent, meine Freunde! We have all the signals recorded? Then come - we must get the intel to safety!",
radiobase_pick_up_device_complete_germ: "Tenho o dispositivo. Rápido, nós temos que voltar para a torre!" #I have the device. Quickly, we must return to the tower!",
radio_op_spawn2_russ: "Isso é para a transmissão." #That is for broadcast.",
radiobase_free_franz3_brit: "Vamos achar o Lange." #Let's find Lange.",
radiobase_defend_device2_russ: "Máquina tem um trabalho para fazer! Nós protegemos a máquina!" #Machine has job to do! We protect machine!",
radiobase_defend_device1_brit: "Nós não podemos deixar os alemães pararem o gravador!" #We can't let Jerry stop the recorder!",
radio_op_pick_up_dyna_brit: "Algumas belas dinamites, prontinhos para detonarem, eh?" #Some nice fresh dynamite, ripe for the picking, eh?",
radiobase_technician_free_ex1_amer: "Então, como podemos pegar o resto das informações?" #So, how do we get the rest of that intel?",
radiobase_pick_up_device_brit: "Agora, que tal pegarmos o gravador, conectar na torre e terminar o quê o coitado do Lange começou. Precisamos do resto das informações!" #Now then, what say we grab the recording device, hook it up to the tower, and finish what poor old Lange started. We need the rest of that intel!",
radiobase_escape_germ: "Wunderbar! Agora, devemos ir embora?" #Wunderbar! Now, shall we leave?",
radiobase_2nd_barricade_defend1_brit: "Ainda tem mais barricada!" #Still got another barricade!",
radio_op_spawn_germ: "Estrutura interessante." #Impressive structure. ",
radio_op_activate_power_gen3_brit: "Ache e ligue, o mais rápido que pôder." #Find it and get it on, quick as you can.",
radiobase_tak_shoots_at_gate_russ: "Não enrole! O tanque está aqui, e o portão não vai segurar por muito tempo." #Move quickly! Tank is here, and gate cannot hold up for long!",
radiobase_device_destroyed1_amer: "Ah, porra! Eles quebraram o gravador!" #Aw fuck! They busted the recorder!",
radiobase_retreat_amer: "Fizemos o quê podíamos. Recuem para a torre!" #Done what we can here. Back to the mast!",
radiobase_all_signals_rec_russ: "Gravamos todas as transmissões? Então, está na hora de irmos embora." #The broadcasts are all recorded? Then it is time to leave.",
radiobase_cut_cables2_germ: "Que tal esta torre do rádio. Vê os cabos? Nós cortamos os cabos e..." #How about this radio tower. You see the cables? We cut those and...",
radiobase_tank_long_route1_amer: "Tanque está chegando na ponte!" #Tank's gotta go around the bridge!",
radiobase_tank_destroys_main1_brit: "Meu Deus! Explodiu o portão!" #Christ! It blew the gate!",
radiobase_inside_yard3_russ: "Da. Vamos matar os fascistas. Depois libertamos ele." #Da. Let's finish off the fascists. Then we free him.",
radiobase_tech_mess_sent: "Ja, já era. As comunicações foram kaput!" #Ja, that is it. Communications are kaput!",
radiobase_appro_gate2_russ: "Um acampamento? Lange deve estar lá." #A camp? Lange is probably there.",
radio_op_escape_active_rem_germ: "Por que você está ficando? Entra, vem logo!" #Why do you remain? Get in, quickly!",
radiobase_tank_arc_destroyed_russ: "Ainda bem que destruímos a arcada! Tanque deve dar a volta!" #Good thing we destroyed the arch! Tank must go around!",
radiobase_connect_device1_amer: "Conseguimos fazer isso! Só conectar o gravador na torre." #We can do this! Just gotta hook up the recording device at the radio tower.",
radio_op_sabre_missed1_brit: "Ah, pelo amor de Deus. Aquele piloto imbecil ruim da peste errou!" #Oh, for crying out loud. Silly bugger only ruddy well missed!",
radiobase_message_sent1_russ: "Você! Lange! Já terminou?" #You! Lange! Are you finished?",
radio_op_repair_fuse_box_germ: "Os fios!" #The fuses! ",
radiobase_technician_free15: "Wunderbar!"
radiobase_find_tools_germ: "Então, estamos procurando por ferramentas do rádio. Ok." #So we're searching for some wire-tapping tools. Okay.",
radio_op_escape_active_complete_brit: "Haha! Trabalho bem feito, pessoal. Para longe, nós vamos!" #Haha! Splendid work, chaps. Away we go!",
radiobase_cut_cables3_brit: "Vai cair, e nós teremos a nossa rota de fuga! Que beleza!" #Down it comes, and we have a way out! Jolly good!",
radio_op_wait_for_truck_complete_amer: "Finalmente! O piloto chegou!" #Finally! Driver's here!",
radio_op_find_dynamite_rem2_amer: "Deve estar aqui em algum lugar!" #Must be some here somewhere!",
radio_op_call_airdrop_dyna2_germ: "Então, melhor a gente contatar o controle e pedir por uma carga aérea, vamos logo." #Then we had best contact command and request an airdrop, at once.",
radio_op_open_pod_complete_brit: "Aqui, está aberto, pessoal." #There - it's open, chaps.",
radiobase_tech_5th_message: "Isso vai encurtar a guerra, certeza!" #This will shorten the war, to be sure!",
radiobase_place_flare1_amer: "O avião tá na área, só temos que liberar espaço e botar uma sinalizadora, vamo lá." #The plane's inbound, so we gotta find some clear ground and get a flare out, quickly.",
radiobase_tank_entering_brit: "Mas que merda! Está quase chegando!" #Bloody hell! It's almost here!",
radio_op_escape_active_complete_amer: "Rá! E lá vamos nós, foi uma boa ter derrubado aqueles malditos aviões!" #Ha! Off we go, and good riddance to those shitbirds!",
radio_op_start_trans_complete_germ: "Boa! Vamos esperar que seja útil bastante para dobrar a taxa." #Good! Let us hope it is useful enough to double the fee.",
radiobase_place_flare1_russ: "Nós precisamos de uma área limpa para a sinalizadora e o pacote." #We require the open space for flare and package drop. ",
radiobase_tech_8th_message: "Talvez não é útil, mas pode ser interessante!" #Maybe not useful, but interesting!",
radio_op_place_dynamite_complete_amer: "Tá bom, pavio aceso. Recuem, pessoal!" #All right, fuse is burning. Get back, guys!",
radio_op_recording_device_placed_brit: "Liguei o gravador." #I've hooked up the recorder.",
radio_op_call_airdrop_dyna2_brit: "Concordo. Temos que chamar o controle e pedir pela carga, o mais rápido possível." #Agreed. We'd best contact command and request an airdrop, quick as they can.",
radiobase_deliver_tools1_amer: "Pegue as ferramentas pro Lange, vamos lá!" #Get those tools to Franz, come on!",
radio_op_refuel_generator_complete_russ: "Gerador está rodando de novo. Muito bom por enquanto, mas Kurgan fica de olho!" #Generator back up. All good for now, but Kurgan keeps eyes open!",
radiobase_got_the_radiodev1_brit: "Aqui nós estamos, tenho o gravador." #Here we are - I have the recording device.",
radiobase_connect_device1_germ: "Devemos conectar o gravador na torre do rádio. Podemos conseguir." #The radio tower is where we shall connect the recording device. We shall succeed.",
radiobase_technician_died1_amer: "Lange?! Fala alguma coisa!" #Lange?! Say somethin'!",
radio_op_wait_for_truck_complete_russ: "Sim, sim! Tem o nosso transporte!" #Yes, yes! There is our transport!",
radiobase_technician_free_ex1_germ: "Agora, como a gente grava o resto das informações que você prometeu para Sra. White?" #Now, how do we acquire the rest of the intel you promised Frau White?",
radiobase_post_spawn3_germ: "Lange precisa da nossa ajuda. Nós temos que escutar as transmissões nazistas na torre. Depois nós voltamos para casa com o Lange e as informações. Só mais uma terça-feira." #Lange needs our help. We must listen in on Nazi broadcasts at the tower. Then we return with Lange and the intel. Just another day at the office.",
radio_op_call_airdrop_dyna_complete_russ: "Boa, boa! A carga está chegando. Talvez eles mandaram vodca também, eh?" #Good, good! Airdrop is on way. Maybe they send vodka too, eh?",
radiobase_call_mrs_white_rec2_brit: "Sim, devemos achar uma área limpa e, claro, colocar a sinalizadora para o piloto nos achar." #Yes. We shall find clear ground and place a flare for your pilot at once, of course.",
radiobase_find_flare_position1_germ: "Não temos tempo a perder. Ache uma área limpa e acende a sinalizadora." #We have no time to lose. Find somewhere clear and light a flare.",
radiobase_codebook_recovered1_brit: "Bingo! Peguei o caderno!" #Bingo! Got the notebook!",
radio_op_activate_power_gen3_germ: "Nós temos que achá-lo e ativá-lo." #We must locate it and activate it.",
radiobase_connect_device1_russ: "O gravador é para ser usado na torre do rádio. Devemos conectá-lo." #Recording device is to be used at radio tower. We shall connect device.",
radio_op_find_dynamite3_brit: "Então, nós precisamos passar pelas essas barras. Deve ter dinamite por perto!" #Then we need to get through those bars. Look for dynamite!",
radio_op_pick_up_dyna_germ: "Ah, eu amo o cheiro de dinamite. Vamos levar um e sair daqui." #Ah, I do love the smell of dynamite. Let us take it, and be on our way.",
radiobase_enemy_plant_dyna1_germ: "Tem inimigo na barricada!" #One got to the barricade!",
radiobase_tech_tip_landmines: "Eu vi as minas antes. Elas podem ser usadas, ja?" #I saw landmines earlier. They could be used, ja?",
radiobase_tech_3rd_message: "Frau White vai decidir o quê fazer com isso." #Frau White will decide what to do with this.",
radiobase_change_channel_complete_amer: "Achei outro sinal, ainda gravando!" #Found another signal -- still recording!",
radio_op_place_dynamite_russ: "Vê as barras na parede? Plantem a dinamite ali!" #See bars on wall? Get dynamite there!",
radio_op_call_airdrop_dyna_complete_germ: "Wunderbar! A nossa carga está a caminho, cavalheiros." #Wunderbar! Our airdrop is en route, gentlemen.",
radiobase_stop_barricade2_germ: "Melhor não celebramos antes da vitória." #Let us not celebrate prematurely.",
radio_op_activate_power_gen2_germ: "Desse jeito, precisamos de um gerador." #Therefore, we require a generator.",
radiobase_tech_9th_message: "Isso é informação útil. É claro." #This is useful information. For sure.",
radiobase_plane_arrived1_russ: "Avião chegou? Hm, Kurgan estava se divertindo." #Plane is here? Hm. Kurgan was having fun.",
radio_op_refuel_generator2_brit: "Vamos pegar mais um pouquinho aqui." #Let's get a little more in there.",
radiobase_place_flare2_germ: "Nosso pacote vai chegar assim que o piloto vê a sinalizadora." #Our package will be dropped once the pilot sees the flare.",
radiobase_tools_picked_up1_germ: "Peguei as ferramentas." #I have his tools.",
radio_op_keep_trans_running_complete_brit: "Acho que já foi! A transmissão terminou!" #I think that's it! I think the transmission is finished!",
radiobase_connect_device_complete_germ: "Aqui, o gravador está conectado. Espero que esteja funcionando." #There -- the device is now connected. Let us hope it does its job.",
radiobase_2nd_barricade_defend2_brit: "De fato! Ainda não estamos cercados!" #Indeed! We're not overrun yet!",
radiobase_wait_for_plane1_amer: "Não sei por quanto tempo podemos aguentar! Onde tá o piloto?" #I dunno how much more'a this we can take! Where's that pilot?",
radio_op_refuel_generator2_germ: "Vão reabastecer o gerador." #Go fix it a drink.",
radiobase_escape_via_alley_russ: "Aí, aí! Nós vamos para o beco!" #There, there! The alley! We go!",
radiobase_change_channel1_russ: "O canal morreu." #Channel has gone dead.",
radio_op_refuel_generator2_russ: "Nós consertamos isso, da?" #We fix that fast, da?",
radiobase_device_destroyed3_germ: "Entendi. Vamos acender outro sinalizador." #Understood. Let us get another flare lit up.",
radio_op_escape2_amer: "Não ligo como tá o cheiro, só entra aí." #I don't care how it smells, get in there.",
radio_op_wait_airdrop1_brit: "Nossa carga deve chegar aqui em breve, cavalheiros. Mantém esses malditos longe daqui!" #Our airdrop should be here soon, lads. Keep these buggers off us!",
radiobase_tech_tied_released: "Ah, danke!" #Ah, danke! ",
radiobase_stop_barricade2_brit: "Maravilha!" #Splendid! ",
radiobase_defend_the_radiodev_russ: "Nós matamos cada filha da puta que tentar parar a gravação! Protegem o gravador!" #We crush any little men who try stop recording! Protect device!",
radiobase_defend_technician_germ: "Como desejar, Herr Lange. Meine Freunde, protegem ele!" #As you wish, Herr Lange. Meine Freunde, keep him safe!",
radiobase_change_channel_complete_germ: "Ah, achei outro canal, e mais informações para gravar!" #Aha! That's another channel, and more intel to record!",
radiobase_inside_yard4_russ: "A barraca, Lange deve estar lá." #The tent. Lange must be there.",
radiobase_plane_arrived2_amer: "Aquele pacote deve ter caído em algum lugar próximo!" #That package must'a landed somewhere nearby!",
radiobase_connect_device_complete_brit: "Maravilha! O gravador está conectado. Espero que ainda funciona!" #Superb! The device is connected. Let's hope it works!",
radio_op_activate_power_gen_russ: "Precisa de energia." #Need power. ",
radio_op_get_to_tower_complete_brit: "Chegamos. Boa. E agora?" #We're here. Great. Next?",
radiobase_appro_gate2_brit: "O melhor lugar para achar o Lange, eu diria." #The best place to find Lange, I'd wager.",
radio_op_escape_active_germ: "Vamos embora daqui! Temos que ir!" #Let us be away! We go now!",
radio_op_recording_device_placed_amer: "O gravador está conectado." #That's the recorder all hooked up.",
radiobase_cut_cables3_germ: "Caiu tudo! Temos um caminho para fugir! Sehr gut!" #It crashes down! And we have a path out! Sehr gut!",
radiobase_pick_up_device_russ: "Boa. Levamos o gravador para a torre, conectamos e roubamos as informações dos nazistas." #Good. We take recording device to tower, connect device, and steal remaining Nazi secrets.",
radiobase_recording_is_done_brit: "Belo trabalho, cavalheiros! Nós conseguimos tudo que precisamos, vamos pegar o gravador!" #Good show lads! We've got everything we need - go grab the recording device!",
radio_op_activate_power_gen_germ: "Agora, precisamos de energia." #Next, we require power. ",
radio_op_send_new_mess_complete_brit: "Certo. Hora de ver a próxima mensagem. Veremos..." #Right. Time for a new message. Let's see...",
radio_op_refuel_generator_complete_brit: "Ok, isso deve fazer durar mais um pouquinho!" #Okay, that should keep it running a little bit longer!",
radio_op_contact_mrs_white_escape_amer: "Caramba! Precisamos contatar Sra. White e sair daqui! Tem que ter um rádio por perto!" #Hot damn! We gotta contact Mrs. White and get outta here! S'gotta be a radio nearby!",
radio_op_activate_power_gen2_russ: "Onde está o gerador?" #Where is generator?",
radiobase_recover_codebooks_germ: "O caderno do Herr Lange tem valor. Melhor a gente pegar do seu cadáver." #Herr Lange's notebook is valuable. Take it from his body.",
radiobase_tank_destroy_gate3_amer: "De volta para o acampamento! Segurem eles!" #Back to the camp! Hold 'em back there!",
radiobase_wait_for_plane1_brit: "Espero que o avião chegue logo. A situação está ficando apertada!" #I hope the bally plane hurries. This is becoming quite the to-do!",
radiobase_escape_amer: "Agora, parem de enrolar e venham logo. Vamos!" #Now, shimmy your asses along it. Hurry!",
radio_op_near_pod_russ: "Carga faz muita fumaça, sim? É mais pequeno do que esperado." #Airdrop make lot of smoke, yes? Is smaller than expected.",
radio_op_refuel_generator2_amer: "Bota a gasolina logo." #Get it refilled.",
radiobase_tools_picked_up1_brit: "Peguei o dispositivo!" #I got the bloody gizmos!",
radio_op_prepare_trans1_russ: "Equipamento pra preparar, da? Na torre." #Equipment to set up, da? At tower base.",
radio_op_wait_airdrop1_amer: "Só temos que segurar esses babacas longe até a carga chegar." #Just gotta hold these assholes off until the airdrop gets here.",
radiobase_tank_destroys_main1_germ: "O tanque destruiu o portão!" #That gate was blown by the tank!",
radiobase_escape_brit: "Certo, aí está a nossa rota de fuga, cavalheiros! Vamos logo!" #Right, there's our escape path, lads! Everyone along it!",
radiobase_deliver_tools1_russ: "Vamos entregar as ferramentas para o alemão. Sem enrolar!" #Return the tools to the German. Hurry!",
radiobase_defend_device1_germ: "Temos que impedir esses schweins de quebrar o dispositivo!" #These schweins must not be allowed to stop the device!",
radiobase_got_the_radiodev2_germ: "Agora estamos na gasolina! Liguem o gravador." #Now we are cooking on gas! Hook up the recording device.",
radio_op_repair_fuse_box2_russ: "Consertem isso, não enrolem!" #Fix, fix fast!",
radio_op_codemachine_placed_amer: "O Enigma caiu!" #That's the Enigma machine down!",
radiobase_got_the_radiodev1_amer: "Peguei o gravador aqui." #Got the recording device right here.",
radiobase_tech_climbs: "Oof, essa torre é mais alta do que lembrava." #Oof. This tower is taller than I remember.",
radio_op_radio_call_white1_brit: "Sra. White, é o Broadsword. Está na escuta, câmbio." #Mrs. White - this is Broadsword. Do you read me, over.",
radiobase_tech_tied2: "Tem alguém aí?" #Is someone there?",
radio_op_spawn2_brit: "É aí onde nós enviamos a transmissão." #That's where we send the transmission from. ",
radio_op_radio_call_white4: "Afirmativo, Broadsword. Sabre Squadron está em rota para abrir um caminho para vocês. Joguem um sinalizador para mostrarem o alvo do piloto. Teremos suporte esperando por vocês, câmbio." #Roger that, Broadsword. Sabre Squadron is en route to blow open a path for you. Throw down a flare so the pilot knows where to target. We'll have transport waiting for you. Over.",
radio_op_pick_up_dyna_complete1_russ: "Kurgan has dynamite!" #Kurgan has dynamite!",
radiobase_toolbox_close4_germ: "Seriam essas ferramentas do Lange?" #Are these the tools Lange seeks?",
radio_op_find_dynamite_rem2_germ: "Continuem procurando, nós vamos achar, tenho certeza." #Keep looking, and you shall find it, I am sure.",
radiobase_lou_technician_free4_amer: "Nos falaram que você não pegou todas informações. Então, como podemos pegar o resto?" #We were told you didn't get all the intel. So how do we get the rest?",
radiobase_new_plan2_germ: "Tenho uma ideia. Nós podemos pedir um gravador para o piloto. Lembrem daquela barraca que achamos o Lange? Tinha um rádio!" #I've got an idea. We can have a recording device airdropped in. Remember the tent where we found Lange -- it had a radio!",
radio_op_drop_flare_russ: "Sra. White disse que um avião está chegando, sim? Nós soltamos um sinalizador, mostra o alvo que deve ir boom!" #Mrs. White says bomber is coming, yes? We drop flare. Show it what goes boom!",
radio_op_get_to_tower_amer: "Então, é pra lá onde nós vamos. Bora." #Then that's where we're headed first. Let's go.",
radiobase_barricade_down5_brit: "Então, defendem a próxima linha. Recuem!" #Then defend the next line. Fall back!",
radio_op_pick_up_dyna_amer: "Então peguem a dinamite logo, nós temos que ir embora daqui." #So grab the dynamite already so we can get outta here.",
radiobase_find_tools_amer: "Certo. Vamos procurar pelas ferramentas dele. Entendido!" #Right. So we're looking for his tools. Got it!",
radiobase_all_signals_rec_amer: "Boa! Foi tudo! Bora, precisamos ir embora daqui enquanto ainda podemos!" #Nice! That's a wrap! C'mon, let's get outta here while we still can!",
radiobase_call_mrs_white_rec2_russ: "Boa. Avião deve conseguir ver o sinalizador aqui no chão. Vamos fazer isso." #Good. Plane must see flare on ground that is clear. We will do that.",
radiobase_2nd_barricade_tank_brit: "Defendem a barricada! Fiquem na linha!" #Defend the barricade! Hold the line!",
radiobase_tools_picked_up1_russ: "Kurgan tem isso." #Kurgan have them.",
radiobase_appro_gate3_russ: "Um acampamento? Lange deve estar lá." #A camp? Lange is probably there.",
radio_op_place_dynamite_complete_brit: "Vai explodir. Fiquem longe, idiotas!" #Fuse is lit. Stand back, chaps!",
radiobase_recover_codebooks_brit: "Peguem o caderno do Lange!" #Grab the notebook off Lange's body!",
radiobase_barricade_down1_germ: "Bah! Os schweins derrubaram a barricada!" #Bah! The schweins took the barricade!",
radiobase_enemy_plant_dyna1_amer: "Ei, eu vi um. Na barricada!" #Hey, I see one. At the barricade!",
radiobase_tech_6th_message: "Me deixem escrever isso. Frau White vai gostar disso." #Let me write that down. Frau White will be pleased.",
radio_op_activate_power_gen_amer: "A próxima coisa que precisamos é energia." #Next thing we need to do is get some power. ",
radio_op_codebook_placed_amer: "Aqui está o caderno." #Placed the codebook.",
radio_op_open_pod_complete_amer: "Abri o pacote, pessoal." #Got the drop open, guys.",
radiobase_inside_yard3_germ: "Tem que ser aqui. Vamos limpar o acampamento e libertar ele." #It has to be. Let's clear the camp and free him.",
radiobase_protect_barricade3_amer: "Então, quando chegarem perto, atirem!" #So, when they get close - shoot 'em!",
radiobase_barricade_down5_russ: "Nós recuamos, da? Achem um lugar melhor para ficarmos!" #We fall back, da? Find better place to stand!",
radiobase_inside_yard1_brit: "Vocês ouviram isso?" #You hear that? ",
radiobase_place_flare2_russ: "Sinalizador vai sinalizar o piloto, e o pacote vai chegar." #Flare will signal pilot, and package will be dropped.",
radiobase_tank_long_route1_brit: "Tanque não pode passar pela ponte!" #Tank can't cross the bridge!",
radio_op_repair_fuse_box_complete_brit: "Aí, isso deve servir." #There, that should do it.",
radio_op_send_new_mess2_germ: "O rádio! Peguem!" #The radio! Get to it!",
radiobase_toolbox_close4_amer: "Me fala que são as ferramentas do Lange." #Tell me these are Lange's tools.",
radio_op_codemachine_placed_brit: "Enigma está no lugar!" #Enigma is placed!",
radiobase_open_pod_complete_brit: "Aí, abri essa merda!" #There - got the bugger open!",
radiobase_lou_technician_free4_russ: "As suas informações dos fascistas não estão completas. Como a gente faz o resto?" #Your fascist intel is not complete. How do we complete it?",
radiobase_technician_died2_brit: "Tarde demais. Eles o mataram!" #It's too late. They got him!",
radio_op_find_dynamite2_germ: "Tem um canal de água mais além dessas barras de aço, viu?" #There is a narrow water channel beyond those steel bars, you see?",
radiobase_cut_cables3_russ: "Caiu! E nos deus um caminho! Gostei!" #It falls down! And gives us a path! I like!",
radiobase_technician_free_ex1_russ: "As suas informações dos fascistas não estão completas. Como a gente faz o resto?" #Your fascist intel is not complete. How we get it?",
radiobase_enemy_plant_dyna1_russ: "Homens plantando bomba na barricada!" #Man setting bomb at barricade!",
radio_op_open_pod_brit: "Agora, vamos pegar o pacote e seguir o nosso caminho. Viu a fumaça verde? É o nosso pacote." #Now, let's go get that airdrop open and be on our way. See the green smoke? That's our airdrop.",
radiobase_device_destroyed2_russ: "Piloto consegue entregar outro, sim?" #Pilot can deliver another, yes?",
radiobase_cut_cables3_amer: "Caiu, temos a nossa saída! Gostei!" #It falls, and we have a way out of here! I like it!",
radio_op_drop_flare_complete_germ: "Sinalizador aceso! Agora vamos aproveitar e limpar o lugar!" #The flare isdown! Now, get clear and enjoy the show!",
radio_op_activate_power_gen_complete_brit: "Ok, temos energia!" #Okay. We've got power now! ",
radio_op_refuel_generator_complete_germ: "Boa, o gerador está funcionando, mantenham o ligado." #Good. The generator is satisfied for now. Keep it that way.",
radio_op_contact_mrs_white_escape_germ: "Ach! Temos que escapar, e rápido! Vamos ligar para a Sra. White! Deve ter um rádio por perto!" #Ach! We must escape, and quickly! Let us contact Mrs. White! There must be a radio here!",
radiobase_tools_picked_up2_germ: "Bom trabalho, cavalheiros. Vamos entregar as ferramentas para o Lange." #Good work gentlemen. Let us supply Lange with what he requires.",
radiobase_inside_yard2_amer: "Veio daquela barraca. Tem que ser o Lange." #Came from that tent. Gotta be Lange.",
radiobase_plane_arrived1_brit: "Aí! O avião chegou. Já estava na hora!" #There! The plane's here. Took the blighter long enough!",
radiobase_stop_barricade2_russ: "Facistas. Todo exibidos, sem poderes." #Fascists. All style, no power.",
radio_op_escape2_germ: "Vamos!" #Let us go!",
radiobase_defend_device_complete_germ: "A menos que eu esteja errado, o sinal acabou. Temos que mudar de canal." #Unless I am mistaken, the signal is ended. We must change the channel.",
radio_op_find_dynamite_complete_amer: "Ei, achei o dinamite!" #Hey, found the dynamite!",
radiobase_2nd_barricade_tank_russ: "Continuem defendendo a barricada!" #Keep defending barricade!",
radiobase_tank_destroys_gate_germ: "Aquilo foi o portão externo! O tanque está chegando!" #That was the outer gate! The tank is coming!",
radiobase_stop_barricade2_amer: "Boa, isso ensinou uma lição pra eles!" #Great. That showed 'em!",
radio_op_wait_airdrop1_germ: "Agora precisamos ficar vivos até a carga chegar!" #Now there's the small matter of staying alive until the airdrop gets here!",
radiobase_escape_via_alley_brit: "Aí está a nossa saída! O beco!" #There's our way out! See the alley!",
radio_op_codemachine_placed_russ: "Boa, Enigma está no lugar." #Good. Enigma is in right place. ",
radiobase_appro_gate1_russ: "Olhem o portão. Acampamento está no outro lado." #Look at gate. Camp is on other side.",
radiobase_plane_arrived2_germ: "Vamos! Precisamos achar o pacote, vai estar por perto." #Come! We must find the package. It will be close.",
radio_op_place_dynamite_brit: "Agora, vamos plantar o dinamite nas barras!" #Now, just got to get the dynamite planted on the bars!",
radiobase_plane_arrived2_brit: "A carga deve está próxima, cavalheiros!" #The air drop must be near, chaps!",
radio_op_spawn_russ: "Então, olha, ver a torre?" #So, look. See the mast? ",
radiobase_tech_tip_tank_barricade: "Eu a acho, pensando um pouco aqui, podemos bloquear o caminho!" #I think, with a little thinking and industry, you can block ze path!",
radiobase_barricade_down5_amer: "Temos que recuar, recuar!" #We gotta retreat. Fall back!",
radiobase_technician_free_ex2: "Vocês têm que achar as minhas ferramentas. Equipamento especial. Eles estão por aqui." #You must find my wire-tapping tools. Special equipment. They are surely nearby.",
radiobase_stop_barricade1_brit: "Aquele tanque está parado na barricada!" #That Tiger's stopped at the barricade!",
radiobase_tech_starts_transmitting_b: "Me deixe escrever isso." #Let me write this down.",
radiobase_recording_is_done_amer: "Bem feito, amigos! Conseguimos o quê queríamos, temos que pegar o gravador!" #Nicely done fellas! We got what we came for - just gotta get the recording device!",
radio_op_call_airdrop_dyna1_amer: |
 Nós temo' que pegar algum dinamite ou vamo' ficar preso aqui.
#We're gonna need some dynamite or we're stuck here.",
radio_op_activate_power_gen_brit: "Precisamos de energia nessa coisa." #Let's get some power on this thing. ",
radio_op_open_pod_complete_russ: "Abri! Aí está dinamite." #Open! There is dynamite.",
radio_op_spawn2_germ: "Aqui vai ser a nossa transmissão." #That will be the site of our transmission.",
radiobase_change_channel_complete_brit: "Aqui está a nova frequência. Continua gravando!" #That's a new frequency. Keep that recording going!",
radiobase_tech_below_tower: "Preciso subir agora?" #I need to go up there now?",
radiobase_place_flare1_germ: "Cavalheiros! Nós temos que limpar o lugar e soltar um sinalizador para o piloto conseguir ver." #Gentlemen! We must find suitably clear ground and release a flare for the pilot to see.",
radiobase_change_channel1_brit: "Nada, além de estática nesse canal, idiotas." #Nothing but static on this channel, chaps.",
radiobase_searching_for_wire_tools2_germ: "Talvez uma busca rápida vamos achar as ferramentas?" #Perhaps a cursory search of this area will reveal the tools?",
radio_op_get_to_tower_complete_russ: "Tudo bom, é o lugar certo, o quê vamos fazer?" #All good, is right place. Now what we do?",
radiobase_change_channel2_russ: "Então temos que achar o canal que não está morto." #Then we must find channel that is not dead.",
radiobase_2nd_barricade_defend2_germ: "De fato! Defendem!" #Indeed! Defend it!",
radiobase_pick_up_device_complete_brit: "Entendido! Vamos, cavalheiros, voltem para a torre." #Got it! Quickly lads, back to the radio tower.",
radio_op_send_new_mess_russ: "Kurgan ouve Sra. White!" #Kurgan hears Mrs. White!",
radio_op_start_trans_complete_russ: "Está feito, Londres conseguiu a mensagem. Espera por muitos segredos, da?" #It is done, London gets message. Hope for plenty of secrets, da?",
radiobase_codebook_recovered1_russ: "Aqui, aqui, Kurgan tem o caderno, sem pânico." #Here, here, Kurgan have notebook. No panic.",
radiobase_cut_cables2_brit: "Eu tenho uma ideia, aquela torre está com suporte dos cabos. Nós cortamos e aí..." #I have an idea. That tower is supported by those cables. We cut the cables and...",
radiobase_new_plan1_brit: "Oh, porcaria. Não podemos sair daqui de mãos vazias. Essas informações são importantes para a guerra." #Oh blast. We can't leave here empty handed. That intel is vital to the war effort.",
radio_op_prepare_trans_complete_germ: "Acho quando tudo vai de acordo com o plano." #I do love it when everything goes to plan.",
radiobase_tank_destroy_gate1_amer: "Puta merda! Eles explodiram o portão!" #Holy shit! They blasted the gate!",
radio_op_refuel_generator_russ: "Gerador sem gasolina!" #Generator out of fuel! ",
radiobase_clear_area_rem8_germ: "Se nós vamos ter sucesso com isso, sugiro limpar a área." #If we are to succeed, I would suggest we clear the area.",
radiobase_technician_free3: "Ah, danke! "
radiobase_tak_shoots_at_gate_germ: "Merda! O tanque chegou no portão, e logo logo vai cair!" #Not good! The tank has reached the gate, and it will soon fall!",
radiobase_defend_device1_amer: "Não deixem que esses krauts cheguem perto do gravador!" #Don't let those krauts anywhere near the device!",
radiobase_defend_the_radiodev_amer: "Matem qualquer filha da puta que tentarem derrubar o gravador, temos que terminar a gravação." #Take out any shitbirds shooting the device - it's gotta finish the recording!",
radiobase_protect_barricade3_brit: "Então, não deixem ninguém encostar!" #Then keep the buggers away from them!",
radio_op_send_new_mess_brit: "Sra. White precisa de mais um pouco." #Mrs. White needs a little more. ",
radio_op_drop_flare_complete_amer: "Sinalizador aceso! Limpem o lugar antes da bomba chegar!" #Flare placed! Get clear before the bomb drops!",
radiobase_got_the_radiodev1_russ: "Hm, é o gravador, eu peguei." #Hm. This is the recording device, I have it.",
radiobase_tank_entering_amer: "Ah, merda! O tanque tá na nossa cola!" #Aw crap! Tank's right on us!",
radio_op_send_new_mess2_russ: "Devemos ligar de novo, da?" #Must call again, da?",
radiobase_barricade_down1_russ: "Quem deixou chegar perto? A barricada foi derrubada!" #Who let them get close? Barricade is gone! ",
radiobase_place_flare_complete_germ: "O sinalizador está aceso. Vai guiar o piloto, mas o nosso inimigo vai saber aonde estamos. Fiquem atentos!" #The flare's lit. That'll guide the pilot, but our enemy know where we are too now. Stand firm!",
radiobase_tech_2nd_message: "Bem interessante!" #Very interesting! ",
radiobase_recover_codebooks_russ: "Peguem o caderno do cadáver!" #Take the notebook from the body!",
radio_op_prepare_trans_complete_brit: "Aí, maravilha, isso deve servir." #There. Smashing. That *should* be good.",
radiobase_device_destroyed4_russ: "Sinalizador aceso. Nazistas vão atacar, mas fascistas para matar enquanto espera por pacote." #Light flare. Nazis will attack. More fascists to slaughter while we wait for package.",
radiobase_franz_climb_down2_amer: "Fiquem atentos, pessoal! Não deixem eles matar o kraut!" #Pour it on, guys! Don't let 'em drop the kraut now!",
radiobase_tak_shoots_at_gate_amer: "Merda, o tanque tá aqui, o portão não vai aguentar por muito tempo!" #Shit - The tank's here, and the gate won't hold out long!",
radiobase_tank_arc_destroyed_amer: "Os tanques vão ter que contornar pelo arco! Boa!" #The tanks gotta drive around the arch! Great!",
radio_op_prepare_trans_complete_amer: "Ok, acho que isso deve servir." #Okay, I think that does it. ",
radiobase_stop_barricade3_germ: "Eles seriam tolos em deixarem isso. Matem os engenheiros!" #They would be fools to leave it. Cut the engineers down!",
radio_op_sabre_drop_bomb_russ: "Caboom! Haha! Isso me deixou surdo! Kurgan está gritando? Sim, está gritando." #BOOM! HAHA! THAT WAS LOUD! IS KURGAN SHOUTING? YES, I AM SHOUTING.",
radiobase_tank_arc_destroyed_germ: "Ah! A nossa estratégia valeu a pena! O tanque está dando a volta!" #Ah! Our strategy paid off! The tank is diverted!",
radiobase_gate_closed2_russ: "Olhem, achem outro caminho." #Look. Find other way in.",
radio_op_escape2_russ: "Vamos lá, da?" #Let's go, da?",
radiobase_defend_device_complete_russ: "O sinal está completo. Gravamos outro sinal agora!" #Signal is complete. We record new signal now!",
radio_op_escape_brit: "Aí está a nossa saída!" #There's our exit! ",
radiobase_defend_device_complete_brit: "Só sinal morto, cavalheiros. Hora de mudar o canal." #We're getting dead air, lads. Time to change channel.",
radiobase_appro_gate1_brit: "Aquele portão, suponho que o acampamento está lá dentro." #That gate. Reckon their camp must be beyond it.",
radiobase_change_channel_complete_russ: "Novo sinal encontrado. Vamos gravá-lo." #New broadcast has been found. We will record it.",
radiobase_tank_destroy_gate1_germ: "Scheisse! Eles explodiram o portão!" #Scheisse! They blew the gate!",
radiobase_escape_via_tower_amer: "Olha só isso, fizemos uma ponte sobre a parede! Vamo' lá!" #Look at that - made ourselves a bridge over the wall! C'mon!",
radiobase_area_cleared1_brit: "Acho que está limpo." #I think it's clear. ",
radio_op_sabre_drop_bomb_brit: "Meu Deus! Nada melhor além de terminar o dia com uma explosão!" #Crikey O'Reilly! Nothing like a good bang to end the day!",
radio_op_spawn2_amer: "Daí que está vindo a transmissão." #That's where we're broadcasting from. ",
radio_op_keep_trans_running_germ: "Protegem a caixa de fios, não deixem o gerador ficar sem gasolina. Simples." #Protect the fuse box. Don't let the generator go thirsty. Simple.",
radiobase_appro_gate3_brit: "Me atrevo dizer que vamos manter o pobre do Lange." #I dare say that'll be where they're keeping poor Lange.",
radiobase_got_the_radiodev2_amer: "Ok, vamos ligar o gravador, e rápido." #Okay - let's get that recording device hooked up, and fast.",
radio_op_sabre_missed1_germ: "Verdamnt! O piloto errou o alvo!" #Verdamnt! The bomber missed the target!",
radio_op_pick_up_dyna_complete2_germ: "Então temos tudo para explodir aquelas barras de aço. Para o rio!" #Then we have everything we need to deal with those steel bars. To the river!",
radio_op_activate_power_gen3_amer: "Nós temos que achar e ligá-lo." #We gotta find it and get it running.",
radiobase_2nd_barricade_tank_amer: "O tanque não pode passar pela barricada! Defendem!" #Tank can't get through the barricade! Defend it!!",
radio_op_wait_for_truck1_amer: "Onde tá a caminhonete? Sra. White falou que teria uma caminhonete!" #Where's the truck? Mrs. White said there'd be a truck!",
radiobase_place_flare1_brit: "Fiquem atentos, pessoal! O avião está vindo, temos que limpar o lugar e acender um sinalizador." #Look sharp, chaps! Plane's on the way, so we have to find clear ground to pop a flare.",
radio_op_pick_up_dyna_russ: "Temos dinamite, agora." #We take dynamite, now.",
radio_op_near_pod_amer: "E lá vamos nós, um pacote fresquinho." #Here we go, one fresh airdrop, good to go.",
radiobase_technician_died1_brit: "Lange! Não... Lange?!" #Lange! No... Lange?!",
radiobase_appro_gate2_germ: "Ah! Lange está lá. Tenho certeza." #Ah! Lange will be there. I am sure of it.",
radiobase_start_still_no_enemies_germ: "Esse silêncio. Estou com mal pressentimento." #This silence. It does not sit well with me.",
radiobase_gate_closed2_germ: "Deve ter um jeito de entrar." #Surely there must be another way in.",
radiobase_open_pod2_brit: "Esperamos que o gravador esteja inteiro. Vamos, seus imbecis." #Let's hope the recording device is intact. Come on, chaps.",
radiobase_appro_gate1_germ: "O acampamento está no outro lado do portão." #The camp will be beyond the gate.",
radiobase_technician_died3_germ: "Frau White ficará muito decepcionada conosco. Talvez o caderno dele vai compensar algo." #Frau White will be most displeased with us. Perhaps his notebooks will placate her.",
radiobase_connect_device1_brit: "Quase lá, cavalheiros! Precisamos conectar o gravador na torre do rádio." #Almost there, chaps! This recording device just needs to be hooked up to the radio tower.",
radiobase_device_destroyed4_amer: "Nós temos que chamar outra carga aqui. Acende um sinalizador e esperar chegar." #We gotta get another air drop here. Light the flare and wait for it.",
radiobase_barricade_down1_brit: "Droga! Eles chegaram na barricada!" #Blast! They got to the barricade!",
radio_op_near_pod_germ: "Hm, esperava algo mais grande. Dinamite é divertido, sim?" #Hm. I rather hoped for a bigger container. Dynamite is fun, yes?",
radiobase_tech_tank_destroy_main_gate: "O que foi isso!? Nein! O tanque destruiu o portão!" #What was that!? Nein! The Tiger destroyed the gate!",
radiobase_tank_long_route1_germ: "Rá! A ponte foi destruída!" #Ha! The bridge is gone!",
radio_op_send_new_mess_amer: "Ei, Sra. White tá chamando." #Hey, Mrs. White's calling. ",
radiobase_defend_technician_russ: "Muito bem! Vamos manter o alemão seguro!" #Very well! Let us keep the German safe!",
radiobase_clear_area_rem8_amer: "Então, como vamos nos livrar desses krauts e seguir em frente?" #So how's abouts we get rid of these krauts and get on with it?",
radiobase_technician_free11: "Quando eles perceberem que estou bisbilhotando as suas comunicações, eles vão mandar o meio exercíto para cá!" #When they realise I am tapping into their communications, they will send half the Army to stop it!",
radio_op_repair_fuse_box_complete_russ: "Novo fio. Tudo bom." #New fuse. All good.",
radiobase_tank_long_route1_russ: "Sem ponte para você, Sr. tanque!" #No bridge for you, Mr Tank!",
radiobase_tech_protect: "Lembrem-se, quando eu começar, eles vão atacar sem pensar duas vezes. Ficaria bem agradecido pela sua proteção." #Remember, when I start this process, they will attack without mercy. I would be grateful for your protection.",
radiobase_enemy_plant_dyna1_brit: "Sabotador! Na barricada!" #Sapper! At the barricade!",
radiobase_tools_picked_up2_brit: "Que maravilha, pessoal. Vamos levar as ferramentas para o Lange." #Jolly good, chaps. Let's get Lange his tools.",
radiobase_tech_1st_message: "Ja! Ja! Essa informação é valiosa!" #Ja! Ja! This data is most valuable!",
radiobase_stop_barricade1_germ: "Excelente, admiro uma boa barricada." #Excellent. I do admire a good barricade.",
radio_op_send_new_mess_complete_amer: "Tudo bem, hora de mandar uma nova mensagem..." #All right, time to get a new message off...",
radio_op_repair_fuse_box_complete_germ: "Caixa de fios consertado." #Fuse box is fixed. ",
radio_op_open_pod_russ: "Fumaça verde é o pacote, sim? Então, vamos até a fumaça verde." #Green smoke leads to airdrop, yes? So we go to green smoke.",
radio_op_open_pod_complete_germ: "Aqui, a carga está aberta agora." #Here, the drop is open now.",
radio_op_repair_fuse_box_complete2_brit: "Agora vamos manter eles longe da caixa de fios, que tal?" #Now let's keep them off the fuse box, shall we?",
radiobase_tech_near_top: "Estou quase... quase lá..." #I am almost... ALMOST there...",
radio_op_find_dynamite_complete_russ: "Rá! Dinamite aqui. Agora, planta nas barras!" #Hah! Dynamite here. Now - use on bars!",
radiobase_message_sent1_amer: "Ei, Lange? Conseguiu o quê queria?" #Hey Lange? You get what you needed?",
radiobase_find_flare_position2_amer: "Então eles vão saber onde soltar o pacote." #Then they'll know where to drop the package.",
radiobase_change_channel2_amer: "Muda pro outro canal. Tem que ter mais, e não vou deixar pela metade!" #Change to another channel. There's gotta be more, and I ain't one to leave a job half-finished!",
radiobase_place_flare2_amer: "Assim que eles verem o sinalizador, eles vão soltar o pacote. Bora!" #Once they see the flare, they'll drop the package. Let's go!",
radiobase_2nd_barricade_tank_germ: "A barricada está segurando o tanque! Defendem!" #The barricade is holding back the tank! Defend it!",
radiobase_tech_4th_message: "Ja! Isso é a informação bem interessante." #Ja! This is most interesting information.",
radiobase_tank_destroys_gate_amer: "Acho o portão externo se foi! Já fiquem preparados pro tanque!" #Think that was the outer gate! We can expect the tank now!",
radiobase_tank_destroy_gate3_brit: "Entrem no pátio. Continuem na defesa! Recuem!" #Get inside the yard. Keep defending!! Fall back!!",
radio_op_radio_call_white1_amer: "Sra. White? Tá na escuta? É o Broadsword, câmbio." #Mrs. White? You there? This is Broadsword, over.",
radiobase_defend_the_radiodev_brit: "Protegem o gravador, idiotas, esses desgraçados vão fazer de tudo para impedir a gravação!" #Protect the device, chaps - these buggers'll do anything to stop this recording!",
radiobase_defend_device2_germ: "Custe o que custar! Precisamos pegar aquela informação!" #Whatever it takes! We must get that intel!",
radiobase_new_plan2_brit: "Espera aí, imbecis. A barraca onde estava o Lange. Lá tinha um rádio. Talvez possamos pedir por uma carga com o gravador." #Hang on, chaps. The tent where we found Lange. There was a radio there. Perhaps we can call in an airdrop for a recording machine.",
radiobase_barricade_down5_germ: "Nós devemos triunfar em outro lugar. Recuem!" #We shall triumph elsewhere. Fall back!",
radiobase_2nd_barricade_defend2_russ: "Da! Ainda lutamos!" #Da! We still in fight!",
radiobase_2nd_barricade_defend1_amer: "Nós ainda temos outra barricada." #We still got another barricade. ",
radiobase_cut_cables2_russ: "Kurgan vê torre de rádio com cabos. Nós cortamos os cabos..." #Kurgan see radio tower held by cables. We cut the cables...",
radiobase_tank_destroy_gate1_russ: "O que foi... Oh, mamãe! Explodiram o portão!" #What was - oh mama! It blew the gate!",
radiobase_tools_picked_up2_russ: "Ah, ferramentas encontradas. Entregar ao Lange." #Ah. Tools are found. We give to Lange.",
radiobase_technician_died2_germ: "Eles o pegaram. Filhas da puta." #They got him. Those bastards.",
radiobase_deliver_tools1_germ: "Entreguem as ferramentas ao Herr Lange. Schnell!" #Get Herr Lange his tools. Schnell!",
radiobase_escape_via_tower_brit: "Excelente! Nós podemos usar o que resta da torre para subir a parede!" #Top hole! We can use what's left of the tower to get over the wall!",
radiobase_technician_alerts: "Ei, você! Vejo soldados entrando!" #Hey you! I see enemy soldiers moving in!",
radio_op_refuel_generator_amer: "O gerador tá ficando sem gasolina." #The generator's running outta gas. ",
radiobase_2nd_barricade_defend1_germ: "Ainda temos uma barricada!" #Still a barricade remaining!",
radiobase_codebook_recovered1_germ: "Fiquem calmos. O caderno está comigo." #Remain calm. The notebook is mine.",
radiobase_pick_up_device_complete_russ: "Kurgan tem o gravador. Vamos levar à torre do rádio." #Kurgan has device. We will take to radio tower.",
radiobase_stop_barricade3_amer: "Agora temos que manter desse jeito assim! Não deixem eles explodirem!" #Now we just gotta keep it there! Don't let 'em blast it!",
radiobase_tech_climb_down: "Estou descendo. Me protegem!" #I'm coming down now. Protect me!",
radiobase_stop_barricade1_russ: "Rá! Tanque está preso! Cuidem da barricada!" #Hah! Tank stuck! Look at the barricade!",
radio_op_find_dynamite2_amer: "Ei, estou vendo uma abertura aqui. Com essas barras de aço? É a nossa saída." #Hey, I see an opening over there. With the steel bars? That's the way out.",
radiobase_tank_destroys_gate_russ: "Lá se foi o portão externo! O tanque está chegando, Kurgan pensa!" #There goes the outer gate! The tank is coming, Kurgan think!",
radiobase_message_sent1_brit: "Lange, você conseguiu pegar tudo que precisava?" #Lange - did you get everything required of you?",
radiobase_find_tools_brit: "Maravilha, idiotas. Vocês ouviu ele. Vamos procurar as suas ferramentas." #Righty-o, chaps. You heard him. Let's find him those tools.",
radiobase_toolbox_close4_russ: "Hm, ferramentas do Lange, talvez?" #Hm. Lange's tools, maybe?",
radiobase_tech_7th_message: "O que isso quer dizer?" #What does this mean?",
radiobase_tech_hide: "Decidi que vou achar um lugar para se esconder!" #I have decided will find a place to hide!",
radiobase_tank_destroys_main1_russ: "O portão foi explodido pelo tanque!" #The gate has been blown by the tank!",
radiobase_inside_yard3_brit: "Concordo. Vamos limpar o pátio e resgatar ele." #Agreed. Let's clear out these jerries and rescue him.",
radiobase_tech_during_defense: "Essa barricada pode ser defendida! Ja!" #That barricade can be defended! Ja!",
radiobase_appro_gate2_amer: "Cinquenta pratas que vamos achar o Lange lá." #Fifty bucks says we'll find Lange there.",
radiobase_tools_picked_up2_amer: "Nada mal, pessoal. Levem as ferramentas para o Lange." #Not bad, guys. Get the tools to Lange.",
radiobase_prepare_for_attack2_russ: "Lange precisa de tempo. Nós barricar as portas!" #Lange needs time to work. We barricade doors!",
radiobase_retreat_brit: "Recuem para a torre!" #Orderly retreat back to the tower!",
radiobase_stop_barricade3_russ: "Fascistas tentando livrar da barricada! Parem eles!" #Fascists try to free it! Stop them!",
radiobase_new_plan1_amer: "Merda, temos que terminar o trabalho ou vamos voltar de mãos vazias. Como vamos pegar as informações para a Sra. White?" #Shit. We gotta finish the job or we can't go back. How do we get that intel for Mrs. White?",
radiobase_place_flare2_brit: "Então, eles podem entregar o pacote. Entenderam?" #Then they can drop the package. Understood?",
radiobase_find_flare_position1_brit: "Ok! Nós precisamos limpar a área e acender o sinalizador, o mais rápido possível." #Right-o! We need to find a clear area and crack open a flare, quick as you can.",
radiobase_plane_arrived1_amer: "Finalmente! Esse é o avião, bem ali!" #Finally! That's the plane, right there!",
radiobase_open_pod2_amer: "Um gravador chegando! Vamos." #One recording device coming up! Let's go.",
radiobase_open_pod2_germ: "Então nós vamos ter o gravador em breve. Excelente." #Then we will soon have the recording device. Excellent.",
radiobase_open_pod_complete_germ: "Bom, o pacote está aberto!" #Good - the package is open!",
radiobase_defend_device2_brit: "Defendem a qualquer custo! Nós temos que ter aquela informação!" #Defend it at any cost! We have to have that intel!",
radiobase_change_channel1_germ: "Não tem nada nessa frequência." #There is nothing more coming through on this frequency.",
radiobase_device_destroyed2_germ: "Então esperamos que o piloto tenha outro pacote." #Then we must hope the pilot has another they can drop in.",
radiobase_device_destroyed3_brit: "Vamos, cavalheiros, acendem outro sinalizador." #Quickly lads, get another flare lit up.",
radio_op_get_to_tower_complete_germ: "Sehr gut. Vamos seguir em frente." #Sehr gut. Let us proceed.",
radio_op_prepare_trans1_amer: "Vamos juntar essa merda toda na torre." #Let's get all this crap set up by the mast.",
radio_op_codemachine_placed_germ: "O Enigma está em posição." #The Enigma is in position.",
radio_op_recording_device_placed_russ: "Gravador pronto." #Recorder ready.",
radio_op_recording_device_placed_germ: "O gravador está no lugar e pronto." #The recorder is placed and ready.",
radio_op_prepare_trans_complete_russ: "Tudo está pronto." #All is good, ready to go.",
radio_op_activate_power_gen2_brit: "Deve ter um gerador por perto?" #Must be a generator here?",
radio_op_activate_power_gen_complete_amer: "Gerador está rodando!" #Generator's running!",
radio_op_send_new_mess2_brit: "Volta para o rádio!" #Get back on the radio!",
radio_op_start_trans_complete_amer: "Aê! Espero que a Sra. White entende essa porcaria toda!" #There! I hope Mrs. White understands all this crap!",
radio_op_keep_trans_running_complete_amer: "Ei, acho que terminamos aqui. A transmissão terminou!" #Hey, I think we're done. Transmission finished!",
radio_op_keep_trans_running_complete_russ: "A parte do rádio terminou. Hora da vodca." #All done with radio now. Is time for vodka.",
radio_op_repair_fuse_box_complete2_russ: "Tente novamente, fascista, vai ter uma bala passando pela sua cabeça, da?" #Try again, fascist, you will get bullet through brain, da?",
radio_op_repair_fuse_box_complete2_germ: "Certifique-se que fique desse jeito." #Ensure it stays that way.",
radio_op_refuel_generator_complete_amer: "Boa, isso vai mantar o gerador rodando!" #Great, that'll keep the generator going a little longer!",
radio_op_find_dynamite3_amer: "Então, nós temos que pessar pelas barras? Sem problema. Peguem a dinamite!" #So we gotta get through the bars? No problem. Get dynamite!",
radio_op_find_dynamite3_germ: "Então, precisamos de dinamite. Muito bom!" #Then we need dynamite. Very good!",
radio_op_find_dynamite_rem2_russ: "Dinamite, dinamite... venha para o Kurgan." #Dynamite, dynamite... come to Kurgan.",
radio_op_place_dynamite_complete_russ: "Dinamites vão explodir. Recuem se quiserem manter os braços e as pernas!" #Dynamite set. Back, back, if you like to keep limbs!",
radio_op_escape_russ: "Nós temos uma saída!" #We have way out! ",
radio_op_call_airdrop_dyna1_russ: "Nós vamos precisar de dinamite para escaparmos daqui." #We will need dynamite to make exit.",
radio_op_call_airdrop_dyna1_germ: "Nós vamos precisar de alguns dinamites, se quisermos escapar deste lugar." #We will surely need some dynamite if we are to escape this place.",
radio_op_call_airdrop_dyna2_russ: "Então, nós pedimos para as pessoas mandarem uma carga." #So we ask people at command to send airdrop.",
radio_op_open_pod_amer: "Tá vendo a fumaça verde? É o nosso pacote. Vamo lá abrir." #Y'see that green smoke? That's our airdrop. Let's go bust it open.",
radio_op_pick_up_dyna_complete1_germ: "Tenho o dinamite!" #Haha! I have the dynamite!",
radio_op_pick_up_dyna_complete2_amer: "Hora de dar tchauzinho pra essas barras, e cair fora daqui." #Time to kiss those damn steel bars goodbye, and get outta here.",
radiobase_call_mrs_white_rec1_1_amer: "Sim! As coisas sairam do controle aqui. Precisamos de um gravador agora mesmo. Não, não tenho tempo pra explicar. Pode mandar um?" #Aha! Yeah! Things have gone a bit crazy here. We need a recording device right away. No, I -- I can't explain right now. Can you send it?",
radiobase_post_spawn3_russ: "Silencioso ou não, Kurgan não liga, resgatar o Lange, usar a torre do rádio para roubar os segredos dos fascistas. Levar os segredos e Lange para base, simples." #Sneaky, not sneaky. Kurgan not care. Rescue Lange. Use radio tower to steal fascists' secrets. Bring secrets and Lange to base. Simple.",
radiobase_appro_gate3_amer: "Se o Lange ainda estiver vivo, aqui vai ser onde vão manter ele." #If Lange's still alive, that'll be where they're keeping him.",
radiobase_inside_yard1_russ: "Ouvi alguma coisa." #I hear something.",
radiobase_inside_yard1_germ: "Ouça! O quê foi isso?" #Listen! What is that?",
radiobase_inside_yard4_brit: "Vindo da barraca, deve ser o Lange." #Coming from the tent. Must be Lange.",
radiobase_inside_yard4_germ: "Daquela barraca. Com certeza é o Lange." #From that tent. It is most surely Lange.",
radiobase_franz_climb_down2_germ: "Desencadeia o inferno! Nós fomos muito longe para fracassar agora!" #Unleash hell! We have come too far to fail now!",
radiobase_tech_2mins_left: "Acho que eles estão mudando as comunicações. Posso dar o meu jeito nisso." #I think they are re-routing communications. I can work around this though.",
radio_op_get_to_tower_brit: "Então, isso é o nosso objetivo. Vamos lá." #Then that's our first objective. Let's get over there.",
radiobase_searching_for_wire_tools2_brit: "Procurem nessa área. Tenho certeza que as ferramentas estão por aqui, em algum lugar." #Search this area. I have an inkling the tools are around here, somewhere.",
radiobase_searching_for_wire_tools2_russ: "Ferramentas vivem em caixa de ferramentas. Caixa de ferramentas vão estar por perto, tenho certeza." #Tools live in toolbox. Toolbox will be close, I am sure",
radiobase_recording_is_done_russ: "Temos tudo agora, camaradas. Pegamos gravador, rápido." #We have it all now, comrades. We take recording device - quickly.",
radiobase_escape_via_tower_russ: "Grande torre caiu! Vamos usar para subir pela parede!" #Haha! Big tower crash! Use to get over wall!",
radiobase_escape_via_alley_amer: "Bem ali, o beco é a nossa saída!" #Right there - the alley's our way out!",
radiobase_escape_via_alley_germ: "Ali, o beco é a nossa saída!" #There - the alley is our way out!",
radio_op_contact_mrs_white_escape_brit: "Merda! Precisamos chamar a Sra. White pelo rádio para escapar daqui. Não enrolem!" #Crikey! We need to get Mrs. White on the radio so we can get out of here. Chop bloody chop",
radio_op_contact_mrs_white_escape_russ: "Inimigos estão se esforçando hoje! Nós chamar a Sra. White e escapar desse lugar. Rádio está perto, sim?" #Haha! Little men fight hard today! We contact Mrs. White and leave this place. Radio is close, yes?",
radio_op_radio_call_white1_germ: "Frau White, está me ouvindo? É o Broadsword, câmbio." #Frau White, are you receiving? This is Broadsword, over.",
radio_op_radio_call_white2: "Ouvindo alto e claro, Broadsword. Podem falar, câmbio." #Receiving you loud and clear Broadsword. Go ahead. Over.",
radio_op_radio_call_white3_russ: "Temos as gravações, desejamos sair daqui. Podem nos ajudar, sim? Câmbio." #We have recordings. We wish to leave now. You help us, yes? Over.",
radio_op_radio_call_white5_russ: "Vou falar para camaradas, obrigado. Câmbio, desligo." #I tell comrades. Thank you. Over and out.",
radio_op_radio_call_white5_germ: "Música para os meus ouvidos, Frau White. Câmbio, desligo." #Music to my ears, Frau White. Over and out.",
radio_op_drop_flare_complete_russ: "Acendi o sinalizador! Agora, correm, antes do grande caboom!" #Placed the flare! Now run, before the big boom!",
radio_op_sabre_drop_bomb_amer: "Viram isso? Na mosca!" #Oh-ho-ho! You see that? Right on the money!",
radio_op_sabre_drop_bomb_germ: "Nada melhor do que uma explosão bonita como essa para ficar animado!" #Haha! Nothing like a beautiful explosion to get the blood pumping!",
radio_op_wait_for_truck_complete_brit: "Lá vamos nós! O piloto chegou!" #Here we go! Driver's here!",
radio_op_wait_for_truck_complete_germ: "O piloto chegou!" #Aha! The driver has arrived!",
radio_op_escape_active_brit: "Vamos, pessoal, entrem!" #C'mon lads - get in!",
radio_op_escape_active_rem_russ: "Está bem! Vamos agora! Bora!" #Fine! We go now! Come on!",
radiobase_ambush1_brit: "Filha da puta! Emboscada!" #Bloody fuck! Ambush!",
radiobase_ambush1_amer: "Meu Deus! Emboscada!" #Christ! Ambush!",
radiobase_ambush1_russ: "É emboscada!" #It ambush!",
radiobase_ambush1_germ: "Achtung! Emboscada!" #Achtung! Ambush!",
radiobase_start_still_no_enemies_amer: "Sinto falta dos tiros e das explosões, sabe?" #Kinda miss the gunshots and explosions, y'know?",
radiobase_start_still_no_enemies_russ: "Quieto demais!" #Too quiet!",

