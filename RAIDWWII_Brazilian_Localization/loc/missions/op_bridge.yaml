# Objetivos
obj_ger_bridge_op_01_desc: "The truck is loaded with volatile aviation fuel. Keep the area around it clear of enemies!"
obj_ger_bridge_op_01_hl: "Escort the truck across the bridge"
obj_ger_bridge_op_02_desc: "The truck is at the bridge gate. Open the gate by activating the switch."
obj_ger_bridge_op_02_hl: "Open the bridge gate"
obj_ger_bridge_op_03_desc: "Nazis are going to try to close the gate! Keep them away from the switch!"
obj_ger_bridge_op_03_hl: "Defend gate switch"
obj_ger_bridge_op_04_desc: "You need to cover the gap in the bridge to allow the truck to cross. Find the wooden planks and place them across the gap."
obj_ger_bridge_op_04_hl: "Patch up the bridge"
obj_ger_bridge_op_05_desc: "There is a truck in your way. Push it off the bridge to let your truck get past."
obj_ger_bridge_op_05_hl: "Push the truck off the bridge"
obj_ger_bridge_op_06_desc: "The bridge exit is damaged, and the truck can't get past. Explosives should clear it. Call in an airdrop for dynamite."
obj_ger_bridge_op_06_hl: "Find flares"
obj_ger_bridge_op_07_desc: "Sabre Squadron can deliver an airdrop to the location marked with the flare."
obj_ger_bridge_op_07_hl: "Place the flare"
obj_ger_bridge_op_08_desc: "Sabre Squadron is on the way with dynamite. Stay alive!"
obj_ger_bridge_op_08_hl: "Wait for the airdrop"
obj_ger_bridge_op_09_desc: "Go to the airdrop and pick up the dynamite."
obj_ger_bridge_op_09_hl: "Collect the dynamite"
obj_ger_bridge_op_10_desc: "The dynamite needs to be placed at the bridge exit. This will clear a path for the truck."
obj_ger_bridge_op_10_hl: "Place the dynamite"
obj_ger_bridge_op_11_desc: "The path is clear! Follow the truck to the end of the bridge and escape."
obj_ger_bridge_op_11_hl: "Escape!"
obj_ger_bridge_op_12_desc: "The gate switch has been turned off. Turn it back on to get the gate open."
obj_ger_bridge_op_12_hl: "Turn the gate switch back on!"
obj_ger_bridge_op_13_desc: "The path for the truck isn't clear. Shoot the explosive barrels to clear the path forward."
obj_ger_bridge_op_13_hl: "Shoot the explosive barrels"
obj_ger_bridge_op_14_desc: "There is a fire blocking your path! Shoot at the water pipes to extinguish it!"
obj_ger_bridge_op_14_hl: "Extinguish the fire"
obj_ger_bridge_op_15_desc: "Water is pouring on the flames. Wait until the water from the pipes puts the the fire out."
obj_ger_bridge_op_15_hl: "Wait for the fire to be extinguished"