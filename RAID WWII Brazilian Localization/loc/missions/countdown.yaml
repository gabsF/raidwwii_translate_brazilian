# Nome e descrições
menu_silo_hl: "Countdown" #Countdown",
menu_silo_loading_desc: "Infiltre-se no complexo Bauvorhaben 20 e encontrem o silo. Destrua o míssil e o complexo, não deixem sobrar nada." #Infiltrate the Bauvorhaben 20 facility and find the missile silo. Destroy the rocket and the entire facility leaving nothing behind.",
menu_silo_desc: |
 Wernher Bachman, um cientista da resistência que foi designado para uma missão confidencial dos Nazistas chamada de "retribuição". A retribuição que estão planejando é na forma de um foguete gigante capaz de causar uma destruição inimaginável. Este foguete é capaz de chegar em locais a quilômetros do local de lançamento. Londres ou até lugares mais distantes não estarão seguros até acabarmos com essa operação. Eu vou guiá-los pelo complexo que os Nazistas chamam de Bauvorhaben 20 ao noroeste da Alemanha, e ajudarei a destruí-lo. Forneceremos os explosivos, vocês vão precisar de muito.$NL;
 - Entrem no complexo
 - Levem os explosivos até o silo
 - Coloquem combustível no foguete
 - Inicie a ignição
 - Fuja!
#Wernher Bachman, a resistance scientist has been recently assigned to a top-secret Nazi mission code named “retribution”. The retribution that they are planning comes in the form of a massive rocket capable of destruction like we haven't seen. This rocket is meant to be able to reach locations miles from its launch point. London or even further will not be safe until we dismantle their operation. I will personally guide you through the facility the Nazis are calling Bauvorhaben 20, in the north west of Germany and destroy it. We will supply you with the explosives, and you're going to need a lot of it.  

#- Break into the silo facility 
#- Transport the explosives to the silo
#- Get the fuel flowing throughout the rocket
#- Start the ignition sequence
#- Escape!",
silo_mission_photo_4_title: "A Câmara" #The Airlock",
silo_mission_photo_4_description: "Vocês nunca conseguirão entrar na sala principal do silo antes de passar pela câmara. Certifiquem-se de que todos estão dentro dela antes de prosseguirem." #You'll never be able to get into the main silo room without going through this airlock. Make sure the whole team are in this room when you cycle it.",
silo_mission_photo_1_title: "O Carrinho" #The Cart",
silo_mission_photo_1_description: "Vocês usarão um carrinho igual a este para transportar os explosivos pelo bunker." #You'll use a cart like this to transport all the explosives through the silo bunker.",
silo_mission_photo_2_title: "Painéis de Fusíveis das Portas" #Door Fuse Panels",
silo_mission_photo_2_description: "Muitas portas do bunker estão protegidas. Se elas estiverem fechadas, vocês precisarão acessar os fusíveis e abrir a porta manualmente." #Many of the doors throughout the silo bunker are guarded. If any of them are locked, you need to access these fuse panels to manually get the doors open.",
silo_mission_photo_3_title: "Painéis de Controle" #Control Panels",
silo_mission_photo_3_description: "Haverá painéis de controle espalhados pelo bunker que podem abrir portas para outros lugares." #Scattered throughout the bunker are control panels that can activate doors to open through the various rooms.",
silo_mission_photo_5_title: "O Foguete V2" #The V2 Rocket",
silo_mission_photo_5_description: "É por isso que vocês vieram aqui. Este foguete é revolucionário e pode virar o jogo em favor aos Nazistas. Ele precisa ser destruído." #This is what you came here for. This rocket is revolutionary and could turn the tide fully in the Nazis favour. It needs to be destroyed.",

