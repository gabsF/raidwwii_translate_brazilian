silo_line_31_brit: "Vamos sair daqui antes que de virarmos churrasco." #Let's get out of here before it's too hot for comfort.",
silo_line_31_russ: "Hora de ir. Tá muito quente aqui." #Time to go. It too hot here.",
silo_line_31_germ: "Vamos embora. Minhas botas estão começando a derreter." #Come, we must go. My boots are starting to melt.",
silo_line_32_russ: "Vamos agora, da?" #We go now, da?",
silo_line_33_germ: "Devemos ir. Agora!" #We must go. Now!",
silo_line_34_brit: "O mais rápido possível, senhores! Antes que o lugar exploda!" #Quick as you can, lads! Before this whole place is ablaze!",
silo_line_34_amer: "Vai, vai, vai! Esse lugar vai explodir!" #Go go go! This whole place is gonna blow!",
silo_line_34_russ: "Esse lugar todo irá queimar! Corram! Agora!" #Everything here will burn! Run! Now!",
#silo_get_out_germ: "" #",
silo_line_36_russ: "Temos que ir. Não fiquem para trás." #We must leave. Do not be left behind.",
silo_line_38_russ: "A fuga!" #The escape!",
silo_line_39_brit: "Bom, ainda bem. Vamos!" #Well, thank fuck for that. Go!",
silo_line_39_russ: "Ótimo! Hora de ir!" #Good! Time to go!",
silo_line_39_germ: "Bem na hora! Komst! Vamos!" #Just in time! Komst! We go!",
silo_line_40_amer: "Ahhh meeeeeeeerda!" #Ohhh fuuuuuuuuck!",
silo_line_41_germ: "Isso deixa o coração quentinho. Se bem que... acho que é outra coisa causando isso!" #It warms the heart. Although... perhaps something else is doing the warming!",
silo_line_42_brit: "Ah. Temos um pequeno bloqueio, interessante." #Ah. We have a little blockade, I see.",
silo_line_42_russ: "Caminho bloqueado!" #Way is blocked!",
silo_line_42_germ: "Hm. Probleminha. Estamos bloqueados." #Hm. A minor problem. We are blocked.",
silo_line_43_germ: "Hm. Temos que dar um jeito nisso." #Hm. Then we should deal with it. ",
silo_line_44_amer: "Deixem eles longe do maldito interruptor!" #Keep 'em off the damn switch!",
silo_line_45_brit: "Muito bem - o caminho está livre!" #Righty-ho - road's clear!",
silo_line_45_russ: "Vamos continuar empurrando!" #Can push again!",
silo_line_46_brit: "Certo, essa é a nossa rota de fuga, senhores! Todos juntos!" #Right, there's our escape path, lads! Everyone along it!",
silo_line_47_brit: "Essa escada é nossa melhor opção, eu devo dizer." #That ladder looks like our best bet, I dare say.",
silo_line_47_amer: "Essa escada parece promissora." #That ladder looks promising.",
silo_line_47_russ: "Bom. Ali tem uma escada. Vamos usá-la." #Yes. There is ladder. We use that.",
silo_line_47_germ: "De fato, e essa escada parece ser como faremos isso." #Indeed, and that ladder is surely how we can do just that.",
silo_line_48_brit: "Eu aposto que essa coisinha é o botão de ligar a energia." #I'd wager this little fellow must be the button to turn on the power.",
silo_line_48_germ: "Eu acredito que esse interruptor ligue a energia." #I believe this switch turns on the power.",
silo_npc_trigger_one: "Muito bem, senhores, vocês entraram na toca do leão. O primeiro obstáculo é passar pelas portas da entrada. Terá painéis com fusíveis por perto. Vocês vão ter que improvisar se estiverem trancadas." #Well done chaps, you made it into the hornets nest. First hurdle, get past the entrance doors. There'll have fuse panels controlling them. You’ll have to improvise if their locked.",
silo_npc_trigger_three: "Bom, vocês ainda estão vivos. O foguete V2 deve estar por perto. Com sorte, logo depois da câmara. Certfiquem-se de liberar bastante combustível pelo silo." #Well you're still alive. It seems so you must be near the V2 rocket by now. Hopefully your past the airlock. Be sure to get as much rocket fuel flowing through the silo system.",
silo_pck_defend_the_valves_var1_amer: "Estão tentando desligar as válvulas! Parem eles!" #They're trying to shut off the valves! Get 'em!",
silo_pck_defend_the_valves_var1_germ: "Eles estão na válvula. Pare-os antes que fechem!" #They are at the valve. Stop them before they close it!",
silo_pck_defend_the_valves_var2_brit: "Estão fechando a válvula! Parem os malditos!" #They're closing the valve! Stop the buggers!",
silo_pck_defend_the_valves_var2_germ: "Não os deixem fechar a válvula!" #Do not let them close the valve!",
silo_pck_spawn1_russ: "Bah, Kurgan escala com estilo! Vamos encontrar o foguete V2." #Bah, Kurgan climb much! Now need to find V2 rocket.",
silo_pck_spawn1_germ: "Essa escalada foi algo e tanto. Vamos torcer para o foguete V2 estar perto." #That climb was quite something. Let us hope the V2 rocket is close by.",
silo_pck_spawn2_russ: "Empurrar o carrinho, da?" #Push cart, da?",
silo_pck_spawn2_germ: "Já fizemos coisas muito menos dignas. Empurrem o carrinho!" #We have done far less dignified things. Push the cart!",
silo_pck_entering_silo_room1_germ: "A engenharia alemã criou um foguete e tanto!" #German engineering has created quite a sizable rocket!",
silo_pck_entering_silo_room2_amer: "Quando maior o tamanho, melhor a queda." #The bigger they build it the hard its gonna come down.",
silo_pck_entering_silo_room2_russ: "Kurgan acredita que consegue destruir o foguetão." #Kurgan believes can make big rocket into no rocket.",
silo_pck_entering_silo_room2_germ: "Não importa o tamanho, vamos transformar isso em sucata." #No matter the size, we can turn this into the sum of its parts.",
silo_pck_look_for_valves1_brit: "Os reguladores da válvula precisam ser abertos para o combustível fluir. Então..." #The valve regulators need to be opened up to get the fuel flowing. So then....",
silo_pck_look_for_valves1_amer: "Precisamos achar os reguladores das válvulas e abri-los. Eu acho..." #Gotta find those valve regulators and open em up. I'd say...",
silo_pck_look_for_valves1_russ: "Válvula, eguladores, Kurgan quer achar todos. Eu acho que..." #Valve, regulators, Kurgan want to find them all. So I think...",
silo_pck_look_for_valves1_germ: "Os reguladores das válvulas é o próximo passo. Então eu diria que..." #The valve regulators are the next job to open up. I'd like to say...",
silo_pck_look_for_valves2_brit: "Estamos procurando válvulas. Olhem em volta." #We're looking for valves. Search around.",
silo_pck_look_for_valves2_amer: "As válvulas devem estar por aqui." #Valves gotta be around here somewhere.",
silo_pck_destroy_silo_hatch_brit: "Eu diria que é hora de destruir a escotilha do silo!" #Time to take out the Silo hatch I say!",
silo_pck_destroy_silo_hatch_amer: "Precisamos destruir a escotilha do silo!" #Gotta get this silo hatch taken out!",
silo_pck_destroy_silo_hatch_russ: "Kurgan diz que a escotilha deve abrir!" #Silo hatch must come off Kurgan say!",
silo_pck_destroy_silo_hatch_germ: "Uma escotilha deve ser algo simples de remover!" #A Silo hatch should be a simple thing to remove!",
silo_pck_shoot_hinges_russ: "Atirem na dobradiça!" #Shoot the hinge!",
silo_pck_shoot_hinges_germ: "Precisamos atirar na dobradiça!" #We must shoot the hinge!",
silo_pck_hinges_shot_brit: "Dobradiças quebradas!" #Hinges are free!",
silo_pck_hinges_shot_amer: "Todas as dobradiças quebraram!" #That's all the hinges off!",
silo_pck_hinges_shot_russ: "Dobradiças removidas." #Hinges removed.",
silo_pck_hinges_shot_germ: "As dobradiças foram quebradas." #The hinges are all removed.",
player_gen_placed_one_brit: "Foi a primeira!" #That's the first!",
player_gen_placed_one_amer: "Uma pronta!" #One done!",
player_gen_placed_one_russ: "Primeira pronta!" #First done!",
player_gen_placed_one_germ: "Sim, uma!" #Yeah, one!",
bank_approaching_vault1_amer: "Jesus Cristo, olhem a porta desse cofre!" #Jesus Christ, look at that vault door!",
bank_approaching_vault1_russ: "Esse cofre é gigante!" #The vault door is huge!",
bank_approaching_vault1_germ: "Mein Gott, essa porta é enorme!" #Mein Gott, that vault door is huge!",
bank_approaching_vault2_brit: "Mesmo se o Sabre explodisse nela, duvido que faria alguma coisa." #Even if Sabre hit them bang, I doubt that it would scratch that.",
bank_approaching_vault2_amer: "Eu duvido que até bombas Sabre Squadron abririam isso." #I doubt it even Sabre Squadron bombs could crack that.",
bank_approaching_vault2_russ: "Kurgan acha que bombas nem arranhariam." #Bombs would not make dent, Kurgan think.",
bank_approaching_vault2_germ: "Eu duvido que bombas abririam isso." #I'm doubtfully even bombs would break that open.",
bank_approaching_vault3_brit: "Então, como diabos entraremos?" #So, how the hell do we get in to it?",
bank_approaching_vault3_amer: "Então, como estamos pensando em entrar?" #So, how we thinking we can get in to it?",
bank_approaching_vault3_russ: "Então, como entramos?" #So, how we get in?",
bank_approaching_vault3_germ: "Então, como vamos entrar?" #So, how we supposed to get in?",
flakturm_enemies_dash_out1_brit: "Funcionou!" #It worked!",
flakturm_enemies_dash_out1_amer: "Puta merda, funcionou!" #Holy shit, it worked!",
flakturm_enemies_dash_out1_russ: "Funcionou!" #It work!",
flakturm_enemies_dash_out1_germ: "Ah meu... Funcionou!" #Oh my, It worked!"

# Objetivos [AS LINHAS COM "_hl" NÃO PRECISAM DE PONTO FINAL]
silo_fuel_the_rocket_break_hl: "Quebre a Válvula do Combustível" #Break the Fuel Valve",
silo_shoot_hinges_hl: "Atire nas Dobradiças da Escotilha do Silo" #Shoot the Silo Roof Hatch Hinges",
silo_enter_boat_and_escape_hl: "Entre no Barco e Fuja" #Enter the Boat and Escape",
silo_fuel_the_rocket_def_hl: "Proteja a Válvula" #Defend the Fuel Valve",
silo_destroy_barricade_hl: "Destrua a Barricada" #Destroy the barricade",
silo_transfer_the_fuel_hl: "Abra as Válvulas de Combustível do Foguete" #Open the Rocket Fuel Valves",
silo_extend_the_walkway_hl: "Ative a Passarela do Silo" #Activate the Silo Walkway",
silo_move_payload_final_hl: "Leve o Carrinho até a Bomba de Combustível" #Push the Cart to Master Fuel Pump",
silo_fuel_the_rocket_hl: "Abra a Válvula de Abastecimento do Foguete" #Open the Rocket Fueling Valve",
silo_go_and_open_the_door_hl: "Encontre e Ative o Painel de Controle" #Find and Activate the Control Panel",
silo_lower_the_bridge_hl: "Encontre e Ative o Interruptor da Plataforma" #Find and Activate the Platform Switch",
silo_cycle_the_airlock_hl: "Ative o Interruptor da Câmara" #Activate the Airlock Switch",
silo_back_to_the_airlock_hl: "Volte à Câmara" #Return to the Airlock",
silo_continue_push_payload_hl: "Empurre o Carrinho" #Push the Cart",
silo_sabotage_the_rocket_hl: "Prepare o Sistema de Ignição do Foguete" #Prepare the rocket ignition system",
silo_initiate_the_countdown_hl: "Ative os Controles de Lançamento" #Activate the Launch Controls",
silo_rewire_the_panels_hl: "Cause um Curto nos Painéis" #Rewire the Fuse Panels",
silo_resume_lowering_bridge_hl: "Reative a Plataforma" #Reactivate the Platform Switch",
silo_reactivate_gas_loud_def_hl: "Reabra os Reguladores de Combustível" #Re-open the fuel regulators",
silo_jump_off_hl: "Pule no Barco de Fuga!" #Jump onto the Escape Boat!",
silo_regroup_airlock_hl: "Reagrupe dentro da câmara" #Regroup inside airlock",
silo_start_push_payload_hl: "Empurre o Carrinho" #Push the Cart",
silo_tip_the_cart_hl: "Tombe o Carrinho" #Tip over the Cart",
silo_wait_for_bridge_hl: "Proteja o Interruptor da Plataforma" #Defend the Platform Switch",
silo_shot_the_panels_hl: "Atire nos Painéis" #Shoot the Fuse Panels",
silo_get_out_hl: "Fuja do Complexo" #Escape the Facility",
silo_wait_for_bridge_desc: "Você precisa abaixar a plataforma para o carrinho passar. Defenda o interruptor até que a plataforma abaixe até a altura correta." #You need the platform to lower in order to get the cart across. Defend the Platform Switch until the platform lowers to the correct level.",
silo_move_payload_final_desc: "Ao posicionar o carrinho perto da bomba de combustível, você pode causar uma violenta reação de explosões." #By positioning the cart close to the master fuel pump, you can cause the greatest explosive reaction with the explosives.",
silo_rewire_the_panels_desc: "Os painéis estão expostos, cause um curto-circuito para abrir as portas." #The fuse panels are now exposed, rewire them to get the doors open.",
silo_destroy_barricade_desc: "A barricada está bloqueando o carrinho. Destrua-a para continuar!" #The wooden barricade is blocking the cart. Destroy it and continue pushing forward!",
silo_shot_the_panels_desc: "A porta foi trancada. Atire nos painéis para abri-los." #The door has been locked. Shoot at the fuse panels to get them open.",
silo_regroup_airlock_desc: "Todos devem entrar na câmara, não fique para trás." #Everyone must go inside the airlock, don't fall behind",
silo_continue_push_payload_desc: "Mova o carrinho pelo bunker." #Move the cart through the silo bunker.",
silo_fuel_the_rocket_break_desc: "Há combustível suficiente no sistema conectado ao foguete. Quebre a válvula para impedir o combustível de ser removido." #There is enough fuel in the system connected to the rocket. Break the valve to make sure the fuel cannot be removed.",
silo_sabotage_the_rocket_desc: "Abra o painel do foguete e mexa nele, deixando-o pronto para ignição." #Open the panel on the rocket and tamper with it, getting it ready for ignition.",
silo_resume_lowering_bridge_desc: "O interruptor da plataforma foi desativado. Volte e reative-o." #The platform switch has been deactivated. Go back to the platform switch console and reactivate it.",
silo_tip_the_cart_desc: "Derrube todos os explosivos no chão. Tombe o carrinho." #Get all the explosives onto the ground. Push the cart over.",
silo_extend_the_walkway_desc: "Interaja no console para extender a passarela." #Interact with the console to extend the silo walkway.",
silo_enter_boat_and_escape_desc: "Entre no barco de fuga e vá para o mais longe possível da explosão!" #Enter the escape boat and get as far away as possible from the imminent explosion!",
silo_start_push_payload_desc: "O carrinho cheio de explosivos deve ser levado ao silo. Empurre-o pelo bunker." #The cart full of explosives needs to be taken to the silo. Push it through the bunker.",
silo_initiate_the_countdown_desc: "Vá até o painel de controle e inicie a ignição. O combustível vai queimar o complexo todo!" #Go to the launch control panel and initiate the ignition. The fuel will burn through the whole facility! ",
silo_shoot_hinges_desc: "Atire para destruir as dobradiças no teto do silo para que o foguete não seja lançado." #Shoot to sabotage the hinges to the silo roof hatch so that the rocket cannot be launched.",
silo_lower_the_bridge_desc: "A caminho a frente está bloqueado. A plataforma precisa ser abaixada para continuar movendo o carrinho. Encontre o interruptor e ative-o." #The way forward is blocked. The platform needs to be lowered so you can continue moving the cart. Find the platform switch and activate it.",
silo_fuel_the_rocket_desc: "Abra as válvulas que mandam combustível para o foguete e o bunker." #Open the valves that run fuel into the rockets and bunker system.",
silo_fuel_the_rocket_def_desc: "O combustível está passando pelo foguete, certifique-se de que as válvulas não podem ser desligadas." #While rocket fuel is running through the rocket fueling system, make sure the valves are not turned back off.",
silo_cycle_the_airlock_desc: "As portas da câmara para o silo não abrirão até que você ative o interruptor." #The airlock doors to the silo room won't open until the airlock is cycled. Activate the switch.",
silo_go_and_open_the_door_desc: "Encontre e ative o painel de controle para abrir a porta." #Find and activate a control panel to open the door.",
silo_reactivate_gas_loud_def_desc: "Os reguladores controlam o fluxo de combustível. Reabra eles e aumente o fluxo de combustível nos canos." #The regulators control the flow of fuel. Re-Open them up and increase the flow of fuel by turning the pipe valves.",
silo_jump_off_desc: "Pule para acionar o paraquedas e fugir da destruição do complexo!" #Jump to activate your parachute while you escape the destruction of the facility!",
silo_transfer_the_fuel_desc: "Precisamos fazer o combustível fluir para o foguete. Abra as válvulas." #We need to get fuel flowing into the rocket. Go to the fuel valves and open them.",
silo_back_to_the_airlock_desc: "O complexo está prestes a explodir! Vá para a câmara e puxe a alavanca." #The facility is about to explode! Go to the Airlock and pull the lever.",
silo_get_out_desc: "Encontre uma saída antes que as explosões destruam todo o complexo." #Find an exit before the explosive chain reaction destroys the whole facility.",