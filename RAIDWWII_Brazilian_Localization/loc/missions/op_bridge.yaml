# Nomes e descrições
menu_ger_oper_02_event_3_name: "Urgent Delivery"
menu_ger_oper_rhinegold_event_3_progress_text: "The truck with the spiked barrels of aviation fuel is on its way to Schloss Blomberg. However, it has stopped at the Elbe Bridge. Ensure that it crosses the bridge safely.\n\n- Remove obstacles from the bridge\n- Ensure the Resistance truck makes it across\n- Escape"
rhinegold_mission_photo_5_description: "Your mission is to escort a truck chock-full of aviation fuel across the bridge. Needless to say, should the truck sustain too much damage, it’s likely you will too."
rhinegold_mission_photo_5_title: "Truck Escort"
menu_ger_oper_rhinegold_event_3_loading_text: "Ensure that the truck with the barrels of fuel crosses the Elbe Bridge safely."

