# Cena dos créditos
01_credits_001: "E agora, por favor, lembre-se dos homens e mulheres que estiveram aqui antes de você."
01_credits_002: "Que pavimentaram o caminho pela sua glória e fortuna."
01_credits_003: "Eles escravizaram os seus escritores pelo seu dinheiro."
01_credits_004: "Eles suaram durante as reuniões."
01_credits_005: "Mandaram cartas por horas e beberam café até não conseguirem mais."
01_credits_006: "São os desenvolvedores e sacrificaram muito pela a causa."
01_credits_007: "Invadem em memória destes leões."

# Cena da introdução
01_intro_003: "A situação é a seguinte. Hitler está vencendo." #The situation is this. Hitler is winning.",
01_intro_005: "E vocês são essas tais medidas. Vocês são os melhores, mais capazes assassinos que podemos achar." #And you are those measures. You’re the best, most capable killers we can find.",
01_intro_0012: "Não teremos misericórdia. Sem regras. Isso não é guerra de bonequinha." #We will be merciless. No rules. This isn’t a gentleman’s war.",
01_intro_006: "As suas habilidades são inigualáveis. São sobreviventes. E vão fazer um trabalho bem feito." #Your skills are second to none. You’re survivors. And you get the job done.",
01_intro_0013: "Explodem os seus trens, derrubem as suas pontes, queimem os inimigos vivos." #Blast their trains, blow their bridges, burn the enemy alive.",
01_intro_007: "E o trabalho que precisamos fazer é ganhar esta guerra." #And the job we need doing is winning this war.",
01_intro_002: "Agora, eu sou Diretor, então presta bem atenção, por favor." #Now, I’m Control so listen carefully, please.",
01_intro_0014: "Agora, depois de ter lido os seus arquivos, não espero que pessoas como vocês tenham um senso de dever-" #Now, having read your files I don’t expect fellows like you to do this purely out of a sense of duty-",
01_intro_004: "Então, precisamos de medidas drásticas." #So, we need drastic measures.",
01_intro_009: "Resumo, deixe a Europa em chamas, por assim dizer." #In short, set Europe ablaze, as it were.",
01_intro_001: "Ah, olá!" #Ah, hello!",
01_intro_0016: "Livros de história não vão lembrar de vocês, mas os seus feitos vão definir. Boa sorte." #History won’t remember you, but your deeds will define it. Good luck.",
01_intro_0010: "Nosso alvo: Hitler." #Our target: Hitler.",
01_intro_0011: "Esse chucrute bunda-mole e os seus malditos nazistinhas e tudo que eles apoiam." #That short-arsed Kraut and his nasty Nazi friends and everything they stand for.",
01_intro_008: "Churchill nos deu uma missão, atacar o Reich por quaisquer métodos." #Churchill has given us a mission - attack the Reich any way we can.",
01_intro_0015: "então se um pouquinho do ouro nazista, por acaso, sumir, não vamos fazer perguntas." #so if a little Nazi gold happens to go missing no questions will be asked.",

