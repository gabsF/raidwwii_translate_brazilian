# Traduzido por gabsF
# O Acampamento
menu_camp_hl: "O Acampamento"

# O Acampamento (legendas)
camp_train_op_post_fail_var1_germ: "Nós fracassamos. Por mais que estamos vivos por mais um dia, temo que o Heimdall vai ter proteção máxima. Que merda." #We have failed. While we live to fight another day, I fear that Heimdall will now be heavily protected. Damn it all.",
camp_train_op_pre_var1_germ: "Heimdall. Interessante. Vamos! Estou ansioso para ver o quê estão movendo no ferroviário." #Heimdall. Most intriguing. Come! I am most keen to see that is moving through the railyard. ",
camp_train_raid_post_fail_var1_germ: "Para algo tão bonito quanto a Câmara de Âmbar para ficar preso com esses cachorros... É uma grande perda para a cultura. E, para nós, uma derrota sem dignidade." #For something as beautiful as the Amber Room to be stuck with such dogs... this is a great loss for culture. And, for us, a most undignified defeat.",
camp_train_op_post_fail_var1_amer: "Não. Não dá pra acreditar uma porra dessa, que a gente deixou esses filhas da puta passar pela gente com as armas anti-aéreas. Tem que ser um pesadelo." #No. I can't believe we just let those shitbirds walk all over us and get their AA guns past us. S'gotta be a bad fucking dream.",
camp_train_op_post_success_var1_amer: "Mais um trabalho bem feito. Quero dizer, passar pelo ferroviário e explodindo um pá de armas anti-aéreas não é algo que chamaria de 'trabalho', mas, ei, estamos sendo pago, então já é trabalho, não é?" #Another job well done. I mean, strolling into a rail yard and blowing up a whole bunch of AA guns isn't exactly what I'd call 'work', but hey, if someone's paying us, it's a job, right?",
camp_train_op_post_fail_var1_brit: "Só tinhamo que explodir a porra das armas! Seja lá quem for Heimdall, vai estar bem protegido, que só vai complicar as coisas pro nosso lado. Merda." #We only had to blow the bloody guns up! Whatever Heimdall is, it's now going to be jolly well protected, which will only make our job harder. Shit.",
camp_train_raid_post_success_var1_germ: "Vocês têm meu respeito, cavalheiros. Para recuperar a Câmara de Âmbar é um belo chute no saco dos nazistas. Bom... para aqueles que deixamos ainda respirando. Qualquer coisa que podemos fazer para arruinar a vida deles já vale a pena. Então, o quê vamos fazer agora?" #You have my respect, gentlemen. To recover the Amber Room is to truly embarrass the Nazis. Well... those we left breathing. Anything we can do to ruin their efforts is well worth our own effort. So - where to, next?",
camp_train_op_pre_var1_russ: "Sra. White disse destruir o quê tiver no trem. Mas também destruir os fascistas, da?" #Mrs. White say destroy what is on train. But we also destroy the fascists, da? ",
camp_train_op_post_success_var1_russ: "Nós fizemos ótimo. Mas se fizemos isso de novo, eu quero as armas anti-aéreas. Sou homem grande, preciso de arma grande. Isso vocês entende." #We did very good. But if we ever do such things again, I want to use AA gun for myself. I am big man, I need the big gun. This you understand.",
camp_train_raid_post_fail_var1_amer: "Não dá pra acreditar que esses filhas da puta nos derrotaram. A Câmara de Âmbar? Quem é que liga. Deixar aqueles desgraçados pensarem que são melhores do que a gente? Aí não dá pra deixar." #I can't believe those shitbirds got us beat. Amber Room? Who gives a shit. Letting those assholes think they're better than us? No, I can't let that go.",
camp_train_raid_post_fail_var1_brit: "Verdade seja dita, Câmara de Âmbar não significa lá essas coisas para mim. Mas mijar nas calças daquele jeito pode deixar a Sra. White brava com a gente. Bora ficar atentos com isso, vamos?" #The Amber Room means bugger all to me, truth be told. But us pissing the bed like that could put us on the wrong side of Mrs. White. Let's get our bloody act together, shall we?",
camp_train_raid_post_success_var1_brit: "Trabalho bem feito, cavalheiros. Nós resgatamos um tesouro, e botamos alguns fascistas nas covas. Além de termos roubados um pouco do ouro. Que maravilha!" #Top work today, lads. We rescued a treasure, and flattened a few fascists. Netted a lovely bit of lolly from it all too. Jolly good!",
camp_train_raid_pre_var1_germ: "Não tenho problema com tal roubo, desde que podemos matar alguns dos schweins guardando a Câmara de Âmbar. Ah, é um belo dia quando rebaixamos o inimigo." #Such a daring robbery is fine by me, on the condition that we have the opportunity to eliminate some of the schweins guarding the Amber Room. Ah! It is a fine day when we thin the ranks of the enemy.",
camp_train_raid_pre_var1_brit: "A Câmara de Âmbar não tem preço, é? Bom, espero que a mulher não puxa o tapete quando chegar a hora de pagar a gente. Porquê, sim, tudo tem preço." #Amber Room is priceless, eh? Well, I hope the old girl doesn't try and pull that shit when it comes to getting paid. 'Cos everything has a price. ",
camp_train_op_post_success_var1_germ: "Então, eram armas anti-aéreas que estavam sendo transportadas para o Heimdall. Defesas, com certeza, mas estava pensando que seria para algo específico. Frau White saberá mais." #So, it was AA guns being shipped to Heimdall. Defences, for sure, but I am thinking their role was something more specific. Frau White will know more.",
camp_train_op_pre_var1_amer: "Nada como uma demolição localizada para começar o seu dia, heh. Nós entramos e derrubamos a artilharia. Pois é, tá falando a minha língua." #Nothing like a little localised demolition to start your day the right way, heh. We get in, we take out a whole bunch'a flak guns. Yeah, sounds like my kinda job.",
camp_train_raid_pre_var1_amer: "Entramos de fininho, roubamos um tesouro valioso e cairemos fora junto com a Câmara de Âmbar inteirinhos? Tá parecendo o tipo de loucura que sempre fazemos, não acha?" #Sneak in, steal a priceless treasure, get out with both us and the Amber Room in one piece? Sounds like the crazy kind of mission that we excel at, don'cha think?",
camp_train_op_pre_var1_brit: "Me pergunto quem seria esse tal de Heimdall? Só há um jeito de descobrir, para o ferroviário!" #Wonder what this Heimdall is? Only one way to find out - to the rail yard!",
camp_train_raid_post_success_var1_amer: "Arrebentar daquele jeito me fez pensar, talvez deveríamos melhorar este lugar? Ter a nossa própria Câmara de Âmbar. Não...?" #Kickin' ass like we did today got me thinking - maybe we should upgrade this place? Get our own little Amber Room thing going on here. No...?",
camp_train_raid_post_success_var1_russ: "Hoje, somos o orgulho da Rússia, tenho certeza. A Câmara de Âmbar é muito especial, mas destruir ladrões, isso sim é especial para mim. Bom trabalho." #Today, we are pride of Russia, I am sure. Amber Room is very special, but destroying the thieves - that is special to me. Good work.",
camp_train_raid_pre_var1_russ: "Eu não saber se você quer ser silencioso, ou fazer barulho, mas devemos punir os fascistas por roubar a Rússia. Isso podemos concordar, tenho certeza." #I not know if you  wish to be sneaky, or make the noise, but we must punish the fascists for stealing from Russia. That much we all agree on, I am sure.",
camp_train_raid_post_fail_var1_russ: "Para perder a Câmara de Âmbar é um chute no saco. Todos nós cometemos erros? Eu não. Estou muito decepcionado." #To lose Amber Room is heavy blow. Did all of us make mistakes? I do not make mistakes. I am very disappointed.",
camp_train_op_post_success_var1_brit: "Então... armas anti-aéreas. Ora, ora, ora. Os alemães realmente não querem ninguém voando próximo do Heimdall, disso tenho certza. Me pergunto quem é esse cara." #So... AA guns. Well, well, well. Jerry really doesn't want anyone flying anywhere near Heimdall, that's for sure. Wonder what the bugger is.",
camp_train_op_post_fail_var1_russ: "Fracassamos no ferroviário. Isso ser ruim. Bem ruim." #We fail at railyard. This bad. This very bad. ",

camp_bridge_op_post_success_var1_russ: "Muito bom cada um de nós ter dois braços, duas pernas. Isso é sempre bom! MUITO bom." #Very good each of us has two arms, two legs. This is always good! VERY good.",
camp_bridge_op_post_fail_var1_amer: "Nem consigo lembrar de como a gente conseguiu se safar dessa. Escoltar uma caminhonete foi uma coisa, mas cheio de gasolina pra aviação? Cê acha que estávamos prontos pra isso?" #I can't even remember how we got outta that one. Escorting the truck was one thing, but a truck full of goddamn aviation fuel? Ya think we were ready for it?",
camp_bridge_op_pre_var1_germ: "Cruzando uma ponte cheio de nazistas é uma coisa. Agora isso enquanto escolta um caminhão cheio de gasolina. Ora, vamos pegar uma unterwasche extra." #Crossing a bridge covered in Nazis is one thing. To do that while escorting a truck laden with fuel. Well, let us just pack extra unterwasche.",
camp_bridge_op_post_success_var1_amer: "Eu não ligo pra quem você reza, alguém tem que estar servindo de anjo da guarda pra gente. Agora, que tal a ideia de ver a bagunça que podemos fazer com um caminhão cheio de gasolina, eh?" #I don't care who you pray to, someone's gotta be looking out for us. Now, how's about we go see what kinda mess a truck-load of aviation fuel can make, eh?",
camp_bridge_raid_post_success_var1_germ: "Ah, uma bela vista da nossa força, cavalheiros. A ponte destruída já seria recompensador, mas sermos pagos com uma pequena fortuna de ouro... rá! Que belo dia de trabalho." #Ah, a fine display of our might, gentlemen. The wrecked bridge would be reward enough, but to obtain the small fortune of gold as we did... hah! A fine day's work.",
camp_bridge_op_post_success_var1_germ: "Eu vejo um pequeno valor em escrutinar as várias causas da nossa vitória. Tenho certeza que sou uma delas. Mas hoje direi que todos nós fomos excelentes. Vamos continuar assim, ja?" #I see small value in scrutinising the many causes of our success. I am certainly one of them. But today I will concede that we all did very well. Let us continue, ja?",
camp_bridge_raid_post_fail_var1_germ: "Foi cedo demais para comemorar? Essa missão estava realmente difícil para nós? Seja lá o quê foi, fracassamos. Rezem que isso nunca aconteça novamente." #Were we too hasty to assume victory? Was this mission truly beyond our capabilities? Either way, we failed. Pray this never happens again.",
camp_bridge_raid_pre_var1_germ: "Frau White só tem que falar em ouro, que terá o meu interesse nesta invasão. Além de podermos explodir uma ponte... rá! Vamos logo, agora!" #Frau White only had to mention gold, and you are assured of my interest in this raid. Couple it with getting to blow a bridge... Hah! I wish to get going, now!",
camp_bridge_raid_post_success_var1_russ: "Muito bom. Ponte destruída, fascistas esmagados, e muito ouro para Sra. White. Nós somos impressionantes." #Very good. Bridge smashed, fascists crushed, and much gold for Mrs. White. We are most impressive. ",
camp_bridge_op_pre_var1_russ: "Da, nós provavelmente explodir em pedaços, escoltar caminhão, mas se matarmos nazistas primeiro, talvez viveremos." #Da, we probably be blown to bits, escorting truck, but if we kill little Nazis first, maybe we live. ",
camp_bridge_raid_post_success_var1_brit: "Amo o cheiro da demolição na manhã. De noite também. Um belo de um grande roubo e... melhor dia, não diria?" #Love the smell of demolition in the morning. Evening too, come to that. Pop in a spot of grand theft and... best day ever, wouldn't you say?",
camp_bridge_op_post_fail_var1_germ: "Verdamnt! Como isso deu errado? A missão tinha riscos, certeza. Como nós deixamos aqueles schweins nos superar? Só... me deixa ficar só." #Verdamnt! How did that go wrong? The task was with its risks, for sure. So how did we let those schweins get the better of us? Just... leave me be.",
camp_bridge_op_post_success_var1_brit: "Orgulhoso que nós safamos dessa. Ênfase no safamos, considerando a explosão da última missão. Diria que merecemos os últimos três hurras, né?" #Rather proud we walked away from that one. Emphasis on walk, given the explosive potential of that last mission. I'd say we've earnt at least three hurrahs, yes?",
camp_bridge_op_post_fail_var1_russ: "Não era o plano que não era perfeito. É maluco, sim, mas não há desculpas para o fracasso. Não devemos deixar os fascistas vencerem, nunca mais." #It was not plan that was flawed. It crazy, yes, but there no excuse for failure. We must not let fascists beat us, never again.",
camp_bridge_raid_post_success_var1_amer: "Olha, não sou o tipo de se exibir, mas... ah, quem eu tô querendo enganar? Nós destruímos uma ponte! Eu poderia fazer isso todo dia." #Look - I'm not one to brag but... aw, who am I kidding? We tore that bridge up! I could do shit like that all damn day.",
camp_bridge_raid_post_fail_var1_amer: "Tá, então. Nós fizemos merda. Temos sorte que a Sra. White não nos enviou de volta pra a cadeia, só tô dizendo." #All right. So. We screwed the pooch. We're lucky Mrs. White didn't send us back to that jail, is all I'm saying.",
camp_bridge_raid_post_fail_var1_brit: "Tudo que a gente tinha que fazer era explodir a ponte, e o ouro teria caído nas nossas mãos. Como a gente ferrou nessa missão, eu nem quero saber..." #All we had to do was blast the bridge up, and the gold would have fallen into our laps. How we managed to balls that up, I can't even...",
camp_bridge_raid_pre_var1_russ: "Destruir a ponte, pegar todo ouro, e matar todo fascista no nosso caminho? Sim, soa música pros meus ouvidos. Vamos nos apressar para entregar a dor." #Destroy bridge, obtain very much gold, and crush every fascist who stands in our way? Yes. Is pleasing to me. Let us not delay in delivering the pain.",
camp_bridge_op_pre_var1_amer: "Eu não tenho problema em escoltar uma caminhonete atravessando uma ponte cheia de nazistas babacas do caralho, mas quando aquela caminhonete tá cheia de gasolina? É só eles atirarem um pouco e estamos fritos, então, tomem cuidado." #I got no beef escorting a truck across a bridge swarmin' with Nazi assholes, but when that truck's full of goddamn aviation fuel? Few stray shots and we're toast, so - watch your six.",
camp_bridge_raid_pre_var1_amer: "Eu não sei sobre vocês, mas parando um trem E ferrando os nazistas até o ponto de não conseguirem fazer nada... Ora, isso é música pros meus ouvidos." #I don't know about you, but hitting a gold train AND crippling the Nazis' ability to get shit done... well, sounds like one hell of a payday to me.",
camp_bridge_op_pre_var1_brit: "Eu me pergunto, 'Sterling, meu velho, o fim justifica o método?'. Francamente, quando o assunto é queimar os nazistas vivos, eu digo... quem é que liga." #Often, I ask, 'Sterling, old egg - do the ends justify the means?'. Quite frankly, when it coming to burning Nazis alive, I say... who gives a toss.",
camp_bridge_raid_pre_var1_brit: "Sra. White é uma mulher atrevida, eh? Explodindo uma ponte, E roubar uma fortuna em ouro. *risadas* Um belo chute nos alemães. Bravo. Vamos?" #Mrs. White is quite the lady, eh? Blowing a bridge, AND stealing a fortune in gold. *chuckles* One up the arse for Jerry. Bravo. Shall we?",
camp_bridge_raid_post_fail_var1_russ: "Nós devemos explodir uma ponte, roubar ouro, da? Bem simples. E mesmo assim, aqui nós estamos, sem ouro. Isso não é bom." #We supposed to blow up bridge, steal gold, da? Very simple. Yet, we here, no gold. This is not good.",
camp_bridge_op_post_fail_var1_brit: "Mesmo esquecendo dos fracassos lá trás, nós tinhamos uma tarefa de manter o cara vivo, e falhamos miseravelmente. Tenho vergonha que voltamos vivo dessa." #Even forgetting our own failures back there - we had a duty to keep that bloody driver alive, and we failed miserably. I'm rather ashamed we even made it back.",

camp_castle_op_pre_var1_russ: "Já faz um tempo desde que eu estive em uma festa. Se eu entender isso bem, nós vamos fazer uma que nunca vamos esquecer, sim? Bom, vamos nos apressar." #It has been very long time since I have been to party. If I understand correctly, we will make it one they will never forget, yes? Good. Let us not be late.",
camp_castle_op_post_success_var1_russ: "Ah! aquilo foi bom! O cheiro dos nazistas queimando! Eu gosto! Queria que o cheiro nunca fosse embora!" #Ah! That was good! Smoke of burning Nazis cling to uniform! I like! I never wash away smell!",
camp_castle_raid_pre_var1_russ: "É triste que devemos matar os generais. Eles serviram o seu país com honra. Devemos ver eles morrerem com honra." #It sad we must kill the generals. They served their country with honor. We must see that they die with such honor.",
camp_castle_raid_post_success_var1_amer: "Alguns dias são mais sombrios que outros, isso com certeza é um deles, mesmo que isso seja pro bem maior. Pelo menos os generais não vão morrer por nada, sabe." #Some days are darker than others, that much is sure, even when the thing you're doing is for the greater good. I'm just glad the generals didn't die for nothing, y'know.",
camp_castle_op_post_success_var1_brit: "Muito bom, seus patetas! Quantos a gente pegou? Bom, seja lá a contagem final for, valeu a pena. Belo jeito de terminar uma operação, não é?" #Very well done, you chaps! How many did we get? Well, whatever the final tally was, it was definitely worth it. Nice way to end an operation, wouldn't you say?",
camp_castle_op_post_fail_var1_brit: " Todos esses nazistas juntinhos em um teto só, um alvo bem gordo, e o quê nós fizemos? Fracassamos. Um puta de um fracasso. Que merda." #All those Nazis gathered under one roof, a big fat juicy target, and what do we do? We fuck it up. Royally fuck it up. Bollocks. ",
camp_castle_raid_post_success_var1_brit: "Nós fomos enviados para matar dois generais. E matamos eles. Mesmo assim... poderia ter tido outro final, pessoal." #We were sent to kill two Generals. And we killed two Generals. Still... could have done better, lads.",
camp_castle_op_post_fail_var1_germ: "Nós subestimamos a segurança do lugar, e suponho que isso foi nossa culpa. Pensei que poderíamos vencer esse dia." #Clearly we underestimated the security of such a gathering, and I suppose that was our undoing. I truly thought we would win this day.",
camp_castle_raid_post_success_var1_germ: "Tinha esperança que poderíamos achar um outro jeito. Mas a guerra finalmente acabou para os generais. Uma invasão com sucesso? Ja, pode-se dizer." #I had hoped we might have found another way. But the war is finally over for the Generals. A successful raid? Ja, of a kind.",
camp_castle_op_pre_var1_germ: "Não sei se fico impressionado com a capacidade da Frau White pela violência, ou se fico com medo. Vamos lá." #I do not know whether to be impressed with Frau White's capacity for violence, or fearful. Let us go.",
camp_castle_raid_pre_var1_amer: "Nah, esse aí não soa bom pra mim. Entendo o porquê tem que ser feito, mas não pense que tô feliz com esse tipo de ato. Só vamos acabar logo com isso." #Nah, this one don't sit right with me. I understand why it's gotta be done, but don't think for even a second that I'm happy about it. Let's just get this over with.",
camp_castle_op_pre_var1_amer: "Fala sobre fazer uma festa com um estouro, né? E aqui estou eu pensando que 'fogo no rabo' era apenas expressão. Então... bora?" #Talk about making the party go off with a bang, am I right? And there was me thinking that lighting a fire under someone's ass was just an expression. So then... shall we?",
camp_castle_raid_post_fail_var1_germ: "Espero que percebem o tamanho deste fracasso. Quem sabe dos esquemas que esses nazistas vão desenvolver com os generais e as suas informações." #I hope you realise the magnitude of this failure. Who knows what wretched schemes the Nazis will develop with the Generals and their intel.",
camp_castle_raid_pre_var1_germ: "Um dia sombrio, de fato. O nosso fracasso no castelo quer dizer... Bom, vamos ver o quê quer dizer. Os nazistas vão usar os generais, as informações e... ah, nem quero pensar!" #A dark day, indeed. Our failure at the castle means... well, we shall see what it means. The Nazis will use the Generals, the intelligence and... ach, a dark day!",
camp_castle_raid_post_fail_var1_russ: "O nosso fracasso hoje deu uma porta aberta para a Rússia. Vocês entendem? Nem falem comigo." #Our failure today has given the fascists an open door into Russia. You understand...? Do not speak to me now.",
camp_castle_op_post_fail_var1_russ: "Que parte da missão que deu errado? Tinhamos tudo para dar certo, a gasolina, os nazistas... por que fracassamos?" #Where did mission go wrong? We had all things we needed - fuel barrels, Nazis... so why we not succeed?",
camp_castle_raid_post_success_var1_russ: "Tenho que admitir, essa missão foi a mais difícil para mim. Espero que nunca temos que encarar tal tarefa de novo. Com licença, por favor." #I must admit, this mission was one of the most difficult for me. I hope that we never have to face such a task again. Excuse me, please.",
camp_castle_op_post_fail_var1_amer: "Eu ainda não sei como conseguimos foder isso. Aqueles desgraçados estavam num lugar só, pedindo pra gente matar eles. E olha o fracasso." #I still don't get how we managed to fuck that one up. Those shitbirds were all in one place, just asking for us to take 'em out. And we got nothing.",
camp_castle_op_post_success_var1_amer: "Cara, ô cara. Agora isso sim que é uma festa. Ainda bem que não estamos na lista de convidados, mas gostaria de pensar que ainda fizemos um trampo no quarto, no nosso jeito único." #Man oh man. Now THAT is what I call a party. Damn glad we weren't on the guest list, but I'd like to think we still worked the room, in our own unique way.",
camp_castle_raid_pre_var1_brit: "Triste em falar isso, mas eu agradeço que na guerra temos os deveres sombrios. Contudo, assassinar os nossos generais. Espero que isso não volta pro Kremlin." #Sad to say it, but I appreciate that in war we have our darker duties. Assassinating friendly Generals, though. Hope this never gets back to the Kremlin.",
camp_castle_raid_post_fail_var1_brit: "Não gosto de pensar o quê esses generais tiveram que passar, mas vai parecer fichinha comparado com quê os nazistas vão fazer com a Rússia agora. Que merda." #Don't like to think what those Generals endured, but it's sod all compared to what the Nazis will inflict upon Russia now. Bollocks.",
camp_castle_raid_post_fail_var1_amer: "Não tem como voltar depois dessa. A nossa cagada fez a Rússia o próximo alvo dos nazistas. A partir daqui, estamos fodidos." #There's no coming back from this one. Our fuck-up means Russia's next for the Nazis. From there, we're all fucked.",
camp_castle_op_pre_var1_brit: "Tenho certeza que a vóvó cantava uma canção sobre isso. *murmurando* Quatro e vinte nazistas, cozinhados em uma torta. Bom, tanto faz, vamos lá." #I'm sure nanny used to sing me a lullaby about this. *murmurs* four and twenty Nazis, baked in a pie. Well, whatever. Let's go.",
camp_castle_op_post_success_var1_germ: "Acho que nunca estive feliz em não estar na lista de convidados. Fizemos um belo de um estrago aos nazistas essa noite, mein freundes. Acredito que podemos considerar essa operação concluída." #I think I've never been so glad to not be on a guest list. We struck a serious blow to the Nazis tonight, mein freundes. I believe we can consider this operation complete. ",

camp_flak_op_pre_var1_amer: "Esses bombardeiros não vão ter uma chance contra o Heimdall, a menos a gente vá lá e quais são as chances. Bora, o quê a gente tá esperando?" #Those bombers ain't gonna stand a chance against Heimdall, unless we get out there and even the odds. So come on, what are we standing around for.",
camp_flak_raid_post_success_var1_amer: "Agora É ASSIM que se faz as coisas! você viu a bagunça que fizemos daquele dirigível? Foi do caralho! Posso imaginar a expressão do Hitler quando ele descobrir que torramos o Reinhardt!" #Now THAT's how you get things done! Ya see the mess we made of that airship? Hot fucking damn! Can imagine the look on Hitler's face when he finds out we toasted Reinhardt!",
camp_flak_raid_pre_var1_russ: "Eu não conheço esse dirigível que a Sra. White fala. Só lembro das suas palavras, explodir o dirigível, da? Não me preocupo com as outras coisas. Vem! Temos um dirigível para explodir!" #I know not of this flakturm Mrs. White speaks of. I only remember her words - blow up airship, da? All other things are of small concern to me. Come! We have airship to explode!",
camp_flak_op_pre_var1_brit: "Então... Heimdall é um radar, eh? Bora, melhor irmos e foder tudo antes dos bombardeiros chegar." #So... Heimdall's a radar, eh? Come on, we best go and bugger it up before those bombers get here.",
camp_flak_raid_post_fail_var1_germ: "Eu não sei como sobrevivemos, mas parando para pensar, talvez nem mereceríamos. Devemos fazer melhor do que aquilo." #I do not know how we survived, but thinking back to the flakturm, perhaps we did not deserve to. We must do better than that.",
camp_flak_op_post_fail_var1_germ: "Depois de tudo que nos levamos até o Heimdall, para cair logo no final é algo difícil de engolir. Só posso rezar que a morte dos bombardeiros não foi dolorosa." #After everything it took to get us to Heimdall, to fall at the final hurdle is a bitter pill to swallow. I can only pray that the death of the helpless bomber crew was swift.",
camp_flak_raid_pre_var1_germ: "Um dirigível, um zepelim e um cientista. Tudo para ser destruído. De fato, isso tem cara de ser um belo dia. Komm!" #A flakturm, an airship and a vile specimen of a scientist. All to be destroyed. Indeed, this has the makings of a very fine day. Komm!",
camp_flak_op_post_fail_var1_brit: "Merda, Heimdall ainda está de pé. O que quer dizer que aqueles bombardeiros provavelmente estão mortos. Porra. Porra!" #Shit. Heimdall's still up there. Which means those bombers likely aren't. Fuck. Fuck!",
camp_flak_op_post_success_var1_amer: "Cristo, achei que iríamos morrer. Heimdall tá fodido, espero que aqueles pilotos conseguem fazer o serviço e voltarem pra casa em segurança. Meio que isso sendo o objetivo de hoje a noite, huh?" #Christ, I thought we were goners. Heimdall's fucked up, so hope those fly-boys managed to do their job and get home safely tonight. Kinda the point of tonight, huh? ",
camp_flak_raid_post_fail_var1_amer: "Como caralhos fodemos essa? Claro, quatro contra só-sabe-Deus quantos não estavam no nosso lado, mas já passamos o pior. Nada bom, nada bom de fato." #How did we fuck that one up? Sure - four against fuck-knows how many ain't exactly in our favour, but we beat worse odds than that before. Not good. Not good at all.",
camp_flak_op_post_fail_var1_russ: "Nós fracassamos. Heimdall sobrevive. Que quer dizer os bombardeiros... talvez não. Porra." #We failed. Heimdall survives. Which means bomber pilots... perhaps not so. Fuck.",
camp_flak_raid_post_success_var1_russ: "Babushka, ela sempre disse: 'Kurgan, meu bebê querido, você faz encrenca'. Hoje, a minha babushka estaria orgulhosa, da." #Babushka, she always say: 'Kurgan, my beautiful baby, you make trouble'. Today, my babushka would be very proud, da.",
camp_flak_op_post_success_var1_germ: "Ah! Heimdall foi destruído e os bombardeiros estão salvos. Fico feliz que podemos considerar esta operação um sucesso. Agora... o quê vamos fazer?" #Ah! Heimdall is destroyed and the bombers are saved. I am glad we can consider this operation successfully concluded. Now... what next?",
camp_flak_op_post_success_var1_brit: "Então... Heimdall virou história. Assim como Berlim, agora salvamos aqueles bombardeiros. Me pergunto se esses idiotas sabem o quê fizemos por eles hoje a noite. Provavelmente não. Ah, bom. Bom trabalho, pessoal." #So... Heimdall is a smoking ruin. As is much of Berlin, now we saved those bombers. I wonder if those chaps up there know what we did for them tonight. Probably not. Ah well. Good work, chaps. ",
camp_flak_raid_pre_var1_brit: "Sra. White tem um gosto por 'relatos'. Não sei se a admiro ou a temo. Enfim, vamos para a torre do dirigível. Veremos sobre derrubar esse 'Odin'." #Mrs. White has a fondness for 'statements'. Can't tell whether I admire her or fear her. Either way, let's get to that flak tower. See about bringing this 'Odin' down.",
camp_flak_raid_post_success_var1_brit: "Foi um belo de um estouro, pessoal. Tenho certeza que vai demorar um tempo para os alemães recuperarem do choque de perderem aquele general de um jeito espetacular. Continuem assim." #We struck quite a blow today, lads. Reckon it'll take Jerry a while to get over the shock of losing that general in such a fiery manner. Keep up the good work.",
camp_flak_raid_post_success_var1_germ: "Hoje a noite, nós fomos artistas. A noite foi o nosso quadro, e as chamas indo para o céu foram a nossa tinta. Muito bem feito, cavalheiros." #Tonight,we are artists. The night is our canvas, and the flames licking the sky our paint. Very well done, gentlemen.",
camp_flak_op_post_fail_var1_amer: "Então, toda aquela preparação, e nós ferramos feio com o Heimdall. Que merda!" #So, all that preparation, and then we screwed the pooch at Heimdall. Goddamn it!",
camp_flak_raid_post_fail_var1_russ: "Nós tinhamos o elemento da surpresa, e assim Doutor Reinhardt ainda nos derrotou. Isso não é bom, camaradas. Não há desculpas." #We had element of surprise, yet Doctor Reinhardt still defeated us. This is not good enough, comrades. There are no excuses.",
camp_flak_raid_pre_var1_amer: "Uma torre grande e fortificada, cheio de nazistas, e um dirigível prontinha para ser explodida? Parece divertido. Bora fazer a vida deles um inferno." #A huge, fortified tower, swarming with Nazis, and a great big airship waiting to be blown up? Sounds fun. Let's go give 'em hell.",
camp_flak_op_pre_var1_russ: "Eu não entendo como radar funciona, mas entendo que bombardeiros vão ser destruídos se não cuidarmos do Heimdall. Vamos! Temos que ir!" #I not understand how radar work, but I understand that bombers will be destroyed if we not deal with Heimdall. Come! We go!",
camp_flak_raid_post_fail_var1_brit: "Continuo tentando entender aonde erramos com o dirigível. Mas, verdade seja dita, todos nós aqui têm que tomar a culpa pelo erro de deixar a missão sair do controle." #I keep trying to retrace just where things went wrong for us at the flakturm. But, truth be told, we've each got to carry some responsibility for that going tits-up. ",
camp_flak_op_pre_var1_germ: "Então, foi revelado, Heimdall é um radar. E temos bombardeiros aliados voando direto nele. Eles não vão conseguir contra tal arma. Vamos! Temos que ir e dar uma chance!" #So, it is revealed - Heimdall is a radar. And there are Allied bombers flying right into it. They will not stand a chance against such a weapon. Come! We go and give them a chance!",
camp_flak_op_post_success_var1_russ: "Heimdall foi destruído. Bombardeiros foram salvos. Estamos vivos. Muitos fascistas mortos. Da, isso ser uma boa noite." #Heimdall is dead. Bombers are saved. We are alive. Many fascists dead. Da, this is good night.",

camp_radio_op_post_fail_var1_brit: "Se a Sra. White chamar, querendo saber do tamanho fracasso que tivemos, não vai ser eu que vai responder. Já estou de saco cheio dos alemães." #If Mrs. White calls, wanting to know how we messed that so badly, I'm not going to answer. Had enough of a hiding off the Jerries.",
camp_radio_raid_pre_var1_russ: "Desde que temos um bando de nazistas para matar, e talvez algumas explosões, então não me importo se salvarmos os homens ou os seus segredos. Ele tem o seu trabalho e tenho meu." #So long as we have plenty of Nazis to destroy, and maybe some big explosions, then I not care if we save the man, or his secrets. He has his job, I have mine.",
camp_radio_op_post_success_var1_russ: "Esmagando os fascistas e roubando os seus segredos são bons, da. Nós vamos criar arte. Que nem pintura, mas com tinta vermelha! Haha!" #Crushing fascists and stealing their secrets is good, da. We make it look like art. Like painting, but we use a lot of red paint! Haha!",
camp_radio_op_post_fail_var1_amer: "É, essa foi do caralho. De volta, de mãos vazias, e não há uma coisa que podemos fazer pra impedir os nazistas em executar seja lá o quê for o plano deles." #Yeah, great fuckin' going. Back here, empty-handed, and there ain't a goddamn thing we can do to stop the Nazis from whatever they're planning.",
camp_radio_raid_pre_var1_brit: "Não vou fingir que entendo o quê esse tal de Lange faz, com a sua máquina e beeps e sei lá o quê. Só vamos lá e resgatar o camarada, vamos?" #I won't pretend to understand what this Lange fellow does, with his machines and his beeps and all that shit. Let's just go and fetch the fellow, shall we?",
camp_radio_op_pre_var1_russ: "Haha! Então, a máquina que roubamos dos nazistas, agora usamos para roubar os seus segredos? Da! Gostei. Usando a arma do inimigo contra o inimigo é o melhor." #Haha! So, machine we steal from Nazis, now we use to steal their secrets? Da! I like this. Using weapon of enemy against enemy is the best.",
camp_radio_raid_post_success_var1_russ: "Esse Lange... ele me impressionou hoje. Corajoso. Ele parecia um homem normal, mas ele teve o coração de um leão hoje. Da, impressionante." #This Lange... he impress me today. Very brave. He look like very normal man, but he has heart of lion today. Da, most impressive.",
camp_radio_op_pre_var1_amer: "Agora, estamos indo algum lugar, e realmente botando aquele código da máquina pra bom uso. Podem contar comigo, especialmente se acharmos um tempinho para matar alguns dos desgraçados no caminho, né?" #Now we're getting somewhere, and actually putting that code breaking machine to good use. Count me in, especially if we find a little time to take out a few shitbirds along the way, right?",
camp_radio_op_pre_var1_brit: "Usando uma máquina do nazista para interceptar mensagens encriptadas? Bem espertinho, não há nada como usar os brinquedos dos alemães contra eles mesmos, não concorda?" #Using a stolen Nazi code machine to intercept encrypted messages? Frightfully clever stuff, and nothing quite like using Jerry's toys against him, wouldn't you say?",
camp_radio_raid_post_fail_var1_brit: "Difícil de acreditar que deixamos aquilo ficar feio. As informações do Lange poderiam ter sido um belo soco para os nazistas. Aquilo ficou feio, pessoal." #Hard to believe we let that go so badly. Lange's intel would have been a massive blow against the Nazis. We've let the side down, lads.",
camp_radio_raid_pre_var1_germ: "Conhecendo os nazistas, ficaria supreso se o contato de comunicações da Frau White ainda estiver vivo. Mesmo assim. Nós vamos. Vem!" #Knowing the Nazis as I do, I would be surprised if Frau White's communications man is still alive. Still. We look. Come!",
camp_radio_op_pre_var1_germ: "Poucas coisas são satisfatórias, como usar os instrumentos dos nazistas contra eles, eh? Vamos nos apressar para a base do rádio." #Few things are as satisfying as turning the Nazis' instruments against them, eh? Let us hurry to the radio base. ",
camp_radio_op_post_success_var1_germ: "Não vou fingir que entendo as complexidades das informações. Deixo isso para a Frau White." #I shall not pretend to understand the intricacies of the technical data. That must be left to Frau White.",
camp_radio_raid_post_success_var1_amer: "Considerando as coisas, nós fomos bons, sabe. Não vou fingir que entendo as informações que pegamos, mas desde que tenha alguém que entenda, é... fizemos a coisa boa." #All things considered, we did good, y'know. I'm not gonna pretend to understand all the intel we took down, but so long as someone does, then yeah... we did good.",
camp_radio_op_post_success_var1_brit: "Espero que os cientistas da Sra. White entendem todo aquele beep beep e sei lá mais o quê. Me pergunto aonde aquilo vai nos mandar." #Hopefully Mrs. White's boffins will be able to make some sense of all that beep-beep jibber-jabber. Wonder where it will send us next.",
camp_radio_raid_post_fail_var1_russ: "Lange foi corajoso. Mas fracassamos com ele e com a Sra. White. Nós somos melhores do que isso." #Lange was brave. But we fail him. And fail Mrs. White. We are better than this.",
camp_radio_raid_pre_var1_amer: "Ei, sabe, sempre achei que vocês tiveram o rosto pro rádio. Heh. Bora, vamos resgatar o gênio da merda que ele se meteu." #Hey - y'know, I always thought you guys had a face for the radio. Heh. C'mon, let's go get Mrs. White's little genius out of whatever hot water he's in.",
camp_radio_raid_post_success_var1_brit: "Sabe, quando aquele tanque veio até a gente, pensei 'bom, Sterling, velho rapaz, já ela', mas de algum jeito ainda estamos aqui. Espero que a Sra. White pode colocar as informações para bom uso também." #You know, when that tank came at us, I thought 'well, Sterling, old boy, that's it', but somehow we're still here. Hope Mrs. White can put that intel to good use too.",
camp_radio_raid_post_success_var1_germ: "Admito, eu subestimei o Lange e a sua coragem. Não conheço muitas almas que colocaram a sua vida em jogo em tal modo. Um homem impressionante." #I admit, I underestimated Lange and his bravery. I do not know many souls who would put their life on the line in quite that manner. A most impressive man.",
camp_radio_raid_post_fail_var1_amer: "Como aquilo ficou feio de repente? Tudo que tinhamos que fazer era terminar o quê Lange terminou, e nem conseguimos isso." #How did we get that one so wrong? All we had to do was finish what Lange started, and we couldn't even manage that.",
camp_radio_raid_post_fail_var1_germ: "Eu esperava que a gente ia ser melhor. Lange estava contando com a gente, e olha como ele saiu. Não podemos permitir que isso se repita." #I had rather hoped today would go better. Lange was relying on us, and look how that turned out for him. We cannot allow our standards to slip like this.",
camp_radio_op_post_success_var1_amer: "informações adquiridas, um monte de nazistas mortos, e abrir um belo de um bourbon? Heh, está perfeito para mim." #Intel acquired, a whole bunch of Nazis taken out, and back in time to crack open some bourbon? Heh - what's not to like?",
camp_radio_op_post_fail_var1_russ: "Nós não recuperamos a máquina do código. Então por que voltamos? Sem recuar, sem se render, é isso o que a minha babushka sempre dizia." #We did not retrieve code machine. So why we come back? No retreat, no surrender - that is what my babushka always say.",
camp_radio_op_post_fail_var1_germ: "Estou surpreso que a Frau White nos deixou voltar, dado o tamanho fracasso da nossa missão. Para perder a máquina do código... É algo que não dá para imaginar." #I am surprised Frau White has allowed us to return, given the utter failure of our mission. To lose that code machine... it is unthinkable.",

camp_bank_raid_pre_var1_germ: "Quando a Frau White planeja um roubo, não vai ser um banco qualquer. Não, não, não, ela vai nos levar para a porra da Tesouraria! Rá! Vamos, temos uma riqueza para roubar." #When Frau White plans a robbery, she does not have us rob a mere bank. No, no, no - she has us take on the damned Treasury! Ha! Come, we have vast wealth to steal.",
camp_bank_op_post_fail_var1_amer: "Então, todos nós fomos longe pra fracassamos desse jeito, e sair de mãos vazias? Não, não é bom." #So, we came all that way just to get shot to shit, and walk away empty-handed? No. Not good enough.",
camp_bank_op_post_success_var1_russ: "Fico feliz que a máquina Enigma está com a gente. Se eu entendo, revela segredos nazistas, então isso só pode ser coisa boa. Vai nos contar para onde ir para uma boa luta." #I am glad the Enigma machine is with us. If I understand, it reveal Nazi secrets, so this can only be good thing. It will tell us where to go for good fight.",
camp_bank_raid_post_fail_var1_germ: "Eu não sei aonde apontar o dedo o fracasso dessa missão. Nós poderíamos culpar os pilotos, mas foi no chão onde perdemos. Que não aconteça de novo." #I do not know where to pin the failure of this mission. We could blame the pilots, but it was on the ground where we lost. It must not happen again.",
camp_bank_op_post_fail_var1_brit: "Foi péssimo hoje, pessoal. Sem máquina do código, sem rotores, e sem esperança em descobrirmos o quê os nazistas estão tramando. Que decepção." #Poor show today, lads. No code machine, no rotors, and no hope of figuring out what the Nazis are plotting next. Truly disappointing.",
camp_bank_raid_post_success_var1_amer: "Alguns dias são bons. Alguns são ótimos. E ALGUNS a gente explode um buraco em uma tesouraria e roubamos toneladas de ouro dos nazistas. Agora ISSO é o meu dia." #Some days are good. Some days are great. And SOME days we blow a hole in a goddamn treasury and relieve the Nazis of a fuck-ton of gold. Now THAT is my kinda day. ",
camp_bank_raid_pre_var1_russ: "Sim, sim! O que há para não gostar? Destruímos a tesouraria, roubamos o ouro, e matar muitos fascistas! Aprovo esse plano!" #Yes, yes! What is not to like? We destroy Treasury, take gold, and kill many fascists! I approve of this plan!",
camp_bank_raid_post_fail_var1_brit: "De Sabre Squadron engatilhando as coisas para a gente acabar sendo inúteis, posso dizer com certeza que isso foi um fracasso." #From Sabre Squadron cocking things up to us being as much use as tits on a teapot, I say this one can safely be regarded as a failure.",
camp_bank_op_pre_var1_russ: "Não entendo uma coisa que a Sra. White fala sobre essa máquina Enigma, mas roubar dos fascistas? Agora falou a minha língua. Bora, não ficar enrolando." #I do not understand this Enigma machine Mrs. White speaks of, but stealing from fascists? That, I understand very well. Come - I wish to get started.",
camp_bank_raid_post_success_var1_brit: "Isso foi impressionante, gente. Nós transformamos a invasão em uma obra prima, se me perguntarem. Quase me faz pensar se perdemos a nossa vocação." #Bloody impressive show today, lads. We turned the raid into something downright artistic, if you ask me. Almost makes me wonder if we missed our calling.",
camp_bank_op_post_success_var1_germ: "Temos a máquina, os rotores e o código. Sehr gut! Nós estamos mais pertos de resolver o mistério do Heimdall." #We have the machine, the rotors and the code book. Sehr gut! We are now close to solving the mystery of Heimdall.",
camp_bank_op_pre_var1_amer: "Parece um trabalho que somos qualificados para fazer, se me permitem dizer. Uma máquina Enigma chegando!" #Sounds like a job we're pretty damn qualified for, if I do say so myself. One Enigma Machine, coming up!",
camp_bank_raid_post_success_var1_germ: "Me falem que nós não temos que entregar TODO ouro que roubamos para a Frau White, temos? Cavalheiros?" #Tell me we don't have to give Frau White ALL of the gold we stole, do we? Gentlemen?",
camp_bank_raid_pre_var1_brit: "Um banco, eh? Soa esplêndido. Francamente, aquela tesouraria não vai ter uma chance. Tudo que precisamos saber é quem vai 'esmagar' e quem vai 'roubar'?" #A bank job, eh? Sounds rather splendid. Frankly, that Treasury doesn't stand a chance. All that's left to establish is which of us gets to 'smash', and whogets to 'grab'?",
camp_bank_op_post_success_var1_amer: "Tem poucas coisas no mundo tão satisfatórias quanto mostrar esses merdinhas quem é que manda, mas roubar algumas máquina para decodificar os seus segredos? Nada mal, cavalheiros. Nada mal mesmo." #There's few things as enjoyable as showing those shitbirds who's boss, but nabbing the means of decoding some of their most-secret secrets? Not bad, gentlemen. Not bad at all.",
camp_bank_raid_post_success_var1_russ: "Ah! Agora entendi o termo 'esmagar e roubar'. Porquê nós 'esmagamos' e depois 'roubamos'. 'Esmagar' é uma bela palavra. Espero que esmagamos muitas coisas." #Ah! Now I understand phrase 'smash and grab'. Because we do the 'smash', and then the 'grab'. 'Smash' is a good word. I hope we will get to smash many things.",
camp_bank_raid_pre_var1_amer: "Roubando um banco é uma coisa, mas uma tesouraria? Ah, do caralho! Bora, vamo logo!" #Robbing a bank is one thing, but robbing a treasury? Oh fuck yeah! Let's go already! C'mon!",
camp_bank_op_post_fail_var1_russ: "O quê deu de errado na missão? Como a gente foi derrotados! Nós não devemos deixar isso acontecer de novo." #What went wrong with mission? How were we defeated? We must not let such thing happen again.",
camp_bank_op_pre_var1_germ: "Então, os nazistas têm o código, e precisamos de ferramentas para decifrar. Então, vamos, cavalheiros. Para o banco!" #So, the Nazis have a code, and we need the tools to crack the code. Then let us go, gentleman. To the bank!",
camp_bank_raid_post_fail_var1_russ: "Nós fomos roubar ouro dos nazistas. E voltamos de mãos vazias. Você ver o quão ruim é isso, da?" #We were to steal much gold from the Nazis. We return empty-handed. You see how this is bad, da?",
camp_bank_op_pre_var1_brit: "Então, roubamos a máquina Enigma, e os seus pedaços. Deve ser moleza, bora." #So we nick an Enigma machine, and its bits and bobs. Should be a doddle. Come on.",
camp_bank_raid_post_fail_var1_amer: "Não sei como conseguimos ferrar a missão daquele jeito. Claro, os aviões já tiveram um começo de merda, mas nós deveríamos ter cuidado disso." #I just don't get how we managed to screw that up so badly. Sure, the flyboys set a shitty starting point, but we should'a had that in the bag.",
camp_bank_op_post_success_var1_brit: "Ok, foi toda aquela baboseira técnica assegurada. Espero que alguém que saiba usar. Eu não faço ideia." #Okay, that's all these bloody technical gizmos safely gathered. Hope someone knows how to use them. I haven't the foggiest.",
camp_bank_op_post_fail_var1_germ: "Sem máquina. Sem rotores. Nós somos inúteis, percebe? Bem inúteis." #No code machine. No rotors. We were useless back there, you realize? Quite useless.",

