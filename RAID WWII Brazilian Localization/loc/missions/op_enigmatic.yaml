# Nomes e descrições
menu_ger_oper_01_event_2_progress_text: "Com o sinal interceptado, é hora de encontrar uma maneira de descriptografá-lo. Vamos recuperar a máquina Enigma e seus rotores. Eles estarão na posse de comandantes no banco.$NL;$NL;- Entre no banco$NL;- Encontre e roube a Enigma$NL;- Encontre e elimine os comandantes$NL;- Recupere os rotores da Enigma" #With the signal intercepted, it is time to find a way to decrypt it. Start by recovering an Enigma code machine and its necessary decoding rotators. These will be found in the possession of officers at the Treasury.$NL;$NL;- Get into the Treasury$NL;- Locate and steal an Enigma machine$NL;- Locate and eliminate the officers$NL;- Recover the Enigma rotors"
menu_ger_oper_01_event_2_progress_title: "Enigmatic" #Enigmatic"
clear_skies_mission_photo_2_title: "Rotores da Enigma" #The Enigma Machine Rotors"
clear_skies_mission_photo_2_description: "Parece que apenas os nazistas de alto escalão são confiados para proteger os rotores da Enigma. Eles usam uniforme cinza, será fácil distinguí-los, e fique a vontade para treinar tiro ao alvo naquela emblema em suas boinas." #It seems only the top ranking Nazis are entrusted to hold onto the rotors of the Enigma machine. With their grey uniforms, they’ll stand out, and feel free to use that shiny emblem on their cap as a target."
clear_skies_mission_photo_3_description: "Usada para criptografar mensagens confidenciais, os Nazistas acham que escondendo a preciosa máquina Enigma no banco nos fará desistir de recuperá-la. Prove o contrário." #Used to encrypt and decrypt highly classified communications, the Nazis seem to think that stashing a precious Enigma machine in the bank will keep it out of our hands. Prove them wrong."
clear_skies_mission_photo_3_title: "A Enigma" #The Enigma Machine"
menu_ger_oper_01_event_2_loading_text: "Procure a Enigma no banco, e os comandantes que guardam seus rotores." #Search the Treasury for an Enigma machine, and the officers who carry its rotors."

# Legendas
bank_op_loud_bomb_planted_brit: "Ok. Dinamite pronta! Pra trás, rapazes!" #Okay. Fuse is lit! Stand away, chaps!"
bank_op_loud_call_airdrop1_germ: "Nicht gut! A porta está fechada!" #Nicht gut! The door is sealed!"
bank_op_tank_appears2_brit: "É um tanque Tiger!" #A bloody Tiger!"
bank_op_loud_entrance_blown_brit: "Caramba! Bom, funcionou!" #Wallop! Well, that did it!"
bank_op_ste_in_find_rotor_var1_amer: "Então precisamos achar os comandantes. São esses idiotas que estão com os rotores." #So we need to find the commanders. They're the assholes who've got the rotors."
bank_op_ste_guard_alarm_russ: "Está indo tocar o alarme - parem ele!" #Raising alarm - stop him!"
bank_op_ste_out_find_enigma_var2_amer: "Não tem porquê ficar aqui no frio. Precisamos entrar e pegar a Enigma." #No point standing around in the cold. We gotta get in there and grab the Enigma machine."
bank_op_loud_took_enigma_var2_brit: "Perfeito! Eu peguei a Enigma!" #Superb! I've got the Enigma machine!"
bank_op_white_tank_disscuss1_germ: "Frau White, por favor responda. Aqui é Broadsword, câmbio." #Frau White, please come in. This is Broadsword, over."
bank_op_loud_took_enigma_var2_amer: "Ei-yo! Peguei a máquina!" #Hey-yo! Got the machine here!"
bank_op_at_door_with_key_russ: "Trancar a porta é inteligente, mas quando a chave está comigo não importa muito." #To lock door is wise, perhaps, but when the key is in my hand, it matters little."
bank_op_loud_escaped_russ: "Devíamos visitar mais bancos assim, camaradas. Matar comandantes e roubar bancos é bom. Vamos voltar agora." #We should visit bank like this more often, comrades. Crushing commanders and stealing from banks is good. We go to base now."
bank_op_loud_blow_office_door_amer: "Trancaram a porta. Não temos tempo, vamos explodir!" #Door's locked. No time to do it nice, blow it open!"
bank_op_loud_used_radio1_amer: "Broadsword chamando Sra. White. Está na escuta?" #Broadsword calling Mrs. White. You hearing this?"
bank_op_ste_spawn3_brit: "Teremos que fazer isso pessoalmente, rapazes - os comandantes estão com os rotores." #We'll have to get up close and personal lads - it's the commanders who'll have the rotors on them."
bank_op_at_door_no_key_amer: "Droga - a porta tá trancada. ALguém por aqui deve ter a chave. Vamos - precisamos achá-lo, em silêncio." #Damn it - doors are locked. Someone round here has to have the keys. C'mon - we're gonna get them, quietly."
bank_op_loud_took_rotor_var1_russ: "Eu fico com isso, seu desgraçado de merda!" #I take that, shiny-booted shit-licker!"
bank_op_loud_used_radio1_brit: "Broadsword chamando Sra. White. Na escuta, velhota?" #Broadsword calling Mrs. White. You there, old girl?"
bank_op_loud_used_radio3_germ: "Peço desculpas pela demora. Estamos, como você diz, 'na miséria'." #Apologies for the late call. We are, how you say, 'in the doo-doo'."
bank_op_ste_out_find_enigma_var2_russ: "Estamos do lado de fora, mas precisamos da Enigma. Estão entendendo o que quero dizer?" #We are outside. But we need Enigma machine. You understand my confusion?"
bank_op_loud_blow_office_door_brit: "Trancaram a porta. Não temos tempo. Plantem dinamite nela!" #This door's locked. No time to finesse this. Get some dynamite on there!"
bank_op_use_radio_esc_amer: "A Sra. White pode ajudar. Usem o rádio!" #Mrs. White can help. Get on the radio!"
bank_op_white_tank_disscuss1_russ: "Sra. White, responda, por favor. Aqui é Broadsword, Câmbio." #Mrs. White, you will come in now please. This is Broadsword, over."
bank_op_loud_door_blown_brit: "Para dentro, rápido!" #In, come on!"
bank_op_ste_found_enigma_russ: "Olhem, aqui. A enigma, nyet?" #Look, here. Enigma code machine, nyet?"
bank_op_loud_took_enigma_germ: "Eu fico com isso. Pegamos a Enigma!" #I'll take that. Enigma machine acquired!"
bank_op_ste_out_find_enigma_var1_brit: "Eu sugiro entrar no banco e pegar a Enigma, que tal?" #I'd suggest we get inside and pinch that Enigma machine, yes?"
bank_op_found_key_germ: "Aha - essas são as chaves para o banco, tenho certeza. Será de grande ajuda." #Aha - these are the keys to the Reichsbank, I am sure. I feel we can put these to good use."
bank_op_at_door_no_key_germ: "Droga - as portas estão trancadas. Alguém deve ter as chaves, até nos matarmos esse schwein e roubarmos ela. Silenciosamente." #Damn - these doors are locked. Someone will have the keys - until we find the poor schwein, and take them. Quietly."
bank_op_loud_took_rotor_var2_amer: "Você fica com isso, e eu fico com aquilo." #You take THIS, and I'll take THAT."
bank_op_ste_spawn2_brit: "Agora, rapazes, vamos achar um jeito de entrar e pegar os rotores, e a Enigma é claro. Depois voltaremos à base." #Now then, chaps. Let's weasel our way in, grab those rotors, and the Enigma machine of course, and get ourselves back to base."
bank_op_loud_took_rotor_var1_brit: "Você não vai precisar disso, meu caro." #You won't be needing that, old bean."
bank_op_loud_used_radio3_russ: "Estamos com problemas. Uma situação não muito boa. Situação muito ruim." #Have situation. Not good situation. Is bad situation."
bank_op_loud_enigma_no_rotor_var1_amer: "Estamos com a máquina - agora faltam os rotores." #That's the machine taken care of - now we gotta get those rotors."
bank_op_ste_spawn2_amer: "Só precisamos entrar, pegar os rotores, roubar a Enigma, e podemos ir embora." #All we gotta do is sneak in, grab the rotors, nab the Enigma machine, and be on our way."
bank_op_lure_tank_further_russ: "Bom bom! Agora levem o tanque para o lado direito do banco, certo? Eu disse PRA DIREITA do banco!" #Good good! Now we get tank to the right side of treasury, yes? I said TO THE RIGHT of treasury!"
bank_op_loud_used_radio2: "Sra. White na escuta, Broadsword. Não esperava ouvir notícias de vocês. Câmbio." #Mrs. White receiving Broadsword. Wasn't expecting to hear from you. Over."
bank_op_loud_rotor_no_enigma_var2_brit: "Excelente, rapazes. Estamos com os rotores. Agora só falta a Enigma e podemos ir embora." #Excellent, chaps. That's the rotors dealt with. One Enigma machine and we can scarper."
bank_op_loud_blow_office_door_russ: "Porta trancada. Que chato - significa explosivos então. Ha!" #Door is locked. Shame - means more explosives. Ha!"
bank_op_tank_destro_truck2_brit: "Precisamos de outro jeito de fugir!" #Need another way out!"
bank_op_loud_rotor_no_enigma_var2_amer: "Estamos com todos os rotores, certo? Então vamos pegar a Enigma e dar o fora daqui." #We got the rotors, right? So let's get that Enigma machine and be on our way."
bank_op_ste_picked_cylinders_var2_1_germ: "Posso estar errado, mas esse é um dos rotores, não é?" #Unless I am mistaken, this is one of the rotors, yes?"
bank_op_found_key_brit: "Eu acho que essas são as chaves para o banco. Deve ser útil." #I say - methinks these are the keys to the Reichsbank. Should come in handy."
bank_op_use_radio_esc_germ: "Frau White! Ela pode ajudar! Usem o rádio!" #Frau White! She can help! Use the radio!"
bank_op_loud_call_airdrop2_brit: "Encontrem um rádio. Diga à Sra. White que precisamos de explosivos." #Find a radio. Tell Mrs. White we need explosives."
bank_op_at_door_no_key_brit: "Droga, trancaram as portas. Vamos ter que achar quem está com as chaves e roubá-las. Silenciosamente." #Blast, the ruddy doors are locked. We'll have to find whoever has the keys and nab them. Quietly."
bank_op_ste_spawn_russ: "Fiquei quietos, da? O banco está perto. Vamos dar uma olhada." #Stay quiet, da? Treasury ahead. We take a look."
bank_op_ste_rotor_not_enigma_var1_brit: "Temos todos os rotores. Agora falta a Enigma." #That's the rotors taken care of. Now to find the Enigma machine."
bank_op_ste_spawn_var2_russ: "Os comandantes não vão sair vivos se estiverem com os rotores." #The commanders are not long for world, if they have rotors we need."
bank_op_ste_in_find_rotor_var2_amer: "Precisamos dos rotores, vamos achar os comandantes que guardam eles." #We need those rotors, so we need to find the commanders who've got 'em."
bank_op_loud_escaped_amer: "Haha! Nada mal, nada mal mesmo. Vamos voltar à base." #Haha! Not bad, not bad at all. Let's get back to base."
bank_op_loud_enigma_no_rotor_var1_germ: "Estamos com a máquina, faltam apenas os rotores! Vamos, encontrem os comandantes que os guardam." #With the machine ours, all we need are the rotors. Go, find the commanders holding them."
bank_op_ste_enigma_no_rotor_var2_russ: "Temos a Enigma. Não temos rotores. Vamos achar os rotores agora." #We have Enigma machine. We do not have rotors. We get rotors now."
bank_op_ste_in_find_rotor_var1_germ: "Não podemos ir embora sem os rotores. Encontrem os comandantes que guardam eles." #We must not leave until we have the rotors. Find the commanders who hold them."
bank_op_request_dynamite_russ: "Agora é hora de chamar a Sra. White, tenho certeza." #Now is time to call Mrs White, I am sure."
bank_op_ste_spawn2_germ: "Vou dizer que parece simples. Roubamos a Enigma, os rotores e acabou." #I must say, it sounds rather simple. We steal the Enigma machine, take the rotors, and we're finished here."
bank_op_loud_took_enigma_var2_germ: "Hah! A Enigma é nossa!" #Hah! The Enigma machine is ours!"
bank_op_white_tank_disscuss3_russ: "Nossa missão foi um sucesso. Mas graças ao tanque, nosso transporte foi destruído! Gostaríamos de uma ajuda, se possível. Câmbio." #Our mission was big success. But, thanks to big tank, our transport is very big mess! We would like some help, if you please. Over."
bank_op_ste_cylinders2_russ: "Da, da, atrás dos engomadinhos!" #Da, da, look for shiniest boots!"
bank_op_ste_picked_cylinders1_germ: "Esse é um dos rotores que procuramos?" #This may be a rotor that we seek?"
bank_op_ste_out_find_rotor_var2_brit: "É melhor procurarmos os comandantes para roubar os rotores, rapazes. Acham que podem estar dentro do banco?" #We'd best get to finding those commanders, chaps, so we can take their rotors. Do you think they're inside the bank?"
bank_op_loud_alarm_triggered_brit: "Alarme. Porcaria!" #The alarm. Bollocks!"
bank_op_ste_picked_cylinders_var2_1_amer: "Se eu tivesse que adivinhar, esse é um dos rotores." #If I had to guess, I'd say this is one of the rotors."
bank_op_ste_rotor_not_enigma_var2_amer: "Temos os rotores, não é? Então agora só precisamos da Enigma." #We got the rotors, right? So all we need now is that Enigma machine."
bank_op_white_tank_disscuss3_brit: "Não se preocupe! A missao corre bem, mas temos um pequeno problema. Um maldito tanque apareceu do nada e explodiu nosso veículo de fuga. Tem como nos ajudar? Câmbio." #Never fear! Mission accomplished, but we've just hit a small snag. A bloody panzer just showed up and blasted our escape vehicle to smithereens. Any chance of a lift home? Over."
bank_op_request_dynamite_brit: "Rapazes, eu diria para contatarmos a Sra. White." #I say, chaps, we ought to give Mrs White a call, methinks."
bank_op_ste_out_find_rotor_var2_russ: "Estão vendo os comandantes? Eles terão os rotores, e nós queremos rotores." #You see any commanders? They will have rotors, and we need to take rotors."
bank_op_loud_blow_entrance_germ: "Plantem os explosivos na porta, ja?" #Get the explosives onto the door, ja?"
bank_op_loud_blow_office_door_germ: "Trancaram a porta. Dinamite vai destranca-la." #The door is locked. Dynamite will fix that."
bank_op_loud_call_airdrop2_amer: "Procurem um rádio. Mandem a Sra. White enviar explosivos, ou sei lá." #Get on a radio. Tell Mrs. White to send some explosives, or something."
bank_op_ste_cylinders1_germ: "Precisamos dos rotores. Os comandantes da Wehrmacht devem estar com eles." #We require rotors. Only officers of the Wehrmacht would be entrusted with them."
bank_op_loud_rotor_no_enigma_var1_germ: "Temos os rotores, então vamos pegar a Enigma e dar o fora daqui." #The rotors are ours, so, let us take the Enigma machine and be on our way."
bank_op_lure_tank_further_germ: "Jawohl! Ali - à direita do banco, estão vendo? É onde precisamos levar o tanque!" #Jawohl! There - to the right of the treasury, you see? That is where we need the tank!"
bank_op_ste_out_find_rotor_var1_germ: "Precisamos pegar os rotores, então precisamos encontrar os generais. Talvez eles estão lá dentro?" #We must acquire the rotors, therefore we must find the generals. Perhaps they are inside?"
bank_op_white_tank_disscuss1_amer: "Broadsword falando. Na escuta, Sra. White? Câmbio." #This is Broadsword. You there, Mrs White? Over."
bank_op_use_radio_esc_brit: "A Sra. White deve ter um plano. Liguem o rádio." #Mrs. White will know. Get on the radio."
bank_op_tank_destro_truck2_russ: "Como vamos fugir?" #How we get out?"
bank_op_loud_alarm_triggered_amer: "Ah droga. Certo, vamos acordar a vizinhança." #Ah crap. All right, let's wake the neighbours."
bank_op_loud_entrance_blown_germ: "Ja-ha-ha! Esse é o tipo de explosão que eu gosto!" #Ja-ha-ha! Now THAT is the boom-boom I crave!"
bank_op_ste_guard_alarm_germ: "Ele vai acionar o alarme! Matem ele! Já!" #He will raise the alarm! Stop him! Now!"
bank_op_loud_airdrop_arrived_brit: "A entrega aérea. Peguem os explosivos, rápido!" #There's the airdrop. Grab those explosives, will you!"
bank_op_loud_took_enigma_amer: "Ei, peguei a máquina!" #Hey, got the machine!"
bank_op_lure_tank_further_amer: "Continuem! Atraiam o tanque à direita do banco e talvez isso funcione!" #Keep it going! Get the panzer to the right of the treasury and this might just work!"
bank_op_ste_spawn_amer: "Fiquem escondidos! Certo, o banco está bem a frente. Vamos ver o que encontramos, certo?" #Keep it down! All right, that's the Treasury up ahead. Let's see what we can find, huh?"
bank_op_loud_took_enigma_russ: "Kurgan pegou a máquina!" #Kurgan has code machine!"
bank_op_ste_rotor_not_enigma_var1_germ: "Pegamos os rotores - isso é bom. Mas precisamos da Enigma também." #We have the rotors - that is good. But we require the Enigma machine as well."
bank_op_loud_call_airdrop2_russ: "Encontrem um rádio. Chamem a Sra. White. Mande enviar explosivos muito rápido, da?" #Find radio. Call Mrs. White. Send explosives doublequick, da?"
bank_op_ste_enigma_no_rotor_var1_russ: "Estamos com a Enigma? Então só falta encontrar os comandantes que estão com os rotores." #We have machine of Enigma? So there are commanders to find now, for rotors."
bank_op_loud_used_radio5_brit: "Pode nos fazer um favor e enviar, sei lá, uns 22 quilos de dinamite, por favor?" #You couldn't be a dear and send, oh, say, fifty pounds of dynamite, could you?"
bank_op_ste_rotor_not_enigma_var2_brit: "Pegamos todos os rotores - só precisamos encontrar a Enigma e terminamos aqui." #That's the rotors all sewn up - we just need that Enigma machine and we're finished here."
bank_op_loud_rotor_no_enigma_var2_russ: "Pegamos todos os rotores? Ótimo. Vamos pegar a Eniga também." #Rotors belong to us? Good. We do same with machine of Enigma now."
bank_op_lure_tank_idea_amer: "Que tal o tanque? Podemos atraí-lo para explodir a parede?" #How about the tank? Get it to blast that wall there?"
bank_op_ste_picked_cylinders1_russ: "Hm. Peguei algo - um rotor, talvez?" #Hm. Have something - rotor, maybe?"
bank_op_ste_spawn_var2_germ: "Se precisamos dos rotores, então temos que matar os schweins que estão no comando." #If we want the rotors, then, we shall have to take them from those schweins who are in command."
bank_op_ste_picked_cylinders1_brit: "Isso é um rotor?" #Is this a rotor?"
bank_op_white_tank_disscuss3_germ: "Boas notícias - a missão foi um sucesso. Más notícias - um tanque obliterou nosso veículo de fuga. Poderia nos ajudar? Câmbio." #The good news - our mission was a success. The bad news - a tank has obliterated our means of escape. Perhaps you could arrange some help? Over."
bank_op_ste_out_find_rotor_var1_amer: "Precisamos dos rotores, então vamos encontrar os comandantes que guardam eles." #We need those rotors, so we need to find the commanders holding on to 'em."
bank_op_ste_spawn_germ: "Cavalheiros. O banco está a frente. Sugiro ficarmos em silêncio." #Gentlemen. The Treasury is ahead. I suggest we approach quietly."
bank_op_ste_cylinders2_brit: "O de sempre. Sério, intrometido, arrogantes. Sabem... idiotas." #Usual type. Stern, officious, arrogant looking chaps. You know... twats."
bank_op_loud_enigma_no_rotor_var2_amer: "Nada mal. Pegamos a máquina, mas precisamos dos rotores também." #Not bad. The machine's one thing, but we need those rotors too."
bank_op_loud_airdrop_arrived_amer: "A entrega aérea chegou. Vamos, peguem os explosivos!" #That'll be the airdrop. C'mon, let's go grab those explosives!"
bank_op_lure_tank_complete_russ: "Pelas bolas de Stalin! Não achei que funcionaria! Vamos, antes que o tanque atire de novo!" #Stalin's balls! I did not think that would work! Come, we go before tank takes next shot!"
bank_op_loud_took_enigma_var2_russ: "Aqui! Peguei a máquina!" #Here! I have code machine!"
bank_op_ste_out_find_rotor_var1_russ: "Procuramos por comandantes - eles estão com os rotores." #We look for commanders - they have rotors we need."
bank_op_loud_used_radio5_amer: "Uns 22 quilos de dinamite cairiam bem aqui." #We could do with about fifty pounds of dynamite over here.
bank_op_ste_out_find_enigma_var1_amer: "Hora de entrar e pegar a Enigma, não acham?" #Time to head inside and get that Enigma machine, don'cha think?"
bank_op_loud_enigma_no_rotor_var1_russ: "Temos a máquina? Então vamos matar os comandantes e pegar os rotores!" #Code machine is with us? Then we crush commanders and take rotors!"
bank_op_ste_spawn_var2_amer: "Então vamos pegar os rotores dos comandantes." #So let's go separate the commanders from their rotors."
bank_op_ste_out_find_rotor_var2_germ: "Os comandantes guardam os rotores, não é? Então vamos achá-los." #The commanders hold the rotors, yes? Then we must find them."
bank_op_ste_out_find_rotor_var1_brit: "Me pergunto se todos os comandantes estão lá dentro? De qualquer forma, temos que achá-los e pegar os rotores." #I wonder if the commanders are all inside? Either way, we'd best find them, and those rotors."
bank_op_ste_out_find_enigma_var2_germ: "Teremos mais chances de encontrar a Enigma lá dentro, eu suponho." #To find an Enigma machine, we would have more luck heading inside, I feel."
bank_op_lure_tank_idea_brit: "Talvez podemos usar o tanque? Fazê-lo explodir aquela parede." #Maybe we can use the tank? Get it to blow that wall over there."
bank_op_white_tank_disscuss3_amer: "Pegamos o que viemos buscar, mas estamos numa enrascada! Um maldito tanque explodiu nosso veículo. Pode nos mandar um táxi? Câmbio." #We got what we came for, but we're in a tight spot! A goddamn tank took out our ride home. You think you could call us a cab? Over."
bank_op_ste_picked_cylinders1_amer: "Seria esse um dos rotores?" #Is this one of those rotors?"
bank_op_loud_rotor_no_enigma_var2_germ: "Pegamos os rotores, só precisamos da Enigma. Rápido, rapazes!" #We now have the rotors, so we must take the Enigma machine. Quickly, men!"
bank_op_loud_enigma_no_rotor_var2_russ: "A máquina Enigma está conosco. Os rotores são os próximos." #Machine of Enigma is with us now. Rotors from dead commanders is next."
bank_op_tank_appears2_russ: "Tanque Tiger!" #Tiger tank!"
bank_op_ste_in_find_rotor_var2_brit: "Os comandantes estão com os rotores. Se encontrarmos eles, encontramos os rotores. Entenderam?" #The commanders have the rotors. We find the commanders, we find the rotors. Understood?"
bank_op_found_key_amer: "Se eu não estiver enganado, essas são as chaves do banco. É, eu vou levá-las." #Unless I'm mistaken, these look like the keys to the Reichsbank. Yeah, I'll take those."
bank_op_ste_out_find_enigma_var2_brit: "Dúvido que vamos encontrar a Enigma aqui fora. Vamos, rapazes, temos que entrar." #I doubt we'll find an Enigma machine outdoors. C'mon chaps, let's get inside."
bank_op_ste_picked_cylinders_var2_1_russ: "Camaradas? Esse é um dos rotores?" #Comrades? Is this rotor we seek?"
bank_op_tank_destro_truck2_germ: "Agora como fugimos?!" #Now how do we escape?!"
bank_op_ste_found_enigma_germ: "Guten tag! Ali está a Enigma." #Well guten tag! There is an Enigma code machine."
bank_op_loud_airdrop_arrived_germ: "Aha! A entrega aérea chegou. Vamos ver se Frau White enviou a dinamite." #Aha! The airdrop is here. Come, let us see if Frau White sent the dynamite."
bank_op_loud_used_radio1_russ: "Alô! Broadsword chamando Sra. White? Alô!" #Hallo! Broadsword calls. Mrs. White? Hallo!"
bank_op_ste_spawn3_germ: "Os comandantes estão com os rotores. Vamos encontrá-los." #Their commanders will have the rotors. Let us find them."
bank_op_loud_took_rotor_var2_germ: "Sua morte foi em vão." #Know that your death was needless."
bank_op_loud_took_rotor_var1_amer: "Obrigado pelo rotor, mein Obergruppencuzão." #Thanks for the rotor, mein Obergruppenarsehole."
bank_op_loud_enigma_no_rotor_var2_brit: "Ótimo - estamos com a Enigma. Só precisamos dos rotores." #Good stuff - one Enigma machine in the bag. We just need those ruddy rotors."
bank_op_ste_in_find_rotor_var1_brit: "Agora que tal encontrarmos os rotores e matar os comandantes que os guardam." #Now then, how about we find those rotors and put an end to the commanders holding on to them."
bank_op_ste_spawn_brit: "Ali está o banco. Vamos ver o que encontramos, sim?" #There's the Treasury. Let's go and see what we can find, eh?"
bank_op_ste_spawn2_russ: "A missão é simples. Entramos no banco, roubamos a Enigma e os rotores, depois voltamos pro acampamento, né?" #Mission is simple. We enter bank, steal Enigma machine, steal rotors, and return to camp, yes?"
bank_op_ste_spawn3_amer: "Fiquem de olho nos comandantes - os rotores estão com eles." #Keep an eye out for the commanders - they'll have the rotors."
bank_op_ste_spawn3_russ: "Os comandantes guardam os rotores? Em breve não guardarão nada." #The commanders are the men who hold the rotors? Then they soon hold nothing."
bank_op_ste_spawn_var2_brit: "Temos que encontrar cada comandante e arrancar os rotores das mãos deles, certo?" #We'd best find each commander and prise a rotor from his cold, dead hands, wouldn't you say?"
bank_op_ste_cylinders1_brit: "Lembrem-se, os rotores estão com os comandantes." #Remember, it will be the officers that will have the rotors."
bank_op_ste_cylinders1_amer: "Os comandantes são quem guardam os rotores." #Only officers are gonna be carrying the rotors."
bank_op_ste_cylinders1_russ: "Os rotores estarão com os comandantes. Procurem por eles!" #Rotors will be only with officers. Keep eyes for them!"
bank_op_ste_cylinders2_amer: "Vocês já sabem. Os de uniformes bonitos que ficam dando ordens. Filhos da puta." #You know 'em. The guys in the smart uniforms. Giving the orders. Motherfuckers."
bank_op_ste_cylinders2_germ: "Vocês vão saber quando vê-los. Engomadinhos desgraçados, não param de dar ordens." #You know them when you see them. Self-important scum, barking orders like dogs."
bank_op_ste_picked_cylinders_var2_1_brit: "Hm. Rapazes, vocês acham que esse é um dos rotores?" #Hm. You chaps think this is one of the rotors?"
bank_op_ste_out_find_enigma_var1_russ: "Precisamos da Enigma? Ela não vai estar aqui fora, disso eu sei." #We need Enigma machine? They not leave it outside, I am sure."
bank_op_ste_out_find_enigma_var1_germ: "Precisamos pegar a Enigma, meine Freunde. Vamos, pra dentro." #We must acquire the Enigma machine, meine Freunde. Come - we head inside."
bank_op_ste_out_find_rotor_var2_amer: "Ainda precisamos dos rotores. Acho que os comandantes estão dentro do banco." #We still gotta get those rotors. Guessing the commanders that have 'em are inside the bank."
bank_op_ste_in_find_rotor_var1_russ: "Vamos encontrar os comandantes para roubarmos os rotores." #Maybe we find commanders and steal rotors now."
bank_op_ste_in_find_rotor_var2_russ: "Estamos atrás dos rotores, então encontrem os comandantes." #We are here for rotors, so we find commanders now."
bank_op_ste_in_find_rotor_var2_germ: "Os comandantes devem estar perto - encontrem eles e peguem os rotores." #The commanders must be close - find them and take the rotors they hold."
bank_op_ste_rotor_not_enigma_var1_amer: "Só precisamos da Enigma e terminamos aqui." #Just gotta get that Enigma machine then we're done here."
bank_op_ste_rotor_not_enigma_var1_russ: "Temos todos os rotores? Que droga. Eu tava me divertindo com os comandantes. Vamos pegar a Enigma então." #We have rotors? Shame. Commanders were fun. We get Enigma machine now."
bank_op_ste_rotor_not_enigma_var2_russ: "Temos todos os rotores? Então vamos encontrar e pegar a Enigma." #Rotors are ours? Then let us find and take Enigma machine."
bank_op_ste_rotor_not_enigma_var2_germ: "Temos os rotores, mas ainda não encontramos a Enigma. Vamos dar um jeito nisso." #The rotors are ours, but the Enimga machine evades us. Let us correct that."
bank_op_ste_enigma_no_rotor_var1_brit: "Bom, bom. Pegamos a Enigma. Agora só precisamos dos malditos rotores." #Good, good. That's the Enigma machine dealt with. Just need to get hold of those ruddy rotors."
bank_op_ste_enigma_no_rotor_var1_amer: "Certo, pegamos a Enigma - só precisamos dos rotores e podemos cair fora daqui." #Alright, we got the Enigma machine - just gotta get the rotors and we can get outta here."
bank_op_ste_enigma_no_rotor_var1_germ: "A Enigma é nossa. Agora só precisamos dos rotores." #The Enigma machine is in our possession. Now, to find the rotors."
bank_op_ste_enigma_no_rotor_var2_brit: "Podemos riscar a Enigma da lista, mas precisamos dos rotores, rapazes." #We can tick the Enigma machine off the list, but we must acquire those rotors, lads."
bank_op_ste_enigma_no_rotor_var2_amer: "Só precisamos pegar os rotores agora, depois podemos ir embora." #Just gotta get those rotors, now, then we're done."
bank_op_ste_enigma_no_rotor_var2_germ: "A Enigma é nossa? Então precisamos pegar os rotores que estão com os comandantes." #We have the Enigma machine now? Then we must take the rotors from the commanders."
bank_op_ste_guard_alarm_brit: "Ele vai acionar o alarme! Matem ele!" #He's going for the alarm! Stop him!"
bank_op_ste_guard_alarm_amer: "Ele tá indo acionar o alarme! Matem ele!" #He's runnin' for the alarm! Drop him!"
bank_op_ste_found_enigma_brit: "Olha o que temos aqui! A Enigma." #Well, look at this! Enigma."
bank_op_ste_found_enigma_amer: "Olha só que coisa. A Enigma." #Well, I'll be damned. An Enigma machine."
bank_op_loud_alarm_triggered_russ: "Hah! Finalmente, não preciso mais me esconder. Venham me enfrentar!" #Hah! At last, no more sneaking. Come face your doom!"
bank_op_loud_alarm_triggered_germ: "Scheisse. Vamos ter companhia em breve. Acabem com eles!" #Scheisse. We will soon have company. Unleash hell!"
bank_op_loud_call_airdrop1_brit: "Que droga. Trancaram a porta!" #Bugger it. They've sealed the door!: "" #
bank_op_loud_call_airdrop1_amer: "Merda. Trancaram a porta!" #Crap. They slammed the door shut!"
bank_op_loud_call_airdrop1_russ: "Mas que bosta, trancaram a porta!" #Mother of shit, they locked the door!"
bank_op_loud_call_airdrop2_germ: "Precisamos de um rádio. Vamos torcer para que Frau White possa enviar explosivos." #We need a radio. Let us hope Frau White can send explosives."
bank_op_loud_airdrop_arrived_russ: "Olhem! A entrega aérea. A Sra. White conseguiu. Vai, vai, peguem os explosivos." #Look! Plane drop. Mrs. White did good. Go, go, get explosive."
bank_op_loud_blow_entrance_brit: "Plantem a dinamite na porta!" #Plant the dynamite on the door!"
bank_op_loud_blow_entrance_amer: "Só precisamos colocar a dinamite na porta!" #Just gotta get the dynamite planted on the door!"
bank_op_loud_blow_entrance_russ: "Coloquem os explosivos na porta! Agora!" #Get explosives on door! Now!"
bank_op_loud_bomb_planted_amer: "Certo, está acionado. Se afastem da porta!" #All right, it's live. Get the hell away from the door!"
bank_op_loud_bomb_planted_russ: "Acionado. Tapem os ouvidos!" #Fuse lit. Cover ears!: "" #
bank_op_loud_bomb_planted_germ: "Dinamite acionada! Protejam-se!" #The fuse is lit! Take cover!"
bank_op_loud_entrance_blown_amer: "Boom! *risada* aposto que até o Hitler acordou!" #Boom! *laughs* I bet that woke Hitler!"
bank_op_loud_entrance_blown_russ: "Haah! Sra. White, obrigado!" #Haah! Mrs. White, thank you!"
bank_op_loud_door_blown_amer: "Entrem!" #Get in there!"
bank_op_loud_door_blown_russ: "A porta abriu - entrem, entrem!" #Door is open - in, in!"
bank_op_loud_door_blown_germ: "A porta não tinha chance alguma. Vamos!" #The door stood no chance. Come!"
bank_op_loud_took_enigma_brit: "Peguei a Enigma!" #I got the Engima machine!"
bank_op_loud_took_rotor_var1_germ: "Oh? Esse rotor é pra mim? Que gentileza a sua." #Oh? This rotor is for me? You are too kind."
bank_op_loud_took_rotor_var2_brit: "Acho que é meu agora." #I think that's mine now."
bank_op_loud_took_rotor_var2_russ: "Você não vai precisar disso se estiver morto." #You do not need this when you are dead."
bank_op_loud_rotor_no_enigma_var1_brit: "Conseguimos os rotores. Agora só precisamos encontrar e pegar a Enigma." #There - rotors acquired. Now there's just the business of the Enigma machine to take care of."
bank_op_loud_rotor_no_enigma_var1_amer: "Conseguimos os rotores. Vamos pegar a máquina e dar o fora daqui." #That's the rotors taken care of. Let's grab the machine so we can move out."
bank_op_loud_rotor_no_enigma_var1_russ: "Pegamos os rotores. Precisamos da máquina. Vamos encontrar a máquina." #We have rotors. We need code machine. Let us find code machine."
bank_op_loud_enigma_no_rotor_var1_brit: "Belo trabalho, pessoal. Pegamos a Enigma, só faltam os rotores agora." #Good work, gents. We've got the Enigma machine. Just need those rotors now."
bank_op_loud_enigma_no_rotor_var2_germ: "A Enigma é apenas metade de nossa missão, precisamos dos rotores também, rápido." #The Enigma machine was only half the mission - we must acquire the rotors, quickly."
bank_op_tank_appears2_amer: "É um maldito tanque!" #Goddamn Tiger!"
bank_op_tank_appears2_germ: "Um tanque!" #It's a panzer!"
bank_op_tank_destro_truck2_amer: "Deve ter outro jeito de fugir!" #Gotta be another way out!"
bank_op_use_radio_esc_russ: "Chamem a Sra. White. Usem o rádio!" #Call Mrs. White. Use the radio!"
bank_op_lure_tank_idea_russ: "Que tal o tanque? Ele poderia explodir a parede?" #What about tank? It can blast wall there?"
bank_op_lure_tank_idea_germ: "O tanque! Poderiamos atraí-lo e fazer ele atirar na parede." #The tank! We could trick it into blasting that wall there."
bank_op_lure_tank_idea2_brit: "Ótima ideia. Faça ele segui-lo, mas fiquem longe da metralhadora!" #Capital idea. Have it follow you, but stay away from the gun!"
bank_op_lure_tank_idea2_amer: "Ótima ideia. Faça ele segui-lo, mas pelo amor de Deus fique longe da metralhadora!" #Nice idea! Make it follow you, but for fucks sake stay away from the gun!"
bank_op_lure_tank_idea2_russ: "Da! Fazer tanque seguir. Cuidado com arma, da?" #Da! Have tank follow. But watch gun, da?"
bank_op_lure_tank_idea2_germ: "Ah! De fato! Faça ele segui-lo. Cuidado com a metralhadora!" #Ah! Indeed! Have it follow you. But avoid the big gun!"
bank_op_loud_escaped_brit: "Perfeito, rapazes! Rápido, vamos voltar à base antes que eles se reagrupem!" #Top hole, chaps! Quickly now, let's get back to base before they can regroup!"
bank_op_loud_escaped_germ: "Excelente trabalho, cavalheiros! Vamos voltar pro acampamento antes que eles tomem conta do que perderam!" #Excellent work, gentlemen! Let us return to camp while they realise how badly they have lost!"
bank_op_loud_used_radio1_germ: "Frau White? Aqui é Broadsword. Na escuta?" #Frau White? This is Broadsword. Are you there?"
bank_op_loud_used_radio3_brit: "Perdão se acordamos você. É que estamos com problemas aqui. Câmbio." #Sorry if we got you out of bed. Thing is, we've gone and cocked things up. Over."
bank_op_loud_used_radio3_amer: "É, sobre isso... meio que estragamos tudo." #Yeah, about that... we kinda screwed the pooch."
bank_op_loud_used_radio5_russ: "Explosivos. Talvez 22 quilos?" #Explosive. Maybe fifty pounds?"
bank_op_loud_used_radio5_germ: "Eu estimo que mais ou menos 22 quilos do melhor explosivo que tiver, se não for pedir muito." #By my estimate, around fifty pounds of your finest explosives, if you would be so kind."
bank_op_loud_used_radio4: "Entendido, Broadsword. Do que precisam?" #Understood, Broadsword. What do you need?"
bank_op_loud_used_radio6: "Vou ver o que posso fazer. Câmbio, desligo." #I'll see what I can do. Over and out."
bank_op_request_dynamite_amer: "Então só precisamos contatar a Sra. White, certo?" #So now all we gotta do is call Mrs White - is that right?"
bank_op_request_dynamite_germ: "Talvez seja uma boa hora para contatar Frau White, senhores?" #Perhaps now would be a good time to call Frau White, gentlemen?"
bank_op_white_tank_disscuss1_brit: "Aqui é Broadsword chamando Sra. White. Broadsword chamando Sra. White, câmbio." #This is Broadsword calling Mrs White. Broadsword for Mrs White, over."
bank_op_white_tank_disscuss2: "Sra. White na escuta, alto e claro, Broadsword. É melhor que sejam boas notícias, câmbio." #This is Mrs White, reading you loud and clear Broadsword. You'd best be calling with good news, over."
bank_op_white_tank_disscuss4: "Muito bem, Broadsword. Irei enviar alguém para pegá-los, mas ele só pode chegar até o outro lado do banco." #Very well, Broadsword. I'll send someone to collect you now, but the only spot they can get to is on the other side of the treasury."
bank_op_white_tank_disscuss4_01: "Se estou entendendo direito, vocês terão que achar um jeito de destruir a parede entre o banco e a rua. Boa sorte. Câmbio, desligo." #By my understanding, that means you'll need to find a way to break through the wall between the treasury and the road. Good luck. Over and out."
bank_op_lure_tank_further_brit: "Ótimo, rapazes! Se conseguirmos atrair o tanque à direita do banco, isso pode funcionar!" #Good show, lads! If we can get the tank over to the right side of the treasury, we might just pull this off!"
bank_op_lure_tank_complete_brit: "Eu não acredito, funcionou! Que tal nós irmos embora enquanto ainda temos chance!" #Well I never, it only bloody worked! How about we scarper while we have the chance!"
bank_op_lure_tank_complete_amer: "Haha! Funcionou - o desgraçado abriu uma porta pra nós! Rápido, temos que ir enquanto temos chance!" #Haha! It worked - the fucker just opened a door for us! C'mon, we gotta go while we still can!"
bank_op_lure_tank_complete_germ: "Quem diria! Que tal irmos embora enquanto temos tempo?" #Wonders never cease! May I suggest we escape while we have our opening?: "" #
bank_op_at_door_no_key_russ: "Bah! Trancaram as portas. Se queremos continuar quietos, precisamos achar e roubar o idiota que tem a chave." #Bah! Doors are locked. If we wish to keep quiet, we must find the little man with key and take it."
bank_op_at_door_with_key_brit: "Inteligente da parte deles, trancar as portas. Não que vá adiantar muito, é claro, já que temos as chaves..." #Smart move on their part, locking the doors. Not that it'll help, of course, now we have the keys..."
bank_op_at_door_with_key_amer: "Trancar as portas seria inteligente, SE eles escondessem melhor as chaves, heh." #Locking the doors would've been a smart move, *if* they were better at hiding their keys, heh."
bank_op_at_door_with_key_germ: "Trancar as portas é uma ótima estratégia. Que pena que não pensaram em esconder as chaves." #Their logic is sound in locking the doors. Pity their logic was lacking when they hid their keys."
bank_op_found_key_russ: "Eu acho que essas são as chaves do banco. Hm. Podem ser úteis." #These are keys for the Reichsbank, I think. Hm. These may be of use."
bank_op_call_for_airdrop_brit: "Que droga! Barricaram a porta! Vamos precisar de algo além da chave para entrar." #Bugger it! They've barred the door! We'll need something stronger than a key to get inside now."
bank_op_call_for_airdrop_amer: "Oh perfeito! Bloquearam a maldita porta! Vamos precisar de algo além da chave para entrar!" #Oh great! They've blocked the goddamn door! Gonna need more than a key to get in there!"
bank_op_call_for_airdrop_russ: "Mas que merda! Bloquearam a porta, não adianta usar a chave!" #Mother of shit! The door is blocked, and no key can fix that!"
bank_op_call_for_airdrop_germ: "Droga! A chave é inútil agora que barricaram a porta! Como vamos entrar?" #Damn it! What good is a key when they've barred the door! How do we get inside now?"

# Objetivos
obj_ger_miss_03_rb_st_03_hl: "Pegue a dinamite da entrega aérea" #Take dynamite from the airdrop pod"
obj_ger_miss_03_rb_st_06_hl: "Fuja!" #Escape!"
obj_ger_miss_03_rb_st_07_desc: "O avião aliado está a caminho. Espere a entrega aérea chegar." #The allied planes are on the way. Wait for the airdrop pod to be delivered."
obj_ger_miss_03_rb_st_01_hl: "Roube a Enigma e seus rotores" #Steal an enigma machine and its rotors"
obj_ger_miss_03_rb_st_07_hl: "Espere pela entrega aérea" #Wait for airdrop"
obj_ger_miss_03_rb_st_01_hl_sub_01: "Encontre a Enigma dentro do banco" #Find the enigma machine inside the treasury"
obj_ger_miss_03_rb_st_09_hl: "Faça o tanque explodir o portão" #Get the tank to blow up the gate"
obj_ger_miss_03_rb_st_01_hl_sub_02: "Encontre os rotores da Enigma" #Find the enigma rotors"
obj_ger_miss_03_rb_st_01_desc: "A Enigma e os comandantes que guardam os rotores estão perto e dentro do banco. Encontre-os." #An enigma machine and commanders carrying its rotors are nearby and inside the treasury. Find them and take the items.: "" #
obj_ger_miss_03_rb_st_04_desc: "A dinamite da entrega aérea pode ser usada para explodir as portas do banco." #The bag of dynamite from the airdrop pod can be used on the Treasury doors to blow them open."
obj_ger_miss_03_rb_st_11_hl: "Contate a Sra. White" #Call Mrs. White"
obj_ger_miss_03_rb_st_03_desc: "A entrega aérea contém dinamite para as portas e mais algumas que podem ser úteis no futuro." #The airdrop pod contains a bag of dynamite for the Treasury doors and some additional charges that might come in handy."
obj_ger_miss_03_rb_st_08_hl: "Atraia o tanque para o portão" #Lure the tank to the gate"
obj_ger_miss_03_rb_st_04_hl: "Exploda as portas do banco" #Blow up the Treasury doors"
obj_ger_miss_03_rb_st_06_desc: "Você pegou o necessário. Hora de fugir antes que você seja capturado pelos inimigos." #You have what you need. Time to get out of there before you are caught by the enemy."
obj_ger_miss_03_rb_st_08_desc: "Um tanque Tiger está lhe caçando. Atrai-o para o portão perto do banco." #A Tiger tank is hunting you. Lure it to the locked gate by the Treasury."
obj_ger_miss_03_rb_st_10_hl: "Fuja!" #Escape!"
obj_ger_miss_03_rb_st_02_desc: "As portas do banco foram trancadas por dentro! Peça uma entrega de dinamites para explodir as portas!" #The Treasury doors have been locked from the inside! Call for dynamite to be airdropped and blast the doors open!"
obj_ger_miss_03_rb_st_05_hl: "Exploda a porta do escritório" #Blow up the office door"
obj_ger_miss_03_rb_st_09_desc: "Com o tanque atraído para o portão ao lado do banco, você pode fazê-lo destruir o portão para você fugir." #With the Tiger Tank lured to the locked gate by the Treasury, you can use it to blast a hole for your escape."
obj_ger_miss_03_rb_st_02_hl: "Peça uma entrega de dinamite" #Call for a dynamite airdrop"
obj_ger_miss_03_rb_st_11_desc: "Você precisa achar outro jeito de fugir! Contate a Sra. White usando o rádio e peça sua ajuda." #You need another way to get out of there! Call Mrs. White on the radio and ask for her help."
obj_ger_miss_03_rb_st_10_desc: "Você pegou o necessário. Hora de fugir antes que você seja capturado pelos inimigos." #You have what you need. Time to get out of there before you are caught by the enemy."
obj_ger_miss_03_rb_st_05_desc: "Use a dinamite para entrar no escritório do banco." #Gain entrance to the Treasury office by using dynamite from the airdrop pod."